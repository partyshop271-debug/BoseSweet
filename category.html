<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تصفح الأصناف الفاخرة | حلويات بوسي</title>
    
    <!-- 🔍 إعدادات تحسين محركات البحث والأرشفة الفاخرة SEO -->
    <meta name="description" content="استمتع بتصفح تشكيلة حلويات بوسي الفاخرة المجهزة يومياً بمكونات طبيعية 100% طازجة تليق بمناسباتكم السعيدة.">
    
    <!-- 🎨 ربط ملفات التصميم الموزعة هندسياً لمنع تضخم الأكواد وتأخر التحميل -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- 👑 استدعاء المحرك المركزي العالمي في رأس الصفحة لتأمين الـ DOM ومنع وميض الألوان -->
    <script src="js/core-engine.js"></script>

    <style>
        /* 🎨 الهندسة البصرية الخاصة بصفحة الفئة الديناميكية لمنع التكديس البصري */
        .category-view-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 16px;
            direction: rtl;
            box-sizing: border-box;
            background-color: var(--bose-white, #FFFFFF);
            min-height: 60vh;
        }

        .bose-category-breadcrumb {
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: var(--bose-black, #111111);
            font-weight: 600 !important;
        }

        .bose-category-breadcrumb a {
            color: var(--bose-black, #111111);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .bose-category-breadcrumb a:hover {
            color: var(--bose-pink, #FF91A4);
        }

        .bose-category-breadcrumb span {
            margin: 0 10px;
            opacity: 0.3;
        }

        .category-hero-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .category-title-text {
            color: var(--bose-black, #111111) !important;
            font-size: 1.85rem;
            font-weight: 700 !important;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .category-title-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: var(--bose-pink, #FF91A4);
            border-radius: 2px;
        }

        .category-desc-text {
            color: #4D4D4D;
            font-size: 0.95rem;
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 📐 محرك التوزيع الشبكي المرن المتوافق مع محددات الأبعاد القياسية الصارمة */
        .category-products-grid {
            display: grid;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* كارت واحد كامل ومريح في الصف على الموبايل لمنع التكدس */
        .category-products-grid.layout-two-cards, 
        .category-products-grid.layout-tabs,
        .category-products-grid.layout-full-card {
            grid-template-columns: 1fr;
        }

        /* التوزيع المتوازن على الشاشات الأكبر */
        @media (min-width: 768px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs,
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs,
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
        }

        /* 📐 المقاسات الإلزامية الصارمة لكارت المنتج الموحد لمنع تضخم الكود والـ Overflow */
        .product-card {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            box-sizing: border-box;
            width: 100%;
            height: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bose-shadow-hover, 0 16px 40px rgba(255, 145, 164, 0.22));
            border-color: var(--bose-pink, #FF91A4);
        }

        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card-img {
            width: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            aspect-ratio: 1 / 1;
            background-color: #F7F7F7;
            /* أبعاد الارتفاع الهندسية القياسية الصارمة */
            height: 220px !important;
        }

        @media (min-width: 768px) {
            .product-card-img {
                height: 260px !important;
            }
        }

        @media (min-width: 1024px) {
            .product-card-img {
                height: 320px !important;
            }
        }

        .product-card-title {
            font-size: 1.15rem;
            margin: 10px 0 4px 0;
            font-weight: 700 !important;
            color: var(--bose-black, #111111);
        }

        .product-card-flavor-name {
            color: var(--bose-pink, #FF91A4);
            font-size: 0.9rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .product-card-desc {
            font-size: 0.85rem;
            color: #4D4D4D;
            line-height: 1.4;
            margin: 6px 0;
        }

        /* 🚨 التبويبات الفرعية لأصناف الديسباسيتو */
        .bose-size-tabs-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: rtl;
        }

        .bose-filter-tab-pill {
            font-family: 'Cairo', sans-serif;
            font-weight: 700 !important;
            font-size: 0.85rem;
            padding: 10px 20px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            color: #111111;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bose-filter-tab-pill.active {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
        }

        /* العداد المطور المرن بتوزيع هندسي ملتزم: يمين (+) وسط (القيمة) يسار (-) */
        .product-card-qty-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
            padding-top: 8px;
            direction: rtl; /* تفعيل التناغم العربي الصريح من اليمين لليسار */
        }

        .bose-internal-qty-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--bose-black, #111111);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .bose-internal-qty-btn:hover {
            border-color: var(--bose-pink, #FF91A4);
            background-color: rgba(255, 145, 164, 0.05);
        }

        .bose-internal-input {
            width: 45px;
            text-align: center;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--bose-black, #111111);
            background: transparent;
            -moz-appearance: textfield;
        }

        .bose-internal-input::-webkit-outer-spin-button,
        .bose-internal-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .product-card-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .product-card-price {
            color: var(--bose-pink, #FF91A4);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .bose-internal-add {
            background: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: background 0.2s, transform 0.1s;
        }

        .bose-internal-add:hover {
            background-color: #111111;
        }

        /* 🚨 هيكل التحميل الهيكلي الـ Skeleton */
        .skeleton-card-loader {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .skeleton-pulse-node {
            background: linear-gradient(90deg, #f7f7f7 25%, #eeeeee 50%, #f7f7f7 75%);
            background-size: 200% 100%;
            animation: bosePulse 1.4s infinite linear;
            border-radius: 12px;
        }

        @keyframes bosePulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bose-empty-state-container {
            text-align: center;
            padding: 60px 20px;
            color: var(--bose-black, #111111);
        }
        
        .bose-empty-state-container i {
            font-size: 3rem;
            color: var(--bose-pink, #FF91A4);
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bose-hardware-accelerated bose-arabic-text">

    <!-- 🏢 [الأوسمة النائبة المعتمدة هندسياً لحقن الهيدر والفوتر ديناميكياً] -->
    <div id="bose-header-injector"></div>

    <!-- 🧱 منطقة عرض الفئة والمنتجات التابعة لها -->
    <main class="category-view-wrapper" id="main-category-content">
        <nav class="bose-category-breadcrumb" aria-label="مسار التنقل">
            <a href="index.html">الرئيسية</a>
            <span>/</span>
            <a href="menu.html">المنيو الشامل</a>
            <span>/</span>
            <span id="breadcrumb-active-category" aria-current="page">جاري التحميل...</span>
        </nav>

        <div class="category-hero-header">
            <h1 id="bose-category-headline" class="category-title-text">تصفح الأصناف</h1>
            <p id="bose-category-description" class="category-desc-text">جاري جلب تفاصيل صنف حلويات بوسي الفاخر...</p>
        </div>

        <!-- تبويبات التصفح للأحجام والأبعاد لأصناف الديسباسيتو -->
        <div id="bose-size-filter-row" class="bose-size-tabs-filter" style="display: none;">
            <button class="bose-filter-tab-pill active" data-filter-size="triangle" aria-label="عرض مقاس مثلث فردي">مثلث فردي</button>
            <button class="bose-filter-tab-pill" data-filter-size="medium" aria-label="عرض مقاس وسط تشارك ممتع">وسط تشارك ممتع</button>
            <button class="bose-filter-tab-pill" data-filter-size="large" aria-label="عرض مقاس كبير جمعات فاخرة">كبير جمعات فاخرة</button>
        </div>

        <!-- حاوية الشبكة الهندسية للمنتجات المعزولة -->
        <div id="bose-category-products-grid" class="category-products-grid">
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
        </div>
    </main>

    <!-- 🏪 [الوسم النائب المعتمد هندسياً لحقن الفوتر ديناميكياً] -->
    <div id="bose-footer-injector"></div>

    <!-- 👑 المحرك البرمجي المتكامل والمستقل لصفحة الفئة 👑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('category');

            const productsGrid = document.getElementById('bose-category-products-grid');
            const headlineNode = document.getElementById('bose-category-headline');
            const descNode = document.getElementById('bose-category-description');
            const breadcrumbNode = document.getElementById('breadcrumb-active-category');
            const sizeFilterRow = document.getElementById('bose-size-filter-row');
            
            let activeSizeTab = "triangle";
            let globalFilteredProducts = [];
            let globalStoreCurrency = "EGP";

            if (!categoryId) {
                renderEmptyState("لم يتم تحديد الصنف بشكل صحيح. يرجى العودة للمنيو الرئيسي.");
                return;
            }

            // الاستماع والربط الآمن مع قاعدة البيانات المركزية
            if (window.BoseStoreData) {
                initCategoryRendering(window.BoseStoreData);
            } else {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    initCategoryRendering(e.detail);
                });
            }

            function initCategoryRendering(siteData) {
                if (!siteData || !siteData.homepage || !siteData.products) {
                    renderEmptyState("عذراً، حدث خطأ أثناء تحميل بيانات المتجر.");
                    return;
                }

                const categoryObj = siteData.homepage.categoriesSlider.find(cat => cat.id === categoryId);
                if (!categoryObj) {
                    renderEmptyState("الصنف المطلوب غير متوفر حالياً.");
                    return;
                }

                document.title = `${categoryObj.title} الفاخرة | حلويات بوسي`;
                headlineNode.textContent = categoryObj.title;
                breadcrumbNode.textContent = categoryObj.title;

                globalFilteredProducts = siteData.products.filter(p => p.category === categoryId);
                globalStoreCurrency = siteData.store.currency || "EGP";
                
                // الترتيب السلوكي الذكي للعميل
                try {
                    const behaviorData = localStorage.getItem('bose_user_behavior');
                    const behaviorLog = behaviorData ? JSON.parse(behaviorData) : {};
                    
                    globalFilteredProducts.sort((a, b) => {
                        let scoreA = behaviorLog[a.slug] ? behaviorLog[a.slug].score : 0;
                        let scoreB = behaviorLog[b.slug] ? behaviorLog[b.slug].score : 0;
                        
                        if (scoreB === scoreA) {
                            let timeA = behaviorLog[a.slug] ? behaviorLog[a.slug].lastVisited : 0;
                            let timeB = behaviorLog[b.slug] ? behaviorLog[b.slug].lastVisited : 0;
                            return timeB - timeA;
                        }
                        return scoreB - scoreA;
                    });
                } catch (e) {
                    console.warn("⚠️ فشل فرز المنتجات سلوكياً داخل الفئة.");
                }
                
                if (globalFilteredProducts.length > 0) {
                    descNode.textContent = globalFilteredProducts[0].description || `أفخر أنواع ${categoryObj.title} المصنوعة يدوياً بكل حب وشغف.`;
                } else {
                    renderEmptyState("لا توجد منتجات متوفرة حالياً في هذه الفئة.");
                    return;
                }

                const firstProduct = globalFilteredProducts[0];

                if (categoryId === "taswaq-cupcake") {
                    productsGrid.className = "category-products-grid layout-full-card";
                    sizeFilterRow.style.display = "none";
                } else if (firstProduct && firstProduct.layout) {
                    productsGrid.className = `category-products-grid layout-${firstProduct.layout}`;
                    if (firstProduct.layout === "tabs") {
                        sizeFilterRow.style.display = "flex";
                    } else {
                        sizeFilterRow.style.display = "none";
                    }
                }

                // بناء العرض الأولي
                renderProductsDOM();

                // ربط التبويبات بكفاءة دون سحق أحداث الـ DOM بشكل عشوائي
                sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (this.classList.contains('active')) return;
                        
                        sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        activeSizeTab = this.getAttribute('data-filter-size');
                        
                        // تحديث الأسعار والمحددات ديناميكياً لتوفير استهلاك البيانات والمعالجة
                        updateExistingCardsConfig();
                    });
                });
            }

            function renderProductsDOM() {
                productsGrid.innerHTML = "";
                
                globalFilteredProducts.forEach(product => {
                    const defaultSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");
                    
                    const calculatedPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                        window.calculateProductFinalPrice(product, {size: defaultSize}) : (product.price || 0);
                    
                    const cardElement = document.createElement('div');
                    cardElement.className = 'product-card';
                    cardElement.setAttribute('data-slug', product.slug);
                    
                    // 📐 الالتزام بالترتيب الهندسي الصارم: يمين (+) وسط (العدد) يسار (-) بالتوافق مع اتجاه RTL لصفحة المتجر
                    cardElement.innerHTML = `
                        <a href="product.html?slug=${product.slug}" class="product-card-link" aria-label="عرض تفاصيل منتج ${product.title}">
                            <img class="product-card-img" src="${product.image || (product.images ? product.images[0] : '')}" alt="${product.title}" loading="lazy">
                            <h3 class="product-card-title">${product.title}</h3>
                            <span class="product-card-flavor-name">${product.flavorName || ''}</span>
                            <p class="product-card-desc">${product.flavorDesc || ''}</p>
                        </a>
                        
                        <div class="product-card-qty-row">
                            <button class="bose-internal-qty-btn bose-internal-plus" type="button" aria-label="زيادة الكمية">+</button>
                            <input class="bose-internal-input" type="number" value="1" min="1" readonly aria-label="الكمية الحالية">
                            <button class="bose-internal-qty-btn bose-internal-minus" type="button" aria-label="تقليل الكمية">-</button>
                        </div>

                        <div class="product-card-bottom-row">
                            <div class="product-card-price" data-base-unit-price="${calculatedPrice}">${calculatedPrice} ${globalStoreCurrency}</div>
                            <button class="bose-internal-add" type="button" aria-label="إضافة منتج ${product.title} لسلة المشتريات">إضافة للسلة</button>
                        </div>
                    `;

                    // ربط أحداث العداد بشكل مستقل وآمن لراحة العميل النفسية والبدنية
                    const plusBtn = cardElement.querySelector('.bose-internal-plus');
                    const minusBtn = cardElement.querySelector('.bose-internal-minus');
                    const inputField = cardElement.querySelector('.bose-internal-input');
                    const addBtn = cardElement.querySelector('.bose-internal-add');
                    const priceDisplay = cardElement.querySelector('.product-card-price');

                    plusBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        let currentVal = parseInt(inputField.value, 10) || 1;
                        inputField.value = currentVal + 1;
                        updateCardPriceDisplay(priceDisplay, inputField.value);
                    });

                    minusBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        let currentVal = parseInt(inputField.value, 10) || 1;
                        if (currentVal > 1) {
                            inputField.value = currentVal - 1;
                            updateCardPriceDisplay(priceDisplay, inputField.value);
                        }
                    });

                    addBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        const finalQty = parseInt(inputField.value, 10) || 1;
                        const currentSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");
                        
                        if (typeof window.createCartItem === 'function') {
                            const cartItem = window.createCartItem(product, {size: currentSize}, finalQty);
                            if (cartItem) {
                                let rawCart = localStorage.getItem('bose_cart');
                                let cart = rawCart ? JSON.parse(rawCart) : [];
                                
                                const existingIndex = cart.findIndex(item => item.productSlug === product.slug && item.type === cartItem.type && item.customDetails.size === cartItem.customDetails.size);
                                if (existingIndex > -1) {
                                    cart[existingIndex].quantity += finalQty;
                                } else {
                                    cart.push(cartItem);
                                }
                                
                                localStorage.setItem('bose_cart', JSON.stringify(cart));
                                if (typeof window.updateGlobalCartCounter === 'function') {
                                    window.updateGlobalCartCounter();
                                }
                                
                                const originalText = addBtn.textContent;
                                addBtn.textContent = "تمت الإضافة للسلة";
                                addBtn.style.backgroundColor = "#111111";
                                setTimeout(() => {
                                    addBtn.textContent = originalText;
                                    addBtn.style.backgroundColor = "var(--bose-pink)";
                                    inputField.value = 1; 
                                    updateCardPriceDisplay(priceDisplay, 1);
                                }, 1500);
                            }
                        }
                    });

                    productsGrid.appendChild(cardElement);
                });
            }

            function updateCardPriceDisplay(priceDisplayNode, quantity) {
                const basePrice = parseFloat(priceDisplayNode.getAttribute('data-base-unit-price')) || 0;
                const totalDisplayPrice = basePrice * (parseInt(quantity, 10) || 1);
                priceDisplayNode.textContent = `${totalDisplayPrice} ${globalStoreCurrency}`;
            }

            function updateExistingCardsConfig() {
                globalFilteredProducts.forEach(product => {
                    const cardNode = productsGrid.querySelector(`[data-slug="${product.slug}"]`);
                    if (!cardNode) return;

                    const priceDisplay = cardNode.querySelector('.product-card-price');
                    const inputField = cardNode.querySelector('.bose-internal-input');
                    
                    const currentSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");
                    
                    const newUnitPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                        window.calculateProductFinalPrice(product, {size: currentSize}) : (product.price || 0);
                    
                    priceDisplay.setAttribute('data-base-unit-price', newUnitPrice);
                    updateCardPriceDisplay(priceDisplay, inputField.value);
                });
            }

            function renderEmptyState(message) {
                productsGrid.className = "category-products-grid layout-full-card";
                productsGrid.innerHTML = `
                    <div class="bose-empty-state-container">
                        <i class="fa-solid fa-cookie-bite"></i>
