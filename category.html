<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تصفح الأصناف الفاخرة | حلويات بوسي</title>
    
    <!-- 🔍 إعدادات تحسين محركات البحث والأرشفة الفاخرة SEO -->
    <meta name="description" content="استمتع بتصفح تشكيلة حلويات بوسي الفاخرة المجهزة يومياً بمكونات طبيعية 100% طازجة تليق بمناسباتكم السعيدة.">
    
    <!-- 🎨 ربط ملفات التصميم الموزعة هندسياً لمنع تضخم الأكواد وتأخر التحميل -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- 👑 استدعاء المحرك المركزي العالمي في رأس الصفحة لتأمين الـ DOM ومنع وميض الألوان -->
    <script src="js/core-engine.js"></script>

    <style>
        /* 🎨 الهندسة البصرية الخاصة بصفحة الفئة الديناميكية لمنع التكديس البصري */
        .category-view-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 16px;
            direction: rtl;
            box-sizing: border-box;
            background-color: var(--bose-white, #FFFFFF);
            min-height: 60vh;
        }

        .bose-category-breadcrumb {
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: var(--bose-black, #111111);
            font-weight: 600 !important;
        }

        .bose-category-breadcrumb a {
            color: var(--bose-black, #111111);
            text-decoration: none;
            transition: var(--bose-transition-smooth, color 0.3s ease);
        }

        .bose-category-breadcrumb a:hover {
            color: var(--bose-pink, #FF91A4);
        }

        .bose-category-breadcrumb span {
            margin: 0 10px;
            opacity: 0.3;
        }

        .category-hero-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .category-title-text {
            color: var(--bose-black, #111111) !important;
            font-size: 1.85rem;
            font-weight: 700 !important;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .category-title-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: var(--bose-pink, #FF91A4);
            border-radius: 2px;
        }

        .category-desc-text {
            color: #4D4D4D;
            font-size: 0.95rem;
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 📐 محرك التوزيع الشبكي المرن المتوافق مع محددات الأبعاد القياسية الصارمة للمواصفة */
        .category-products-grid {
            display: grid;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* منع التكدس والحشر على الموبايل: كارت واحد كامل ومريح في الصف لراحة العميل النفسية */
        .category-products-grid.layout-two-cards, 
        .category-products-grid.layout-tabs,
        .category-products-grid.layout-full-card {
            grid-template-columns: 1fr;
        }

        /* التوزيع المتوازن على الشاشات الأكبر */
        @media (min-width: 768px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
        }

        /* 🚨 التبويبات الفرعية لأصناف الديسباسيتو */
        .bose-size-tabs-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: rtl;
        }

        .bose-filter-tab-pill {
            font-family: 'Cairo', sans-serif;
            font-weight: 700 !important;
            font-size: 0.85rem;
            padding: 10px 20px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            color: #111111;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bose-filter-tab-pill.active {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
        }

        /* 🚨 هيكل التحميل الهيكلي الـ Skeleton */
        .skeleton-card-loader {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-pulse-node {
            background: linear-gradient(90deg, #f7f7f7 25%, #eeeeee 50%, #f7f7f7 75%);
            background-size: 200% 100%;
            animation: bosePulse 1.4s infinite linear;
            border-radius: 12px;
        }

        @keyframes bosePulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bose-empty-state-container {
            text-align: center;
            padding: 60px 20px;
            color: var(--bose-black, #111111);
        }
        .bose-empty-state-container i {
            font-size: 3rem;
            color: var(--bose-pink, #FF91A4);
            margin-bottom: 20px;
        }
        
        /* 🛠️ [إصلاح هندسي لحل مشكلة الصورة المضغوطة بالفوتر] */
        .bose-footer .footer-logo-container img {
            height: 60px !important;
            width: auto !important;
            max-width: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body class="bose-hardware-accelerated bose-arabic-text">

    <!-- 🏢 [الأوسمة النائبة المعتمدة هندسياً في الـ Blueprint لحقن الهيدر ديناميكياً] -->
    <div id="bose-header-injector"></div>

    <!-- 📥 القائمة الجانبية المشتركة للموبايل -->
    <div class="drawer-overlay" id="drawer-shield"></div>
    <aside class="bose-drawer-menu" id="sidebar-drawer"></aside>

    <!-- 🧱 منطقة عرض الفئة والمنتجات التابعة لها -->
    <main class="category-view-wrapper">
        <nav class="bose-category-breadcrumb" aria-label="مسار التنقل">
            <a href="index.html">الرئيسية</a>
            <span>/</span>
            <a href="menu.html">المنيو الشامل</a>
            <span>/</span>
            <span id="breadcrumb-active-category" aria-current="page">جاري التحميل...</span>
        </nav>

        <div class="category-hero-header">
            <h1 id="bose-category-headline" class="category-title-text">تصفح الأصناف</h1>
            <p id="bose-category-description" class="category-desc-text">جاري جلب تفاصيل صنف حلويات بوسي الفاخر...</p>
        </div>

        <!-- تبويبات التصفح للأحجام والأبعاد لأصناف الديسباسيتو -->
        <div id="bose-size-filter-row" class="bose-size-tabs-filter" style="display: none;">
            <button class="bose-filter-tab-pill active" data-filter-size="triangle">مثلث فردي</button>
            <button class="bose-filter-tab-pill" data-filter-size="medium">وسط تشارك ممتع</button>
            <button class="bose-filter-tab-pill" data-filter-size="large">كبير جمعات فاخرة</button>
        </div>

        <!-- حاوية الشبكة الهندسية للمنتجات المعزولة -->
        <div id="bose-category-products-grid" class="category-products-grid">
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
        </div>
    </main>

    <!-- 🏪 [الوسم النائب المعتمد هندسياً لحقن الفوتر ديناميكياً] -->
    <div id="bose-footer-injector"></div>

    <!-- 👑 المحرك البرمجي المتكامل والمستقل لصفحة الفئة 👑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('category');

            const productsGrid = document.getElementById('bose-category-products-grid');
            const headlineNode = document.getElementById('bose-category-headline');
            const descNode = document.getElementById('bose-category-description');
            const breadcrumbNode = document.getElementById('breadcrumb-active-category');
            const sizeFilterRow = document.getElementById('bose-size-filter-row');
            
            let activeSizeTab = "triangle";

            if (!categoryId) {
                renderEmptyState("لم يتم تحديد الصنف بشكل صحيح. يرجى العودة للمنيو الرئيسي.");
                return;
            }

            // الاستماع والربط مع قاعدة البيانات المركزية
            if (window.BoseStoreData) {
                initCategoryRendering(window.BoseStoreData);
            } else {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    initCategoryRendering(e.detail);
                });
            }

            function initCategoryRendering(siteData) {
                if (!siteData || !siteData.homepage || !siteData.products) {
                    renderEmptyState("عذراً، حدث خطأ أثناء تحميل بيانات المتجر.");
                    return;
                }

                const categoryObj = siteData.homepage.categoriesSlider.find(cat => cat.id === categoryId);
                if (!categoryObj) {
                    renderEmptyState("الصنف المطلوب غير متوفر حالياً.");
                    return;
                }

                // تحديث وسوم الـ SEO ديناميكياً بحسب الفئة النشطة
                document.title = `${categoryObj.title} الفاخرة | حلويات بوسي`;

                headlineNode.textContent = categoryObj.title;
                breadcrumbNode.textContent = categoryObj.title;

                const filteredProducts = siteData.products.filter(p => p.category === categoryId);
                
                // 👑 [الترتيب السلوكي الذكي داخل الفئة] 👑
                try {
                    const behaviorData = localStorage.getItem('bose_user_behavior');
                    const behaviorLog = behaviorData ? JSON.parse(behaviorData) : {};
                    
                    filteredProducts.sort((a, b) => {
                        let scoreA = behaviorLog[a.slug] ? behaviorLog[a.slug].score : 0;
                        let scoreB = behaviorLog[b.slug] ? behaviorLog[b.slug].score : 0;
                        
                        if (scoreB === scoreA) {
                            let timeA = behaviorLog[a.slug] ? behaviorLog[a.slug].lastVisited : 0;
                            let timeB = behaviorLog[b.slug] ? behaviorLog[b.slug].lastVisited : 0;
                            return timeB - timeA;
                        }
                        return scoreB - scoreA;
                    });
                } catch (e) {
                    console.warn("⚠️ فشل فرز المنتجات سلوكياً داخل الفئة.");
                }
                
                if (filteredProducts.length > 0) {
                    descNode.textContent = filteredProducts[0].description || `أفخر أنواع ${categoryObj.title} المصنوعة يدوياً بكل حب وشغف.`;
                } else {
                    renderEmptyState("لا توجد منتجات متوفرة حالياً في هذه الفئة.");
                    return;
                }

                const currency = siteData.store.currency || "EGP";
                const firstProduct = filteredProducts[0];

                // تطبيق التخطيطات الشبكية الآمنة تماشياً مع الـ JSON والمواصفات
                if (categoryId === "taswaq-cupcake") {
                    productsGrid.className = "category-products-grid layout-full-card";
                    sizeFilterRow.style.display = "none";
                } else if (firstProduct && firstProduct.layout) {
                    productsGrid.className = `category-products-grid layout-${firstProduct.layout}`;
                    if (firstProduct.layout === "tabs") {
                        sizeFilterRow.style.display = "flex";
                    } else {
                        sizeFilterRow.style.display = "none";
                    }
                }

                const renderProductsByLayoutConfig = () => {
                    productsGrid.innerHTML = "";
                    filteredProducts.forEach(product => {
                        if (categoryId !== "taswaq-cupcake" && firstProduct && firstProduct.layout === "tabs" && product.prices) {
                            product.defaultSize = activeSizeTab; 
                        }
                        
                        let cardHTML = "";
                        // 👑 [تصحيح فوري للمطابقة بالملي مع الهيكل الموحد للكارت بالمسطرة] 👑
                        if (typeof window.generateStrictProductCardHTML === 'function') {
                            cardHTML = window.generateStrictProductCardHTML(product, currency);
                        } else {
                            const calculatedPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                                window.calculateProductFinalPrice(product, {size: product.defaultSize}) : (product.price || 0);
                            
                            // هيكل الكارت الموحد الصارم (الاسم، النكهة، السعر، العداد، وزر الإضافة الحقيقي)
                            cardHTML = `
                                <div class="product-card" data-slug="${product.slug}" style="background:#FFFFFF; border:1px solid rgba(255,145,164,0.15); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:12px; position:relative;">
                                    <a href="product.html?slug=${product.slug}" style="text-decoration:none; color:inherit; display:block;">
                                        <img class="product-card-img" src="${product.image || product.images[0]}" alt="${product.title}" loading="lazy" style="width:100%; height:220px; object-fit:cover; border-radius:12px;">
                                        <h3 class="product-card-title" style="font-size:1.15rem; margin:10px 0 2px 0; font-weight:700 !important; color:#111111;">${product.title}</h3>
                                        <span class="product-card-flavor-name" style="color:var(--bose-pink); font-size:0.9rem; font-weight:600; display:block; margin-bottom:4px;">${product.flavorName || ''}</span>
                                        <p class="product-card-desc" style="font-size:0.85rem; color:#4D4D4D; line-height:1.4; margin:6px 0;">${product.flavorDesc || ''}</p>
                                    </a>
                                    
                                    <!-- عداد الكمية المرن لمنع القيم السالبة -->
                                    <div class="product-card-qty-row" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:auto; padding-top:8px; direction:ltr;">
                                        <button class="btn-qty-minus" style="width:32px; height:32px; border:1px solid rgba(255,145,164,0.3); background:#fff; border-radius:50%; font-weight:bold; cursor:pointer;">-</button>
                                        <input class="input-qty-value" type="number" value="1" min="1" readonly style="width:40px; text-align:center; border:none; font-weight:700; font-size:1rem; color:#111111;">
                                        <button class="btn-qty-plus" style="width:32px; height:32px; border:1px solid rgba(255,145,164,0.3); background:#fff; border-radius:50%; font-weight:bold; cursor:pointer;">+</button>
                                    </div>

                                    <div class="product-card-bottom-row" style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                                        <div class="product-card-price" style="color:var(--bose-pink); font-weight:700; font-size:1.2rem;">${calculatedPrice} ${currency}</div>
                                        <button class="btn-add-to-cart" style="background:var(--bose-pink); color:#FFFFFF; border:none; padding:10px 18px; border-radius:50px; cursor:pointer; font-size:0.85rem; font-weight:700;">إضافة للسلة</button>
                                    </div>
                                </div>
                            `;
                        }

                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = cardHTML;
                        
                        // تفعيل الـ Lazy Loading لتوفير الباقات وبيانات الموبايل
                        const imgElement = tempDiv.querySelector('img');
                        if (imgElement) {
                            imgElement.setAttribute('loading', 'lazy');
                        }
                        
                        while (tempDiv.firstChild) {
                            productsGrid.appendChild(tempDiv.firstChild);
                        }
                    });

                    if (typeof window.attachProductCardEvents === 'function') {
                        window.attachProductCardEvents(productsGrid, siteData.products, currency);
                    }
                };

                renderProductsByLayoutConfig();

                sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.preventDefault();
                        sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        activeSizeTab = this.getAttribute('data-filter-size');
                        renderProductsByLayoutConfig();
                    });
                });
            }

            function renderEmptyState(message) {
                productsGrid.className = "category-products-grid layout-full-card";
                productsGrid.innerHTML = `
                    <div class="bose-empty-state-container">
                        <i class="fa-solid fa-cookie-bite"></i>
                        <h3 style="font-weight: 700 !important; color: var(--bose-black); margin-bottom: 12px;">${message}</h3>
                        <a href="menu.html" style="display: inline-block; background-color: var(--bose-pink); color: #FFFFFF; padding: 12px 28px; border-radius: 50px; text-decoration: none; font-weight: 700; margin-top:15px; transition:0.3s ease;">تصفح المنيو الشامل</a>
                    </div>
                `;
                headlineNode.textContent = "تنبيه";
                descNode.textContent = "";
                breadcrumbNode.textContent = "خطأ";
            }
        });
    </script>
</body>
</html>
