    <!-- 🛡️ [SEO - Canonical ديناميكي]: الصفحة دي بتتفتح بروابط متعددة (category.html?category=X
         لكل فئة)، فمن غير canonical بيقول لجوجل إن كل رابط ده نسخة مستقلة معتبرة، ممكن يتعامل
         معاها كمحتوى مكرر ويقلل ترتيبها. الوسم بيتحدّث فعليًا بالـ ID الصحيح بعد ما بيانات الفئة
         تجهز (شوفي دالة updateCanonicalTag في نص الصفحة) - القيمة هنا Placeholder بس لحد التحديث. -->
    <link rel="canonical" id="bose-canonical-tag" href="https://bose-sweet.vercel.app/category.html">
    <!-- 🛡️👑 [SEO/GEO - Canonical فوري لفئات المحاكي]: فئات "ورد" و"تورت" (taswaq-flowers /
         taswaq-toort) بيتم تحويل الزائر منها فوراً لصفحة المحاكي المخصصة عن طريق JS بعد ما بيانات
         المنتجات تجهز (شوفي initCategoryRendering تحت). المشكلة إن أي بوت/محرك بحث مش بيستنى تنفيذ
         الـ JS وينتظر التحويل ده كان بيشوف صفحة category.html فاضية شكلياً للفئة دي، من غير أي ربط
         واضح بصفحة المحاكي الحقيقية. الكود ده بيحدد الـ canonical فوراً من الـ URL (مش لازم ننتظر
         تحميل بيانات المتجر) عشان أي بوت يعرف من أول لحظة إن المحتوى الرسمي لفئة الورد/التورت
         موجود فعلياً في flower-builder.html / cake-builder.html. -->
    <script>
        (function bosePreResolveBuilderCanonical() {
            var catId = new URLSearchParams(window.location.search).get("category");
            var builderMap = { "taswaq-flowers": "flower-builder.html", "taswaq-toort": "cake-builder.html" };
            if (catId && builderMap[catId]) {
                var tag = document.getElementById("bose-canonical-tag");
                if (tag) tag.setAttribute("href", "https://bose-sweet.vercel.app/" + builderMap[catId]);
            }
        })();
    </script>

             المحتوى (مكونات المنتج وطعمه ولمين مناسب)، فالخط الصغير (0.95rem) والمحاذاة
             لنص وسط النص كانوا بيخلوا الفقرة تبان مكدسة وصعبة القراءة. دلوقتي بطاقة
             مستقلة بخلفية وردية فاتحة جداً وحدود وشريط لوني جانبي، عشان الوصف ياخد
             حيز بصري واضح ومختلف عن باقي الصفحة، والنص بقى محاذي لليمين (أطبع للقراءة
             في فقرة عربية طويلة من المحاذاة لالوسط) وبمسافة أسطر أوسع. */
        .category-desc-card {
            background: linear-gradient(180deg, rgba(255, 145, 164, 0.08), rgba(255, 145, 164, 0.02));
            border: 1px solid rgba(255, 145, 164, 0.28);

            box-shadow: var(--bose-shadow-glow, 0 8px 32px rgba(255, 145, 164, 0.12));
            padding: 22px 26px;
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .category-desc-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background-color: var(--bose-pink, #FF91A4);

            font-size: 1.1rem;

            line-height: 2;

        /* 📐 محرك التوزيع الشبكي المرن المتوافق مع محددات الأبعاد القياسية الصارمة */

        /* كارت واحد كامل ومريح في الصف على الموبايل لمنع التكدس */

        /* 📏 [إصلاح - كارت وصف طويل بيكسر ارتفاع الصف]: نفس إصلاح main.css
           (راجع الشرح الكامل هناك) - قص بصري لـ3 أسطر + زرار "اظهار المزيد"

        .product-card-desc {

        /* 🚨 التبويبات الفرعية لأصناف الديسباسيتو */
        .bose-size-tabs-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: rtl;
            /* 🛡️🛡️ [إصلاح UX حرج]: شريط الأحجام كان بيفضل مكانه فوق الصفحة وكروت
               المنتجات بتتحرك تحت السكرول - فالعميلة كانت مضطرة تسكرول لفوق كل
               مرة تغيّر الحجم، وبعدين تاني لتحت تشوف أثر التغيير على الكروت.
               دلوقتي الشريط ثابت (Sticky) أعلى الشاشة طول وقت التصفح - قدام
               عينها دايماً من غير أي سكرول إضافي.
               🐛 [إصلاح - البند 6.3-ج]: كان الشريط بيستخدم top:8px وz-index:15،
               وده بيخليه يستقر تحت الهيدر الثابت (.bose-sticky-header، fixed
               بارتفاع 76px بعد الشريط العلوي، z-index:5000) لما تعملي سكرول -
               فيختفي وراه بدل ما يفضل ظاهر. دلوقتي top بقى بعد نهاية الهيدر
               الثابت فعليًا (نفس المعادلة المستخدمة في padding-top للصفحة كلها)
               وz-index اتزود عشان يفضل ظاهر فوق أي محتوى تحته. */
            position: sticky;
            top: calc(var(--bose-topbar-height, 44px) + 76px + 8px);
            z-index: 4000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 10px 8px;
            border-radius: 16px;
        }

        .product-card-price {

        /* 🚨 هيكل التحميل الهيكلي الـ Skeleton */

            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);

        /* 🆕👑 [نافذة تفاصيل المنتج المدمجة]: نفس أسلوب اللايت بوكس المستخدم في
           صفحة المنتج القديمة، بس هنا بتحتوي على الكارت التفاعلي الكامل (صورة/حجم/

<body class="bose-hardware-accelerated bose-arabic-text">

        <!-- حاوية الشبكة الهندسية للمنتجات المعزولة -->

    <!-- 🆕👑 [دمج صفحة المنتج جوه صفحة الفئة]: بدل ما "عرض التفاصيل" يوديكي لصفحة
         تانية منفصلة (product.html)، تفاصيل المنتج (صورة أكبر، الحجم، الكمية،
         السعر، الوصف الكامل، وزرار الإضافة للسلة) بتتفتح في نافذة واحدة فوق نفس
         صفحة الفئة، من غير أي انتقال أو تحميل صفحة جديدة - نفس المنتج، نفس الصفحة،
         خطوة واحدة أقل. الرابط بيتحدث في شريط العنوان (category.html?category=X&product=Y)
         عشان يفضل قابل للمشاركة ولزرار الرجوع في المتصفح، بس من غير ما تتحمل صفحة جديدة فعلياً. -->
    <!-- 🍧 [حل مشكلة "مش عارف يختار من خلاله" - تنسيق أداة اختيار التوبينجين]: كروت
         الاختيار دي كانت موجودة بتنسيقها الخاص جوه صفحة المنتج القديمة (product.html)
         اللي اتشالت بالكامل بعد دمج تفاصيل المنتج جوه نافذة category.html - فالتنسيق
         مش موجود في أي ملف CSS مشترك تاني. بنعرّفه هنا مستقل تماماً (أسماء كلاسات
         bose-mix-* مش مستخدمة في أي مكان تاني بالموقع) عشان منتج الميكس بس. -->
    <style>
        .bose-mix-picker-wrapper { margin: 4px 0 18px; }

        }
        .bose-mix-chip-name { font-weight: 700; font-size: 0.85rem; }
        .bose-mix-chip-price { font-size: 0.75rem; opacity: 0.7; }
    </style>

    <div id="bose-product-detail-modal" class="bose-product-detail-modal-overlay">
        <div class="bose-product-detail-modal-panel">
            <button type="button" id="bose-product-detail-close-btn" class="bose-product-detail-close-btn" aria-label="إغلاق">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="bose-product-detail-modal-body" class="bose-product-detail-modal-body"></div>
        </div>
    </div>

        <!-- 🆕👑 [محرك نافذة تفاصيل المنتج المدمجة] -->
        <script>
            // 🆕👑 [دمج صفحة المنتج جوه صفحة الفئة]: بيبني محتوى النافذة من نفس الكارت
            // التفاعلي الموحّد (createProductCardHTML) اللي شغال في كل صفحات الموقع
            // التانية، عشان منطق الحجم/الكمية/السعر/الإضافة للسلة يفضل مركزي في مكان
            // واحد بس ومفيش نسخة تانية منه ممكن تتلخبط أو تختلف. بيفتح فوق نفس الصفحة
            // من غير أي تحميل جديد، وبيحدّث رابط الصفحة عشان يفضل قابل للمشاركة.
            //
            // 🆕👑 [تحديث تاني]: بعد ما اتأكد إن الاستغناء عن صفحة المنتج قرار نهائي،
            // النافذة دلوقتي بتحمل كل حاجة كانت موجودة في الصفحة القديمة من غير نقصان:
            // قسم المقترحات المشابهة + قسم المراجعات والتقييمات الكامل (بالفورم بتاعه)
            // + تحديث عنوان الصفحة/الرابط الرسمي (canonical) لاسم المنتج المفتوح فعلياً،
            // بالظبط زي ما كان بيحصل في product.html قبل كده.
            const boseCategoryLevelTitle = document.title;
            const boseCategoryLevelCanonical = document.getElementById("bose-canonical-tag")
                ? document.getElementById("bose-canonical-tag").getAttribute("href") : "";

            function boseRenderRelatedProducts(currentProduct) {
                const relatedRoot = document.getElementById('bose-product-detail-related-grid');
                if (!relatedRoot || !window.BoseStoreData || !window.BoseStoreData.products) return;
                const suggestionsList = window.BoseStoreData.products.filter(function(p) {
                    return p.slug !== currentProduct.slug && !(p.customBuilderUrl && p.builderType && p.builderType !== 'standard');
                }).slice(0, 8);

                if (suggestionsList.length === 0) {
                    relatedRoot.innerHTML = '<p style="width:100%; text-align:center; opacity:0.6; font-weight:600; padding:20px;">استكشف المزيد من المفاجآت والأصناف الفاخرة بداخل المنيو الشامل 🌸</p>';
                    return;
                }
                relatedRoot.innerHTML = suggestionsList.map(function(p) { return window.createProductCardHTML(p); }).join('');
            }

            /**
             * 🍧 [حل مشكلة "مش عارف يختار من خلاله" - منتجات الميكس]: بتبني أداة
             * اختيار توبينجين مختلفين لمنتج ميكس (زي قشطوطة ميكس) وتحقنها تحت
             * الكارت التفاعلي مباشرة جوه نافذة التفاصيل. مصدر التوبينجات هو باقي
             * نكهات نفس القسم (بنفس فلسفة "استكشف باقي النكهات" اللي كانت موجودة في
             * صفحة المنتج القديمة)، مع استبعاد منتجات العروض "promo-" ومنتجات الميكس
             * التانية وأي نكهة نفدت كميتها حالياً. العميلة لازم تختار توبينجين
             * مختلفين قبل ما زرار "أضف للسلة" (المعطّل افتراضياً في الكارت) يتفعّل.
             * @param {Object} product
             * @param {HTMLElement} cardEl
             */
            function renderBoseMixToppingPickerInModal(product, cardEl) {
                const allProducts = (window.BoseStoreData && window.BoseStoreData.products) || [];
                const pool = allProducts.filter(function (p) {
                    return p.category === product.category &&
                        p.slug !== product.slug &&
                        !String(p.id).startsWith('promo-') &&
                        !(p.options && p.options.mixFlavor === true) &&
                        p.isAvailable !== false;
                });

                // 🍧 مفيش توبينجات كفاية للاختيار منها حالياً - بنسيب الكارت زي ما هو
                // (زرار الإضافة هيفضل معطّل، وده أهون من نافذة فاضية أو أداة مكسورة).
                if (pool.length < 2) return;

                const pickerRoot = document.createElement('div');
                pickerRoot.className = 'bose-mix-picker-wrapper';
                pickerRoot.innerHTML =
                    '<label class="bose-mix-picker-title">' +
                    '<i class="fas fa-layer-group" style="color:var(--bose-pink);"></i> اختاري توبينجاتك (لازم تختاري اتنين مختلفين)</label>' +
                    '<div class="bose-mix-picker-subtitle">التوبينج الأول</div>' +
                    '<div class="bose-mix-chip-row" id="bose-mix-picker-a"></div>' +
                    '<div class="bose-mix-picker-subtitle">التوبينج الثاني</div>' +
                    '<div class="bose-mix-chip-row" id="bose-mix-picker-b"></div>';

                cardEl.insertAdjacentElement('afterend', pickerRoot);

                // 🍧 حالة الاختيار الحالية مخزّنة على الكارت نفسه - window.handleBoseMixAddToCartClick
                // (core-engine.js) بيقرأها من هنا وقت الإضافة الفعلية للسلة.
                cardEl._boseMixSelection = { mixToppingASlug: null, mixToppingBSlug: null, mixToppingAName: '', mixToppingBName: '' };

                function renderPickerCards(containerId, currentSlug, otherSlug, onPick) {
                    const container = pickerRoot.querySelector('#' + containerId);
                    container.innerHTML = pool.map(function (top) {
                        return '<div class="bose-mix-chip' + (top.slug === currentSlug ? ' selected' : '') + '"' +
                            ' data-slug="' + top.slug + '"' +
                            ' style="' + (top.slug === otherSlug ? 'opacity:0.35;' : '') + '">' +
                            '<span class="bose-mix-chip-name">' + window.escapeBoseHTML(top.flavorName || top.title) + '</span>' +
                            '<span class="bose-mix-chip-price">' + Math.round(top.price) + ' جنيه</span>' +
                            '</div>';
                    }).join('');
                    container.querySelectorAll('.bose-mix-chip').forEach(function (card) {
                        card.addEventListener('click', function () {
                            if (this.dataset.slug === otherSlug) {
                                if (typeof window.showBoseGlobalToast === 'function') {
                                    window.showBoseGlobalToast('مينفعش تختاري نفس التوبينج مرتين - اختاري توبينج مختلف للنص التاني 🍧');
                                }
                                return;
                            }
                            onPick(this.dataset.slug);
                        });
                    });
                }

                function refreshBothPickers() {
                    const sel = cardEl._boseMixSelection;
                    renderPickerCards('bose-mix-picker-a', sel.mixToppingASlug, sel.mixToppingBSlug, function (slug) {
                        sel.mixToppingASlug = slug;
                        const t = pool.find(function (p) { return p.slug === slug; });
                        sel.mixToppingAName = t ? (t.flavorName || t.title) : '';
                        onMixSelectionChange();
                    });
                    renderPickerCards('bose-mix-picker-b', sel.mixToppingBSlug, sel.mixToppingASlug, function (slug) {
                        sel.mixToppingBSlug = slug;
                        const t = pool.find(function (p) { return p.slug === slug; });
                        sel.mixToppingBName = t ? (t.flavorName || t.title) : '';
                        onMixSelectionChange();
                    });
                }

                function onMixSelectionChange() {
                    refreshBothPickers();
                    const sel = cardEl._boseMixSelection;
                    const bothSelected = sel.mixToppingASlug && sel.mixToppingBSlug;
                    const btn = cardEl.querySelector('.btn-add-to-cart-mix');
                    const priceDisplay = cardEl.querySelector('.product-card-price');
                    const flavorNode = cardEl.querySelector('.product-card-flavor-name');

                    if (bothSelected) {
                        const unitPrice = window.calculateProductFinalPrice(product, {
                            mixToppingASlug: sel.mixToppingASlug,
                            mixToppingBSlug: sel.mixToppingBSlug
                        });
                        if (priceDisplay) {
                            const priceSpan = priceDisplay.querySelector('span');
                            if (priceSpan) priceSpan.textContent = Math.round(unitPrice) + ' جنيه';
                        }
                        if (flavorNode) flavorNode.textContent = sel.mixToppingAName + ' + ' + sel.mixToppingBName;
                        if (btn) {
                            btn.disabled = false;
                            btn.style.opacity = '';
                            btn.style.cursor = '';
                            btn.innerHTML = '<i class="fa-solid fa-basket-shopping"></i> اضافة للسلة';
                        }
                    } else {
                        if (flavorNode) flavorNode.textContent = product.flavorName || '';
                        if (btn) {
                            btn.disabled = true;
                            btn.style.opacity = '0.6';
                            btn.style.cursor = 'not-allowed';
                            btn.innerHTML = '<i class="fa-solid fa-layer-group"></i> اختاري توبينجاتك تحت أولاً';
                        }
                    }
                }

                refreshBothPickers();
            }

            window.openBoseProductDetailModal = function(slug, preferredSize, opts) {
                opts = opts || {};
                if (!window.BoseStoreData || !window.BoseStoreData.products) return;
                const product = window.BoseStoreData.products.find(function(p) { return p.slug === slug || p.id === slug; });
                if (!product) return;

                const modal = document.getElementById('bose-product-detail-modal');
                const body = document.getElementById('bose-product-detail-modal-body');
                if (!modal || !body) return;

                // 🍧 [حل مشكلة "مش عارف يختار من خلاله" - منتجات الميكس]: منتج زي
                // "قشطوطة ميكس" لازم يظهر هنا بالكارت الكامل التفاعلي (renderMode
                // 'detail') مش الكارت المصغّر اللي بيودّي لمكان تاني - هنا فعلاً
                // "المكان التاني" اللي المفروض تختار منه.
                const isMixFlavorProduct = product.options && product.options.mixFlavor === true;

                body.innerHTML = window.createProductCardHTML(product, isMixFlavorProduct ? 'detail' : undefined)
                    + '<h3 class="bose-related-products-heading" style="font-size:1.1rem; font-weight:800; margin:0 0 6px 0;">قد يعجبك أيضاً</h3>'
                    + '<div id="bose-product-detail-related-grid" class="bose-horizontal-suggestions-slider"></div>'
                    + '<div id="bose-product-detail-reviews-root"></div>';

                const cardEl = body.querySelector('.product-card-unified');
                // منع أي محاولة نقر تودّي لفتح نافذة تانية جوه النافذة نفسها
                if (cardEl) cardEl.removeAttribute('onclick');

                // 🍧 [حل مشكلة "مش عارف يختار من خلاله" - أداة اختيار التوبينجين]:
                // بتضاف مباشرة تحت الكارت (قبل قسم "قد يعجبك أيضاً") - العميلة
                // بتختار توبينجين مختلفين من نفس نكهات القسم، والسعر وزرار الإضافة
                // بيتحدثوا لحظياً مع كل اختيار (راجع renderBoseMixToppingPickerInModal تحت).
                if (isMixFlavorProduct && cardEl) {
                    renderBoseMixToppingPickerInModal(product, cardEl);
                }

                // لو فيه حجم متفق عليه من الكارت اللي جبنا منه (نفس اللي شافت سعره
                // العميلة قبل ما تفتح التفاصيل)، بنفعّله بمحاكاة نقرة حقيقية على نفس
                // التبويب عشان السعر والصورة يتحدّثوا صح بنفس المنطق الموجود فعلياً.
                if (cardEl && preferredSize) {
                    const pill = cardEl.querySelector(`.bose-card-size-pill[data-size-key="${preferredSize}"]`);
                    if (pill && !pill.classList.contains('active')) pill.click();
                }

                boseRenderRelatedProducts(product);
                if (typeof window.initBoseReviewsWidget === 'function') {
                    window.initBoseReviewsWidget({
                        mountId: 'bose-product-detail-reviews-root',
                        slug: product.slug,
                        title: product.title,
                        heading: 'مراجعات وتقييمات العملاء',
                        subtext: 'شاركينا رأيك في الصنف ده - رأيك بيفرق مع عميلات تانية زيك.'
                    });
                }

                // 🔍 [SEO]: نفس سلوك product.html القديم بالظبط - عنوان الصفحة والرابط
                // الرسمي (canonical) بيتحدثوا لاسم المنتج المفتوح فعلياً، ويرجعوا لقيمة
                // الفئة العامة تاني لما النافذة تتقفل.
                document.title = `${product.title} | حلويات بوسي الفاخرة`;
                const canonicalTag = document.getElementById("bose-canonical-tag");
                if (canonicalTag) canonicalTag.setAttribute("href", `https://bose-sweet.vercel.app/category.html?category=${encodeURIComponent(product.category || '')}&product=${encodeURIComponent(product.slug)}`);

                modal.classList.add('active');
                document.body.classList.add('bose-modal-open');

                if (!opts.skipHistory) {
                    const catId = new URLSearchParams(window.location.search).get('category') || product.category;
                    const newUrl = `category.html?category=${encodeURIComponent(catId)}&product=${encodeURIComponent(product.slug)}`;
                    history.pushState({ boseProductModalSlug: product.slug }, '', newUrl);
                }
            };

            window.closeBoseProductDetailModal = function(opts) {
                opts = opts || {};
                const modal = document.getElementById('bose-product-detail-modal');
                if (modal) modal.classList.remove('active');
                document.body.classList.remove('bose-modal-open');
                document.title = boseCategoryLevelTitle;
                const canonicalTag = document.getElementById("bose-canonical-tag");
                if (canonicalTag && boseCategoryLevelCanonical) canonicalTag.setAttribute("href", boseCategoryLevelCanonical);
                if (!opts.skipHistory) history.back();
            };

            document.getElementById('bose-product-detail-close-btn').addEventListener('click', function() {
                window.closeBoseProductDetailModal();
            });
            document.getElementById('bose-product-detail-modal').addEventListener('click', function(e) {
                if (e.target === this) window.closeBoseProductDetailModal();
            });

    <!-- 🏪 [الوسم النائب المعتمد هندسياً لحقن الفوتر ديناميكياً] -->

    <!-- 👑 المحرك البرمجي المتكامل والمستقل لصفحة الفئة 👑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);

            if (!categoryId) {

            // الاستماع والربط الآمن مع قاعدة البيانات المركزية
            if (window.BoseStoreData) {
                initCategoryRendering(window.BoseStoreData);
            } else {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    initCategoryRendering(e.detail);
                });
            }

            function initCategoryRendering(siteData) {
                if (!siteData || !siteData.homepage || !siteData.products) {
                    renderEmptyState("عذراً، حدث خطأ أثناء تحميل بيانات المتجر.");

                // 🛡️ [إصلاح]: بنستخدم القايمة الحية (typeof window.getBoseCategoriesList) بدل

                const liveCatList = (typeof window.getBoseCategoriesList === "function" && window.getBoseCategoriesList().length)
                    ? window.getBoseCategoriesList()
                    : (siteData.homepage.categoriesSlider || []);
                const categoryObj = liveCatList.find(cat => cat.id === categoryId);
                if (!categoryObj) {
                    renderEmptyState("الصنف المطلوب غير متوفر حالياً.");
                    return;
                }

                document.title = `${categoryObj.title} الفاخرة | حلويات بوسي`;
                headlineNode.textContent = categoryObj.title;
                breadcrumbNode.textContent = categoryObj.title;

                // 🔍 [SEO - وصف مخصص لكل قسم]: نفس مبدأ product.html - قبل كده كل الأقسام
                // (تورت، ورد، كب كيك...) كانت بتشترك في meta description واحد عام للصفحة
                // كلها. دلوقتي كل قسم بياخد وصف فيه اسمه الحقيقي، فجوجل يقدر يميّز نتيجة
                // "الجاتوهات الملكية" عن نتيجة "بوكيهات الورد" في نتائج البحث.
                // 🛡️👑 [إصلاح لاحق]: كان النص هنا بيتجاهل categoryObj.description الحقيقي

                // يعني حتى الفئات اللي أدمن كتبلها وصف كويس ومفصّل (زي الجاتوهات) كان
                // الوصف ده بيروح في نص الصفحة بس ومبيوصلش لمحرك البحث نفسه. دلوقتي أول
                // أولوية للوصف الحقيقي المكتوب، وبعدين fallback للنص العام لو مفيش وصف.
                (function updateBoseCategoryMeta() {
                    const catDesc = (categoryObj.description && categoryObj.description.trim())

                        : `تسوقي ${categoryObj.title} من حلويات بوسي - تشكيلة فاخرة بمكونات طبيعية 100%، تحضير طازة يومياً وتوصيل لباب البيت.`;
                    const metaDesc = document.querySelector('meta[name="description"]');

                // 🛡️ [SEO - تحديث Canonical]: بنحدّث الوسم بنفس رابط الفئة الحالية بالظبط

                // منتج جديد منفصل بسعر مختلف لنفس النكهة، فيبان للعميل إنه تكرار غلط. مكانها الشرعي

                //
                // 🛡️ [إصلاح حرج جديد]: المنتجات "الرئيسية" المرتبطة بمحاكي تفاعلي (تورت مخصص toort-custom-master

                // standard بسعر أساسي بس من غير أي تخصيص حقيقي (شكل/حجم/نكهة/عدد أفراد للتورت، نوع/عدد
                // ورد للبوكيه) - نفس فحص isBuilderMaster المستخدم في core-engine.js (createProductCardHTML)
                // وproduct.html (التحويل التلقائي) اتطبق هنا كمان عشان الصفحات الثلاثة تتفق مع بعضها.
                globalFilteredProducts = siteData.products.filter(p =>
                    p.category === categoryId &&
                    !String(p.id).startsWith('promo-') &&
                    !(p.customBuilderUrl && p.builderType && p.builderType !== 'standard')
                );
                globalStoreCurrency = siteData.store.currency || "EGP";

                // 🛡️ [إصلاح حرج جديد]: لو الفئة دي بالكامل بتخص محاكي تفاعلي (زي "التورت" أو "الورد")
                // فبعد الفلترة فوق هتبقى فاضية تماماً من غير أي منتج قياسي - بدل ما نعرض "لا توجد منتجات"
                // مربكة للعميل، نوديه مباشرة لصفحة المحاكي الصحيحة (نفس سلوك product.html بالظبط).
                if (globalFilteredProducts.length === 0) {
                    const masterBuilderProduct = siteData.products.find(p =>
                        p.category === categoryId && p.customBuilderUrl && p.builderType && p.builderType !== 'standard'
                    );
                    if (masterBuilderProduct) {
                        window.location.replace(masterBuilderProduct.customBuilderUrl);

                // 🔽 [إصلاح - ترتيب يدوي بالسعر]: الترتيب السلوكي بقى دالة مستقلة
                // (sortByBehavior) بتتنادى بس لو العميلة سايبة الوضع الافتراضي
                // "الأنسب لك" - لو اختارت ترتيب بالسعر، بنحترم اختيارها ومنعملش
                // إعادة ترتيب سلوكي فوقه.
                applyActiveSort();

                if (sortSelectEl && !sortSelectEl.dataset.bound) {
                    sortSelectEl.dataset.bound = "1";
                    sortSelectEl.value = activeSortMode;
                    sortSelectEl.addEventListener('change', function () {
                        activeSortMode = this.value;
                        applyActiveSort();
                        renderProductsDOM();
                    });
                }

                descNode.textContent = categoryObj.description || globalFilteredProducts[0].description || `أفخر أنواع ${categoryObj.title} المصنوعة يدوياً بكل حب وشغف.`;

                const firstProduct = globalFilteredProducts[0];

                if (categoryId === "taswaq-cupcake") {
                    productsGrid.className = "category-products-grid layout-full-card";
                    sizeFilterRow.style.display = "none";
                    sizeFilterNote.style.display = "none";
                } else if (firstProduct && firstProduct.layout) {
                    productsGrid.className = `category-products-grid layout-${firstProduct.layout}`;
                    if (firstProduct.layout === "tabs") {

                        sizeFilterNote.style.display = "flex";
                    } else {
                        sizeFilterRow.style.display = "none";
                        sizeFilterNote.style.display = "none";
                    }

                // بناء العرض الأولي
                renderProductsDOM();

                // 🆕👑 [دمج صفحة المنتج جوه صفحة الفئة]: لو حد فتح لينك فيه ?product=

                // فاتورة سابقة...)، نفتحله نافذة تفاصيل المنتج ده تلقائياً فور ما
                // الشبكة تخلص رسم نفسها، من غير ما يحتاج يدور عليه بنفسه.
                const deepLinkProductSlug = urlParams.get('product');
                if (deepLinkProductSlug) {
                    window.openBoseProductDetailModal(deepLinkProductSlug, urlParams.get('size'), { skipHistory: true });
                }

                // ربط التبويبات بكفاءة دون سحق أحداث الـ DOM بشكل عشوائي
                sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (this.classList.contains('active')) return;
                        
                        sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        activeSizeTab = this.getAttribute('data-filter-size');

                        // 🔽 [إصلاح - ترتيب يدوي بالسعر]: لو الترتيب الحالي بالسعر، لازم نعيد

                        // الأرقام مكانها - وإلا الترتيب يفضل مبني على أسعار الحجم القديم.
                        if (activeSortMode === "price-asc" || activeSortMode === "price-desc") {
                            applyActiveSort();
                            renderProductsDOM();
                        } else {
                            // تحديث الأسعار والمحددات ديناميكياً لتوفير استهلاك البيانات والمعالجة
                            updateExistingCardsConfig();
                        }
                    });
                });
            }

            // 🔽 [إصلاح - ترتيب يدوي بالسعر]: بنستخدم نفس دالة حساب السعر النهائي
            // (calculateProductFinalPrice) المستخدمة فعلياً في عرض الكارت، عشان
            // الترتيب يتطابق تماماً مع السعر اللي العميلة شايفاه فعلاً على الشاشة.
            function getSortablePrice(product) {
                const sizeForPrice = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");
                return typeof window.calculateProductFinalPrice === 'function'
                    ? window.calculateProductFinalPrice(product, { size: sizeForPrice })
                    : (product.price || 0);
            }

            function applyActiveSort() {
                if (activeSortMode === "price-asc") {
                    globalFilteredProducts.sort((a, b) => getSortablePrice(a) - getSortablePrice(b));
                    return;
                }
                if (activeSortMode === "price-desc") {
                    globalFilteredProducts.sort((a, b) => getSortablePrice(b) - getSortablePrice(a));
                    return;
                }
                // الوضع الافتراضي "الأنسب لك": الترتيب السلوكي بناءً على تصفح العميلة سابقاً
                try {
                    const behaviorData = localStorage.getItem('bose_user_behavior');
                    const behaviorLog = behaviorData ? JSON.parse(behaviorData) : {};

                    globalFilteredProducts.sort((a, b) => {

                        if (scoreB === scoreA) {

            function renderProductsDOM() {

                    // مشطوب - فيبان للعميل كأنه منتج مستقل بسعر غريب، مش نفس المنتج اللي شايفه
                    // بخصم في قسم العروض. تم توحيد شكل شارة الخصم هنا مع نفس كلاسات main.css

                    // المستخدمة فعلياً في كل باقي الموقع.
                    // 👑 [6.3-أ]: منطق الشارة نفسه دلوقتي بييجي من buildBoseDiscountBadgeMarkup

                    const { hasDiscount, discountBadgeHtml, oldPriceHtml, savingsHtml } = window.buildBoseDiscountBadgeMarkup(product, { currencyLabel: globalStoreCurrency, savingsVerb: 'وفرت' });

                    // 👑 [إصلاح جذري - كل الكارت قابل للمس]: الكارت كله بيودي لصفحة

                    // على الصورة أو الاسم. العداد وزرار الإضافة للسلة استثناء مقصود.
                    cardElement.style.cursor = 'pointer';

                    // 🛡️ [إصلاح أمني]: escapeBoseHTML كان متاح ومستخدم في كل مكان تاني بالموقع،

                    const esc = typeof window.escapeBoseHTML === 'function' ? window.escapeBoseHTML : (s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
                    const safeTitle = esc(product.title);

                    // 🛡️🛡️ [إصلاح جذري - فقدان قيمة صفحة المنتج]: الكارت هنا كان بيسمح

                    const favBtnHtml = window.buildBoseFavButtonHTML(product.id);

                    const productDetailUrl = `category.html?category=${encodeURIComponent(categoryId)}&product=${encodeURIComponent(product.slug)}&size=${encodeURIComponent(defaultSize)}`;

                    cardElement.innerHTML = `

                    // فوق (نفس السلوك بالظبط) - مربوطة دلوقتي بـ addEventListener بعد إدراج الكارت.

                    const descToggleBtn = cardElement.querySelector(".bose-desc-toggle-btn");
                    if (descToggleBtn) {
                        descToggleBtn.addEventListener("click", function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            window.toggleBoseCardDesc(descToggleBtn);
                        });
                    }

                    // 👑 [إصلاح جذري - كل الكارت قابل للمس]
                    cardElement.addEventListener('click', function(e) {
                        if (e.target.closest('a')) return; // الأنكرز فوق بتتصرف بمفردها
                        window.openBoseProductDetailModal(product.slug, defaultSize);
                    });

                    productsGrid.appendChild(cardElement);
                });
            }

            function updateCardPriceDisplay(priceDisplayNode, quantity) {
                // 🐛 [إصلاح حرج]: كان بيكتب على .product-card-price بالكامل بـ textContent،
                // فكان بيمسح شارة "السعر القديم" وملاحظة "وفرت X جنيه" لأي منتج عليه عرض
                // بمجرد ما العميل يغيّر الكمية. دلوقتي بيحدّث السعر الحالي بس جوه span مخصصة له.
                const basePrice = parseFloat(priceDisplayNode.getAttribute('data-base-unit-price')) || 0;
                const totalDisplayPrice = basePrice * (parseInt(quantity, 10) || 1);
                const priceValueNode = priceDisplayNode.querySelector('.current-price-value');
                if (priceValueNode) {
                    priceValueNode.textContent = `${totalDisplayPrice} ${globalStoreCurrency}`;
                } else {
                    priceDisplayNode.textContent = `${totalDisplayPrice} ${globalStoreCurrency}`;
                }
            }

            function updateExistingCardsConfig() {
                globalFilteredProducts.forEach(product => {
                    const cardNode = productsGrid.querySelector(`[data-slug="${product.slug}"]`);
                    if (!cardNode) return;

                    const priceDisplay = cardNode.querySelector('.product-card-price');

                    const currentSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");

                    const newUnitPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                        window.calculateProductFinalPrice(product, {size: currentSize}) : (product.price || 0);
                    
                    priceDisplay.setAttribute('data-base-unit-price', newUnitPrice);
                    updateCardPriceDisplay(priceDisplay, 1);

                    // 🛡️🛡️ [إصلاح جذري - الصورة مش بتتغيّر مع الحجم]: كانت الصورة هنا ثابتة
                    // دايماً حتى لو المنتج عنده صورة مختلفة مسجلة لكل حجم (product.sizeImages
                    // - نفس البيانات اللي صفحة المنتج بتستخدمها بالفعل). دلوقتي بتتبدّل فوراً
                    // مع أي تبديل تبويب حجم، بدون ما تحتاج العميلة تفتح صفحة المنتج لتشوف الفرق.
                    const imgNode = cardNode.querySelector('.product-card-img[data-size-img]');
                    if (imgNode && product.sizeImages && product.sizeImages[currentSize]) {
                        const newImgUrl = product.sizeImages[currentSize];
                        const optimizedUrl = window.optimizeBoseImageUrl ? window.optimizeBoseImageUrl(newImgUrl, 450) : newImgUrl;
                        if (!imgNode.src.includes(encodeURI(newImgUrl)) && imgNode.getAttribute('src') !== optimizedUrl) {
                            imgNode.style.opacity = '0.4';
                            setTimeout(() => {
                                imgNode.src = optimizedUrl;
                                imgNode.style.opacity = '1';
                            }, 120);
                        }
                    }
                });
            }

            function renderEmptyState(message) {
                productsGrid.className = "category-products-grid layout-full-card";
                productsGrid.innerHTML = `
                    <div class="bose-empty-state-container">
                        <i class="fa-solid fa-cookie-bite"></i>
                        <h3 style="font-weight: 700 !important; color: var(--bose-black); margin-bottom: 12px;">${message}</h3>
                        <a href="menu.html" style="display: inline-block; background-color: var(--bose-pink); color: #FFFFFF; padding: 12px 28px; border-radius: 50px; text-decoration: none; font-weight: 700; margin-top:15px; transition: 0.3s ease;">تصفح المنيو الشامل</a>
                    </div>
                `;
                headlineNode.textContent = "تنبيه";
                descNode.textContent = "";
                breadcrumbNode.textContent = "خطأ";
            }
        });
    </script>
</body>
</html>
