<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تصفح الأصناف الفاخرة | حلويات بوسي</title>
    
    <!-- 🔍 إعدادات تحسين محركات البحث والأرشفة الفاخرة SEO المتطابقة -->
    <meta name="description" content="استمتع بتصفح تشكيلة حلويات بوسي الفاخرة المجهزة يومياً بمكونات طبيعية 100% طازجة تليق بمناسباتكم السعيدة وتضمن راحتكم النفسية.">
    
    <!-- 🎨 ربط ملفات التصميم الموزعة هندسياً لمنع تضخم الأكواد وتأخر التحميل -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- 👑 استدعاء المحرك المركزي العالمي في رأس الصفحة لتأمين الـ DOM ومنع وميض الألوان -->
    <script src="js/core-engine.js"></script>

    <style>
        /* 🎨 الهندسة البصرية الخاصة بصفحة الفئة الديناميكية لمنع التكديس البصري */
        .category-view-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 16px;
            direction: rtl;
            box-sizing: border-box;
            background-color: var(--bose-white, #FFFFFF);
        }

        .bose-category-breadcrumb {
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: var(--bose-black, #111111);
            font-weight: 600 !important;
        }

        .bose-category-breadcrumb a {
            color: var(--bose-black, #111111);
            text-decoration: none;
            transition: var(--bose-transition-smooth, color 0.3s ease);
        }

        .bose-category-breadcrumb a:hover {
            color: var(--bose-pink, #FF91A4);
        }

        .bose-category-breadcrumb span {
            margin: 0 10px;
            opacity: 0.3;
        }

        .category-hero-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .category-title-text {
            color: var(--bose-black, #111111) !important;
            font-size: 1.85rem;
            font-weight: 700 !important; /* مقفول عند 700 للأقسام الكبرى تماشياً مع معايير البراند */
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .category-title-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: var(--bose-pink, #FF91A4);
            border-radius: 2px;
        }

        .category-desc-text {
            color: #4D4D4D;
            font-size: 0.95rem;
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 📐 محرك التوزيع الشبكي المرن المتوافق مع محددات الأبعاد القياسية الصارمة للمواصفة */
        .category-products-grid {
            display: grid;
            gap: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        /* لقطة عزل التكديس البصري تماشياً مع تخطيطات الـ Layout بالـ JSON */
        .category-products-grid.layout-two-cards, 
        .category-products-grid.layout-tabs {
            grid-template-columns: repeat(2, 1fr);
        }

        /* النمط المخصص للجاتوهات وبوكس الروقان كارت واحد مالي الشاشة على الموبايل لمنع الحشر البصري */
        .category-products-grid.layout-full-card {
            grid-template-columns: 1fr;
        }

        @media (min-width: 768px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
        }

        /* 🚨 التبويبات الفرعية الفاخرة المخصصة حصرياً لأحجام فئة الديسباسيتو لمنع تشتيت العميل */
        .bose-size-tabs-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: rtl;
        }

        .bose-filter-tab-pill {
            font-family: 'Cairo', sans-serif;
            font-weight: 700 !important;
            font-size: 0.85rem;
            padding: 10px 20px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            color: #111111;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bose-filter-tab-pill.active {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
        }

        /* 🚨 هيكل التحميل الهيكلي الـ Skeleton لسرعة وخفة تجربة الأداء وموازنة معالجات الموبايل */
        .skeleton-card-loader {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            height: 440px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .skeleton-pulse-node {
            background: linear-gradient(90deg, #f7f7f7 25%, #eeeeee 50%, #f7f7f7 75%);
            background-size: 200% 100%;
            animation: bosePulse 1.4s infinite linear;
            border-radius: 12px;
        }

        @keyframes bosePulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* 🛠️ [إصلاح هندسي حاسم لحل مشكلة الصورة المضغوطة بالفوتر] */
        .bose-footer .footer-logo-container img {
            height: 60px !important;
            width: auto !important;
            max-width: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body class="bose-hardware-accelerated bose-arabic-text">

    <!-- 🏢 مكون الهيدر الموحد والثابت الصريح (Shared Universal Header) الملتزم بالـ DOM القياسي الموحد -->
    <header class="bose-navbar"></header>

    <!-- 📥 القائمة الجانبية المشتركة للموبايل (Universal Drawer Menu) -->
    <div class="drawer-overlay" id="drawer-shield"></div>
    <aside class="bose-drawer-menu" id="sidebar-drawer"></aside>

    <!-- 🧱 منطقة عرض الفئة والمنتجات التابعة لها ديناميكياً وعزل الكوارث البصرية -->
    <main class="category-view-wrapper">
        <nav class="bose-category-breadcrumb" aria-label="مسار التنقل">
            <a href="index.html">الرئيسية</a>
            <span>/</span>
            <a href="menu.html">المنيو الشامل</a>
            <span>/</span>
            <span id="breadcrumb-active-category" aria-current="page">جاري التحميل...</span>
        </nav>

        <div class="category-hero-header">
            <h1 id="bose-category-headline" class="category-title-text">تصفح الأصناف</h1>
            <p id="bose-category-description" class="category-desc-text">جاري جلب تفاصيل صنف حلويات بوسي الفاخر...</p>
        </div>

        <!-- تبويبات التصفح للأحجام والأبعاد (تظهر وتخفي برمجياً وحصرياً لأصناف الديسباسيتو بناءً على دليل التشغيل) -->
        <div id="bose-size-filter-row" class="bose-size-tabs-filter" style="display: none;">
            <button class="bose-filter-tab-pill active" data-filter-size="triangle">مثلث فردي</button>
            <button class="bose-filter-tab-pill" data-filter-size="medium">وسط تشارك ممتع</button>
            <button class="bose-filter-tab-pill" data-filter-size="large">كبير جمعات فاخرة</button>
        </div>

        <!-- حاوية الشبكة الهندسية للمنتجات المعزولة التكديس البصري -->
        <div id="bose-category-products-grid" class="category-products-grid layout-two-cards">
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>
        </div>
    </main>

    <!-- 🏪 مكون الفوتر الموحد والثابت الفاتح الصريح (Shared Universal Footer) -->
    <footer class="bose-footer"></footer>

    <!-- 👑 المحرك البرمجي المتكامل لصفحة الفئة والمطابق لحسابات السلة والـ JSON 👑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('category');

            const productsGrid = document.getElementById('bose-category-products-grid');
            const headlineNode = document.getElementById('bose-category-headline');
            const descNode = document.getElementById('bose-category-description');
            const breadcrumbNode = document.getElementById('breadcrumb-active-category');
            const sizeFilterRow = document.getElementById('bose-size-filter-row');
            
            let activeSizeTab = "triangle";

            if (!categoryId) return;

            window.getBoseDatabase().then(siteData => {
                initCategoryRendering(siteData);
            }).catch(() => {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    initCategoryRendering(e.detail);
                });
            });

            function initCategoryRendering(siteData) {
                if (!siteData || !siteData.homepage || !siteData.products) return;

                const categoryObj = siteData.homepage.categoriesSlider.find(cat => cat.id === categoryId);
                if (!categoryObj) return;

                headlineNode.textContent = categoryObj.title;
                breadcrumbNode.textContent = categoryObj.title;

                const filteredProducts = siteData.products.filter(p => p.category === categoryId);
                // 👑 [بداية زراعة الترتيب السلوكي الذكي داخل الفئة] 👑
                try {
                    const behaviorData = localStorage.getItem('bose_user_behavior');
                    const behaviorLog = behaviorData ? JSON.parse(behaviorData) : {};
                    
                    filteredProducts.sort((a, b) => {
                        let scoreA = behaviorLog[a.slug] ? behaviorLog[a.slug].score : 0;
                        let scoreB = behaviorLog[b.slug] ? behaviorLog[b.slug].score : 0;
                        
                        // لو النقاط متساوية، رتّب على حسب الأحدث زيارة للعميل
                        if (scoreB === scoreA) {
                            let timeA = behaviorLog[a.slug] ? behaviorLog[a.slug].lastVisited : 0;
                            let timeB = behaviorLog[b.slug] ? behaviorLog[b.slug].lastVisited : 0;
                            return timeB - timeA;
                        }
                        return scoreB - scoreA;
                    });
                } catch (e) {
                    console.warn("⚠️ فشل فرز المنتجات سلوكياً داخل الفئة.");
                }
                // 👑 [نهاية زراعة الترتيب السلوكي الذكي داخل الفئة] 👑
                
                if (filteredProducts.length > 0 && filteredProducts[0].description) {
                    descNode.textContent = filteredProducts[0].description;
                }

                const currency = siteData.store.currency || "EGP";
                const firstProduct = filteredProducts[0];

                // 👑 [تحسين وتعديل تخطيط الكب كيك سلوكياً وبصرياً]:
                // إذا كان المعرّف يخص فئة الكب كيك، نجبر الكلاس على أخذ النمط الفردي مالي الشاشة لمنع الحشر والتكديس
                if (categoryId === "taswaq-cupcake") {
                    productsGrid.className = "category-products-grid layout-full-card";
                    sizeFilterRow.style.display = "none";
                } else if (firstProduct && firstProduct.layout) {
                    productsGrid.className = `category-products-grid layout-${firstProduct.layout}`;
                    if (firstProduct.layout === "tabs") {
                        sizeFilterRow.style.display = "flex";
                    } else {
                        sizeFilterRow.style.display = "none";
                    }
                }

                const renderProductsByLayoutConfig = () => {
                    productsGrid.innerHTML = "";
                    filteredProducts.forEach(product => {
                        if (categoryId !== "taswaq-cupcake" && firstProduct && firstProduct.layout === "tabs" && product.prices) {
                            product.defaultSize = activeSizeTab; 
                        }
                        if (typeof window.generateStrictProductCardHTML === 'function') {
                            const cardHTML = window.generateStrictProductCardHTML(product, currency);
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = cardHTML;
                            
                            // 👑 [إصلاح حاسم للرابط البرمجي]: توجيه العميل فوراً لصفحة تفاصيل الصنف الفردية ليرى المراجعات والبدائل الذكية
                            const cardLinks = tempDiv.querySelectorAll('a');
                            cardLinks.forEach(link => {
                                link.href = `product.html?slug=${product.slug}`;
                            });
                            
                            while (tempDiv.firstChild) {
                                productsGrid.appendChild(tempDiv.firstChild);
                            }
                        }
                    });

                    if (typeof window.attachProductCardEvents === 'function') {
                        window.attachProductCardEvents(productsGrid, siteData.products, currency);
                        
                        // إعادة تطبيق تعديل الروابط بعد تفعيل الأحداث للتأكيد الكامل
                        productsGrid.querySelectorAll('.product-card').forEach(card => {
                            const slug = card.dataset.slug;
                            const cardLinks = card.querySelectorAll('a');
                            cardLinks.forEach(link => {
                                link.href = `product.html?slug=${slug}`;
                            });
                        });
                    }
                };

                renderProductsByLayoutConfig();

                sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.preventDefault();
                        sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        activeSizeTab = this.getAttribute('data-filter-size');
                        renderProductsByLayoutConfig();
                    });
                });
            }
        });
    </script>
</body>
</html>
