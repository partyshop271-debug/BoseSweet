    <title>تصفح الأصناف الفاخرة | حلويات بوسي</title>
    <!-- 🛡️ [SEO - Canonical ديناميكي]: الصفحة دي بتتفتح بروابط متعددة (category.html?category=X
         لكل فئة)، فمن غير canonical بيقول لجوجل إن كل رابط ده نسخة مستقلة معتبرة، ممكن يتعامل
         معاها كمحتوى مكرر ويقلل ترتيبها. الوسم بيتحدّث فعليًا بالـ ID الصحيح بعد ما بيانات الفئة
         تجهز (شوفي دالة updateCanonicalTag في نص الصفحة) - القيمة هنا Placeholder بس لحد التحديث. -->
    <link rel="canonical" id="bose-canonical-tag" href="https://bose-sweet.vercel.app/category.html">
    <!-- 🛡️👑 [SEO/GEO - Canonical فوري لفئات المحاكي]: فئات "ورد" و"تورت" (taswaq-flowers /
         taswaq-toort) بيتم تحويل الزائر منها فوراً لصفحة المحاكي المخصصة عن طريق JS بعد ما بيانات
         المنتجات تجهز (شوفي initCategoryRendering تحت). المشكلة إن أي بوت/محرك بحث مش بيستنى تنفيذ
         الـ JS وينتظر التحويل ده كان بيشوف صفحة category.html فاضية شكلياً للفئة دي، من غير أي ربط
         واضح بصفحة المحاكي الحقيقية. الكود ده بيحدد الـ canonical فوراً من الـ URL (مش لازم ننتظر
         تحميل بيانات المتجر) عشان أي بوت يعرف من أول لحظة إن المحتوى الرسمي لفئة الورد/التورت
         موجود فعلياً في flower-builder.html / cake-builder.html. -->
    <script>
        (function bosePreResolveBuilderCanonical() {
            var catId = new URLSearchParams(window.location.search).get("category");
            var builderMap = { "taswaq-flowers": "flower-builder.html", "taswaq-toort": "cake-builder.html" };
            if (catId && builderMap[catId]) {
                var tag = document.getElementById("bose-canonical-tag");
                if (tag) tag.setAttribute("href", "https://bose-sweet.vercel.app/" + builderMap[catId]);
            }
        })();
    </script>
    
    <!-- 🔍 إعدادات تحسين محركات البحث والأرشفة الفاخرة SEO -->

    <style>
        /* 🎨 الهندسة البصرية الخاصة بصفحة الفئة الديناميكية لمنع التكديس البصري */
        .category-view-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 16px;
            direction: rtl;
            box-sizing: border-box;
            background-color: var(--bose-white, #FFFFFF);
            min-height: 60vh;
        }

        .bose-category-breadcrumb {
            font-size: 0.9rem;
            margin-bottom: 25px;
            color: var(--bose-black, #111111);
            font-weight: 600 !important;
        }

        .bose-category-breadcrumb a {
            color: var(--bose-black, #111111);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .bose-category-breadcrumb a:hover {
            color: var(--bose-pink, #FF91A4);
        }

        .bose-category-breadcrumb span {
            margin: 0 10px;
            opacity: 0.3;
        }

        .category-hero-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .category-title-text {
            color: var(--bose-black, #111111) !important;
            font-size: 1.85rem;
            font-weight: 700 !important;
            position: relative;
            display: inline-block;
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .category-title-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background-color: var(--bose-pink, #FF91A4);
            border-radius: 2px;
        }

        .category-desc-text {
            color: #111111;
            font-size: 0.95rem;
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 📐 محرك التوزيع الشبكي المرن المتوافق مع محددات الأبعاد القياسية الصارمة */
        .category-products-grid {
            display: grid;
            gap: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* كارت واحد كامل ومريح في الصف على الموبايل لمنع التكدس */
        .category-products-grid.layout-two-cards, 
        .category-products-grid.layout-tabs,
        .category-products-grid.layout-full-card {
            grid-template-columns: 1fr;
        }

        /* التوزيع المتوازن على الشاشات الأكبر */
        @media (min-width: 768px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs,
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .category-products-grid.layout-two-cards,
            .category-products-grid.layout-tabs,
            .category-products-grid.layout-full-card {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }
        }

        /* 📐 المقاسات الإلزامية الصارمة لكارت المنتج الموحد لمنع تضخم الكود والـ Overflow */
        .product-card {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            box-sizing: border-box;
            width: 100%;
            height: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bose-shadow-hover, 0 16px 40px rgba(255, 145, 164, 0.22));
            border-color: var(--bose-pink, #FF91A4);
        }

        .product-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card-img {
            width: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            aspect-ratio: 1 / 1;
            background-color: #FFFFFF;
            /* أبعاد الارتفاع الهندسية القياسية الصارمة */
            height: 220px !important;
        }

        @media (min-width: 768px) {
            .product-card-img {
                height: 260px !important;
            }
        }

        @media (min-width: 1024px) {
            .product-card-img {
                height: 320px !important;
            }
        }

        .product-card-title {
            font-size: 1.15rem;
            margin: 10px 0 4px 0;
            font-weight: 700 !important;
            color: var(--bose-black, #111111);
        }

        .product-card-flavor-name {
            color: var(--bose-pink, #FF91A4);
            font-size: 0.9rem;
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }

        .product-card-desc {
            font-size: 0.85rem;
            color: #111111;
            line-height: 1.4;
            margin: 6px 0;
        }

        /* 🚨 التبويبات الفرعية لأصناف الديسباسيتو */
        .bose-size-tabs-filter {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
            direction: rtl;
            /* 🛡️🛡️ [إصلاح UX حرج]: شريط الأحجام كان بيفضل مكانه فوق الصفحة وكروت
               المنتجات بتتحرك تحت السكرول - فالعميلة كانت مضطرة تسكرول لفوق كل
               مرة تغيّر الحجم، وبعدين تاني لتحت تشوف أثر التغيير على الكروت.
               دلوقتي الشريط ثابت (Sticky) أعلى الشاشة طول وقت التصفح - قدام
               عينها دايماً من غير أي سكرول إضافي.
               🐛 [إصلاح - البند 6.3-ج]: كان الشريط بيستخدم top:8px وz-index:15،
               وده بيخليه يستقر تحت الهيدر الثابت (.bose-sticky-header، fixed
               بارتفاع 76px بعد الشريط العلوي، z-index:5000) لما تعملي سكرول -
               فيختفي وراه بدل ما يفضل ظاهر. دلوقتي top بقى بعد نهاية الهيدر
               الثابت فعليًا (نفس المعادلة المستخدمة في padding-top للصفحة كلها)
               وz-index اتزود عشان يفضل ظاهر فوق أي محتوى تحته. */
            position: sticky;
            top: calc(var(--bose-topbar-height, 44px) + 76px + 8px);
            z-index: 4000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 10px 8px;
            border-radius: 16px;
        }

        .bose-filter-tab-pill {
            font-family: 'Cairo', sans-serif;
            font-weight: 700 !important;
            font-size: 0.85rem;
            padding: 10px 20px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            color: #111111;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bose-filter-tab-pill.active {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
        }

        /* العداد المطور المرن بتوزيع هندسي ملتزم: يمين (+) وسط (القيمة) يسار (-) */
        .product-card-qty-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
            padding-top: 8px;
            direction: rtl; /* تفعيل التناغم العربي الصريح من اليمين لليسار */
        }

        .bose-internal-qty-btn {
            width: 36px;
            height: 36px;
            border: 1px solid rgba(255, 145, 164, 0.3);
            background: #FFFFFF;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--bose-black, #111111);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .bose-internal-qty-btn:hover {
            border-color: var(--bose-pink, #FF91A4);
            background-color: rgba(255, 145, 164, 0.05);
        }

        .bose-internal-input {
            width: 45px;
            text-align: center;
            border: none;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--bose-black, #111111);
            background: transparent;
            -moz-appearance: textfield;
        }

        .bose-internal-input::-webkit-outer-spin-button,
        .bose-internal-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .product-card-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .product-card-price {
            /* 🛡️ [تحسين وضوح]: السعر بقى جوه بوردر وخلفية مميزة، وخط أكبر وأوضح
               بدل ما يكون مجرد نص عادي جنب زرار الإضافة. */
            display: inline-flex;
            flex-direction: column;
            color: var(--bose-pink-text, var(--bose-pink, #FF91A4));
            font-weight: 800;
            font-size: 1.25rem;
            border: 2px solid var(--bose-pink, #FF91A4);
            background: rgba(255, 145, 164, 0.06);
            border-radius: 12px;
            padding: 6px 14px;
            line-height: 1.3;
        }

        .bose-internal-add {
            background: var(--bose-pink-text, var(--bose-pink, #FF91A4));
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.2s, transform 0.1s;
        }

        .bose-internal-add:hover {
            background-color: #111111;
        }

        /* 🚨 هيكل التحميل الهيكلي الـ Skeleton */
        .skeleton-card-loader {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.15);
            border-radius: 20px;
            padding: 16px;
            height: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
        }

        .skeleton-pulse-node {
            background: linear-gradient(90deg, #FFFFFF 25%, #FFFFFF 50%, #FFFFFF 75%);
            background-size: 200% 100%;
            animation: bosePulse 1.4s infinite linear;
            border-radius: 12px;
        }

        @keyframes bosePulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .bose-empty-state-container {
            text-align: center;
            padding: 60px 20px;
            color: var(--bose-black, #111111);
        }
        
        .bose-empty-state-container i {
            font-size: 3rem;
            color: var(--bose-pink, #FF91A4);
            margin-bottom: 20px;
        }
    </style>
</head>

            <div class="skeleton-card-loader"><div class="skeleton-pulse-node" style="height:220px;"></div><div class="skeleton-pulse-node" style="height:24px; width:70%;"></div><div class="skeleton-pulse-node" style="height:20px; width:40%;"></div><div class="skeleton-pulse-node" style="height:45px; margin-top:auto;"></div></div>

    <!-- 🏪 [الوسم النائب المعتمد هندسياً لحقن الفوتر ديناميكياً] -->

    <!-- 👑 المحرك البرمجي المتكامل والمستقل لصفحة الفئة 👑 -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('category');

            const productsGrid = document.getElementById('bose-category-products-grid');
            const headlineNode = document.getElementById('bose-category-headline');
            const descNode = document.getElementById('bose-category-description');
            const breadcrumbNode = document.getElementById('breadcrumb-active-category');
            const sizeFilterRow = document.getElementById('bose-size-filter-row');
            const sizeFilterNote = document.getElementById('bose-size-filter-note');
            
            let activeSizeTab = "triangle";
            let globalFilteredProducts = [];
            let globalStoreCurrency = "EGP";

            if (!categoryId) {
                renderEmptyState("لم يتم تحديد الصنف بشكل صحيح. يرجى العودة للمنيو الرئيسي.");
                return;
            }

            // الاستماع والربط الآمن مع قاعدة البيانات المركزية
            if (window.BoseStoreData) {
                initCategoryRendering(window.BoseStoreData);
            } else {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    initCategoryRendering(e.detail);
                });
            }

            function initCategoryRendering(siteData) {
                if (!siteData || !siteData.homepage || !siteData.products) {
                    renderEmptyState("عذراً، حدث خطأ أثناء تحميل بيانات المتجر.");
                    return;
                }

                // 🛡️ [إصلاح]: بنستخدم القايمة الحية (typeof window.getBoseCategoriesList) بدل
                // homepage.categoriesSlider القديمة، عشان اسم/صورة الفئة يتزامن فوراً مع جدول categories.
                const liveCatList = (typeof window.getBoseCategoriesList === "function" && window.getBoseCategoriesList().length)
                    ? window.getBoseCategoriesList()
                    : (siteData.homepage.categoriesSlider || []);
                const categoryObj = liveCatList.find(cat => cat.id === categoryId);
                if (!categoryObj) {
                    renderEmptyState("الصنف المطلوب غير متوفر حالياً.");
                    return;
                }

                document.title = `${categoryObj.title} الفاخرة | حلويات بوسي`;
                headlineNode.textContent = categoryObj.title;
                breadcrumbNode.textContent = categoryObj.title;

                // 🔍 [SEO - وصف مخصص لكل قسم]: نفس مبدأ product.html - قبل كده كل الأقسام
                // (تورت، ورد، كب كيك...) كانت بتشترك في meta description واحد عام للصفحة
                // كلها. دلوقتي كل قسم بياخد وصف فيه اسمه الحقيقي، فجوجل يقدر يميّز نتيجة
                // "الجاتوهات الملكية" عن نتيجة "بوكيهات الورد" في نتائج البحث.
                // 🛡️👑 [إصلاح لاحق]: كان النص هنا بيتجاهل categoryObj.description الحقيقي
                // المكتوب فعلياً في لوحة التحكم (لو موجود) ويستخدم نص عام قالبي دايماً -
                // يعني حتى الفئات اللي أدمن كتبلها وصف كويس ومفصّل (زي الجاتوهات) كان
                // الوصف ده بيروح في نص الصفحة بس ومبيوصلش لمحرك البحث نفسه. دلوقتي أول
                // أولوية للوصف الحقيقي المكتوب، وبعدين fallback للنص العام لو مفيش وصف.
                (function updateBoseCategoryMeta() {
                    const catDesc = (categoryObj.description && categoryObj.description.trim())
                        ? categoryObj.description.trim()
                        : `تسوقي ${categoryObj.title} من حلويات بوسي - تشكيلة فاخرة بمكونات طبيعية 100%، تحضير طازة يومياً وتوصيل لباب البيت.`;
                    const metaDesc = document.querySelector('meta[name="description"]');
                    if (metaDesc) metaDesc.setAttribute("content", catDesc);
                    const ogTitle = document.querySelector('meta[property="og:title"]');
                    if (ogTitle) ogTitle.setAttribute("content", `${categoryObj.title} الفاخرة | حلويات بوسي`);
                    const ogDesc = document.querySelector('meta[property="og:description"]');
                    if (ogDesc) ogDesc.setAttribute("content", catDesc);
                })();

                // 🛡️ [SEO - تحديث Canonical]: بنحدّث الوسم بنفس رابط الفئة الحالية بالظبط
                // (categoryId من الـ URL) عشان جوجل يعرف إن ده الرابط الرسمي المعتمد لنفس
                // المحتوى، مش نسخة مكررة من صفحة category.html العامة.
                const canonicalTag = document.getElementById("bose-canonical-tag");
                if (canonicalTag) canonicalTag.setAttribute("href", `https://bose-sweet.vercel.app/category.html?category=${encodeURIComponent(categoryId)}`);

                // 🛡️ [إصلاح حرج - سابق]: منتجات البوكسات/العروض المجمّعة (بادئة "promo-") كانت بتظهر هنا كأنها
                // منتج جديد منفصل بسعر مختلف لنفس النكهة، فيبان للعميل إنه تكرار غلط. مكانها الشرعي
                // الوحيد هو قسم العروض بالرئيسية وصفحة offers.html فقط، مش شبكة الفئة العادية.
                //
                // 🛡️ [إصلاح حرج جديد]: المنتجات "الرئيسية" المرتبطة بمحاكي تفاعلي (تورت مخصص toort-custom-master
                // / بوكيه ورد flowers-master) معندهاش سعر أو تفاصيل ثابتة أصلاً - سعرها بيتحدد جوه المحاكي بس.
                // قبل الإصلاح ده، كانت الفئتين taswaq-toort و taswaq-flowers بيوصلهم زائر مباشرة عبر رابط
                // (زي category.html?category=taswaq-toort الموجود فعلياً في sitemap.xml)، وكانت الصفحة
                // بتعرض المنتج ده كـ "كارت عادي" بعداد كمية وزرار "إضافة للسلة" مباشر، فيتضاف للسلة كمنتج
                // standard بسعر أساسي بس من غير أي تخصيص حقيقي (شكل/حجم/نكهة/عدد أفراد للتورت، نوع/عدد
                // ورد للبوكيه) - نفس فحص isBuilderMaster المستخدم في core-engine.js (createProductCardHTML)
                // وproduct.html (التحويل التلقائي) اتطبق هنا كمان عشان الصفحات الثلاثة تتفق مع بعضها.
                globalFilteredProducts = siteData.products.filter(p =>
                    p.category === categoryId &&
                    !String(p.id).startsWith('promo-') &&
                    !(p.customBuilderUrl && p.builderType && p.builderType !== 'standard')
                );
                globalStoreCurrency = siteData.store.currency || "EGP";

                // 🛡️ [إصلاح حرج جديد]: لو الفئة دي بالكامل بتخص محاكي تفاعلي (زي "التورت" أو "الورد")
                // فبعد الفلترة فوق هتبقى فاضية تماماً من غير أي منتج قياسي - بدل ما نعرض "لا توجد منتجات"
                // مربكة للعميل، نوديه مباشرة لصفحة المحاكي الصحيحة (نفس سلوك product.html بالظبط).
                if (globalFilteredProducts.length === 0) {
                    const masterBuilderProduct = siteData.products.find(p =>
                        p.category === categoryId && p.customBuilderUrl && p.builderType && p.builderType !== 'standard'
                    );
                    if (masterBuilderProduct) {
                        window.location.replace(masterBuilderProduct.customBuilderUrl);
                        return;
                    }
                    renderEmptyState("لا توجد منتجات متوفرة حالياً في هذه الفئة.");
                    return;
                }
                
                // الترتيب السلوكي الذكي للعميل
                try {
                    const behaviorData = localStorage.getItem('bose_user_behavior');
                    const behaviorLog = behaviorData ? JSON.parse(behaviorData) : {};
                    
                    globalFilteredProducts.sort((a, b) => {
                        let scoreA = behaviorLog[a.slug] ? behaviorLog[a.slug].score : 0;
                        let scoreB = behaviorLog[b.slug] ? behaviorLog[b.slug].score : 0;
                        
                        if (scoreB === scoreA) {
                            let timeA = behaviorLog[a.slug] ? behaviorLog[a.slug].lastVisited : 0;
                            let timeB = behaviorLog[b.slug] ? behaviorLog[b.slug].lastVisited : 0;
                            return timeB - timeA;
                        }
                        return scoreB - scoreA;
                    });
                } catch (e) {
                    console.warn("⚠️ فشل فرز المنتجات سلوكياً داخل الفئة.");
                }

                descNode.textContent = categoryObj.description || globalFilteredProducts[0].description || `أفخر أنواع ${categoryObj.title} المصنوعة يدوياً بكل حب وشغف.`;

                const firstProduct = globalFilteredProducts[0];

                if (categoryId === "taswaq-cupcake") {
                    productsGrid.className = "category-products-grid layout-full-card";
                    sizeFilterRow.style.display = "none";
                    sizeFilterNote.style.display = "none";
                } else if (firstProduct && firstProduct.layout) {
                    productsGrid.className = `category-products-grid layout-${firstProduct.layout}`;
                    if (firstProduct.layout === "tabs") {
                        sizeFilterRow.style.display = "flex";
                        sizeFilterNote.style.display = "flex";
                    } else {
                        sizeFilterRow.style.display = "none";
                        sizeFilterNote.style.display = "none";
                    }
                }

                // بناء العرض الأولي
                renderProductsDOM();

                // ربط التبويبات بكفاءة دون سحق أحداث الـ DOM بشكل عشوائي
                sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (this.classList.contains('active')) return;
                        
                        sizeFilterRow.querySelectorAll('.bose-filter-tab-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        activeSizeTab = this.getAttribute('data-filter-size');
                        
                        // تحديث الأسعار والمحددات ديناميكياً لتوفير استهلاك البيانات والمعالجة
                        updateExistingCardsConfig();
                    });
                });
            }

            function renderProductsDOM() {
                productsGrid.innerHTML = "";
                
                globalFilteredProducts.forEach(product => {
                    const defaultSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");
                    
                    const calculatedPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                        window.calculateProductFinalPrice(product, {size: defaultSize}) : (product.price || 0);
                    
                    const cardElement = document.createElement('div');
                    // 🐛 [إصلاح حرج]: هذه الدالة كانت منفصلة تماماً عن createProductCardHTML الموحدة
                    // في core-engine.js (كود مكرر بمنطق مختلف)، وده كان بيخلي أي منتج عليه عرض
                    // (oldPrice > price) يظهر هنا بسعره الحالي فقط من غير أي شارة خصم أو سعر قديم
                    // مشطوب - فيبان للعميل كأنه منتج مستقل بسعر غريب، مش نفس المنتج اللي شايفه
                    // بخصم في قسم العروض. تم توحيد شكل شارة الخصم هنا مع نفس كلاسات main.css
                    // (bose-offer-card / bose-offer-badge / product-old-price / offer-savings-note)
                    // المستخدمة فعلياً في كل باقي الموقع.
                    // 👑 [6.3-أ]: منطق الشارة نفسه دلوقتي بييجي من buildBoseDiscountBadgeMarkup
                    // الموحدة في core-engine.js بدل نسخة محلية مكررة هنا.
                    const { hasDiscount, discountBadgeHtml, oldPriceHtml, savingsHtml } = window.buildBoseDiscountBadgeMarkup(product, { currencyLabel: globalStoreCurrency, savingsVerb: 'وفرت' });
                    cardElement.className = 'product-card' + (hasDiscount ? ' bose-offer-card' : '');
                    cardElement.setAttribute('data-slug', product.slug);
                    // 👑 [إصلاح جذري - كل الكارت قابل للمس]: الكارت كله بيودي لصفحة
                    // المنتج لو العميلة دوست في أي مكان فاضي منه - مش لازم بالظبط
                    // على الصورة أو الاسم. العداد وزرار الإضافة للسلة استثناء مقصود.
                    cardElement.style.cursor = 'pointer';

                    // 🛡️ [إصلاح أمني]: escapeBoseHTML كان متاح ومستخدم في كل مكان تاني بالموقع،
                    // لكن هذا الملف كان بيحقن title/flavorName/flavorDesc في innerHTML مباشرة
                    // من غير أي تعقيم - ثغرة XSS محتملة لو أي حقل منتج فيه HTML/سكريبت.
                    const esc = typeof window.escapeBoseHTML === 'function' ? window.escapeBoseHTML : (s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));
                    const safeTitle = esc(product.title);
                    const safeFlavor = esc(product.flavorName || '');
                    const safeDesc = esc(product.flavorDesc || '');



                    // 🛡️🛡️ [إصلاح جذري - فقدان قيمة صفحة المنتج]: الكارت هنا كان بيسمح
                    // بإتمام الشراء بالكامل (عداد + إضافة للسلة) من غير ما العميلة تدخل
                    // صفحة المنتج (product.html) خالص - يعني ممكن متشوفش المراجعات ولا
                    // المنتجات المقترحة ولا وصف الحجم التفصيلي أبداً. دلوقتي الكارت هنا
                    // للتصفح والمقارنة السريعة بس (صورة + سعر حسب الحجم)، وزرار واحد
                    // واضح بيودّي دايماً لصفحة المنتج حيث يتم الشراء الفعلي.
                    const sizeImg = (product.sizeImages && defaultSize) ? product.sizeImages[defaultSize] : null;
                    const cardImageUrl = sizeImg || product.image || (product.images ? product.images[0] : '');

                    // 💗 [نظام المفضلة - 6.3-أ]: زرار القلب دلوقتي بييجي من buildBoseFavButtonHTML
                    // الموحدة في core-engine.js (نفس الزرار المستخدم في createProductCardHTML)
                    // بدل نسخة محلية مكررة هنا. الملف ده لسه عنده كارت منفصل عمدًا (راجع
                    // تعليق buildBoseFavButtonHTML نفسها في core-engine.js لسبب الانفصال).
                    const favBtnHtml = window.buildBoseFavButtonHTML(product.id);

                    cardElement.innerHTML = `
                        ${discountBadgeHtml}
                        ${favBtnHtml}
                        <a href="product.html?slug=${encodeURIComponent(product.slug)}" class="product-card-link" aria-label="عرض تفاصيل منتج ${safeTitle}">
                            <img class="product-card-img" data-size-img="1" src="${window.optimizeBoseImageUrl ? window.optimizeBoseImageUrl(cardImageUrl, 450) : cardImageUrl}" alt="${safeTitle}" loading="lazy">
                            <h3 class="product-card-title">${safeTitle}</h3>
                            <span class="product-card-flavor-name">${safeFlavor}</span>
                            <p class="product-card-desc">${safeDesc}</p>
                        </a>

                        <div class="product-card-bottom-row">
                            <div class="product-card-price" data-base-unit-price="${calculatedPrice}">
                                ${oldPriceHtml}
                                <span class="current-price-value">${calculatedPrice} ${globalStoreCurrency}</span>
                                ${savingsHtml}
                            </div>
                            <a href="product.html?slug=${encodeURIComponent(product.slug)}" class="bose-internal-add" aria-label="عرض تفاصيل وتقييمات منتج ${safeTitle}">عرض التفاصيل</a>
                        </div>
                    `;

                    // 👑 [إصلاح جذري - كل الكارت قابل للمس]
                    cardElement.addEventListener('click', function(e) {
                        window.location.href = `product.html?slug=${encodeURIComponent(product.slug)}`;
                    });

                    productsGrid.appendChild(cardElement);
                });
            }

            function updateCardPriceDisplay(priceDisplayNode, quantity) {
                // 🐛 [إصلاح حرج]: كان بيكتب على .product-card-price بالكامل بـ textContent،
                // فكان بيمسح شارة "السعر القديم" وملاحظة "وفرت X جنيه" لأي منتج عليه عرض
                // بمجرد ما العميل يغيّر الكمية. دلوقتي بيحدّث السعر الحالي بس جوه span مخصصة له.
                const basePrice = parseFloat(priceDisplayNode.getAttribute('data-base-unit-price')) || 0;
                const totalDisplayPrice = basePrice * (parseInt(quantity, 10) || 1);
                const priceValueNode = priceDisplayNode.querySelector('.current-price-value');
                if (priceValueNode) {
                    priceValueNode.textContent = `${totalDisplayPrice} ${globalStoreCurrency}`;
                } else {
                    priceDisplayNode.textContent = `${totalDisplayPrice} ${globalStoreCurrency}`;
                }
            }

            function updateExistingCardsConfig() {
                globalFilteredProducts.forEach(product => {
                    const cardNode = productsGrid.querySelector(`[data-slug="${product.slug}"]`);
                    if (!cardNode) return;

                    const priceDisplay = cardNode.querySelector('.product-card-price');

                    const currentSize = (categoryId !== "taswaq-cupcake" && product.prices) ? activeSizeTab : (product.defaultSize || "triangle");

                    const newUnitPrice = typeof window.calculateProductFinalPrice === 'function' ? 
                        window.calculateProductFinalPrice(product, {size: currentSize}) : (product.price || 0);
                    
                    priceDisplay.setAttribute('data-base-unit-price', newUnitPrice);
                    updateCardPriceDisplay(priceDisplay, 1);

                    // 🛡️🛡️ [إصلاح جذري - الصورة مش بتتغيّر مع الحجم]: كانت الصورة هنا ثابتة
                    // دايماً حتى لو المنتج عنده صورة مختلفة مسجلة لكل حجم (product.sizeImages
                    // - نفس البيانات اللي صفحة المنتج بتستخدمها بالفعل). دلوقتي بتتبدّل فوراً
                    // مع أي تبديل تبويب حجم، بدون ما تحتاج العميلة تفتح صفحة المنتج لتشوف الفرق.
                    const imgNode = cardNode.querySelector('.product-card-img[data-size-img]');
                    if (imgNode && product.sizeImages && product.sizeImages[currentSize]) {
                        const newImgUrl = product.sizeImages[currentSize];
                        const optimizedUrl = window.optimizeBoseImageUrl ? window.optimizeBoseImageUrl(newImgUrl, 450) : newImgUrl;
                        if (!imgNode.src.includes(encodeURI(newImgUrl)) && imgNode.getAttribute('src') !== optimizedUrl) {
                            imgNode.style.opacity = '0.4';
                            setTimeout(() => {
                                imgNode.src = optimizedUrl;
                                imgNode.style.opacity = '1';
                            }, 120);
                        }
                    }
                });
            }

            function renderEmptyState(message) {
                productsGrid.className = "category-products-grid layout-full-card";
                productsGrid.innerHTML = `
                    <div class="bose-empty-state-container">
                        <i class="fa-solid fa-cookie-bite"></i>
                        <h3 style="font-weight: 700 !important; color: var(--bose-black); margin-bottom: 12px;">${message}</h3>
                        <a href="menu.html" style="display: inline-block; background-color: var(--bose-pink); color: #FFFFFF; padding: 12px 28px; border-radius: 50px; text-decoration: none; font-weight: 700; margin-top:15px; transition: 0.3s ease;">تصفح المنيو الشامل</a>
                    </div>
                `;
                headlineNode.textContent = "تنبيه";
                descNode.textContent = "";
                breadcrumbNode.textContent = "خطأ";
            }
        });
    </script>
</body>
</html>
