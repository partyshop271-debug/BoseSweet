        // ==========================================
        // 4. مكون صفحة المنيو الكاملة (MenuPage Component)
        // ==========================================
        function MenuPage({ onNavigate, searchQuery, onSearchChange, onNavigateToDetail }) {
            const filteredProducts = useMemo(() => {
                if (!searchQuery.trim()) return siteData.products;
                const normalized = searchQuery.toLowerCase();
                return siteData.products.filter(p => 
                    p.title.toLowerCase().includes(normalized) || 
                    p.description.toLowerCase().includes(normalized) ||
                    (p.searchTerms && p.searchTerms.some(term => term.toLowerCase().includes(normalized)))
                );
            }, [searchQuery]);

            return (
                <div class="py-12 px-4 max-w-6xl mx-auto animate-fade-in text-right">
                    <div class="text-center mb-10">
                        <h1 class="text-2xl md:text-3xl font-extrabold text-brand-dark mb-2">منيو حلويات بوسي</h1>
                        <p class="text-xs text-gray-500">مجموعتنا الكاملة من الأصناف الفاخرة التي نحضرها يومياً بكل حب وإتقان</p>
                    </div>

                    {/* شريط البحث المركزي بالمنيو */}
                    <div class="max-w-md mx-auto mb-12">
                        <div class="relative">
                            <input 
                                type="text" 
                                placeholder="ابحث عن حلوياتك المفضلة..." 
                                value={searchQuery}
                                onChange={(e) => onSearchChange(e.target.value)}
                                class="w-full text-xs bg-[#F9F9F9] border border-gray-100 rounded-full py-3 px-6 outline-none focus:border-brand-pink focus:bg-white shadow-sm smooth-transition text-brand-dark text-right"
                            />
                            {searchQuery && (
                                <button 
                                    onClick={() => onSearchChange('')} 
                                    class="absolute left-4 top-1/2 -translate-y-1/2 text-xs text-gray-400 hover:text-brand-pink smooth-transition"
                                >
                                    مسح
                                </button>
                            )}
                        </div>
                    </div>

                    {/* عرض نتائج البحث والمنتجات بالمنيو */}
                    {filteredProducts.length === 0 ? (
                        <div class="text-center py-16">
                            <p class="text-gray-400 text-xs">لم نجد أصنافاً تطابق بحثك الحالي، يرجى كتابة كلمة بحث أخرى.</p>
                        </div>
                    ) : (
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {filteredProducts.map(product => (
                                <div key={`menu-item-${product.id}`} class="bg-white border border-gray-100 rounded-3xl overflow-hidden hover:shadow-lg smooth-transition flex flex-col">
                                    <div class="relative aspect-[4/3] bg-gray-50 overflow-hidden">
                                        <img 
                                            src={product.images?.[0] || 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500&auto=format&fit=crop&q=80'} 
                                            alt={product.title} 
                                            class="w-full h-full object-cover hover:scale-105 smooth-transition" 
                                            loading="lazy"
                                        />
                                    </div>
                                    <div class="p-5 flex flex-col flex-grow text-right">
                                        <h3 class="font-bold text-base text-brand-dark mb-2">{product.title}</h3>
                                        <p class="text-gray-500 text-xs leading-relaxed mb-6 flex-grow">{product.description}</p>
                                        <div class="flex items-center justify-between pt-4 border-t border-gray-50">
                                            <span class="font-extrabold text-brand-pink text-xs md:text-sm">
                                                {product.price ? `${product.price} ج.م` : (product.variants ? `تبدأ من ${product.variants[0].price} ج.م` : (product.sizes ? `تبدأ من ${product.sizes[0].basePrice} ج.م` : 'حسب الاختيار'))}
                                            </span>
                                            <button 
                                                onClick={() => onNavigateToDetail(product.id)}
                                                class="bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold px-6 py-2 rounded-full smooth-transition shadow-sm active:scale-95"
                                            >
                                                اعرف اكتر

                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 5. مكون صفحة تفاصيل المنتجات المستقلة (ProductDetailPage Component)
        // ==========================================
        function ProductDetailPage({ product, onAddToCart, onNavigate }) {
            const [selectedSizeId, setSelectedSizeId] = useState(product.sizes ? product.sizes[0].id : null);
            const [detailQuantity, setDetailQuantity] = useState(1);

            const activeSizeObj = useMemo(() => {
                if (!product.sizes) return null;
                return product.sizes.find(s => s.id === selectedSizeId);
            }, [product.sizes, selectedSizeId]);

            const handleQtyAdjust = (val) => {
                setDetailQuantity(prev => Math.max(1, prev + val));
            };

            return (
                <div class="py-12 px-4 max-w-4xl mx-auto animate-fade-in text-right">
                    
                    {/* زر العودة للمنيو */}
                    <button 
                        onClick={() => onNavigate('menu')}
                        class="mb-6 inline-flex items-center gap-1 text-xs text-gray-500 hover:text-brand-pink smooth-transition"
                    >
                        <span>← العودة لقائمة المنيو</span>
                    </button>

                    {/* عنوان المنتج في منتصف الصفحة */}
                    <h1 class="text-2xl md:text-3xl font-extrabold text-brand-dark text-center mb-6">{product.title}</h1>
                    
                    {/* صورة المنتج كبيرة ونظيفة تماماً خالية من أي كتابة */}
                    <div class="rounded-3xl overflow-hidden aspect-[16/9] mb-8 bg-gray-50 shadow-md">
                        <img 
                            src={product.images?.[0] || 'https://images.unsplash.com/photo-1551024601-bec78aea704b?w=1000&auto=format&fit=crop&q=80'} 
                            alt={product.title} 
                            class="w-full h-full object-cover" 
                            loading="lazy"
                        />
                    </div>

                    <div class="max-w-2xl mx-auto">
                        
                        {/* وصف احترافي بأسلوب كوبي رايتر يركز على القيمة والجودة */}
                        <div class="bg-brand-grayLight rounded-3xl p-6 border border-gray-100/50 mb-8">
                            <h3 class="font-bold text-xs text-brand-pink mb-2">عن الجودة والتحضير</h3>
                            <p class="text-brand-dark text-xs md:text-sm leading-relaxed font-light">
                                {product.description} يتم تحضيره في مطبخ حلويات بوسي يومياً باعتماد أساليب دقيقة ومعايير نظافة فائقة لنضمن تقديم المذاق الغني والراحة الحقيقية من أول لقمة لآخر قطعة.
                            </p>
                        </div>

                        {/* تنسيق التبويب المخصص للديسباسيتو (tabs layout) */}
                        {product.layout === 'tabs' && product.sizes && (
                            <div class="mb-8">
                                <h3 class="font-bold text-xs text-gray-400 mb-3">اختر حجم الحاوية المفضل:</h3>
                                <div class="flex gap-2 border-b border-gray-100 pb-2 mb-6">
                                    {product.sizes.map(size => (
                                        <button 
                                            key={`tab-btn-${size.id}`}
                                            onClick={() => setSelectedSizeId(size.id)}
                                            class={`px-6 py-2 rounded-full text-xs font-semibold smooth-transition ${selectedSizeId === size.id ? 'bg-brand-pink text-white shadow' : 'bg-brand-grayLight text-brand-dark hover:bg-gray-100'}`}
                                        >
                                            {size.name}
                                        </button>
                                    ))}
                                </div>

                                {activeSizeObj && (
                                    <div class="space-y-4">
                                        <h4 class="font-bold text-xs text-gray-400 mb-3">خيارات النكهات المتاحة للحجم ({activeSizeObj.name}):</h4>
                                        <div class="grid grid-cols-2 gap-4">
                                            {activeSizeObj.variants.map(variant => (
                                                <div key={`variant-tab-${variant.id}`} class="bg-white border border-gray-100 hover:border-brand-pink/20 rounded-2xl p-4 flex flex-col justify-between smooth-transition">
                                                    <div class="mb-3">
                                                        <span class="font-bold text-xs text-brand-dark block mb-1">{variant.flavor}</span>
                                                        <span class="text-brand-pink font-extrabold text-sm">{variant.price} ج.م</span>
                                                    </div>
                                                    <button 
                                                        onClick={() => onAddToCart(product, detailQuantity, { id: `${activeSizeObj.id}-${variant.id}`, flavor: `${activeSizeObj.name} - ${variant.flavor}`, price: variant.price })}
                                                        class="w-full bg-brand-pink/10 hover:bg-brand-pink text-brand-pink hover:text-white text-[10px] font-semibold py-2 rounded-full smooth-transition"
                                                    >
                                                        إضافة للسلة
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* تنسيق الكارتين المتجاورين (two-cards layout) */}
                        {product.layout === 'two-cards' && product.variants && (
                            <div class="mb-8">
                                <h3 class="font-bold text-xs text-gray-400 mb-4">النكهات والخيارات المتوفرة:</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    {product.variants.map(variant => (
                                        <div key={`two-card-${variant.id}`} class="bg-white border border-gray-100 hover:border-brand-pink/20 rounded-2xl p-4 flex flex-col justify-between smooth-transition">
                                            <div class="mb-3">
                                                <span class="font-bold text-xs text-brand-dark block mb-1">{variant.flavor || variant.name}</span>

                                            <button

                                    ))}
                                </div>
                            </div>

            const [printFile, setPrintFile] = useState(null);

            // بيانات الحالة - الشاشة 3
            const [eventTheme, setEventTheme] = useState('');
            const [allergyWarning, setAllergyWarning] = useState('');
            const [cakeText, setCakeText] = useState('');
            const [cardText, setCardText] = useState('');

            // النوافذ المنبثقة والتحذيرات
            const [showInfo, setShowInfo] = useState(false);
            const [upgradeModal, setUpgradeModal] = useState(null); // { targetShape, targetMin }
            const [limitAlert, setLimitAlert] = useState('');

            const basePricePerPerson = 145; // الحسبة المبطنة للفرد الواحد

            // احتساب السعر الإجمالي الفوري والشامل لخيارات الطباعة والتخصيص
            const totalPrice = useMemo(() => {
                let cost = personsCount * basePricePerPerson;
                if (printType === 'edible') cost += 60;
                if (printType === 'non-edible') cost += 20;
                return cost;
            }, [personsCount, printType]);

            // معالجة اختيار الشكل مع محرك الترقية الفورية لمنع الخضة السعرية
            const handleShapeSelect = (selectedShape) => {
                if (selectedShape === 'square' && personsCount < 16) {
                    setUpgradeModal({ targetShape: 'square', targetMin: 16, price: 16 * basePricePerPerson });
                    return;
                }
                if (selectedShape === 'rectangle' && personsCount < 20) {
                    setUpgradeModal({ targetShape: 'rectangle', targetMin: 20, price: 20 * basePricePerPerson });
                    return;
                }
                setShape(selectedShape);
            };

            const confirmUpgrade = () => {
                if (upgradeModal) {
                    setPersonsCount(upgradeModal.targetMin);
                    setShape(upgradeModal.targetShape);
                    setUpgradeModal(null);
                }
            };

            // معالجة زيادة ونقصان الأفراد مع تفعيل قيود الأشكال المختارة
            const handlePersonsChange = (change) => {
                const nextCount = personsCount + change;
                if (nextCount < 4 || nextCount > 250) return;

                if (shape === 'rectangle' && nextCount < 20) {
                    setLimitAlert("الشكل المستطيل محتاج مقاس 20 فرد على الأقل عشان يطلع مظبوط. لو حابب مقاس أصغر، تقدر بكل بساطة تختار الشكل الدائري أو القلب وهيفتح معاك العداد فوراً.");
