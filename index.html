    <style>
        :root {
            --primary-color: #FF91A4;
            --text-color: #000000;
            --bg-color: #ffffff;
            --gray-light: #fdfdfd;
            --gray-medium: #f5f5f5;
            --gray-text: #4a4a4a;
            --transition-smooth: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            --blur-backdrop: blur(20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Alexandria', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* الهيكل الذكي لإدارة صفحات الـ SPA البرمجي بسعة منعدمة */
        .page-wrapper {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .page-wrapper.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* هيدر متطور جداً وانسيابي مع شفافية زجاجية وبدون تزيين متكلف */
        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 75px;
            background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: var(--blur-backdrop);
            -webkit-backdrop-filter: var(--blur-backdrop);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            transition: var(--transition-smooth);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        /* زر قائمة التنقل المتطور */
        .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            position: relative;
            z-index: 1002;
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--text-color);
            transition: var(--transition-smooth);
            border-radius: 2px;
        }

        .menu-toggle.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.open span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .brand-logo img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.2px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition-smooth);
            color: var(--text-color);
        }

        .action-btn:hover {
            background-color: var(--gray-medium);
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: var(--primary-color);
            color: white;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        /* نافذة البحث المدمجة الذكية */
        .search-bar-container {
            position: fixed;
            top: 75px;
            left: 0;
            right: 0;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: var(--blur-backdrop);
            -webkit-backdrop-filter: var(--blur-backdrop);
            padding: 16px 32px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            transform: translateY(-100%);
            opacity: 0;
            transition: var(--transition-smooth);
            z-index: 999;
            display: flex;
            gap: 12px;
        }

        .search-bar-container.active {
            transform: translateY(0);
            opacity: 1;
        }

        .search-input {
            flex: 1;
            padding: 14px 24px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background-color: var(--gray-light);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            color: var(--text-color);
            transition: var(--transition-smooth);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            background-color: var(--bg-color);
        }

        /* قائمة جانبية متطورة جداً وغامرة تعتمد على النقاء والخطوط النظيفة */
        .sidebar-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 1001;
            transition: var(--transition-smooth);
            padding: 120px 48px 48px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .sidebar-menu {
                right: -400px;
                border-left: 1px solid rgba(0, 0, 0, 0.04);
                box-shadow: -20px 0 60px rgba(0, 0, 0, 0.02);
            }
        }

        .sidebar-menu.active {
            right: 0;
        }

        .menu-items-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .menu-item-link {
            text-decoration: none;
            color: var(--text-color);
            font-size: 24px;
            font-weight: 600;
            display: inline-block;
            position: relative;
            transition: var(--transition-smooth);
            opacity: 0.6;
        }

        .menu-item-link:hover, .menu-item-link.active {
            opacity: 1;
            transform: translateX(-8px);
        }

        .sidebar-footer {
            font-size: 12px;
            color: var(--gray-text);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        /* قسم عقد من التميز الفخم: شاشة غامرة بالكامل مريحة ونظيفة */
        .hero-section {
            margin-top: 75px;
            position: relative;
            width: 100vw;
            height: calc(100vh - 75px);
            max-height: 800px;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .hero-video-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hero-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-premium-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.95) 100%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 32px;
            text-align: center;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 20px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        @media (min-width: 768px) {
            .hero-title {
                font-size: 48px;
            }
        }

        .hero-description {
            font-size: 15px;
            color: var(--text-color);
            max-width: 580px;
            margin: 0 auto 40px auto;
            font-weight: 400;
            line-height: 1.7;
            opacity: 0.85;
        }

        /* تصميم الزر البيضاوي الفاخر */
        .btn-primary-oval {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--text-color);
            color: var(--bg-color);
            text-decoration: none;
            padding: 16px 44px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-primary-oval:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* العناوين العامة للأقسام الفاخرة ونظيفة تماماً */
        .section-title-container {
            padding: 60px 32px 24px 32px;
            text-align: right;
        }

        .section-main-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.3px;
        }
    </style>
</head>
