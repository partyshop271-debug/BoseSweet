                                    class="w-full text-xs p-4 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink focus:bg-white smooth-transition text-brand-dark"
                                />
                            </div>

                            <div class="flex gap-4 pt-4">
                                <button onClick={() => navigateStep(2)} class="flex-1 bg-brand-grayLight text-brand-dark font-semibold text-xs py-3.5 rounded-full smooth-transition active:scale-95">العودة للخطوة السابقة</button>
                                <button 
                                    onClick={handleAddToBasket}
                                    class="flex-1 bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-3.5 rounded-full shadow-lg smooth-transition active:scale-95"
                                >
                                    اضافة للسلة
                                </button>
                            </div>
                        </div>
                    )}

                    {/* نافذة معلومات الحسبة السعرية */}
                    {showInfo && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-sm">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-gray-50 text-right animate-fade-in">
                                <h4 class="font-bold text-sm text-brand-pink mb-2">معلومات السعر والاتقان</h4>
                                <p class="text-xs text-gray-500 leading-relaxed mb-6 font-light">{siteData.cakeBuilder.messages.pricingInfo}</p>
                                <button onClick={() => setShowInfo(false)} class="w-full bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold py-2.5 rounded-full smooth-transition">فهمت ذلك</button>
                            </div>
                        </div>
                    )}

                    {/* نافذة ترقية المقاس الهندسي */}
                    {upgradeModal && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-sm">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-gray-50 text-right animate-fade-in">
                                <h4 class="font-bold text-sm text-brand-pink mb-3">✨ توضيح بخصوص الشكل {upgradeModal.targetShape === 'square' ? 'المربع' : 'المستطيل'}</h4>
                                <p class="text-xs text-gray-500 leading-relaxed mb-6 font-light">
                                    عشان تطلع معاك التورتة {upgradeModal.targetShape === 'square' ? 'المربعة' : 'المستطيلة'} مظبوطة وبأفضل تنسيق، أقل مقاس بنقدر ننفذه للشكل ده هو ({upgradeModal.targetMin} فرد).
                                    السيستم هيرفع العداد تلقائياً لـ {upgradeModal.targetMin} فرد، والسعر الإجمالي هيكون ({upgradeModal.price} ج.م) شامل التنسيق بالكامل.
                                    حابب نعتمد الشكل {upgradeModal.targetShape === 'square' ? 'المربع' : 'المستطيل'} ونغير المقاس دلوقتي؟
                                </p>
                                <div class="flex flex-col gap-2">
                                    <button onClick={confirmUpgrade} class="w-full bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold py-2.5 rounded-full smooth-transition">تمام، اعتمد الترقية</button>
                                    <button onClick={() => setUpgradeModal(null)} class="w-full bg-brand-grayLight text-brand-dark text-xs font-semibold py-2.5 rounded-full smooth-transition">لاء، ارجع للمقاس الحالي</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة التنبيه عن تخطي المقاييس */}
                    {limitAlert && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-sm">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-gray-50 text-right animate-fade-in">
                                <h4 class="font-bold text-sm text-red-600 mb-2">تنبيه المقاس المختار</h4>
                                <p class="text-xs text-gray-500 leading-relaxed mb-6 font-light">{limitAlert}</p>
                                <button onClick={() => setLimitAlert('')} class="w-full bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold py-2.5 rounded-full smooth-transition">فهمت ذلك</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 7. مكون محاكي الورد (FlowerBuilder Page)
        // ==========================================
        function FlowerBuilderPage({ onAddCustomItem }) {
            const [step, setStep] = useState(1);

            // بيانات الحالة - الشاشة 1
            const [refPhoto, setRefPhoto] = useState(null);
            const [rosesCount, setRosesCount] = useState(15);
            const [flowerType, setFlowerType] = useState('natural');
            const [colorTheme, setColorTheme] = useState('أحمر كلاسيكي');

            // بيانات الحالة - الشاشة 2
            const [cashAmount, setCashAmount] = useState('');
            const [cashDenom, setCashDenom] = useState(50);
            const [photosCount, setPhotosCount] = useState(0);
            const [photosList, setPhotosList] = useState([]);
            const [hasRibbon, setHasRibbon] = useState(false);
            const [ribbonText, setRibbonText] = useState('');

            // بيانات الحالة - الشاشة 3
            const [chocBudget, setChocBudget] = useState('');
            const [chocPricePerPiece, setChocPricePerPiece] = useState(20);
            const [hasCard, setHasCard] = useState(false);
            const [cardText, setCardText] = useState('');

            const [errorMsg, setErrorMsg] = useState('');

            const basePrice = 400; // السعر الأساسي لـ 15 وردة والتغليف
            const extraPrice = 35; // تكلفة الوردة الإضافية

            // احتساب تكاليف التصميم التراكمية
            const totalPrice = useMemo(() => {
                let cost = basePrice;
                if (rosesCount > 15) {
                    cost += (rosesCount - 15) * extraPrice;
                }
                cost += photosCount * 15;
                if (hasRibbon) cost += 50;
                if (hasCard) cost += 20;
                if (chocBudget && Number(chocBudget) > 0) {
                    cost += Number(chocBudget);
                }
                return cost;
            }, [rosesCount, photosCount, hasRibbon, hasCard, chocBudget]);

            // احتساب عدد ورقات الكاش المالي المتطابق رياضياً
            const calculatedNotes = useMemo(() => {
                const amount = Number(cashAmount);
                if (!amount || amount <= 0) return 0;
                return Math.floor(amount / cashDenom);
            }, [cashAmount, cashDenom]);

            const isCashDivisible = useMemo(() => {
                const amount = Number(cashAmount);
                if (!amount) return true;
                return amount % cashDenom === 0;
            }, [cashAmount, cashDenom]);

            // احتساب قطع الشوكولاتة التلقائي
            const calculatedChocolatePieces = useMemo(() => {
                const budget = Number(chocBudget);
                if (!budget || budget <= 0) return 0;
                return Math.floor(budget / chocPricePerPiece);
            }, [chocBudget, chocPricePerPiece]);

            const handleRosesChange = (change) => {
                const next = rosesCount + change;
                if (next < 15) return; // العداد مقفل عند 15 وردة كحد أدنى
                setRosesCount(next);
            };

            const handlePhotosChange = (change) => {
                const next = Math.max(0, photosCount + change);
                setPhotosCount(next);
                if (next > photosList.length) {
                    setPhotosList(prev => [...prev, ...Array(next - prev.length).fill(null)]);
                } else {
                    setPhotosList(prev => prev.slice(0, next));
                }
            };

            const navigateStep = (target) => {
                setStep(target);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleQuickPurchase = () => {
                if (!refPhoto) {
                    setErrorMsg("يرجى إرفاق صورة البوكيه المرجعي أولاً لتتمكن من استخدام خيار الشراء السريع بنجاح.");
                    return;
                }
                const quickItem = {
                    id: `custom-flower-${Date.now()}`,
                    label: "بوكيه ورد - طلب سريع عبر الصورة",
                    price: basePrice,
                    qty: 1,
                    image: 'https://images.unsplash.com/photo-1590736969955-71cb94801759?w=300&auto=format&fit=crop&q=80',
                    custom: true,
                    details: {
                        "نوع الطلب": "طلب شراء سريع واكتفاء بالصورة المرجعية",
                        "الصورة المرجعية": refPhoto,
                        "عدد الورد": `${rosesCount} وردة`,
                        "مادة الورد": flowerType === 'natural' ? 'ورد طبيعي' : flowerType === 'artificial' ? 'ورد صناعي' : 'ورد ستان'
                    }
                };
                onAddCustomItem(quickItem);
            };

            const handleAddToBasket = () => {
                if (cashAmount && !isCashDivisible) {
                    setErrorMsg("عذراً، إجمالي المبلغ المالي المدخل لا يقبل القسمة على الفئة النقدية المختارة بالتساوي. يرجى تعديله لضمان الشفافية الحسابية المطلقة.");
                    return;
                }

                const customItem = {
                    id: `custom-flower-${Date.now()}`,
                    label: "بوكيه ورد - بناء خاص",
                    price: totalPrice,
                    qty: 1,
                    image: 'https://images.unsplash.com/photo-1590736969955-71cb94801759?w=300&auto=format&fit=crop&q=80',
                    custom: true,
                    details: {
                        "عدد الورد": `${rosesCount} وردة`,
                        "مادة الورد": flowerType === 'natural' ? 'ورد طبيعي' : flowerType === 'artificial' ? 'ورد صناعي' : 'ورد ستان',
                        "تنسيق الألوان": colorTheme,
                        "تنسيق كاش مالي": cashAmount ? `${cashAmount} ج.م (موزعة على ${calculatedNotes} ورقة فئة ${cashDenom} جنيه)` : 'بدون كاش',
                        "صور تذكارية": photosCount > 0 ? `${photosCount} صور وسط الورد` : 'بدون صور تذكارية',
                        "شريط ستان مطبوع": hasRibbon ? `نعم، المطبوع: (${ribbonText})` : 'بدون شريط مطبوع',
                        "ميزانية الشوكولاتة": chocBudget ? `${chocBudget} ج.م (${calculatedChocolatePieces} قطعة فئة ${chocPricePerPiece} ج.م)` : 'بدون شوكولاتة',
                        "كارت الإهداء": hasCard ? `نعم، المكتوب: (${cardText})` : 'بدون كارت'
                    }
                };
                onAddCustomItem(customItem);
            };

            return (
                <div class="py-12 px-4 max-w-2xl mx-auto animate-fade-in text-right">
                    <h1 class="text-2xl font-extrabold text-brand-dark text-center mb-8 font-sans">محاكي بوكيهات الورد</h1>

                    {/* تعقب مراحل التصميم */}
                    <div class="flex items-center justify-between mb-8 text-[11px] font-semibold text-gray-400 select-none border-b border-gray-100 pb-3">
                        <span class={`pb-1 border-b-2 transition-all ${step === 1 ? 'text-brand-pink border-brand-pink' : 'border-transparent'}`}>الشاشة 1: الحجم والمسار السريع</span>
                        <span class={`pb-1 border-b-2 transition-all ${step === 2 ? 'text-brand-pink border-brand-pink' : 'border-transparent'}`}>الشاشة 2: التخصيص المالي والزينة</span>
                        <span class={`pb-1 border-b-2 transition-all ${step === 3 ? 'text-brand-pink border-brand-pink' : 'border-transparent'}`}>الشاشة 3: الشوكولاتة وكارت الإهداء</span>
                    </div>

                    {/* الشاشة 1 */}
                    {step === 1 && (
                        <div class="space-y-8">
                            {/* الشراء السريع بالصورة المرجعية */}
                            <div class="bg-brand-grayLight/50 p-6 rounded-3xl border border-gray-100">
                                <h3 class="font-bold text-sm text-brand-dark mb-2">أرفق صورة لبوكيه مخصص</h3>
                                <p class="text-xs text-gray-400 mb-4 font-light">إذا كان لديك صورة لبوكيه ترغب في تنفيذ تصميم مطابق له بكل دقة</p>
                                <div class="flex flex-col sm:flex-row gap-4 items-stretch sm:items-center">
                                    <div class="flex-grow">
                                        <input 
                                            type="file" 
                                            accept="image/*"
                                            onChange={(e) => setRefPhoto(e.target.files[0] ? e.target.files[0].name : null)}
                                            class="hidden" 
                                            id="flower-ref-upload" 
                                        />
                                        <label htmlFor="flower-ref-upload" class="cursor-pointer bg-white border border-gray-100 rounded-2xl py-3 px-5 flex items-center justify-center gap-2 text-xs font-semibold text-brand-dark shadow-sm hover:bg-gray-50 smooth-transition">
                                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                            اختيار ملف الصورة المرجعية
                                        </label>
                                        {refPhoto && <span class="text-[10px] text-brand-pink font-bold block mt-2">✓ تم التجهيز: {refPhoto}</span>}
                                    </div>
                                    <button 
                                        onClick={handleQuickPurchase}
                                        class="bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold py-3 px-6 rounded-2xl smooth-transition shadow-sm active:scale-95"
                                    >
                                        انهاء سريع بالصورة المرجعية
                                    </button>
                                </div>
                            </div>

                            {/* عداد الورد الأساسي */}
                            <div>
                                <h3 class="font-bold text-sm text-brand-dark mb-2">حدد عدد الورد بالبوكيه</h3>
                                <p class="text-xs text-gray-400 mb-4 font-light">أقل حجم للبوكيه يبدأ من 15 وردة كحد أدنى (الـ 15 وردة الأساسية مع التغليف الفاخر تكلفتها 400 ج.م)</p>
                                <div class="flex items-center justify-center bg-brand-grayLight rounded-full p-2 max-w-[220px] mx-auto border border-gray-100">
                                    <button onClick={() => handleRosesChange(-1)} class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm text-sm font-bold hover:bg-gray-50 smooth-transition">-</button>
                                    <span class="px-8 font-bold text-sm text-brand-dark">{rosesCount} وردة</span>
                                    <button onClick={() => handleRosesChange(1)} class="w-10 h-10 flex items-center justify-center bg-white rounded-full shadow-sm text-sm font-bold hover:bg-gray-50 smooth-transition">+</button>
                                </div>
                            </div>

                            {/* نوع الورد */}
                            <div>
                                <h3 class="font-bold text-sm text-brand-dark mb-3">مادة وخامة الورد</h3>
                                <div class="flex gap-3">
                                    {['natural', 'artificial', 'satin'].map(type => (
                                        <button 
                                            key={`flower-type-${type}`}
                                            onClick={() => setFlowerType(type)}
                                            class={`flex-1 py-3 text-xs font-semibold rounded-full smooth-transition ${flowerType === type ? 'bg-brand-pink text-white shadow-md' : 'bg-brand-grayLight text-brand-dark hover:bg-gray-100'}`}
                                        >
                                            {type === 'natural' ? 'ورد طبيعي' : type === 'artificial' ? 'ورد صناعي' : 'ورد ستان'}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* ألوان وتنسيق الورد */}
                            <div>
                                <h3 class="font-bold text-sm text-brand-dark mb-3">تنسيق الألوان المطلوبة</h3>
                                <div class="grid grid-cols-2 gap-3">
                                    {['أحمر كلاسيكي', 'أبيض ناصع ومميز', 'وردي وبمبي ناعم', 'ميكس متناسق'].map(color => (
                                        <button 
                                            key={`color-opt-${color}`}
                                            onClick={() => setColorTheme(color)}
                                            class={`py-3 px-4 border text-right rounded-2xl text-xs font-semibold smooth-transition ${colorTheme === color ? 'border-brand-pink bg-brand-pink/5 font-bold' : 'border-gray-100 bg-white hover:border-gray-200'}`}
                                        >
                                            {color}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button 
                                onClick={() => navigateStep(2)}
                                class="w-full bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-4 rounded-full shadow-lg smooth-transition mt-8 active:scale-95"
                            >
                                تنسيق إضافات البوكيه الفاخرة
                            </button>
                        </div>
                    )}

                    {/* الشاشة 2 */}
                    {step === 2 && (
                        <div class="space-y-8 animate-fade-in">
                            {/* دمج كاش مالي وسط الورد */}
                            <div class="bg-brand-grayLight/50 p-6 rounded-3xl border border-gray-100">
                                <h3 class="font-bold text-sm text-brand-dark mb-2">تنسيق مبلغ كاش وسط الورد</h3>
                                <p class="text-xs text-gray-400 mb-4 font-light font-sans">اكتب هنا إجمالي المبلغ المالي اللي حابب ننسقه لك جوه البوكيه</p>
                                
                                <input 
                                    type="number"
                                    value={cashAmount}
                                    onChange={(e) => setCashAmount(e.target.value)}
                                    placeholder="مثال: 1000"
                                    class="w-full text-xs p-4 bg-white border border-gray-100 rounded-2xl outline-none focus:border-brand-pink mb-4 text-brand-dark"
                                />

                                <h4 class="font-bold text-xs text-gray-400 mb-3">حدد فئة الورق النقدية المفضلة للتنسيق:</h4>
                                <div class="grid grid-cols-3 gap-2">
                                    {[5, 10, 20, 50, 100, 200].map(denom => (
                                        <button 
                                            key={`denom-opt-${denom}`}
                                            onClick={() => setCashDenom(denom)}
                                            class={`py-2.5 rounded-xl text-xs font-semibold smooth-transition ${cashDenom === denom ? 'bg-brand-pink text-white shadow-sm' : 'bg-white border border-gray-100 text-gray-700'}`}
                                        >
                                            {denom} جنيه
                                        </button>
                                    ))}
                                </div>

                                {cashAmount && Number(cashAmount) > 0 && (
                                    <div class="mt-4 p-3.5 bg-brand-pink/10 rounded-2xl text-xs font-semibold text-brand-dark leading-relaxed">
                                        {isCashDivisible ? (
                                            <span>البوكيه هيكون جواه {calculatedNotes} ورقة من فئة {cashDenom} جنيه</span>
                                        ) : (
                                            <span class="text-red-500">تنبيه: المبلغ المالي المدخل لا يقبل القسمة بالتساوي على فئة ({cashDenom} جنيه). يرجى تعديل المبلغ لضمان الحساب والشفافية.</span>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* تضمين صور تذكارية وسط الورد */}
                            <div>
                                <h3 class="font-bold text-sm text-brand-dark mb-2">تنسيق صور تذكارية وسط الورد</h3>
                                <p class="text-xs text-gray-400 mb-4 font-light">تكلفة طباعة وتنسيق كل صورة إضافية هي +15 ج.م مضافاً للسعر تلقائياً</p>
                                <div class="flex items-center justify-center gap-4 mb-4">
                                    <button onClick={() => handlePhotosChange(-1)} class="w-8 h-8 flex items-center justify-center bg-brand-grayLight rounded-full shadow-sm text-xs font-bold">-</button>
                                    <span class="font-bold text-xs text-brand-dark">{photosCount} صورة</span>
                                    <button onClick={() => handlePhotosChange(1)} class="w-8 h-8 flex items-center justify-center bg-brand-grayLight rounded-full shadow-sm text-xs font-bold">+</button>
                                </div>

                                {photosCount > 0 && (
                                    <div class="space-y-3 animate-fade-in">
                                        {photosList.map((_, idx) => (
                                            <div key={`photo-slot-${idx}`} class="bg-brand-grayLight p-4 rounded-2xl border border-dashed border-gray-200">
                                                <input 
                                                    type="file" 
                                                    accept="image/*"
                                                    onChange={(e) => {
                                                        const updated = [...photosList];
                                                        updated[idx] = e.target.files[0] ? e.target.files[0].name : null;
                                                        setPhotosList(updated);
                                                    }}
                                                    class="hidden" 
                                                    id={`bouquet-photo-${idx}`} 
                                                />
                                                <label htmlFor={`bouquet-photo-${idx}`} class="cursor-pointer flex items-center justify-between text-xs text-gray-600">
                                                    <span>ارفع هنا الصورة {idx + 1} اللي حابب ننسقها لك وسط الورد بدقة عالية</span>
                                                    <span class="text-brand-pink font-bold text-[10px]">تحميل صورة</span>
                                                </label>
                                                {photosList[idx] && <span class="text-[9px] text-brand-pink font-bold block mt-1.5">✓ تم تجهيز: {photosList[idx]}</span>}
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* شريط ستان مطبوع فاخر */}
                            <div class="bg-white border border-gray-100 rounded-3xl p-5">
                                <label class="flex items-center justify-between cursor-pointer select-none mb-3">
                                    <span class="font-bold text-sm text-brand-dark">شريط ستان مطبوع محيط بالبوكيه (+50 ج.م)</span>
                                    <input 
                                        type="checkbox" 
                                        checked={hasRibbon} 
                                        onChange={() => setHasRibbon(!hasRibbon)}
                                        class="w-4 h-4 accent-brand-pink" 
                                    />
                                </label>
                                {hasRibbon && (
                                    <input 
                                        type="text"
                                        value={ribbonText}
                                        onChange={(e) => setRibbonText(e.target.value)}
                                        placeholder="اكتب العبارة اللي حابب نطبعها لك على شريط الستان المحيط بالبوكيه"
                                        class="w-full text-xs p-4 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink focus:bg-white smooth-transition text-brand-dark animate-fade-in"
                                    />
                                )}
                            </div>

                            <div class="flex gap-4 pt-4">
                                <button onClick={() => navigateStep(1)} class="flex-1 bg-brand-grayLight text-brand-dark font-semibold text-xs py-3.5 rounded-full smooth-transition active:scale-95">العودة للخطوة السابقة</button>
                                <button onClick={() => navigateStep(3)} class="flex-1 bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-3.5 rounded-full shadow-md smooth-transition active:scale-95">إضافة الشوكولاتة وكارت الإهداء</button>
                            </div>
                        </div>
                    )}

                    {/* الشاشة 3 */}
                    {step === 3 && (
                        <div class="space-y-8 animate-fade-in">
                            {/* دمج شوكولاتة معتمدة */}
                            <div class="bg-brand-grayLight/50 p-6 rounded-3xl border border-gray-100">
                                <h3 class="font-bold text-sm text-brand-dark mb-2">تزيين وإضافة قطع شوكولاتة للبوكيه</h3>
                                <p class="text-xs text-gray-400 mb-4 font-light">حدد هنا المبلغ اللي حابب نشتري بيه الشكولاتة لتزيين البوكيه</p>

                                <input 
                                    type="number"
                                    value={chocBudget}
                                    onChange={(e) => setChocBudget(e.target.value)}
                                    placeholder="مثال: 300"
                                    class="w-full text-xs p-4 bg-white border border-gray-100 rounded-2xl outline-none focus:border-brand-pink mb-4 text-brand-dark"
                                />

                                <h4 class="font-bold text-xs text-gray-400 mb-3">حدد فئة القطعة الواحدة من الشوكولاتة:</h4>
                                <div class="grid grid-cols-3 gap-2">
                                    {[20, 30, 50].map(price => (
                                        <button 
                                            key={`choc-piece-${price}`}
                                            onClick={() => setChocPricePerPiece(price)}
                                            class={`py-2.5 rounded-xl text-xs font-semibold smooth-transition ${chocPricePerPiece === price ? 'bg-brand-pink text-white shadow-sm' : 'bg-white border border-gray-100 text-gray-700'}`}
                                        >
                                            {price} ج.م / قطعة
                                        </button>
                                    ))}
                                </div>

                                {chocBudget && Number(chocBudget) > 0 && (
                                    <div class="mt-4 p-3.5 bg-brand-pink/10 rounded-2xl text-xs font-semibold text-brand-dark">
                                        سيتم إضافة {calculatedChocolatePieces} قطع شوكولاتة للبوكيه (سعر القطعة الواحدة {chocPricePerPiece} جنيه)
                                    </div>
                                )}

                                <p class="text-[9px] text-gray-400 mt-3 leading-relaxed">
                                    * ملاحظة وتوضيح: البارات والماركات الكبيرة الفاخرة تبدأ أسعار قطعها تلقائياً من 100 جنيه فما فوق للقطعة لسلامة الحسابات والتغليف الفخم.
                                </p>
                            </div>

                            {/* شراء كارت إهداء وطباعة العبارات */}
                            <div class="bg-white border border-gray-100 rounded-3xl p-5">
                                <label class="flex items-center justify-between cursor-pointer select-none mb-3">
                                    <span class="font-bold text-sm text-brand-dark">شراء كارت الإهداء والطباعة المخصصة (+20 ج.م)</span>
                                    <input 
                                        type="checkbox" 
                                        checked={hasCard} 
                                        onChange={() => setHasCard(!hasCard)}
                                        class="w-4 h-4 accent-brand-pink" 
                                    />
                                </label>
                                {hasCard && (
                                    <textarea 
                                        value={cardText}
                                        onChange={(e) => setCardText(e.target.value)}
                                        placeholder="اكتب هنا العبارة اللي حابب نطبعها لك جوه كارت الإهداء الخارجي"
                                        rows="3"
                                        class="w-full text-xs p-4 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink focus:bg-white smooth-transition text-brand-dark animate-fade-in"
                                    ></textarea>
                                )}
                            </div>

                            <div class="flex gap-4 pt-4">
                                <button onClick={() => navigateStep(2)} class="flex-1 bg-brand-grayLight text-brand-dark font-semibold text-xs py-3.5 rounded-full smooth-transition active:scale-95">العودة للخطوة السابقة</button>
                                <button 
                                    onClick={handleAddToBasket}
                                    class="flex-1 bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-3.5 rounded-full shadow-lg smooth-transition active:scale-95"
                                >
                                    اضافة للسلة
                                </button>
                            </div>
                        </div>
                    )}

                    {/* تنبيهات القيود والتحقق */}
                    {errorMsg && (
                        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-brand-dark/40 backdrop-blur-sm">
                            <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-gray-50 text-right animate-fade-in">
                                <h4 class="font-bold text-sm text-red-600 mb-2">تنبيه الحسبة والمدخلات</h4>
                                <p class="text-xs text-gray-500 leading-relaxed mb-6 font-light">{errorMsg}</p>
                                <button onClick={() => setErrorMsg('')} class="w-full bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold py-2.5 rounded-full smooth-transition">فهمت ذلك</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 8. مكون صفحة السلة (CartPage Component)
        // ==========================================
        function CartPage({ cart, onUpdateCartQty, onRemoveFromCart, onNavigate }) {
            const [expandedCustomId, setExpandedCustomId] = useState(null);

            const totalProductsSum = useMemo(() => {
                return cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            }, [cart]);

            const handleToggleDetails = (id) => {
                setExpandedCustomId(expandedCustomId === id ? null : id);
            };

            if (cart.length === 0) {
                return (
                    <div class="py-24 px-4 text-center max-w-md mx-auto animate-fade-in">
                        <svg class="w-16 h-16 mx-auto text-gray-200 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <h2 class="text-lg font-bold text-brand-dark mb-2">سلتك فارغة حالياً</h2>
                        <p class="text-xs text-gray-400 mb-8 font-light">تصفح منيو حلويات بوسي واختر ما يناسب لقاءاتك السعيدة.</p>
                        <button 
                            onClick={() => onNavigate('menu')}
                            class="bg-brand-pink hover:bg-[#ff8095] text-white text-xs font-semibold px-8 py-3 rounded-full shadow-md smooth-transition active:scale-95"
                        >
                            تصفح المنيو الآن
                        </button>
                    </div>
                );
            }

            return (
                <div class="py-12 px-4 max-w-3xl mx-auto animate-fade-in text-right">
                    <h1 class="text-2xl font-extrabold text-brand-dark mb-8 text-center">سلة المشتريات</h1>

                    <div class="space-y-4">
                        {cart.map(item => (
                            <div key={`cart-item-${item.id}`} class="bg-white border border-gray-100 rounded-3xl p-4 flex flex-col gap-4 shadow-sm">
                                <div class="flex items-center justify-between flex-wrap gap-4">
                                    <div class="flex items-center gap-4">
                                        <img src={item.image} alt={item.label} class="w-16 h-16 rounded-2xl object-cover border border-gray-50" />
                                        <div>
                                            <h4 class="font-bold text-sm text-brand-dark">{item.label}</h4>
                                            <span class="text-brand-pink font-bold text-xs mt-1 block">{item.price} ج.م</span>
                                            
                                            {item.custom && (
                                                <button 
                                                    onClick={() => handleToggleDetails(item.id)}
                                                    class="text-[10px] text-gray-400 hover:text-brand-pink font-semibold underline mt-1 block smooth-transition"
                                                >
                                                    {expandedCustomId === item.id ? 'إخفاء خيارات التصميم' : 'استعراض تفاصيل التصميم المخصص'}
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* التحكم بالكمية وحذف الصنف */}
                                    <div class="flex items-center gap-4 mr-auto">
                                        <div class="flex items-center bg-brand-grayLight rounded-full p-1 border">
                                            <button onClick={() => onUpdateCartQty(item.id, -1)} class="w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-sm text-xs font-bold hover:bg-gray-50 smooth-transition">-</button>
                                            <span class="px-3.5 font-bold text-xs text-brand-dark">{item.qty}</span>
                                            <button onClick={() => onUpdateCartQty(item.id, 1)} class="w-7 h-7 flex items-center justify-center bg-white rounded-full shadow-sm text-xs font-bold hover:bg-gray-50 smooth-transition">+</button>
                                        </div>
                                        <span class="font-extrabold text-brand-pink text-sm w-20 text-left">{item.price * item.qty} ج.م</span>
                                        <button onClick={() => onRemoveFromCart(item.id)} class="text-gray-300 hover:text-red-500 smooth-transition" aria-label="حذف الصنف">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        </button>
                                    </div>
                                </div>

                                {/* جدول تفاصيل الخيارات المخصصة المنسدل (أكورديون ناعم) */}
                                {item.custom && expandedCustomId === item.id && item.details && (
                                    <div class="bg-brand-grayLight/50 p-4 rounded-2xl border border-gray-100/50 mt-1 animate-fade-in text-right text-[11px] leading-relaxed">
                                        <h5 class="font-bold text-brand-pink mb-2">خيارات وإضافات العميل لتنسيق وتصميم الفاتورة:</h5>
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 text-gray-600">
                                            {Object.entries(item.details).map(([key, value]) => (
                                                <div key={`detail-row-${key}`} class="border-b border-gray-100 pb-1 flex justify-between gap-2">
                                                    <span class="font-semibold text-brand-dark">{key}:</span>
                                                    <span class="font-light text-left">{value}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* ملخص السلة الإجمالي والانتقال لصفحة إتمام الطلب */}
                    <div class="mt-8 bg-brand-grayLight/50 rounded-3xl p-6 border border-gray-100/50">
                        <div class="flex items-center justify-between font-extrabold text-base mb-6 text-brand-dark">
                            <span>إجمالي قيمة المنتجات</span>
                            <span class="text-brand-pink">{totalProductsSum} ج.م</span>
                        </div>
                        <button 
                            onClick={() => onNavigate('checkout')}
                            class="w-full bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-4 rounded-full shadow-lg smooth-transition text-center active:scale-95"
                        >
                            الانتقال لخطوة اتمام الطلب والدفع
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 9. مكون صفحة إتمام الطلب (Checkout Page)
        // ==========================================
        function CheckoutPage({ cart, onNavigate, onClearCart }) {
            const [custName, setCustName] = useState('');
            const [custPhone, setCustPhone] = useState('');
            const [deliveryType, setDeliveryType] = useState('pickup'); // 'pickup', 'shipping'
            const [shippingArea, setShippingArea] = useState('');
            
            const [schedDate, setSchedDate] = useState('');
            const [schedTime, setSchedTime] = useState('');

            const [phoneError, setPhoneError] = useState(false);
            const [schedulingError, setSchedulingError] = useState('');

            const productsTotal = useMemo(() => {
                return cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            }, [cart]);

            const shippingCost = useMemo(() => {
                if (deliveryType === 'pickup' || !shippingArea) return 0;
                const zoneObj = siteData.shippingZones.find(z => z.area === shippingArea);
                return zoneObj ? zoneObj.price : 0;
            }, [deliveryType, shippingArea]);

            const invoiceTotal = productsTotal + shippingCost;

            // التحقق من توافق أرقام الهواتف المحمولة المصرية بدقة
            const handlePhoneValidation = (val) => {
                setCustPhone(val);
                const regEx = /^01[0125]\d{8}$/;
                if (val && !regEx.test(val)) {
                    setPhoneError(true);
                } else {
                    setPhoneError(false);
                }
            };

            // التحقق من قيود الجدولة: ممنوع استلام في الماضي + أسرع موعد بعد 24 ساعة من الحجز
            const handleSchedulingValidation = (dateVal) => {
                setSchedDate(dateVal);
                if (!dateVal) {
                    setSchedulingError('');
                    return;
                }

                const selected = new Date(dateVal);
                const now = new Date();
                const todayOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                if (selected < todayOnly) {
                    setSchedulingError("عذراً، لا يمكن حجز موعد استلام أو توصيل في الماضي. يرجى اختيار تاريخ مستقبلي.");
                    return;
                }

                const combinedDateTime = new Date(`${dateVal}T${schedTime || '12:00'}`);
                const hoursDifference = (combinedDateTime.getTime() - now.getTime()) / (1000 * 60 * 60);

                if (hoursDifference < 24) {
                    setSchedulingError("عذراً، أسرع موعد للاستلام أو التوصيل بمطبخنا هو بعد 24 ساعة من الحجز لتجهيز طلبكم وتنسيقه بأعلى معايير الجودة.");
                } else {
                    setSchedulingError('');
                }
            };

            const submitOrder = () => {
                if (!custName || !custPhone || !schedDate || !schedTime) {
                    alert("يرجى ملء كافة البيانات الأساسية المطلوبة لإتمام تأكيد طلبكم وتوجيهه للمبيعات.");
                    return;
                }
                if (phoneError) {
                    alert("يرجى مراجعة وتعديل رقم التواصل الخاص بكم ليكون متطابقاً مع أرقام الهواتف المصرية المعتمدة.");
                    return;
                }
                if (schedulingError) {
                    alert(schedulingError);
                    return;
                }

                // صياغة فاتورة مبيعات راقية باللغة المصرية العامية المعتمدة
                let waMessage = `الاسم  ${custName}\nالهاتف  ${custPhone}\nطريقة الاستلام  ${deliveryType === 'pickup' ? 'استلام من الفرع' : 'شحن وتوصيل لموقعك'}\n`;
                
                if (deliveryType === 'shipping') {
                    waMessage += `المنطقة  ${shippingArea}\nتكلفة الشحن  ${shippingCost} ج م\n`;
                } else {
                    waMessage += `عنوان الاستلام  الكفاح شارع الوحدة المحلية بجوار صيدلية الدكتور احمد مجدي وبجوار عيادة الدكتور علي\n`;
                }

                waMessage += `تاريخ الاستلام  ${schedDate}\nالساعة  ${schedTime}\n\n`;
                waMessage += `تفاصيل السلة والحلويات المطلوبة\n`;

                cart.forEach(item => {
                    waMessage += `* ${item.label}  العدد ${item.qty}  السعر الإجمالي ${item.price * item.qty} ج م\n`;
                    if (item.custom && item.details) {
                        Object.entries(item.details).forEach(([key, val]) => {
                            waMessage += `  - ${key}  ${val}\n`;
                        });
                    }
                });

                waMessage += `\nإجمالي الفاتورة شاملة الرسوم  ${invoiceTotal} ج م\n`;
                waMessage += `صنعناها بحب لتهديها لمن تحب`;

                const encodedText = encodeURIComponent(waMessage);
                window.open(`https://wa.me/201097238441?text=${encodedText}`, '_blank');

                onClearCart();
                onNavigate('home');
            };

            return (
                <div class="py-12 px-4 max-w-xl mx-auto animate-fade-in text-right">
                    <h1 class="text-2xl font-extrabold text-brand-dark mb-8 text-center">اتمام الطلب والدفع</h1>

                    <div class="space-y-6">
                        {/* اسم العميل */}
                        <div>
                            <label class="block text-xs font-bold text-brand-dark mb-2">اسم العميل بالكامل</label>
                            <input 
                                type="text"
                                value={custName}
                                onChange={(e) => setCustName(e.target.value)}
                                placeholder="اكتب الاسم بالكامل"
                                class="w-full text-xs p-4 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink focus:bg-white smooth-transition text-brand-dark"
                            />
                        </div>

                        {/* رقم الهاتف */}
                        <div>
                            <label class="block text-xs font-bold text-brand-dark mb-2">رقم هاتف محمول مصري للتواصل</label>
                            <input 
                                type="text"
                                value={custPhone}
                                onChange={(e) => handlePhoneValidation(e.target.value)}
                                placeholder="مثال: 01097238441"
                                class="w-full text-xs p-4 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink focus:bg-white smooth-transition text-brand-dark"
                            />
                            {phoneError && (
                                <span class="text-[10px] text-red-500 font-bold block mt-2 font-sans">
                                    ⚠️ يرجى كتابة رقم هاتف مصري صحيح ومكون من 11 رقماً ويبدأ بالفئات المعتمدة.
                                </span>
                            )}
                        </div>

                        {/* خيار الاستلام أو الشحن */}
                        <div>
                            <label class="block text-xs font-bold text-brand-dark mb-2">طريقة استلام الفاتورة والطلب</label>
                            <div class="flex gap-3">
                                <button 
                                    onClick={() => setDeliveryType('pickup')}
                                    class={`flex-1 py-3 text-xs font-semibold rounded-2xl smooth-transition ${deliveryType === 'pickup' ? 'bg-brand-pink text-white shadow-sm' : 'bg-brand-grayLight text-brand-dark hover:bg-gray-100'}`}
                                >
                                    استلم بنفسي من الفرع
                                </button>
                                <button 
                                    onClick={() => setDeliveryType('shipping')}
                                    class={`flex-1 py-3 text-xs font-semibold rounded-2xl smooth-transition ${deliveryType === 'shipping' ? 'bg-brand-pink text-white shadow-sm' : 'bg-brand-grayLight text-brand-dark hover:bg-gray-100'}`}
                                >
                                    شحن وتوصيل للمنزل
                                </button>
                            </div>
                        </div>

                        {/* تفاصيل عنوان الفرع */}
                        {deliveryType === 'pickup' && (
                            <div class="bg-brand-grayLight p-4 rounded-3xl border border-gray-100 text-xs text-gray-500 leading-relaxed font-light">
                                <span class="font-bold text-brand-pink block mb-1">عنوان الفرع ومطبخنا لتلقي وتسليم الفواتير:</span>
                                الكفاح شارع الوحدة المحلية بجوار صيدلية الدكتور احمد مجدي وبجوار عيادة الدكتور علي.
                            </div>
                        )}

                        {/* تفاصيل مناطق الشحن */}
                        {deliveryType === 'shipping' && (
                            <div class="space-y-4 animate-fade-in">
                                <label class="block text-xs font-bold text-brand-dark mb-1">اختر منطقة الشحن والحي السكني الخاص بك:</label>
                                <div class="grid grid-cols-2 gap-2">
                                    {siteData.shippingZones.map(zone => (
                                        <button 
                                            key={`shipping-zone-${zone.area}`}
                                            onClick={() => setShippingArea(zone.area)}
                                            class={`py-2.5 px-4 border rounded-2xl text-xs text-right transition flex items-center justify-between ${shippingArea === zone.area ? 'border-brand-pink bg-brand-pink/5 font-bold text-brand-dark' : 'border-gray-100 bg-white hover:border-gray-200'}`}
                                        >
                                            <span>{zone.area}</span>
                                            <span class="text-[10px] text-gray-400 font-light">+{zone.price} ج.م</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* التوقيت والجدولة */}
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-brand-dark mb-2">تاريخ الاستلام أو التوصيل</label>
                                <input 
                                    type="date"
                                    value={schedDate}
                                    onChange={(e) => handleSchedulingValidation(e.target.value)}
                                    class="w-full text-xs p-3.5 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink"
                                />
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-brand-dark mb-2">الساعة المقترحة</label>
                                <input 
                                    type="time"
                                    value={schedTime}
                                    onChange={(e) => setSchedTime(e.target.value)}
                                    class="w-full text-xs p-3.5 bg-brand-grayLight border border-gray-100 rounded-2xl outline-none focus:border-brand-pink"
                                />
                            </div>
                        </div>

                        {schedulingError && (
                            <div class="bg-red-50 text-red-700 p-4 rounded-3xl text-xs font-medium leading-relaxed">
                                {schedulingError}
                            </div>
                        )}

                        {/* جدول الحسبة المالية الشاملة */}
                        <div class="bg-brand-grayLight/50 rounded-3xl p-6 border border-gray-100/50">
                            <h4 class="font-bold text-sm text-brand-dark mb-4 border-b pb-2">تفاصيل الفاتورة النهائية</h4>
                            <div class="space-y-2.5 text-xs text-gray-500 mb-4">
                                <div class="flex justify-between">
                                    <span>إجمالي الفاتورة الفرعي</span>
                                    <span>{productsTotal} ج.م</span>
                                </div>
                                {deliveryType === 'shipping' && (
                                    <div class="flex justify-between">
                                        <span>رسوم التوصيل والشحن</span>
                                        <span>{shippingCost} ج.م</span>
                                    </div>
                                )}
                            </div>
                            <div class="flex justify-between font-extrabold text-sm border-t pt-4 text-brand-dark">
                                <span>القيمة الإجمالية لطلبكم</span>
                                <span class="text-brand-pink">{invoiceTotal} ج.م</span>
                            </div>
                        </div>

                        <button 
                            onClick={submitOrder}
                            class="w-full bg-brand-pink hover:bg-[#ff8095] text-white font-semibold text-xs py-4 rounded-full shadow-lg smooth-transition flex items-center justify-center gap-2 active:scale-95"
                        >
                            <span>إرسال وتأكيد الحجز عبر واتساب للمبيعات</span>
                        </button>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 10. المكون الرئيسي الحاكم للبرنامج (App Engine)
        // ==========================================
        function App() {
            const [activePage, setActivePage] = useState('home');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            const [cart, setCart] = useState([]);
            const [selectedProductId, setSelectedProductId] = useState(null);

            // عداد دورة التنبيه لصور الإتقان الفني
            const [excellenceIndex, setExcellenceIndex] = useState(0);
            const [productGroupIndex, setProductGroupIndex] = useState(0); // 0 = أول 4 منتجات، 1 = كل المنتجات الـ 8

            // إدارة كميات المنتجات الفرعية في الكروت
            const [quantities, setQuantities] = useState({});

            // الدوران التلقائي لصور معرض الإتقان
            useEffect(() => {
                const rotationInterval = setInterval(() => {
                    setExcellenceIndex(prev => (prev + 1) % excellenceGallery.length);
                }, 4000);
                return () => clearInterval(rotationInterval);
            }, []);

            const handleUpdateQuantity = (productId, change) => {
                setQuantities(prev => {
                    const current = prev[productId] || 1;
                    const next = Math.max(1, current + change);
                    return { ...prev, [productId]: next };
                });
            };

            const handleAddToCart = (product, qty, variantDetails = null) => {
                let uniqueCartId = product.id;
                let finalPrice = product.price || 0;
                let finalLabel = product.title;

                if (variantDetails) {
                    uniqueCartId = `${product.id}-${variantDetails.id}`;
                    finalPrice = variantDetails.price;
                    finalLabel = `${product.title} (${variantDetails.flavor || variantDetails.name})`;
                } else if (product.sizes) {
                    // إذا كان للمنتج أحجام نختار الحجم الأول كافتراضي
                    const defaultSize = product.sizes[0];
                    uniqueCartId = `${product.id}-${defaultSize.id}`;
                    finalPrice = defaultSize.basePrice;
                    finalLabel = `${product.title} (${defaultSize.name})`;
                }

                setCart(prev => {
                    const existing = prev.find(item => item.id === uniqueCartId);
                    if (existing) {
                        return prev.map(item => item.id === uniqueCartId ? { ...item, qty: item.qty + qty } : item);
                    }
                    return [...prev, {
                        id: uniqueCartId,
                        productId: product.id,
                        label: finalLabel,
                        price: finalPrice,
                        qty: qty,
                        image: product.images?.[0] || 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=100&auto=format&fit=crop&q=80',
                        custom: false
                    }];
                });

                // تصفير عداد الكميات الموضعي
                setQuantities(prev => ({ ...prev, [product.id]: 1 }));
            };

            const handleAddCustomItem = (customItem) => {
                setCart(prev => [...prev, customItem]);
                setActivePage('cart');
            };

            const handleRemoveFromCart = (cartId) => {
                setCart(prev => prev.filter(item => item.id !== cartId));
            };

            const handleUpdateCartQty = (cartId, change) => {
                setCart(prev => prev.map(item => {
                    if (item.id === cartId) {
                        return { ...item, qty: Math.max(1, item.qty + change) };
                    }
                    return item;
                }));
            };

            const handleClearCart = () => {
                setCart([]);
            };

            const handleNavigateToDetail = (productId) => {
                setSelectedProductId(productId);
                setActivePage('product-detail');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const activeProductObj = useMemo(() => {
                return siteData.products.find(p => p.id === selectedProductId);
            }, [selectedProductId]);

            const cartCount = useMemo(() => {
                return cart.reduce((acc, curr) => acc + curr.qty, 0);
            }, [cart]);

            const handlePageNavigation = (targetPage) => {
                setActivePage(targetPage);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            return (
                <div class="min-h-screen flex flex-col justify-between relative bg-white">
                    
                    {/* الهيدر المشترك */}
                    <Header 
                        activePage={activePage}
                        onNavigate={handlePageNavigation}
                        cartCount={cartCount}
                        onSearchChange={setSearchQuery}
                        searchQuery={searchQuery}
                        onToggleSidebar={() => setSidebarOpen(true)}
                    />

                    {/* القائمة الجانبية المنسدلة للتصفح المريح على الهواتف */}
                    {sidebarOpen && (
                        <div class="fixed inset-0 z-50 flex animate-fade-in">
                            <div class="fixed inset-0 bg-brand-dark/45 backdrop-blur-sm transition-opacity" onClick={() => setSidebarOpen(false)}></div>
                            <div class="relative w-80 max-w-xs bg-white h-full p-6 flex flex-col justify-between shadow-2xl z-10">
                                <div>
                                    <div class="flex items-center justify-between mb-8 border-b pb-4">
                                        <div class="flex items-center gap-2">
                                            <img src={siteData.store.logo} alt="شعار حلويات بوسي" class="w-10 h-10" />
                                            <span class="font-bold text-sm text-brand-dark">حلويات بوسي</span>
                                        </div>
                                        <button onClick={() => setSidebarOpen(false)} class="p-2 text-gray-400 hover:text-brand-pink smooth-transition" aria-label="إغلاق القائمة">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                                            </svg>
                                        </button>
                                    </div>
                                    <nav class="flex flex-col gap-3">
                                        {[
                                            { id: 'home', label: 'الرئيسية' },
                                            { id: 'menu', label: 'المنيو' },
                                            { id: 'cake-builder', label: 'محاكي التورت' },
                                            { id: 'flower-builder', label: 'محاكي الورد' },
                                            { id: 'cart', label: 'السلة' }
                                        ].map(navItem => (
                                            <button 
                                                key={`sidebar-nav-${navItem.id}`}
                                                onClick={() => { handlePageNavigation(navItem.id); setSidebarOpen(false); }} 
                                                class={`text-right py-3.5 px-5 rounded-2xl text-xs font-semibold smooth-transition ${activePage === navItem.id ? 'bg-brand-pink/10 text-brand-pink' : 'text-brand-dark hover:bg-brand-grayLight'}`}
                                            >
                                                {navItem.label}
                                            </button>
                                        ))}
                                    </nav>
                                </div>
                                <div class="border-t pt-4 text-center">
                                    <span class="text-[9px] text-gray-400">صنعناها بحب لتهديها لمن تحب</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* مسار الصفحات التفاعلية الحية */}
                    <main class="flex-grow">
                        {activePage === 'home' && (
                            <HomePage 
                                onNavigate={handlePageNavigation}
                                quantities={quantities}
                                onUpdateQuantity={handleUpdateQuantity}
                                onAddToCart={handleAddToCart}
                                productGroupIndex={productGroupIndex}
                                setProductGroupIndex={setProductGroupIndex}
                                excellenceIndex={excellenceIndex}
                                onNavigateToDetail={handleNavigateToDetail}
                            />
                        )}
                        {activePage === 'menu' && (
                            <MenuPage 
                                onNavigate={handlePageNavigation}
                                searchQuery={searchQuery}
                                onSearchChange={setSearchQuery}
                                onNavigateToDetail={handleNavigateToDetail}
                            />
                        )}
                        {activePage === 'product-detail' && activeProductObj && (
                            <ProductDetailPage 
                                product={activeProductObj}
                                onAddToCart={handleAddToCart}
                                onNavigate={handlePageNavigation}
                            />
                        )}
                        {activePage === 'cake-builder' && (
                            <CakeBuilderPage 
                                onAddCustomItem={handleAddCustomItem}
                            />
                        )}
                        {activePage === 'flower-builder' && (
                            <FlowerBuilderPage 
                                onAddCustomItem={handleAddCustomItem}
                            />
                        )}
                        {activePage === 'cart' && (
                            <CartPage 
                                cart={cart}
                                onUpdateCartQty={handleUpdateCartQty}
                                onRemoveFromCart={handleRemoveFromCart}
                                onNavigate={handlePageNavigation}
                            />
                        )}
                        {activePage === 'checkout' && (
                            <CheckoutPage 
                                cart={cart}
                                onNavigate={handlePageNavigation}
                                onClearCart={handleClearCart}
                            />
                        )}
                    </main>

                    {/* الفوتر المشترك */}
                    <Footer onNavigate={handlePageNavigation} />
                </div>
            );
        }

        // ==========================================
        // 11. تشغيل وحقن واجهة التطبيق التفاعلية
        // ==========================================
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
