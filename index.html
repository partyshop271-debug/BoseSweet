<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حلويات بوسي | صنعناها بحب لتهديها لمن تحب</title>
    <meta name="description" content="منصة بيع إلكترونية متكاملة لعلامة حلويات بوسي الفاخرة. استمتع بتجربة تسوق فريدة، صمم تورتتك الخاصة وبوكيه الورد المخصص عبر محاكياتنا التفاعلية الفريدة.">
    <meta name="keywords" content="حلويات, تورت, بوكس هدايا, كاب كيك, سينابون, ورد, دوناتس, حلويات بوسي">
    
    <!-- علامات أرشفة محركات البحث الفاخرة SEO -->
    <meta property="og:title" content="حلويات بوسي | صنعناها بحب لتهديها لمن تحب">
    <meta property="og:description" content="منصة بيع إلكترونية متكاملة لعلامة حلويات بوسي الفاخرة. استمتع بتجربة تسوق فريدة ومحاكيات تفاعلية حصرية.">
    <meta property="og:image" content="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://bosesweets.com">

    <!-- ملفات الستايل الرسمية والمسؤولة عن ضخ التفاصيل البصرية الفخمة لمنع التكديس -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/simulators.css">
    
    <!-- المحرك المركزي العالمي وعمليات الفحص المالي (يستدعى مبكراً لحظر وميض الألوان والأداء) -->
    <script src="js/core-engine.js"></script>
    <!-- ملف الجافاسكربت الرئيسي والمصرح له بالعمل خلف الكواليس -->
    <script src="js/app.js" defer></script>
</head>
<body class="bose-hardware-accelerated">

    <!-- TOP BAR: شريط علوي متحرك لاستقبال رسائل التسويق ديناميكياً من الـ JSON ومنع الفراغات بصرية -->
    <div id="top-bar-marquee" class="bose-ticker-section">
        <div id="top-bar-marquee-track" class="bose-ticker-wrapper"></div>
    </div>

    <!-- HEADER: مكون الهيدر الموحد والثابت الممتثل تماماً لخريطة الـ DOM الهندسية الصارمة -->
    <header class="bose-navbar">
        <div class="navbar-mobile-wrapper">
            <button id="mobile-menu-toggle" class="nav-icon-btn" aria-label="فتح قائمة التصفح">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="brand-logo-container">
                <a href="index.html">
                    <!-- تم تثبيت المعرف الفريد والحصري للوجو الموحد لتغذية المحرك بنجاح -->
                    <img id="bose-store-logo" src="" alt="شعار حلويات بوسي">
                </a>
            </div>
            
            <span class="brand-name-display">حلويات بوسي</span>
            
            <nav id="bose-nav-menu">
                <ul class="nav-list" id="bose-nav-list-container"></ul>
            </nav>
            
            <div class="nav-actions">
                <button id="nav-search-btn" class="nav-icon-btn" aria-label="البحث في المنتجات">
                    <i class="fas fa-search"></i>
                </button>
                
                <a href="cart.html" class="nav-cart-icon-wrapper" aria-label="عرض سلة التسوق">
                    <i class="fas fa-shopping-bag"></i>
                    <span id="nav-cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- MAIN FRAMEWORK: الحاوية الشرعية والوحيدة للمحتوى الديناميكي المتنفس بصرياً -->
    <main id="bose-main-content">

        <!-- SECTION 01: عقد من التميز (Hero Section) - أوساط فارغة للضخ النصي والـ CTA الحاسمة -->
        <section id="hero-section" class="bose-hero-section">
            <div class="bose-hero-slide-overlay">
                <h1 id="hero-title" class="bose-hero-title">عقد من <span class="bose-highlight-pink">التميز</span> في صناعة الحلويات</h1>
                <p id="hero-description" class="bose-hero-desc"></p>
                <a id="hero-cta-btn" href="menu.html" class="bose-hero-btn"></a>
            </div>
        </section>

        <!-- WATERFALL: قسم شلال المنتجات البصري الأنيق - الـ Hook البصري الأول الخالي تماماً من الفراغات -->
        <section id="waterfall-section" class="bose-waterfall-section-container">
            <div class="waterfall-overlay-top"></div>
            <div class="waterfall-container">
                <div id="waterfall-left-col" class="waterfall-col waterfall-up"></div>
                <div id="waterfall-right-col" class="waterfall-col waterfall-down"></div>
            </div>
            <div class="waterfall-overlay-bottom"></div>
        </section>

        <!-- SECTION 02: عقد من الإتقان - مسار وسلايدر الصور الأفقي المتصل لملء عرض الواجهة -->
        <section id="excellence-section" class="bose-perfection-section">
            <div class="bose-section-header">
                <h2 id="excellence-title" class="bose-section-title"></h2>
                <p id="excellence-description" class="bose-section-subtitle"></p>
            </div>
            <div id="excellence-slider-wrapper" class="bose-perfection-carousel-wrapper">
                <div id="excellence-images-track" class="bose-perfection-track"></div>
            </div>
            <div id="excellence-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 03: الأكثر مبيعاً - شبكة المنتجات الثنائية الموحدة الهيكل لضمان حوكمة الكروت -->
        <section id="most-selling-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="most-selling-title" class="bose-section-title"></h2>
                <p id="most-selling-description" class="bose-section-subtitle"></p>
            </div>
            <div id="most-selling-grid" class="bose-products-grid products-grid"></div>
            <div id="most-selling-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 04: محاكي التورت - بلوك بصري فخم ومستقر كلياً لميزة التخصيص الحصرية والتنافسية -->
        <section id="cake-preview-section" class="preview-builder-block bose-isolated-simulator-card">
            <div class="bose-isolated-backdrop-framework"></div>
            <div class="simulator-card-inner-layout">
                <img id="cake-preview-img" src="" alt="محاكي وتصميم التورت الحصري" data-isolated-framework="true">
                <h2 id="cake-preview-title" class="bose-simulator-title"></h2>
                <p id="cake-preview-desc" class="bose-simulator-desc"></p>
                <a id="cake-preview-cta" href="cake-builder.html" class="bose-simulator-action-btn"></a>
            </div>
        </section>

        <!-- SECTION 05: وصل حديثاً - شبكة الفضول واستكشاف التوليفات والنكهات الجديدة والحصرية -->
        <section id="new-arrivals-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="new-arrivals-title" class="bose-section-title"></h2>
                <p id="new-arrivals-description" class="bose-section-subtitle"></p>
            </div>
            <div id="new-arrivals-grid" class="bose-products-grid products-grid"></div>
            <div id="new-arrivals-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 06: منتجاتنا - التوزيع الثنائي المتوازن (4 كروت أولية وعرض ديناميكي للمزيد) -->
        <section id="our-products-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="our-products-title" class="bose-section-title"></h2>
                <p id="our-products-description" class="bose-section-subtitle"></p>
            </div>
            <div id="our-products-grid" class="bose-products-grid products-grid"></div>
            <div class="bose-show-more-container">
                <!-- تم تصحيح الـ ID ليتطابق مع محرك ضخ وقراءة الكروت المتبقية ديناميكياً بدون تعارض -->
                <button id="our-products-show-more" class="bose-product-action-btn"></button>
            </div>
        </section>

        <!-- SECTION 07: محاكي الورد - بلوك بصري فخم للتنسيق والملحقات ومفاجآت الكاش المدمجة الفاخرة -->
        <section id="flower-preview-section" class="preview-builder-block bose-isolated-simulator-card">
            <div class="bose-isolated-backdrop-framework"></div>
            <div class="simulator-card-inner-layout">
                <img id="flower-preview-img" src="" alt="تنسيق بوكيهات الورد والمال الفاخرة" data-isolated-framework="true">
                <h2 id="flower-preview-title" class="bose-simulator-title"></h2>
                <p id="flower-preview-desc" class="bose-simulator-desc"></p>
                <a id="flower-preview-cta" href="flower-builder.html" class="bose-simulator-action-btn"></a>
            </div>
        </section>

        <!-- SECTION 08: الفخر والاعتزاز - بلوك البيانات الإحصائية والعدادات الرقمية التصاعدية الذكية -->
        <section id="pride-section" class="bose-pride-statistics-section">
            <div class="bose-pride-container">
                <div class="bose-pride-text-block">
                    <span class="pride-mini-tag"><i class="fas fa-crown"></i> حكاية شغف وثقة</span>
                    <h2 id="pride-main-title"></h2>
                    <p id="pride-main-text"></p>
                </div>
                <div class="bose-statistics-grid-block" id="bose-counters-framework-trigger">
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-award"></i></div>
                        <div id="stat-years-value" class="stat-number">0</div>
                        <div id="stat-years-label" class="stat-label"></div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-users"></i></div>
                        <div id="stat-customers-value" class="stat-number">0</div>
                        <div id="stat-customers-label" class="stat-label"></div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-shopping-cart"></i></div>
                        <div id="stat-orders-value" class="stat-number">0</div>
                        <div id="stat-orders-label" class="stat-label"></div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-birthday-cake"></i></div>
                        <div id="stat-cakes-value" class="stat-number">0</div>
                        <div id="stat-cakes-label" class="stat-label"></div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-heart"></i></div>
                        <div id="stat-bouquets-value" class="stat-number">0</div>
                        <div id="stat-bouquets-label" class="stat-label"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 09: تسوق حسب الفئة - مجرى حركة الـ 12 كارت المعتمدة رسمياً بالمنيو ذو الوزن البصري -->
        <section id="categories-slider-section" class="bose-section-container bose-categories-slider-section">
            <div class="bose-section-header">
                <h2 id="categories-section-title" class="bose-section-title"></h2>
                <p id="categories-section-subtitle" class="bose-section-subtitle"></p>
            </div>
            <div id="categories-slider-wrapper" class="bose-categories-slider-wrapper">
                <div id="categories-track" class="categories-track-loop"></div>
            </div>
            <div id="categories-dots" class="bose-dots-container"></div>
        </section>

    </main>

    <!-- FOOTER: الفوتر الرسمي الموحد والثابت للموقع بصبغته الفاتحة النظيفة والتنفس البصري الكامل -->
    <footer class="bose-footer">
        <div class="footer-logo-container">
            <a href="index.html">
                <!-- تم حل ثغرة المعرف المكرر وتخصيص كلاس فريد لضمان ضخ اللوجو من المحرك للفوتر بنجاح -->
                <img class="bose-footer-store-logo-fallback" id="bose-footer-logo-node" src="" alt="شعار حلويات بوسي">
            </a>
        </div>
        <span class="brand-name-display footer-brand-name">حلويات بوسي</span>
        
        <div class="footer-about-block">
            <p id="footer-about-text"></p>
        </div>
        
        <!-- روابط القنوات الرسمية والتواصل المباشر بأيقوناتها الصريحة المعتمدة بالحوكمة للبراند -->
        <div id="footer-social-links" class="bose-social-links-wrapper">
            <a href="https://www.facebook.com/share/1H1vVMHyu9/" class="social-link-facebook" target="_blank" aria-label="فيسبوك حلويات بوسي"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.instagram.com/bose_sweets?igsh=amdkMmhxMXJyanYy" class="social-link-instagram" target="_blank" aria-label="انستجرام حلويات بوسي"><i class="fab fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@bosesweets1?_r=1&_t=ZS-96lRDDHq9QK" class="social-link-tiktok" target="_blank" aria-label="تيك توك حلويات بوسي"><i class="fab fa-tiktok"></i></a>
            <a href="https://wa.me/201097238441" class="social-link-whatsapp" target="_blank" aria-label="واتساب حلويات بوسي"><i class="fab fa-whatsapp"></i></a>
        </div>
        
        <!-- الحاويات الهندسية المخصصة للاستقبال التلقائي لوثائق السياسات والروابط المساعدة من الـ JSON -->
        <div class="footer-policies-container" id="bose-footer-policies"></div>
        
        <div class="footer-copyright-block">
            <p>© <span id="copyright-year">2026</span> جميع الحقوق محفوظة لعلامة حلويات بوسي التجارية الفاخرة</p>
        </div>
    </footer>

    <!-- حقن حاوية التوست المركزية لتأمين استقبال إشعارات الإضافة الفورية للسلة بنجاح -->
    <div id="bose-toast-central-container" class="bose-toast-container"></div>

</body>
</html>
