                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-award"></i></div>

                        <div id="stat-years-label" class="stat-label"></div>
                    </div>

                        <div id="stat-customers-value" class="stat-number">0</div>
                        <div id="stat-customers-label" class="stat-label"></div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-shopping-cart"></i></div>

                        <div id="stat-orders-label" class="stat-label"></div>

                    </div>

                        <div class="stat-icon-wrapper"><i class="fas fa-heart"></i></div>

    <div id="bose-footer-injector"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.onBoseDatabaseReady && window.onBoseDatabaseReady((data) => {
                console.log("👑 حارس التمهيد: تم مزامنة واجهة index.html بالكامل وبنجاح مع قاعدة البيانات.");
                
                const runتصارعي = (id, targetValue) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    let current = 0;
                    const duration = 2000;
                    const stepTime = Math.max(Math.floor(duration / targetValue), 15);
                    const suffix = "+";
                    
                    const timer = setInterval(() => {
                        current += Math.ceil(targetValue / 40);
                        if (current >= targetValue) {
                            el.textContent = targetValue + suffix;
                            clearInterval(timer);
                        } else {
                            el.textContent = current + suffix;
                        }
                    }, stepTime);
                };

                setTimeout(() => {
                    runتصارعي("stat-years-value", data.homepage.pride.stats.years.value);
                    runتصارعي("stat-customers-value", data.homepage.pride.stats.customers.value);
                    runتصارعي("stat-orders-value", data.homepage.pride.stats.orders.value);
                    runتصارعي("stat-cakes-value", data.homepage.pride.stats.cakes.value);
                    runتصارعي("stat-bouquets-value", data.homepage.pride.stats.bouquets.value);
                    
                    document.getElementById("stat-years-label").textContent = data.homepage.pride.stats.years.label;
                    document.getElementById("stat-customers-label").textContent = data.homepage.pride.stats.customers.label;
                    document.getElementById("stat-orders-label").textContent = data.homepage.pride.stats.orders.label;
                    document.getElementById("stat-cakes-label").textContent = data.homepage.pride.stats.cakes.label;
                    document.getElementById("stat-bouquets-label").textContent = data.homepage.pride.stats.bouquets.label;
                }, 400);
            });
        });
    </script>
