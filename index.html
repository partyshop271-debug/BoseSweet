    <style>
        /* إعدادات المتغيرات وتثبيت الهوية البصرية الصارمة */
        :root {
            --bs-pink: #FF91A4;
            --bs-white: #FFFFFF;
            --bs-black: #000000;
            --bs-gray-light: #F9F9F9;
            --bs-gray-text: #333333;
            --bs-font: 'Alexandria', sans-serif;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* إعادة تعيين العناصر الأساسية لضمان التوافق بين الموبايل والكمبيوتر */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--bs-font);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bs-white);
            color: var(--bs-black);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* أنماط العناوين والنصوص بوزن لا يتجاوز 800 */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            color: var(--bs-black);
        }

        p {
            font-weight: 400;
            color: var(--bs-gray-text);
        }

        /* أزرار بيضاوية احترافية خالية من الحواف الحادة */
        .bs-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 24px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s var(--transition-smooth);
            text-decoration: none;
            outline: none;
        }

        .bs-btn-primary {
            background-color: var(--bs-pink);
            color: var(--bs-white);
        }

        .bs-btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .bs-btn-secondary {
            background-color: var(--bs-gray-light);
            color: var(--bs-black);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .bs-btn-secondary:hover {
            background-color: #EEEEEE;
        }

        .bs-btn-full {
            width: 100%;
            display: flex;
        }

        /* نظام التوجيه وإدارة عرض الصفحات والشاشات (Single Page Application Layout) */
        .bs-page {
            display: none;
            width: 100%;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.4s var(--transition-smooth);
        }

        .bs-page.active-page {
            display: block;
            opacity: 1;
        }

        /* نظام التنبيهات والرسائل المنبثقة الموحد (Modals & Toast) */
        .bs-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s var(--transition-smooth);
            padding: 20px;
        }

        .bs-modal-overlay.active-modal {
            opacity: 1;
            visibility: visible;
        }

        .bs-modal-card {
            background-color: var(--bs-white);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transform: scale(0.9);
            transition: transform 0.3s var(--transition-smooth);
            text-align: center;
        }

        .bs-modal-overlay.active-modal .bs-modal-card {
            transform: scale(1);
        }

        .bs-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--bs-black);
            color: var(--bs-white);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            z-index: 3000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.3s var(--transition-smooth);
            pointer-events: none;
            white-space: nowrap;
        }

        .bs-toast.active-toast {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* مساحات التنفس والراحة البصرية للـ Grid العام */
        .bs-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* تحسينات المدخلات للتوافق مع الموبايل والكمبيوتر */
        input, textarea, select {
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0,0,0,0.08);
            background-color: var(--bs-gray-light);
            font-size: 14px;
            color: var(--bs-black);
            outline: none;
            transition: border-color 0.3s ease;
            -webkit-appearance: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--bs-pink);

            resize: none;
            min-height: 100px;

    </style>

<body>

    <div id="bsToast" class="bs-toast" aria-live="assertive"></div>

    <div id="bsGlobalModal" class="bs-modal-overlay" role="dialog" aria-modal="true">
        <div class="bs-modal-card">
            <div id="bsModalContent"></div>
        </div>
    </div>

    <div id="mainLayout">
        
        <main id="page-home" class="bs-page active-page"></main>

        <section id="page-menu" class="bs-page"></section>

        <section id="page-cake-builder" class="bs-page"></section>

        <section id="page-flower-builder" class="bs-page"></section>

        <section id="page-cart" class="bs-page"></section>

        <section id="page-checkout" class="bs-page"></section>

    </div>

    <script>
        // نظام إدارة الحالة العام والتنقل الفوري بين الصفحات بدون ريفريش
        const BoseRouter = {
            navigateTo(pageId) {
                const pages = document.querySelectorAll('.bs-page');
                pages.forEach(page => {
                    page.classList.remove('active-page');
                });
                
                const targetPage = document.getElementById(`page-${pageId}`);
                if (targetPage) {
                    targetPage.classList.add('active-page');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        };

        // محرك الرسائل المنبثقة الذكية (Modals)
        const BoseModal = {
            show(htmlContent) {
                const overlay = document.getElementById('bsGlobalModal');
                const contentContainer = document.getElementById('bsModalContent');
                contentContainer.innerHTML = htmlContent;
                overlay.classList.add('active-modal');
            },
            hide() {
                const overlay = document.getElementById('bsGlobalModal');
                overlay.classList.remove('active-modal');
            }
        };

        // محرك الإشعارات السريعة (Toasts)
        const BoseToast = {
            show(message, duration = 3500) {
                const toast = document.getElementById('bsToast');
                toast.innerText = message;
                toast.classList.add('active-toast');
                
                clearTimeout(this.timeout);
                this.timeout = setTimeout(() => {
                    toast.classList.remove('active-toast');
                }, duration);
            }
        };
    </script>

    <script>

                    <h1 class="bs-hero-title">عقد من التميز في صناعة الحلويات</h1>
                    <p class="bs-hero-desc">منصتنا الإلكترونية مصممة خصيصاً لتمنحك تجربة تسوق راقية وسريعة. تصفح خياراتنا المبتكرة وحضر هديتك بكل سهولة.</p>
                    <button class="bs-btn bs-btn-primary" onclick="BoseRouter.navigateTo('menu')">اطلب الآن</button>
                    
                    <div class="bs-hero-video-container">
                        <video class="bs-hero-video" autoplay loop muted playsinline poster="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-pouring-hot-chocolate-sauce-on-a-cake-41584-large.mp4" type="video/mp4">
                        </video>
                    </div>
                </section>

                <section class="bs-section">
                    <h2 class="bs-section-title">الأكثر مبيعاً</h2>
                    <div class="bs-slider-container" id="mostSellingContainer">
                        </div>
                </section>
            </div>
        `;

        // واجهات التحكم والوظائف التفاعلية الخاصة بالجزء الثاني
        const BoseUI = {
            toggleSidebar(open) {
                const overlay = document.getElementById('bsSidebarOverlay');
                overlay.classList.toggle('active-sidebar', open);
            },
            toggleSearch() {
                const searchBar = document.getElementById('bsSearchBar');
                searchBar.classList.toggle('active-search');
                if (searchBar.classList.contains('active-search')) {
                    document.getElementById('bsSearchInput').focus();
                }
            },
            handleNav(pageId) {
                this.toggleSidebar(false);
                BoseRouter.navigateTo(pageId);
            },
            initMostSelling() {
                // مصفوفة تضم 8 منتجات تمثيلية مأخوذة من الهيكل المعتمد لبيانات الموقع لملء السلايدر
                const topProducts = [
                    { name: 'الديسباسيتو نوتيلا', price: '66 ج.م' },
                    { name: 'سينابون لوتس', price: '121 ج.م' },
                    { name: 'دوناتس ماتيلدا', price: '110 ج.م' },
                    { name: 'قشطوطة مانجا', price: '121 ج.م' },
                    { name: 'كبات السعادة روشيه', price: '61 ج.م' },
                    { name: 'ميني تورتة فردين', price: '154 ج.م' },
                    { name: 'بوكس الروقان الفاخر', price: '550 ج.م' },
                    { name: 'سينابون بيستاشيو', price: '143 ج.م' }
                ];
                
                const container = document.getElementById('mostSellingContainer');
                if (container) {
                    container.innerHTML = topProducts.map(prod => `
                        <div class="bs-slider-card" onclick="BoseRouter.navigateTo('menu')">
                            <div class="bs-slider-img-holder">
                                <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="${prod.name}" class="bs-slider-img" loading="lazy">
                            </div>
                            <div class="bs-slider-info">
                                <span class="bs-slider-name">${prod.name}</span>
                                <span class="bs-slider-price">${prod.price}</span>
                            </div>
                        </div>
                    `).join('');
                }
            }
        };

        // تشغيل البناء الفوري للسلايدر عند تحميل السكريبت
        BoseUI.initMostSelling();
    </script>
