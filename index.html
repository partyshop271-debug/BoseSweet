<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>حلويات بوسي | صنعناها بحب لتهديها لمن تحب</title>

    <meta name="keywords" content="حلويات بوسي, حلويات, تورت, بوكس هدايا, كاب كيك, سينابون, ورد, دوناتس, الفرافرة, الوادي الجديد, الكفاح, BoseSweets, محاكي التورت, محاكي الورد">
    <meta name="author" content="إدارة حلويات بوسي">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://bosesweets.com">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bosesweets.com">
    <meta property="og:title" content="حلويات بوسي | صنعناها بحب لتهديها لمن تحب">
    <meta property="og:description" content="تصفح منيو حلويات بوسي واستخدم محاكي التورت والورد التفاعلي لتنسيق طلبك فريش وبأعلى جودة خامات طبيعية ممسوكة ومضمونة.">
    <meta property="og:image" content="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #FF91A4;        /* روح الهوية البصرية - البمبي الملكي */
            --secondary: #FFD700;      /* اللمسة الملكية الناعمة - ذهبي متمم ومحدود جداً */
            --background: #FFFFFF;     /* الأبيض النقي للتنفس والراحة البصرية الكاملة */
            --text-color: #000000;     /* اللون الأسود مخصص بشكل حصري وصارم للنصوص فقط */
            --gray-light: #FBFBFB;     /* درجات رمادية ناعمة جداً للخلفيات الفرعية */
            --gray-border: #F0F0F0;    /* خطوط الفصل والحدود الهادئة */
            --font-main: 'Alexandria', sans-serif;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --shadow-premium: 0 4px 25px rgba(255, 145, 164, 0.06);
        }

        /* الإعدادات العامة والتصفير الاحترافي */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            direction: rtl;
            text-align: right;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.6;
        }

        /* تخصيص شريط التمرير (Scrollbar) بألوان الهوية البصرية */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--background);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        /* حاويات العرض والصفحات المستقلة (SPA Containers) */
        .page-view {
            display: none;
            width: 100%;
            min-height: calc(100vh - 75px);
            animation: viewFadeIn 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .page-view.active-view {
            display: block;
        }

        @keyframes viewFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الهيدر المتطور المدمج بالهوية البصرية واللمسات الناعمة */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--background);
            border-bottom: 1px solid var(--gray-border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 75px;
        }

        .header-right, .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-color);
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .menu-toggle-btn:active {
            color: var(--primary);
        }

        .brand-logo-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-color);
        }

        .brand-logo-zone img {
            width: 46px;
            height: 46px;
            object-fit: contain;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: -0.3px;
        }

        /* أزرار الهيدر والرموز التفاعلية */
        .header-icon-btn {
            background: none;
            border: none;
            font-size: 19px;
            cursor: pointer;
            color: var(--text-color);
            position: relative;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition-smooth);
        }

        .header-icon-btn:active {
            background-color: var(--gray-light);
            color: var(--primary);
        }

        /* عداد الأرقام للسلة مدمج باللون البمبي الدائري */
        .badge-count {
            position: absolute;
            top: 3px;
            right: 3px;
            background-color: var(--primary);
            color: #FFFFFF;
            font-size: 9px;
            font-weight: 700;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--background);
        }

        /* القائمة الجانبية المتطورة والملتزمة بالهيكلة المطلوبة حرفياً */
        .sidebar-navigation {
            position: fixed;
            top: 0;
            right: -100%;
            width: 290px;
            height: 100%;
            background-color: var(--background);
            z-index: 2000;
            box-shadow: -6px 0 30px rgba(0,0,0,0.04);
            transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .sidebar-navigation.sidebar-open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--gray-border);
            padding-bottom: 15px;
        }

        .close-sidebar-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-color);
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .close-sidebar-btn:active {
            color: var(--primary);
        }

        .sidebar-menu-links {
            display: flex;
            flex-direction: column;
            gap: 6px;
            list-style: none;
        }

        .sidebar-link-item a {
            display: block;
            padding: 12px 16px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 20px;
            transition: var(--transition-smooth);
        }

        /* التميز البصري واللوني للروابط النشطة بلمسة الهوية */
        .sidebar-link-item.active-link a, .sidebar-link-item a:active {
            background-color: var(--gray-light);
            color: var(--primary);
            font-weight: 700;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.15);
            z-index: 1900;
            display: none;
            backdrop-filter: blur(3px);
        }

        /* شريط البحث المطور */
        .search-overlay-bar {
            position: fixed;
            top: -85px;
            left: 0;
            width: 100%;
            height: 75px;
            background-color: var(--background);
            z-index: 1500;
            box-shadow: 0 2px 15px rgba(0,0,0,0.02);
            transition: top 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 15px;
            border-bottom: 1px solid var(--gray-border);
        }

        .search-overlay-bar.search-bar-open {
            top: 0;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
        }

        .search-input-wrapper input {
            width: 100%;
            height: 44px;
            border: 1px solid var(--gray-border);
            border-radius: 22px;
            padding: 0 45px 0 20px;
            font-size: 13px;
            background-color: var(--gray-light);
            transition: var(--transition-smooth);
            color: var(--text-color);
        }

        .search-input-wrapper input:focus {
            border-color: var(--primary);
            background-color: var(--background);
        }

        .search-input-wrapper i {
            position: absolute;
            top: 14px;
            right: 18px;
            color: var(--primary);
            font-size: 15px;
        }

        .close-search-trigger {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--text-color);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        /* ================================================================= */
        /* الفئات البنائية المشتركة الجاهزة لجميع الأجزاء القادمة (Master Layout Classes) */
        /* ================================================================= */
        
        /* أزرار بيضاوية فاخرة مرنة */
        .btn-oval-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            background-color: var(--primary);
            color: #FFFFFF;
            border: 1px solid transparent;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--shadow-premium);
            text-decoration: none;
        }

        .btn-oval-primary:active {
            transform: scale(0.98);
            background-color: var(--background);
            color: var(--primary);
            border-color: var(--primary);
        }

        .btn-oval-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            background-color: var(--gray-light);
            color: var(--text-color);
            border: 1px solid var(--gray-border);
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-decoration: none;
        }

        .btn-oval-secondary:active {
            background-color: var(--gray-border);
        }

        /* تفاصيل الخط الذهبي المساعد الناعم جداً كلمسة ملكية خفيفة */
        .gold-royal-spot {
            color: var(--secondary) !important;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        /* نمط كروت المنتجات المشتركة (كارتين جنب بعض) */
        .products-dual-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 15px;
        }

        @media (min-width: 768px) {
            .products-dual-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        .product-premium-card {
            background-color: var(--background);
            border: 1px solid var(--gray-border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: var(--transition-smooth);
        }

        .product-premium-card:hover {
            box-shadow: var(--shadow-premium);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            background-color: var(--gray-light);
            overflow: hidden;
        }

        .card-image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-details-zone {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .card-product-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-color);
            line-height: 1.4;
        }

        .card-product-description {
            font-size: 11px;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
            height: 33px;
        }

        .card-pricing-control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
            border-top: 1px dashed var(--gray-border);
            padding-top: 8px;
        }

        .card-price-display {
            font-size: 14px;
            font-weight: 800;
            color: var(--text-color);
        }

        /* عداد التحكم في الكمية بالمسار والمؤشرات المطلوبة */
        .premium-quantity-stepper {
            display: flex;
            align-items: center;
            background-color: var(--gray-light);
            border: 1px solid var(--gray-border);
            border-radius: 20px;
            padding: 2px;
            gap: 6px;
        }

        .stepper-btn {
            background-color: var(--background);
            border: 1px solid var(--gray-border);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
            color: var(--text-color);
            transition: var(--transition-smooth);
        }

        .stepper-btn:active {
            background-color: var(--primary);
            color: #FFFFFF;
        }

        .stepper-value {
            font-size: 12px;
            font-weight: 700;
            min-width: 14px;
            text-align: center;
            color: var(--text-color);
        }

        .card-add-to-cart-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--gray-light);
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-color);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
        }

        .card-add-to-cart-btn:active {
            background-color: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        /* نظام التنبيهات الفورية الفاخر (Toast Notifications) */
        .toast-notifications-container {
            position: fixed;
            bottom: 25px;
            right: 20px;
            left: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        @media (min-width: 480px) {
            .toast-notifications-container {
                left: auto;
                width: 350px;
            }
        }

        .premium-toast {
            background-color: var(--background);
            border-right: 4px solid var(--primary);
            padding: 14px 18px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            animation: toastSlideIn 0.3s ease forwards;
        }

        .premium-toast i {
            font-size: 15px;
            color: var(--primary);
        }

        .toast-message-content {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-color);
        }

        @keyframes toastSlideIn {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* النوافذ المنبثقة الشاملة الفخمة (Premium Modals) */
        .premium-modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            z-index: 2500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .premium-modal-wrapper {
            background-color: var(--background);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
            border: 1px solid var(--gray-border);
            overflow: hidden;
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes modalPop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-main-header {
            padding: 20px 20px 10px 20px;
            text-align: center;
        }

        .modal-main-header i {
            font-size: 22px;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .modal-main-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-color);
        }

        .modal-main-body {
            padding: 10px 20px 20px 20px;
            text-align: center;
            font-size: 13px;
            color: #222;
            line-height: 1.6;
        }

        .modal-actions-footer {
            padding: 15px 20px 20px 20px;
            background-color: var(--gray-light);
            border-top: 1px solid var(--gray-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* عناوين وأقسام الصفحات القياسية */
        .view-section-container {
            padding: 30px 20px;
            width: 100%;
        }

        .view-section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-color);
            text-align: center;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

    <div class="toast-notifications-container" id="globalToastContainer"></div>

    <div class="premium-modal-backdrop" id="centralUpgradeModal">
        <div class="premium-modal-wrapper">
            <div class="modal-main-header">
                <i class="fa-solid fa-circle-info" id="modalIcon"></i>
                <div class="modal-main-title" id="modalTitle">توضيح بخصوص التنسيق</div>
            </div>
            <div class="modal-main-body" id="modalBody">
                تفاصيل الرسالة الإرشادية تظهر هنا.
            </div>
            <div class="modal-actions-footer" id="modalActions"></div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="search-overlay-bar" id="searchOverlayBar">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="globalSearchInput" placeholder="ابحث عن منتجك المفضل...">
        </div>
        <button class="close-search-trigger" id="closeSearchBtn" aria-label="إغلاق البحث"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <header>
        <div class="header-right">
            <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="فتح قائمة التنقل">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a href="#" class="brand-logo-zone" data-target="homepage-view">
                <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="شعار حلويات بوسي">
                <span class="brand-title">حلويات بوسي</span>
            </a>
        </div>
        <div class="header-left">
            <button class="header-icon-btn" id="searchTriggerBtn" aria-label="فتح البحث">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button class="header-icon-btn" id="cartPageBtn" data-target="cart-view" aria-label="فتح السلة">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="badge-count" id="cartBadgeCount">0</span>
            </button>
        </div>
    </header>

    <nav class="sidebar-navigation" id="sidebarNavigation">
        <div class="sidebar-header">
            <span class="brand-title">حلويات بوسي</span>
            <button class="close-sidebar-btn" id="closeSidebarBtn" aria-label="إغلاق القائمة"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="sidebar-menu-links">
            <li class="sidebar-menu-item sidebar-link-item active-link" data-target="homepage-view"><a href="#">الرئيسية</a></li>
            <li class="sidebar-menu-item sidebar-link-item" data-target="menu-view"><a href="#">المنيو</a></li>
            <li class="sidebar-menu-item sidebar-link-item" data-target="cart-view"><a href="#">السلة</a></li>
            <li class="sidebar-menu-item sidebar-link-item" data-target="cake-simulator-view"><a href="#">محاكي التورت</a></li>
            <li class="sidebar-menu-item sidebar-link-item" data-target="flower-simulator-view"><a href="#">محاكي الورد</a></li>
        </ul>
    </nav>

    <script>
        window.BoseSweetsEngine = {
            state: {
                cart: JSON.parse(localStorage.getItem('bose_cart')) || [],
                favorites: JSON.parse(localStorage.getItem('bose_favs')) || [],
                currentView: 'homepage-view'
            },

            updateUIComponents: function() {
                document.getElementById('cartBadgeCount').textContent = this.state.cart.reduce((acc, item) => acc + (item.quantity || 1), 0);
                localStorage.setItem('bose_cart', JSON.stringify(this.state.cart));
                localStorage.setItem('bose_favs', JSON.stringify(this.state.favorites));
                window.dispatchEvent(new CustomEvent('boseStateUpdated'));
            },

            showToast: function(message, type = 'success') {
                const container = document.getElementById('globalToastContainer');
                const toast = document.createElement('div');
                toast.className = `premium-toast`;
                toast.innerHTML = `
                    <i class="fa-solid fa-circle-check"></i>
                    <div class="toast-message-content">${message}</div>
                `;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'all 0.3s ease';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },

            showModal: function(title, bodyHtml, actionButtons = []) {
                const backdrop = document.getElementById('centralUpgradeModal');
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = bodyHtml;
                const footer = document.getElementById('modalActions');
                footer.innerHTML = '';
                
                actionButtons.forEach(btnConfig => {
                    const btn = document.createElement('button');
                    btn.className = btnConfig.className || 'btn-oval-secondary';
                    btn.textContent = btnConfig.text;
                    btn.addEventListener('click', () => {
                        if (btnConfig.callback) btnConfig.callback();
                        backdrop.style.display = 'none';
                    });
                    footer.appendChild(btn);
                });
                backdrop.style.display = 'flex';
            },

            navigateToView: function(viewId) {
                const views = document.querySelectorAll('.page-view');
                let found = false;
                
                views.forEach(view => {
                    if (view.id === viewId) {
                        view.classList.add('active-view');
                        found = true;
                    } else {
                        view.classList.remove('active-view');
                    }
                });

                if (found) {
                    this.state.currentView = viewId;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    
                    document.querySelectorAll('.sidebar-link-item').forEach(item => {
                        if (item.getAttribute('data-target') === viewId) {
                            item.classList.add('active-link');
                        } else {
                            item.classList.remove('active-link');
                        }
                    });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const closeSidebarBtn = document.getElementById('closeSidebarBtn');
            const sidebarNavigation = document.getElementById('sidebarNavigation');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const searchTriggerBtn = document.getElementById('searchTriggerBtn');
            const closeSearchBtn = document.getElementById('closeSearchBtn');
            const searchOverlayBar = document.getElementById('searchOverlayBar');

            function toggleSidebar(open) {
                if (open) {
                    sidebarNavigation.classList.add('sidebar-open');
                    sidebarOverlay.style.display = 'block';
                } else {
                    sidebarNavigation.classList.remove('sidebar-open');
                    sidebarOverlay.style.display = 'none';
                }
            }

            menuToggleBtn.addEventListener('click', () => toggleSidebar(true));
            closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
            sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

            searchTriggerBtn.addEventListener('click', () => {
                searchOverlayBar.classList.add('search-bar-open');
                document.getElementById('globalSearchInput').focus();
            });

            closeSearchBtn.addEventListener('click', () => {
                searchOverlayBar.classList.remove('search-bar-open');
            });

            document.addEventListener('click', (e) => {
                const targetTrigger = e.target.closest('[data-target]');
                if (targetTrigger) {
                    e.preventDefault();
                    const viewId = targetTrigger.getAttribute('data-target');
                    window.BoseSweetsEngine.navigateToView(viewId);
                    toggleSidebar(false);
                    searchOverlayBar.classList.remove('search-bar-open');
                }
            });

            window.BoseSweetsEngine.updateUIComponents();
        });
    </script>

    <main id="homepage-view" class="page-view active-view">
