    <!-- 🏢 بروتوكول الهيكل الموحد والحقن الديناميكي القياسي لعلامة بوسي الفاخرة -->
    <!-- يتم بناء وضخ الفوتر الموحد بصبغته الفاتحة النظيفة والتنفس البصري الكامل هنا تلقائياً -->
    <div id="bose-footer-injector"></div>

    <!-- 🛡️ حارس التمهيد لربط الـ DOM وتنشيط العدادات الرقمية فور اكتمال مصفوفة قاعدة البيانات -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            window.onBoseDatabaseReady && window.onBoseDatabaseReady((data) => {
                console.log("👑 حارس التمهيد: تم مزامنة واجهة index.html بالكامل وبنجاح مع قاعدة البيانات.");
                
                // محرك العدادات التصاعدية الرقمية الذكية الخالي من أخطاء الـ NaN لـ 5 خانات كاملة بالمسطرة
                const run تصاعدي = (id, targetValue) => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    let current = 0;
                    const duration = 2000;
                    const stepTime = Math.max(Math.floor(duration / targetValue), 15);
                    const suffix = "+";
                    
                    const timer = setInterval(() => {
                        current += Math.ceil(targetValue / 40);
                        if (current >= targetValue) {
                            el.textContent = targetValue + suffix;
                            clearInterval(timer);
                        } else {
                            el.textContent = current + suffix;
                        }
                    }, stepTime);
                };

                // إثارة وتشغيل العدادات فوراً بقيمها النقية والأصيلة المستدعاة من الـ JSON
                setTimeout(() => {
                    run("stat-years-value", data.homepage.pride.stats.years.value);
                    run("stat-customers-value", data.homepage.pride.stats.customers.value);
                    run("stat-orders-value", data.homepage.pride.stats.orders.value);
                    run("stat-cakes-value", data.homepage.pride.stats.cakes.value);
                    run("stat-bouquets-value", data.homepage.pride.stats.bouquets.value);
                    
                    // حقن لواحق الأسماء والتسميات التوضيحية ديناميكياً لتفادي الكتابة اليدوية
                    document.getElementById("stat-years-label").textContent = data.homepage.pride.stats.years.label;
                    document.getElementById("stat-customers-label").textContent = data.homepage.pride.stats.customers.label;
                    document.getElementById("stat-orders-label").textContent = data.homepage.pride.stats.orders.label;
                    document.getElementById("stat-cakes-label").textContent = data.homepage.pride.stats.cakes.label;
                    document.getElementById("stat-bouquets-label").textContent = data.homepage.pride.stats.bouquets.label;
                }, 400);
            });
        });
    </script>
