<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حلويات بوسي | صنعناها بحب لتهديها لمن تحب</title>
    <meta name="description" content="منصة بيع إلكترونية متكاملة لعلامة حلويات بوسي الفاخرة. استمتع بتجربة تسوق فريدة، صمم تورتتك الخاصة وبوكيه الورد المخصص عبر محاكياتنا التفاعلية الفريدة.">
    <meta name="keywords" content="حلويات, تورت, بوكس هدايا, كاب كيك, سينابون, ورد, دوناتس, حلويات بوسي">
    
    <!-- علامات أرشفة محركات البحث الفاخرة SEO والأرشفة العالمية -->
    <meta property="og:title" content="حلويات بوسي | صنعناها بحب لتهديها لمن تحب">
    <meta property="og:description" content="منصة بيع إلكترونية متكاملة لعلامة حلويات بوسي الفاخرة. استمتع بتجربة تسوق فريدة ومحاكيات تفاعلية حصرية.">
    <meta property="og:image" content="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://bosesweets.com">

    <!-- ملفات الستايل الرسمية لمنع تضخم الواجهات وتحقيق الفخامة والتنفس البصري -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/simulators.css">
    
    <!-- المحرك المركزي العالمي وحارس التمهيد: المستدعى الوحيد برأس الصفحة لحظر وميض الألوان وتأمين الأداء -->
    <script src="js/core-engine.js?v=2026_production_v2"></script>
</head>
<body class="bose-hardware-accelerated">

    <!-- 🏢 بروتوكول الهيكل الموحد والحقن الديناميكي القياسي لعلامة بوسي الفاخرة -->
    <!-- يتم بناء وضخ التوب بار المتحرك، الهيدر الهيكلي، والقائمة الجانبية للألوان الحاكمة مركزياً هنا عبر core-engine.js -->
    <div id="bose-header-injector"></div>

    <!-- MAIN FRAMEWORK: الحاوية الشرعية والوحيدة للمحتوى والأقسام العشرة لراحة العميل النفسية -->
    <main id="bose-main-content">

        <!-- SECTION 01: عقد من التميز (#hero-section) -->
        <section id="hero-section" class="bose-hero-section">
            <div class="bose-hero-slide-overlay">
                <h1 id="hero-title" class="bose-hero-title">عقد من <span class="bose-highlight-pink">التميز</span> في صناعة الحلويات</h1>
                <p id="hero-description" class="bose-hero-desc"></p>
                <a id="hero-cta-btn" href="menu.html" class="bose-hero-btn">اطلب الآن</a>
            </div>
        </section>

        <!-- WATERFALL: قسم شلال المنتجات البصري الأنيق (#waterfall-section) - الـ Hook البصري الأول -->
        <section id="waterfall-section" class="bose-waterfall-section-container">
            <div class="waterfall-overlay-top"></div>
            <div class="waterfall-container">
                <div id="waterfall-left-col" class="waterfall-col waterfall-up"></div>
                <div id="waterfall-right-col" class="waterfall-col waterfall-down"></div>
            </div>
            <div class="waterfall-overlay-bottom"></div>
        </section>

        <!-- SECTION 02: عقد من الإتقان (#excellence-section) - السلايدر الأفقي التلقائي -->
        <section id="excellence-section" class="bose-perfection-section">
            <div class="bose-section-header">
                <h2 id="excellence-title" class="bose-section-title">عقد من الإتقان</h2>
                <p id="excellence-description" class="bose-section-subtitle"></p>
            </div>
            <div id="excellence-slider-wrapper" class="bose-perfection-carousel-wrapper">
                <div id="excellence-images-track" class="bose-perfection-track"></div>
            </div>
            <div id="excellence-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 03: الأكثر مبيعاً (#most-selling-section) - شبكة توزيع بدقة هندسية كاملة -->
        <section id="most-selling-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="most-selling-title" class="bose-section-title">الأكثر مبيعاً</h2>
                <p id="most-selling-description" class="bose-section-subtitle"></p>
            </div>
            <div id="most-selling-grid" class="bose-products-grid products-grid"></div>
            <div id="most-selling-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 04: محاكي التورت (#cake-preview-section) - بلوك بصري فاخر عريض وعنصر حاسم مخصص -->
        <section id="cake-preview-section" class="preview-builder-block bose-isolated-simulator-card">
            <div class="bose-isolated-backdrop-framework"></div>
            <div class="simulator-card-inner-layout">
                <img id="cake-preview-img" src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="محاكي وتصميم التورت الحصري">
                <h2 id="cake-preview-title" class="bose-simulator-title">محاكي التورت</h2>
                <p id="cake-preview-desc" class="bose-simulator-desc"></p>
                <a id="cake-preview-cta" href="cake-builder.html" class="bose-simulator-action-btn">تصميم التورتة الآن</a>
            </div>
        </section>

        <!-- SECTION 05: وصل حديثاً (#new-arrivals-section) - شبكة التوليفات والنكهات الحصرية الجديدة -->
        <section id="new-arrivals-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="new-arrivals-title" class="bose-section-title">وصل حديثاً</h2>
                <p id="new-arrivals-description" class="bose-section-subtitle"></p>
            </div>
            <div id="new-arrivals-grid" class="bose-products-grid products-grid"></div>
            <div id="new-arrivals-dots" class="bose-dots-container"></div>
        </section>

        <!-- SECTION 06: منتجاتنا (#our-products-section) - كروت ثنائية متوازنة 4 أولية وعرض ديناميكي للمزيد -->
        <section id="our-products-section" class="bose-section-container">
            <div class="bose-section-header">
                <h2 id="our-products-title" class="bose-section-title">منتجاتنا</h2>
                <p id="our-products-description" class="bose-section-subtitle"></p>
            </div>
            <div id="our-products-grid" class="bose-products-grid products-grid"></div>
            <div class="bose-show-more-container">
                <button id="our-products-show-more" class="bose-product-action-btn">إظهار المزيد</button>
            </div>
        </section>

        <!-- SECTION 07: محاكي الورد (#flower-preview-section) - بلوك بصري فخم للتخصيص والهدايا والكاش المدمج -->
        <section id="flower-preview-section" class="preview-builder-block bose-isolated-simulator-card">
            <div class="bose-isolated-backdrop-framework"></div>
            <div class="simulator-card-inner-layout">
                <img id="flower-preview-img" src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="تنسيق بوكيهات الورد والمال الفاخرة">
                <h2 id="flower-preview-title" class="bose-simulator-title">محاكي الورد</h2>
                <p id="flower-preview-desc" class="bose-simulator-desc"></p>
                <a id="flower-preview-cta" href="flower-builder.html" class="bose-simulator-action-btn">تصميم البوكيه الآن</a>
            </div>
        </section>

        <!-- SECTION 08: الفخر والاعتزاز (#pride-section) - بلوك الأرقام والعدادات التصاعدية من الـ JSON -->
        <section id="pride-section" class="bose-pride-statistics-section">
            <div class="bose-pride-container">
                <div class="bose-pride-text-block">
                    <span class="pride-mini-tag"><i class="fas fa-crown"></i> حكاية شغف وثقة</span>
                    <h2 id="pride-main-title">الفخر والاعتزاز</h2>
                    <p id="pride-main-text"></p>
                </div>
                <div class="bose-statistics-grid-block" id="bose-counters-framework-trigger">
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-award"></i></div>
                        <div id="stat-years-value" class="stat-number">0</div>
                        <div id="stat-years-label" class="stat-label">سنوات خبرة</div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-users"></i></div>
                        <div id="stat-customers-value" class="stat-number">0</div>
                        <div id="stat-customers-label" class="stat-label">عميل</div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-shopping-cart"></i></div>
                        <div id="stat-orders-value" class="stat-number">0</div>
                        <div id="stat-orders-label" class="stat-label">طلب ناجح</div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-birthday-cake"></i></div>
                        <div id="stat-cakes-value" class="stat-number">0</div>
                        <div id="stat-cakes-label" class="stat-label">التورت المصممة</div>
                    </div>
                    <div class="bose-stat-card">
                        <div class="stat-icon-wrapper"><i class="fas fa-heart"></i></div>
                        <div id="stat-bouquets-value" class="stat-number">0</div>
                        <div id="stat-bouquets-label" class="stat-label">منسقة بحب</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 09: تسوق حسب الفئة (#categories-slider-section) - مجرى حركة كروت الفئات الـ 12 المعتمدة -->
        <section id="categories-slider-section" class="bose-section-container bose-categories-slider-section">
            <div class="bose-section-header">
                <h2 id="categories-section-title" class="bose-section-title">تسوق حسب الفئة</h2>
                <p id="categories-section-subtitle" class="bose-section-subtitle"></p>
            </div>
            <div id="categories-slider-wrapper" class="bose-categories-slider-wrapper">
                <div id="categories-track" class="categories-track-loop"></div>
            </div>
            <div id="categories-dots" class="bose-dots-container"></div>
        </section>

    </main>

    <!-- 🏢 بروتوكول الهيكل الموحد والحقن الديناميكي القياسي لعلامة بوسي الفاخرة -->
    <!-- يتم بناء وضخ الفوتر الموحد بصبغته الفاتحة النظيفة والتنفس البصري الكامل هنا عبر core-engine.js -->
    <div id="bose-footer-injector"></div>

</body>
</html>
