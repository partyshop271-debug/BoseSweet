<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF91A4">
    <title>من نحن | حلويات بوسي</title>
    
    <!-- Meta tags for SEO & Brand Quality -->
    <meta name="description" content="تعرف على قصة شغف حلويات بوسي، رحلة بدأت من قلب أم بحثاً عن الأمان والجودة لأطفالها، لتتحول إلى دراسة أكاديمية وعقد من التميز والاحترافية الفاخرة.">
    <meta property="og:title" content="من نحن | حلويات بوسي">
    <meta property="og:description" content="قصة بدأت بالحب والأمان، وتطورت بالدراسة والخبرة لتقديم أرقى وأفخم الحلويات لعائلتك.">
    <meta property="og:type" content="website">
    
        <link rel="canonical" href="https://bose-sweet.vercel.app/about.html">

    <!-- CSS Dependencies -->
    <!-- [إصلاح جذري نهائي]: الأيقونات بقت مُستضافة محليًا داخل الموقع نفسه (vendor/fontawesome)
         بدل الاعتماد على أي CDN خارجي (cdnjs/jsdelivr/unpkg) - مفيش نقطة فشل خارجية تانية خالص. -->
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">
    <link rel="stylesheet" href="css/global.css?v=2026_production_v43.1">
    <link rel="stylesheet" href="css/main.css?v=2026_production_v39.0">
    
    <!-- Styling for About Page Elements (Embedded to ensure zero external file dependency conflicts) -->
    <style>
        /* About Page Unique Decorative Classes */
        .about-hero {
            position: relative;
            padding: 80px 20px;
            text-align: center;
            background: linear-gradient(rgba(255, 145, 164, 0.04), rgba(255, 145, 164, 0.01));
            margin-bottom: 40px;
        }
        
        .about-hero-badge {
            display: inline-block;
            background-color: rgba(255, 145, 164, 0.1);
            color: var(--bose-pink);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 145, 164, 0.2);
        }
        
        .about-hero h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: var(--bose-black);
            line-height: 1.3;
        }
        
        .about-hero h1 span {
            color: var(--bose-pink);
        }
        
        .about-hero p {
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto;
            color: #111111;
            line-height: 1.8;
        }

        .story-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 20px 80px 20px;
        }

        .story-block {
            background-color: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: var(--bose-shadow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .story-block:hover {
            transform: translateY(-4px);
            box-shadow: var(--bose-shadow-hover);
        }

        .story-block-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(255, 145, 164, 0.2);
            padding-bottom: 15px;
        }

        .story-block-header i {
            color: var(--bose-pink);
            font-size: 24px;
        }

        .story-block-header h2 {
            font-size: 24px;
            margin: 0;
            color: var(--bose-black);
        }

        .story-text-content {
            font-size: 16px;
            line-height: 1.9;
            color: #111111;
            text-align: justify;
        }

        .story-quote {
            position: relative;
            background-color: rgba(255, 145, 164, 0.03);
            border-right: 4px solid var(--bose-pink);
            padding: 20px 25px;
            margin: 25px 0;
            border-radius: 4px 12px 12px 4px;
            font-style: italic;
        }

        .story-quote p {
            margin: 0;
            font-size: 16px;
            color: var(--bose-black);
            font-weight: 600;
        }

        /* Real Numbers Strip */
        .about-stats-strip {
            max-width: 720px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .about-stat-card {
            background-color: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 18px;
            padding: 22px 16px;
            text-align: center;
            box-shadow: var(--bose-shadow-glow);
        }

        .about-stat-card i {
            color: var(--bose-pink);
            font-size: 22px;
            margin-bottom: 8px;
            display: block;
        }

        .about-stat-number {
            display: block;
            font-size: 28px;
            font-weight: 800;
            color: var(--bose-black);
            line-height: 1.2;
        }

        .about-stat-label {
            display: block;
            font-size: 13px;
            color: #111111;
            opacity: 0.7;
            margin-top: 4px;
        }

        /* Real Photo Gallery */
        .about-gallery-section {
            max-width: 960px;
            margin: 0 auto 60px auto;
            padding: 0 20px;
        }

        .about-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .about-gallery-item {
            margin: 0;
            border-radius: 18px;
            overflow: hidden;
            border: var(--bose-border-pink);
            box-shadow: var(--bose-shadow-glow);
        }

        .about-gallery-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .about-gallery-item figcaption {
            padding: 10px 12px;
            font-size: 13px;
            color: var(--bose-black);
            text-align: center;
        }

        /* Pillars Section */
        .pillars-section {
            background-color: rgba(255, 145, 164, 0.02);
            border-top: var(--bose-border-pink);
            border-bottom: var(--bose-border-pink);
            padding: 60px 20px;
            margin-bottom: 60px;
        }

        .pillars-grid {
            max-width: 960px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .pillar-card {
            background: var(--bose-white);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: var(--bose-border-pink);
            box-shadow: var(--bose-shadow-glow);
        }

        .pillar-icon {
            width: 60px;
            height: 60px;
            line-height: 60px;
            border-radius: 50%;
            background-color: rgba(255, 145, 164, 0.1);
            color: var(--bose-pink);
            font-size: 24px;
            margin: 0 auto 20px auto;
        }

        .pillar-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: var(--bose-black);
        }

        .pillar-card p {
            font-size: 15px;
            line-height: 1.7;
            color: #111111;
            margin: 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .about-hero {
                padding: 60px 15px 30px 15px;
            }
            .about-hero h1 {
                font-size: 28px;
            }
            .about-hero p {
                font-size: 16px;
            }
            .story-block {
                padding: 25px 20px;
            }
            .story-block-header h2 {
                font-size: 20px;
            }
            .about-stats-strip {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                margin-bottom: 35px;
            }
            .about-stat-card {
                padding: 16px 10px;
            }
            .about-stat-number {
                font-size: 22px;
            }
            .about-gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Universal Header Injection Target -->
    <div id="bose-header-injector"></div>

    <!-- About Main Content -->
    <main class="about-page-main">

        <!-- Hero Section (يتملى ديناميكيًا من إعدادات لوحة التحكم) -->
        <section class="about-hero">
            <div class="about-hero-badge" id="about-hero-badge">عقد من الحب والتميز</div>
            <h1 id="about-main-title">حكايتنا.. من قلب أم لـ <span id="about-hero-highlight">شركاء النجاح</span></h1>
            <p id="about-hero-subtitle">قصة لم تُكتب لتكون مجرد تجارة، بل رحلة ممتلئة بالصدق، الأمان، والبحث المستمر عن الجودة الفاخرة التي تستحقها عائلتكم.</p>
        </section>

        <!-- Real Numbers Strip (تظهر بس لو فيه أرقام مضافة من لوحة التحكم) -->
        <section class="about-stats-strip" id="about-stats-strip" hidden></section>

        <!-- Main Narrative Container (يتملى ديناميكيًا) -->
        <section class="story-container" id="about-story-container"></section>

        <!-- Real Photo Gallery (تظهر بس لو فيه صور مضافة من لوحة التحكم) -->
        <section class="about-gallery-section" id="about-gallery-section" hidden>
            <div class="about-gallery-grid" id="about-gallery-grid"></div>
        </section>

        <!-- Brand Core Values (يتملى ديناميكيًا) -->
        <section class="pillars-section">
            <div class="pillars-grid" id="about-pillars-grid"></div>
        </section>

    </main>

    <!-- Universal Footer Injection Target -->
    <div id="bose-footer-injector"></div>

    <!-- Core Engine Scripts (Handled by the Central System, About Page remains clean and compliant) -->
    <script src="js/supabase-client.js?v=2026_production_v39.0"></script>
    <script src="js/favorites-engine.js?v=2026_production_v37.0"></script>
    <script src="js/core-engine.js?v=2027_production_v49.0"></script>

    <!--
        🆕 [صفحة "من نحن" بقت ديناميكية]: كل النصوص والصور اللي هنا كانت
        قبل كده Hardcoded بالكامل - دلوقتي بتتقرا من عمود about بجدول
        store_settings (نفس مصدر باقي الصفحة الرئيسية)، وقابلة للتعديل من
        لوحة التحكم (صفحة "من نحن" الجديدة). القصة الحالية اتحطت كقيمة
        افتراضية في القاعدة نفسها، فالصفحة هتفضل زي ما هي بالظبط لحد ما
        العميلة تفتح لوحة التحكم وتعدّل أي جزء بنفسها.
    -->
    <script>
        (function () {
            function e(v) { return window.escapeBoseHTML ? window.escapeBoseHTML(v) : String(v == null ? "" : v); }

            function renderHero(about) {
                const badgeEl = document.getElementById("about-hero-badge");
                const highlightEl = document.getElementById("about-hero-highlight");
                const titleEl = document.getElementById("about-main-title");
                const subtitleEl = document.getElementById("about-hero-subtitle");

                if (about.heroBadge) badgeEl.textContent = about.heroBadge;
                if (about.heroTitleHighlight) highlightEl.textContent = about.heroTitleHighlight;
                if (about.heroTitlePrefix) {
                    titleEl.childNodes[0].textContent = about.heroTitlePrefix;
                }
                if (about.heroSubtitle) subtitleEl.textContent = about.heroSubtitle;
            }

            function renderStats(stats) {
                const strip = document.getElementById("about-stats-strip");
                const items = Array.isArray(stats) ? stats.filter((s) => s && (s.number || s.label)) : [];
                if (!items.length) { strip.hidden = true; strip.innerHTML = ""; return; }
                strip.innerHTML = items.map((s) => `
                    <div class="about-stat-card">
                        ${s.icon ? `<i class="fa-solid ${e(s.icon)}"></i>` : ""}
                        <span class="about-stat-number">${e(s.number || "")}</span>
                        <span class="about-stat-label">${e(s.label || "")}</span>
                    </div>`).join("");
                strip.hidden = false;
            }

            function renderStoryBlocks(blocks) {
                const container = document.getElementById("about-story-container");
                const items = Array.isArray(blocks) ? blocks : [];
                container.innerHTML = items.map((block) => {
                    const paragraphs = (Array.isArray(block.paragraphs) ? block.paragraphs : []).filter(Boolean);
                    const introHtml = block.intro ? `${e(block.intro)} ` : "";
                    const quoteHtml = block.quote ? `<div class="story-quote"><p>"${e(block.quote)}"</p></div>` : "";
                    const paragraphsHtml = paragraphs.map((p) => e(p)).join("<br><br>");
                    return `
                    <div class="story-block">
                        <div class="story-block-header">
                            ${block.icon ? `<i class="fa-solid ${e(block.icon)}"></i>` : ""}
                            <h2>${e(block.title || "")}</h2>
                        </div>
                        <div class="story-text-content bose-readmore-target">
                            ${introHtml}${quoteHtml}${paragraphsHtml}
                        </div>
                    </div>`;
                }).join("");

                // 📖✨ [قراءة المزيد لفقرات القصة]: نفس أداة "قراءة المزيد" الموحدة
                // المستخدمة في وصف المنتج (window.initBoseReadMore، راجع core-engine.js) -
                // لو فقرات أي بلوك طالت عن ارتفاع معقول بتتقص بصريًا مع زرار تبديل،
                // ولو قصيرة أصلاً مبيتلمسش خالص. النص نفسه من غير أي حذف أو تغيير.
                if (window.initBoseReadMore) {
                    container.querySelectorAll(".bose-readmore-target").forEach((el) => {
                        window.initBoseReadMore(el, 220);
                    });
                }
            }

            function renderGallery(gallery) {
                const section = document.getElementById("about-gallery-section");
                const grid = document.getElementById("about-gallery-grid");
                const items = Array.isArray(gallery) ? gallery.filter((g) => g && g.image) : [];
                if (!items.length) { section.hidden = true; grid.innerHTML = ""; return; }
                grid.innerHTML = items.map((g) => `
                    <figure class="about-gallery-item">
                        <img src="${e(g.image)}" alt="${e(g.caption || 'حلويات بوسي')}" loading="lazy">
                        ${g.caption ? `<figcaption>${e(g.caption)}</figcaption>` : ""}
                    </figure>`).join("");
                section.hidden = false;
            }

            function renderPillars(pillars) {
                const grid = document.getElementById("about-pillars-grid");
                const items = Array.isArray(pillars) ? pillars : [];
                grid.innerHTML = items.map((p) => `
                    <div class="pillar-card">
                        <div class="pillar-icon">${p.icon ? `<i class="fa-solid ${e(p.icon)}"></i>` : ""}</div>
                        <h3>${e(p.title || "")}</h3>
                        <p>${e(p.text || "")}</p>
                    </div>`).join("");
            }

            function renderAboutPage() {
                const about = (window.BoseStoreData && window.BoseStoreData.about) || {};
                if (Object.keys(about).length === 0) return; // لسه مفيش بيانات وصلت - سيبي القيم الافتراضية في الـ HTML
                renderHero(about);
                renderStats(about.stats);
                renderStoryBlocks(about.storyBlocks);
                renderGallery(about.gallery);
                renderPillars(about.pillars);
            }

            if (window.BoseStoreData) renderAboutPage();
            document.addEventListener("BoseDatabaseLoaded", renderAboutPage);
        })();
    </script>
</body>
</html>
