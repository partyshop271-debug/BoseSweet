<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- 👑 علامات الأرشفة وهندسة الـ SEO الفاخرة المعتمدة لبراند حلويات بوسي 👑 -->
    <title>إتمام الطلب الفاخر | حلويات بوسي</title>
    <meta name="description" content="أدخل بياناتك اللوجستية لمراجعة وتأكيد فاتورتك الملكية وتنسيق التوصيل الفوري لطلبك من فرع الكفاح لحلويات بوسي.">
    <meta name="robots" content="noindex, follow">
    
    <!-- الروابط الموحدة للتصميم لمنع تضخم الملفات وتأخر التحميل البصري -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cart-checkout.css">
    
    <style>
        /* 🎨 الهندسة البصرية المخصصة لصفحة التجهيز اللوجستي ومنع التكديس */
        .checkout-page-section {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 16px 80px 16px;
            box-sizing: border-box;
            direction: rtl;
        }

        .checkout-grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            align-items: start;
            margin-top: 20px;
        }

        @media (min-width: 992px) {
            .checkout-grid-layout {
                grid-template-columns: 1.2fr 1fr;
            }
        }

        .checkout-form-panel {
            background: var(--bose-white, #FFFFFF);
            border: var(--bose-border-pink, 1px solid rgba(255, 145, 164, 0.3));
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--bose-shadow-glow, 0 8px 32px rgba(255, 145, 164, 0.12));
        }

        .checkout-pane-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--bose-black, #111111);
            margin: 0 0 20px 0;
            border-bottom: 1px dashed rgba(255, 145, 164, 0.25);
            padding-bottom: 10px;
        }

        .form-inputs-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group-node {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: right;
        }

        .input-group-node label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--bose-black, #111111);
        }

        .bose-field-capture {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(17, 17, 17, 0.12);
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
            background: var(--bose-white, #FFFFFF);
            color: var(--bose-black, #111111);
            transition: 0.2s ease;
        }

        .bose-field-capture:focus {
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 0 8px rgba(255, 145, 164, 0.15);
        }

        /* تنسيق أزرار خيارات مسار الاستلام التفاعلية */
        .fulfillment-methods-flex {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .btn-fulfillment-node {
            flex: 1;
            min-width: 140px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(17, 17, 17, 0.1);
            background: var(--bose-white);
            color: var(--bose-black);
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-fulfillment-node.active {
            border-color: var(--bose-pink);
            background: rgba(255, 145, 164, 0.04);
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.08);
            color: var(--bose-pink);
        }

        /* مراجعة الفاتورة الجانبية الثابتة */
        .invoice-sticky-preview {
            position: sticky;
            top: 90px;
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--bose-shadow-glow);
        }

        .invoice-items-compact-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-left: 4px;
            scrollbar-width: none;
        }
        .invoice-items-compact-list::-webkit-scrollbar { display: none; }

        .invoice-item-compact-node {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--bose-black);
            border-bottom: 1px dashed rgba(17, 17, 17, 0.05);
            padding-bottom: 8px;
        }

        /* حظر حاسم لعصر وانضغاط لوجو الفوتر */
        .footer-logo-container img, 
        .bose-footer #bose-store-logo {
            height: 60px !important;
            width: auto !important;
            max-width: 100% !important;
            object-fit: contain !important;
            aspect-ratio: auto !important;
            display: block !important;
            margin: 0 auto !important;
        }
    </style>

    <!-- المحرك العام (يُستدعى أولاً في كل الصفحات لقراءة الـ JSON) -->
    <script src="js/core-engine.js"></script>
</head>
<body class="bose-hardware-accelerated">

    <!-- 🏢 مكون الهيدر الموحد والثابت (Shared Universal Header) 🏢 -->
    <header class="bose-navbar"></header>
    <div id="sidebar-drawer" class="bose-drawer-menu"></div>
    <div id="drawer-shield" class="drawer-overlay"></div>

    <!-- 🧱 المحتوى الرئيسي لصفحة التجهيز اللوجستي الفاخرة 🧱 -->
    <main class="checkout-page-section">
        <div class="cart-page-header">
            <h1 class="cart-page-title">إتمام الطلب</h1>
            <p class="cart-page-subtitle bose-arabic-text">من فضلك اكتب بياناتك اللوجستية بدقة ليقوم خبراء فرع الكفاح بتجهيز طلبك الفاخر في موعده القياسي المعتمد 🌸</p>
        </div>

        <div class="checkout-grid-layout">
            
            <!-- الجانب الأيمن: استمارة حصد البيانات الملتزمة بمعرفات المحرك المشترك بالمليم -->
            <div class="checkout-form-panel">
                <h3 class="checkout-pane-title"><i class="fas fa-truck-ramp-box" style="color:var(--bose-pink);"></i> البيانات اللوجستية وموعد الاستلام</h3>
                
                <form id="bose-checkout-fields-form" class="form-inputs-stack">
                    <div class="input-group-node">
                        <label for="checkout-customer-name">الاسم الكريم بالكامل</label>
                        <input type="text" id="checkout-customer-name" class="bose-field-capture" placeholder="اكتب اسمك الثلاثي لتوثيق الفاتورة الفاخرة..." required>
                    </div>

                    <div class="input-group-node">
                        <label for="checkout-customer-phone">رقم الهاتف الفعلي (الواتساب الأساسي)</label>
                        <input type="tel" id="checkout-customer-phone" class="bose-field-capture" placeholder="مثال: 01097238441..." required>
                    </div>

                    <div class="input-group-node">
                        <label for="checkout-customer-phone-2">رقم هاتف إضافي بديل (اختياري لسلامة الشحن)</label>
                        <input type="tel" id="checkout-customer-phone-2" class="bose-field-capture" placeholder="اكتب رقم موبايل إضافي إن وجد لحمايتك من مشاكل الشبكة...">
                    </div>

                    <div class="input-group-node">
                        <label>كيف ترغب في استلام الطلب؟</label>
                        <div class="fulfillment-methods-flex">
                            <button type="button" id="method-delivery" class="btn-fulfillment-node active">
                                <span><i class="fas fa-shipping-fast"></i> أرغب في التوصيل للمنزل</span>
                            </button>
                            <button type="button" id="method-pickup" class="btn-fulfillment-node">
                                <span><i class="fas fa-store"></i> سأستلم الطلب بنفسي من الفرع</span>
                            </button>
                        </div>
                    </div>

                    <!-- 🗺️ [فك الشلل]: وعاء المنطقة السكنية بالمعرف المعتمد تماماً في كود المحرك الحاكم ليعمل السحب آلياً -->
                    <div id="shipping-zone-wrapper" class="input-group-node">
                        <label for="checkout-zone-select">المنطقة السكنية للتوصيل</label>
                        <select id="checkout-zone-select" class="bose-field-capture" required>
                            <!-- يتم حقن فئات مناطق الشحن الـ 10 وأسعارها بالمسطرة بواسطة cart-engine.js عند القراءة -->
                        </select>
                    </div>

                    <div class="input-group-node">
                        <label for="checkout-address-details">العنوان الفعلي بالتفصيل</label>
                        <textarea id="checkout-address-details" class="bose-field-capture" placeholder="اكتب الشارع، رقم المنزل، أو علامة مميزة جمبك لراحة مندوب الشحن..." style="height: 80px; resize: none;" required></textarea>
                    </div>

                    <!-- ⏱️ حقول الجدولة والزمن الصارمة الملتزمة بحارس الـ 24 ساعة للتحضير والإتقان -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%;">
                        <div class="input-group-node">
                            <label for="checkout-delivery-date">تاريخ الاستلام المطلوب</label>
                            <input type="date" id="checkout-delivery-date" class="bose-field-capture" required>
                        </div>
                        <div class="input-group-node">
                            <label for="checkout-delivery-time">ساعة الاستلام التقريبية</label>
                            <input type="time" id="checkout-delivery-time" class="bose-field-capture" required>
                        </div>
                    </div>
                    
                    <p id="checkout-preparation-message" style="font-size: 0.8rem; color: var(--bose-pink); font-weight: 600; margin: 4px 0 0 0; line-height: 1.4; text-align: right;">
                        <!-- جاري جلب نص حارس الوقت من الـ JSON الشفاف لمنع التشتيت -->
                    </p>
                </form>
            </div>

            <!-- الجانب الأيسر: مراجعة وملخص الفاتورة المالية الثابتة الملتزمة بمعرفات الحساب الموحدة -->
            <div class="invoice-sticky-preview">
                <h3 class="checkout-pane-title"><i class="fas fa-receipt" style="color:var(--bose-pink);"></i> مراجعة بنود الفاتورة المالية</h3>
                
                <!-- وسم حقن الأصناف المدمج محلياً بالسلة الفائقة -->
                <div id="bose-invoice-compact-items-list" class="invoice-items-compact-list">
                    <!-- يتم استدعاء الكروت الفرعية محلياً هنا تلقائياً -->
                </div>

                <!-- 🎫 حقل وتطبييق نظام كوبونات الخصم والربط المالي الآمن -->
                <div class="coupon-form-container">
                    <input type="text" id="checkout-coupon-input" class="coupon-input-field" placeholder="اكتب كود الخصم الفاخر هنا...">
                    <button type="button" id="btn-submit-coupon" class="coupon-apply-trigger">تطبيق</button>
                </div>
                <div id="coupon-status-text" class="coupon-status-toast"></div>

                <!-- جدول تفاصيل الحسابات المالية الملتزم بالمعرفات الحاكمة تماماً لمنع أي تفاوت حسابي -->
                <div class="summary-pricing-table" style="margin: 0; padding: 0; border: none;">
                    <div class="pricing-row-node">
                        <span class="pricing-label-text">صافي قيمة الأصناف:</span>
                        <span id="summary-subtotal" class="pricing-value-text">0 EGP</span>
                    </div>
                    <div class="pricing-row-node">
                        <span class="pricing-label-text">الخصم المطبق (الكوبون):</span>
                        <span id="summary-discount" class="pricing-value-text" style="color:var(--bose-success-text); font-weight:700;">0 EGP</span>
                    </div>
                    <div class="pricing-row-node">
                        <span class="pricing-label-text">رسوم ومصاريف التوصيل:</span>
                        <span id="summary-shipping-fee" class="pricing-value-text">0 EGP</span>
                    </div>
                    
                    <div class="summary-grand-total-row">
                        <span class="grand-total-label">الإجمالي المالي النهائي:</span>
                        <span id="summary-grand-total" class="total-value-display">0 EGP</span>
                    </div>
                </div>

                <!-- زر الإجراء الحاسم والمعتمد بالمعرف الصريح لفك الشلل وبدء صياغة رسالة الواتساب وتطهير الذاكرة -->
                <button type="button" id="btn-submit-order-final" class="bose-primary-checkout-btn">
                    <i class="fas fa-lock"></i> حجز وتأكيد الفاتورة الملكية
                </button>
            </div>
        </div>
    </main>

    <!-- 🏪 مكون الفوتر الموحد والثابت الفاتح الصريح (Shared Universal Footer) -->
    <footer class="bose-footer"></footer>

    <!-- ⚡ استدعاء محرك السلة المشترك والذكي الحاكم لكافة العمليات اللوجستية محلياً وسحابياً (js/cart-engine.js) ⚡ -->
    <script src="js/cart-engine.js"></script>

    <!-- سكريبت التعبئة الاحتياطية للأصناف داخل المراجعة كصمام أمان إضافي -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const compactContainer = document.getElementById("bose-invoice-compact-items-list");
            if (!compactContainer) return;

            const rawCart = localStorage.getItem("bose_cart");
            const cart = rawCart ? JSON.parse(rawCart) : [];

            if (cart.length > 0) {
                compactContainer.innerHTML = cart.map(item => `
                    <div class="invoice-item-compact-node">
                        <span><strong>${window.escapeHTML ? window.escapeHTML(item.title) : item.title}</strong> <span style="opacity:0.6;">(×${item.quantity})</span><span style="display:block; font-size:0.75rem; color:var(--bose-pink); font-weight:700;">${item.flavorName || 'كلاسيك'}</span></span>
                        <span style="font-weight:700; color:var(--bose-pink);">${item.finalPrice * item.quantity} EGP</span>
                    </div>
                `).join("");
            }
        });
    </script>
</body>
</html>
