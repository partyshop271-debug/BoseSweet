<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب | حلويات بوسي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* تنسيقات خاصة بصفحة إتمام الطلب - معتمدة بالهوية البصرية الرسمية */
        .checkout-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface-light, #ffffff);
            border-radius: var(--border-radius-card, 16px);
            border: 1px solid rgba(255, 145, 164, 0.2);
            padding: 40px;
            box-shadow: var(--shadow-soft, 0 4px 20px rgba(0,0,0,0.05));
        }

        .form-section {
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(255, 145, 164, 0.1);
        }

        .form-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            color: var(--primary-pink, #ff91a4);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-main, #333333);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid rgba(255, 145, 164, 0.2);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main, #333333);
            background: var(--bg-white, #ffffff);
            transition: var(--transition-smooth, all 0.3s ease);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-pink, #ff91a4);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.1);
        }

        .delivery-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* تصميم أزرار اختيار طريقة الاستلام */
        .delivery-card {
            border: 2px solid rgba(255, 145, 164, 0.2);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition-smooth, all 0.3s ease);
            background: var(--bg-white, #ffffff);
            position: relative;
        }

        .delivery-card input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .delivery-card.selected {
            border-color: var(--primary-pink, #ff91a4);
            background: rgba(255, 145, 164, 0.05);
        }

        .delivery-card i {
            width: 32px;
            height: 32px;
            color: var(--text-muted, #888888);
            margin-bottom: 10px;
            transition: var(--transition-smooth, all 0.3s ease);
        }

        .delivery-card.selected i {
            color: var(--primary-pink, #ff91a4);
        }

        .delivery-card-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main, #333333);
        }

        .branch-info {
            background: rgba(255, 145, 164, 0.05);
            border: 1px dashed var(--primary-pink, #ff91a4);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none; /* تظهر فقط عند اختيار الاستلام من الفرع */
        }

        .whatsapp-btn {
            background-color: #25D366; /* لون واتساب الرسمي */
            border-color: #25D366;
            width: 100%;
            padding: 18px;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            color: #fff;
            border-radius: 12px;
            border: 1px solid #25D366;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 700;
        }

        .whatsapp-btn:hover:not(:disabled) {
            background-color: var(--bg-white, #ffffff);
            color: #25D366;
            border-color: #25D366;
        }

        .whatsapp-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background-color: #ccc;
            border-color: #ccc;
        }

        .map-container {
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 145, 164, 0.2);
            height: 200px;
        }

        @media (max-width: 600px) {
            .delivery-options { grid-template-columns: 1fr; }
            .checkout-container { padding: 20px; }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-icon" onclick="window.history.back()"><i data-lucide="arrow-right"></i></button>
            <h2 style="margin: 0; color: var(--primary-pink, #ff91a4); font-size: 1.6rem; text-align: center;">إتمام الطلب</h2>
            <div style="width: 44px;"></div>
        </div>
    </header>

    <main class="container mt-section mb-section">
        
        <div class="checkout-container">
            <form id="checkout-form">
                
                <div class="form-section">
                    <h3 class="section-title"><i data-lucide="truck"></i> طريقة الاستلام</h3>
                    <div class="delivery-options">
                        <label class="delivery-card selected" id="card-delivery" onclick="window.toggleDeliveryMode('delivery')">
                            <input type="radio" name="deliveryMode" value="delivery" checked>
                            <i data-lucide="map-pin"></i>
                            <div class="delivery-card-title">توصيل للمنزل</div>
                        </label>
                        <label class="delivery-card" id="card-pickup" onclick="window.toggleDeliveryMode('pickup')">
                            <input type="radio" name="deliveryMode" value="pickup">
                            <i data-lucide="store"></i>
                            <div class="delivery-card-title">استلام من الفرع</div>
                        </label>
                    </div>

                    <div class="branch-info" id="branch-details">
                        <h4 style="color: var(--primary-pink, #ff91a4); margin-bottom: 10px;">عنوان الفرع:</h4>
                        <p style="font-weight: 700; color: var(--text-main, #333333); margin-bottom: 5px;">الكفاح، شارع الوحدة المحلية</p>
                        <p style="font-size: 0.95rem; color: var(--text-muted, #888888);">بجوار صيدلية د. أحمد مجدي وعيادة د. علي</p>
                        <div class="map-container">
                            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d113645.123!2d27.9!3d27.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjfCsDAwJzAwLjAiTiAyN8KwNTQnMDAuMCJF!5e0!3m2!1sen!2seg!4v1715000000000!5m2!1sen!2seg" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title"><i data-lucide="user"></i> البيانات الشخصية</h3>
                    <div class="form-group">
                        <label class="form-label">الاسم الثلاثي لحضرتك <span style="color:red;">*</span></label>
                        <input type="text" id="customer-name" class="form-input" placeholder="اكتب الاسم هنا" required>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">رقم الواتساب الخاص بحضرتك <span style="color:red;">*</span></label>
                            <input type="tel" id="whatsapp-phone" class="form-input" dir="ltr" placeholder="01xxxxxxxxx" required>
                        </div>
                        <div class="form-group" id="alt-phone-group">
                            <label class="form-label">رقم هاتف بديل للتواصل مع حضرتك <span style="color:red;">*</span></label>
                            <input type="tel" id="alt-phone" class="form-input" dir="ltr" placeholder="01xxxxxxxxx" required>
                        </div>
                    </div>
                </div>

                <div class="form-section" id="address-section">
                    <h3 class="section-title"><i data-lucide="map"></i> عنوان التوصيل</h3>
                    <div class="form-group">
                        <label class="form-label">المنطقة <span style="color:red;">*</span></label>
                        <select class="form-select" id="delivery-zone">
                            <option value="" disabled selected>اختر المنطقة المحددة...</option>
                            <option value="الكفاح" data-fee="10">قرية الكفاح (10 ج.م)</option>
                            <option value="مدينة الفرافرة" data-fee="25">مدينة الفرافرة (25 ج.م)</option>
                            <option value="القرى المجاورة للكفاح" data-fee="20">القرى المجاورة للكفاح (20 ج.م)</option>
                            <option value="أبو منقار" data-fee="45">أبو منقار (45 ج.م)</option>
                            <option value="النهضة" data-fee="30">قرية النهضة (30 ج.م)</option>
                            <option value="أبو هريرة" data-fee="25">قرية أبو هريرة (25 ج.م)</option>
                            <option value="عثمان بن عفان" data-fee="30">قرية عثمان بن عفان (30 ج.م)</option>
                            <option value="أخرى" data-fee="50">مناطق أخرى (يتم تحديد التكلفة لاحقاً)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">العنوان التفصيلي <span style="color:red;">*</span></label>
                        <textarea id="detailed-address" class="form-textarea" rows="2" placeholder="الشارع، رقم المنزل..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">أقرب معلم واضح لحضرتك <span style="color:red;">*</span></label>
                        <input type="text" id="nearest-landmark" class="form-input" placeholder="مسجد، مدرسة، صيدلية، محل تجاري معروف..." required>
                    </div>
                </div>

                <div class="form-section">
                    <h3 class="section-title"><i data-lucide="calendar-clock"></i> موعد التسليم</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                        <div class="form-group">
                            <label class="form-label">تاريخ التسليم المناسب لحضرتك <span style="color:red;">*</span></label>
                            <input type="date" id="order-date" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">الوقت المناسب لحضرتك <span style="color:red;">*</span></label>
                            <input type="time" id="order-time" class="form-input" required>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 50px;">
                    <p style="text-align: center; color: var(--text-muted, #888888); font-size: 0.9rem; margin-bottom: 15px;">
                        بالضغط على تأكيد، سيتم توثيق الطلب وتحويل حضرتك لواتساب لتأكيد الطلب.
                    </p>
                    <button type="submit" class="whatsapp-btn" id="submit-order-btn">
                        تأكيد وإرسال الطلب عبر واتساب <i data-lucide="send"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="main-footer" style="margin-top: 0;">
        <div class="container" style="text-align: center; border-top: none; padding-top: 0;">
            <p style="font-size: 0.85rem; color: #888;">نضمن لكم خصوصية بياناتكم وأعلى درجات الجودة.</p>
        </div>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="core-engine.js"></script>
    <script type="module" src="data-bridge.js"></script>
    <script type="module" src="cart-system.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            // تعيين التاريخ الأدنى للطلب إلى اليوم لتنظيم المواعيد
            const dateInput = document.getElementById('order-date');
            if (dateInput) {
                const today = new Date().toISOString().split('T')[0];
                dateInput.setAttribute('min', today);
            }
        });

        // توسيع وتطوير دالة التبديل لتشمل كافة متطلبات التحقق الجديدة
        window.toggleDeliveryMode = function(mode) {
            const cardDelivery = document.getElementById('card-delivery');
            const cardPickup = document.getElementById('card-pickup');
            const addressSection = document.getElementById('address-section');
            const branchDetails = document.getElementById('branch-details');
            const altPhoneGroup = document.getElementById('alt-phone-group');
            const altPhoneInput = document.getElementById('alt-phone');
            const zoneSelect = document.getElementById('delivery-zone');
            const addressInput = document.getElementById('detailed-address');
            const landmarkInput = document.getElementById('nearest-landmark');

            if (mode === 'delivery') {
                cardDelivery.classList.add('selected');
                cardPickup.classList.remove('selected');
                addressSection.style.display = 'block';
                branchDetails.style.display = 'none';
                altPhoneGroup.style.display = 'block';
                altPhoneInput.setAttribute('required', 'true');
                zoneSelect.setAttribute('required', 'true');
                addressInput.setAttribute('required', 'true');
                if(landmarkInput) landmarkInput.setAttribute('required', 'true');
            } else {
                cardPickup.classList.add('selected');
                cardDelivery.classList.remove('selected');
                addressSection.style.display = 'none';
                branchDetails.style.display = 'block';
                altPhoneGroup.style.display = 'none';
                altPhoneInput.removeAttribute('required');
                zoneSelect.removeAttribute('required');
                addressInput.removeAttribute('required');
                if(landmarkInput) landmarkInput.removeAttribute('required');
            }
            
            // تحديث الإجماليات لحظياً في حال وجود محرك السلة
            if (typeof window.calculateOrderTotal === 'function') {
                window.calculateOrderTotal();
            }
        };

        // هندسة متقدمة لوظيفة تأكيد الطلب والتوجيه اللحظي والحفظ السحابي السيادي
        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // التحقق من تفعيل معالجة الطلبات المركزية داخل cart-system
            if (typeof window.handleCheckoutSubmit === 'function' && e.isTrusted) {
                 return;
            }

            const submitBtn = document.getElementById('submit-order-btn');
            const originalBtnText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i data-lucide="loader" class="spin-animation"></i> جاري تأمين الطلب وتوثيقه سحابياً...';
            submitBtn.disabled = true;
            if (typeof lucide !== 'undefined') lucide.createIcons();

            try {
                if (window.catalogReady) {
                    await window.catalogReady;
                }

                let rawCart = JSON.parse(localStorage.getItem('BoseSweets_Cart')) || JSON.parse(localStorage.getItem('bose_cart_items')) || [];
                if (rawCart.length === 0) {
                    alert("نعتذر، يبدو أن حقيبة المشتريات فارغة. يرجى مراجعة القائمة.");
                    window.location.href = 'menu.html';
                    return;
                }

                const deliveryMode = document.querySelector('input[name="deliveryMode"]:checked').value;
                const customerName = document.getElementById('customer-name').value.trim();
                const whatsappPhone = document.getElementById('whatsapp-phone').value.trim();
                const orderDate = document.getElementById('order-date').value;
                const orderTime = document.getElementById('order-time').value;
                
                let zone = '';
                let address = '';
                let landmark = '';
                let altPhone = '';
                let shippingFee = 0;

                if (deliveryMode === 'delivery') {
                    const zoneSelect = document.getElementById('delivery-zone');
                    if (!zoneSelect.value) {
                        alert("عذراً، يرجى تحديد المنطقة لاحتساب رسوم التوصيل بشكل صحيح.");
                        submitBtn.innerHTML = originalBtnText;
                        submitBtn.disabled = false;
                        return;
                    }
                    zone = zoneSelect.options[zoneSelect.selectedIndex].text;
                    shippingFee = parseFloat(zoneSelect.options[zoneSelect.selectedIndex].dataset.fee) || 0;
                    address = document.getElementById('detailed-address').value.trim();
                    landmark = document.getElementById('nearest-landmark').value.trim();
                    altPhone = document.getElementById('alt-phone').value.trim();
                }

                let subtotal = 0;
                let itemsListText = '';
                let secureItemsData = [];
                const liveCatalog = window.catalog || [];

                // مطابقة الأسعار واستخراج تفاصيل باني التورتة إن وجدت
                rawCart.forEach((item, index) => {
                    const dbProduct = liveCatalog.find(p => String(p.id) === String(item.id));
                    const securePrice = dbProduct ? parseFloat(dbProduct.price) : parseFloat(item.price);
                    const productName = dbProduct ? dbProduct.name : item.name;
                    const itemTotal = securePrice * item.quantity;
                    subtotal += itemTotal;

                    itemsListText += `${index + 1}. ${productName} [${item.size || 'أساسي'}]\n   العدد: ${item.quantity} | القيمة: ${itemTotal} ج.م\n`;
                    
                    // تضمين تفاصيل باني التورتة أو الملاحظات الإضافية
                    if (item.theme) itemsListText += `   المناسبة/الثيم: ${item.theme}\n`;
                    if (item.allergyNotes) itemsListText += `   ملاحظات صحية: ${item.allergyNotes}\n`;
                    if (item.cakeText) itemsListText += `   النص المطلوب: ${item.cakeText}\n`;
                    if (item.printOption) itemsListText += `   خيارات الطباعة: ${item.printOption}\n`;

                    secureItemsData.push({
                        id: item.id,
                        name: productName,
                        price: securePrice,
                        quantity: item.quantity,
                        size: item.size || 'أساسي',
                        theme: item.theme || '',
                        allergyNotes: item.allergyNotes || '',
                        cakeText: item.cakeText || '',
                        printOption: item.printOption || '',
                        total: itemTotal
                    });
                });

                const finalTotal = subtotal + shippingFee;
                const generatedOrderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000) + '-' + Date.now().toString().slice(-4);

                const cloudOrderData = {
                    orderId: generatedOrderId,
                    timestamp: new Date().toISOString(),
                    customerInfo: { name: customerName, whatsapp: whatsappPhone, altPhone: altPhone },
                    deliveryDetails: { mode: deliveryMode, zone: zone, address: address, landmark: landmark, date: orderDate, time: orderTime },
                    financials: { subtotal: subtotal, shippingFee: shippingFee, finalTotal: finalTotal },
                    items: secureItemsData,
                    status: 'جديد'
                };

                // إرسال نبضة للسحابة لحفظ الطلب عبر جسر البيانات
                window.dispatchEvent(new CustomEvent('secureOrderBackup', { detail: cloudOrderData }));
                
                // صياغة رسالة مهنية ودقيقة
                let msg = `👑 طلب حجز جديد - حلويات بوسي 👑\n\n`;
                msg += `رقم المرجع: ${generatedOrderId}\n\n`;
                msg += `👤 بيانات العميل:\nالاسم: ${customerName}\nرقم الاتصال: ${whatsappPhone}\n\n`;
                
                if (deliveryMode === 'delivery') {
                    msg += `📍 نوع الطلب: توصيل للمنزل\n`;
                    msg += `المنطقة: ${zone}\n`;
                    msg += `العنوان: ${address}\n`;
                    msg += `أقرب معلم واضح: ${landmark}\n`;
                    if(altPhone) msg += `رقم هاتف بديل: ${altPhone}\n\n`;
                } else {
                    msg += `🏬 نوع الطلب: استلام من مقر البراند\nالموقع: الكفاح، شارع الوحدة المحلية\n\n`;
                }
                
                msg += `🕒 الموعد المطلوب:\nالتاريخ: ${orderDate}\nالوقت: ${orderTime}\n\n`;
                msg += `🛍️ تفاصيل المشتريات:\n${itemsListText}\n`;
                msg += `💰 الإجماليات:\n`;
                msg += `- المنتجات: ${subtotal} ج.م\n`;
                if (deliveryMode === 'delivery') {
                    msg += `- مصاريف الشحن: ${shippingFee} ج.م\n`;
                }
                msg += `🔹 الإجمالي المستحق: ${finalTotal} ج.م\n\n`;
                msg += `بانتظار التأكيد لإنهاء التجهيزات.`;

                // تنظيف السلة محلياً بعد التأمين
                localStorage.removeItem('BoseSweets_Cart');
                localStorage.removeItem('bose_cart_items');
                if (typeof window.updateCartBadge === 'function') window.updateCartBadge();
                window.dispatchEvent(new Event('cartUpdated'));

                // التوجيه النهائي
                const encodedMsg = encodeURIComponent(msg);
                const adminPhone = window.adminWhatsAppNumber || "201097238441";
                window.location.href = `https://wa.me/${adminPhone}?text=${encodedMsg}`;

            } catch (error) {
                console.error("عطل تقني أثناء توثيق مسار الطلب:", error);
                alert("تم رصد تذبذب في الاتصال. يرجى المحاولة مرة أخرى لضمان دقة توثيق الطلب.");
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });
    </script>
</body>
</html>
