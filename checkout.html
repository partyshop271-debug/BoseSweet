<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتمام الطلب - حلويات بوسي</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <button id="sidebar-toggle">☰</button>
        <div id="brand">حلويات بوسي</div>
        <input id="header-search" type="text" placeholder="ابحث عن منتج">
        <a href="./cart.html" id="header-cart">🛒 <span id="header-cart-count">0</span></a>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <button id="sidebar-close">×</button>
        <nav>
            <ul>
                <li><a href="./index.html">الرئيسية</a></li>
                <li><a href="./menu.html">المنيو</a></li>
                <li><a href="./cart.html">السلة</a></li>
            </ul>
        </nav>
    </aside>
    <div id="sidebar-overlay"></div>

    <!-- PAGE HERO -->
    <section class="page-hero">
        <h1>إتمام الطلب</h1>
        <p>املأ البيانات المطلوبة بعناية لاستكمال الطلب.</p>
    </section>

    <!-- CHECKOUT FORM -->
    <main>
        <section class="checkout-section">
            <form id="checkout-form">
                <div class="form-group">
                    <label for="customer-name">الاسم الكامل:</label>
                    <input type="text" id="customer-name" required>
                </div>

                <div class="form-group">
                    <label for="customer-phone">رقم الهاتف:</label>
                    <input type="tel" id="customer-phone" placeholder="010XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label>طريقة الاستلام:</label>
                    <select id="delivery-method">
                        <option value="pickup">استلام بنفسه</option>
                        <option value="shipping">شحن</option>
                    </select>
                </div>

                <div class="form-group" id="shipping-options" style="display:none;">
                    <label for="shipping-region">المنطقة:</label>
                    <select id="shipping-region">
                        <option value="farafra">الفرافرة - 50 ج</option>
                        <option value="13">13 - 70 ج</option>
                        <option value="gamaa">الجمعية - 50 ج</option>
                        <option value="snaa">الصنايع - 40 ج</option>
                        <option value="abubakr">ابوبكر - 40 ج</option>
                        <option value="abouhol">ابوالهول - 30 ج</option>
                        <option value="alkefah">الكفاح - 30 ج</option>
                        <option value="alamel">الأمل - 50 ج</option>
                        <option value="17">17 - 70 ج</option>
                        <option value="abuhuraira">ابوهريرة - 140 ج</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="delivery-date">اليوم:</label>
                    <input type="date" id="delivery-date" required>
                </div>

                <div class="form-group">
                    <label for="delivery-time">الساعة:</label>
                    <input type="time" id="delivery-time" required>
                </div>

                <div class="form-summary">
                    <p>إجمالي الطلب: <span id="checkout-total">0 ج.م</span></p>
                </div>

                <button type="submit" id="submit-order">إرسال الطلب</button>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="#">من نحن</a>
            <a href="#">سياسة الخصوصية</a>
            <a href="#">سياسة الاسترجاع</a>
            <a href="#">تواصل معنا</a>
        </div>
        <div class="footer-social">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script type="module" src="./contracts.js"></script>
    <script type="module" src="./data-service.js"></script>
    <script type="module" src="./cart-service.js"></script>
    <script type="module" src="./ui-engine.js"></script>
    <script type="module" src="./checkout-page.js"></script>

</body>
</html>
