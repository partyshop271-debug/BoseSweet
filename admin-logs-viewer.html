<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز القيادة الرقمي | حلويات بوسي</title>
    <!-- استدعاء الخطوط المهنية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-primary: #ff91a4;
            --brand-soft: #fff5f6;
            --brand-dark: #1a1a1a;
            --bg-master: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-master);
            color: var(--brand-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .scroll-area {
            scrollbar-width: thin;
            scrollbar-color: var(--brand-primary) transparent;
            overflow-y: auto;
            flex: 1;
            padding-bottom: 80px;
        }

        .log-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 4px solid transparent;
        }
        .log-card:hover {
            background-color: var(--brand-soft);
            border-right-color: var(--brand-primary);
            transform: scale(1.01);
        }

        .tab-btn {
            position: relative;
            transition: all 0.2s ease;
            opacity: 0.4;
        }
        .tab-btn.active {
            opacity: 1;
            color: var(--brand-primary);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--brand-primary);
            border-radius: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="antialiased">

    <!-- 👑 الهيدر الإداري -->
    <header class="p-5 md:p-7 flex justify-between items-center border-b border-gray-100 bg-white shadow-sm z-50">
        <div class="flex items-center gap-4">
            <div class="w-11 h-11 bg-[var(--brand-primary)] rounded-xl flex items-center justify-center shadow-lg shadow-[var(--brand-primary)]/20">
                <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-lg md:text-2xl font-black">مركز القيادة <span class="text-[var(--brand-primary)]">الرقمي</span></h1>
                <p class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">BoseSweets Digital Command Hub</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="clearSystemLogs()" class="p-2.5 rounded-lg bg-gray-50 text-gray-400 hover:text-red-500 transition-all">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
            <button onclick="location.reload()" class="bg-[var(--brand-primary)] text-white px-5 py-2 rounded-xl font-bold text-xs flex items-center gap-2 hover:brightness-105 active:scale-95 transition-all">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> تحديث
            </button>
        </div>
    </header>

    <!-- 📊 لوحة المؤشرات اللحظية -->
    <div class="px-5 md:px-8 py-4 bg-gray-50/30 flex gap-4 overflow-x-auto border-b border-gray-50 no-scrollbar">
        <div class="min-w-[140px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-500 flex items-center justify-center"><i data-lucide="database" class="w-4 h-4"></i></div>
            <div>
                <span class="block text-[9px] font-bold opacity-40">السجلات</span>
                <span id="stat-total" class="text-base font-black">--</span>
            </div>
        </div>
        <div class="min-w-[140px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-red-50 text-red-500 flex items-center justify-center"><i data-lucide="alert-triangle" class="w-4 h-4"></i></div>
            <div>
                <span class="block text-[9px] font-bold opacity-40">أعطال</span>
                <span id="stat-errors" class="text-base font-black text-red-500">--</span>
            </div>
        </div>
        <div class="min-w-[140px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-3">
            <div id="status-icon" class="w-8 h-8 rounded-lg bg-gray-50 text-gray-400 flex items-center justify-center">
                <i data-lucide="cloud-lightning" class="w-4 h-4"></i>
            </div>
            <div>
                <span class="block text-[9px] font-bold opacity-40">الحالة</span>
                <span id="connection-status" class="text-[10px] font-black uppercase">جاري الفحص</span>
            </div>
        </div>
    </div>

    <!-- 🔍 أدوات الرصد -->
    <div class="p-5 md:px-8 bg-white flex flex-col md:flex-row gap-4 items-center border-b border-gray-50">
        <div class="relative w-full md:w-1/2 lg:w-1/3">
            <i data-lucide="search" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-300 w-4 h-4"></i>
            <input type="text" id="log-search" oninput="renderLogs()" placeholder="بحث في السجلات الرقمية..." class="w-full bg-gray-50 border border-transparent focus:border-[var(--brand-primary)] rounded-xl py-2.5 pr-10 pl-4 text-xs font-bold outline-none transition-all">
        </div>
        <nav class="flex gap-5 overflow-x-auto w-full md:w-auto py-2">
            <button onclick="setFilter('all')" id="filter-all" class="tab-btn active text-[11px] font-black whitespace-nowrap">كافة الأحداث</button>
            <button onclick="setFilter('error')" id="filter-error" class="tab-btn text-[11px] font-black whitespace-nowrap text-red-500">الأعطال الحرجة</button>
            <button onclick="setFilter('sync')" id="filter-sync" class="tab-btn text-[11px] font-black whitespace-nowrap">المزامنة السحابية</button>
        </nav>
    </div>

    <!-- 📜 ساحة العرض الرئيسية -->
    <main class="scroll-area px-5 md:px-8 pt-6">
        <div id="logs-container" class="space-y-3 max-w-4xl mx-auto">
            <!-- حالة التحميل الافتراضية -->
            <div id="loading-state" class="py-24 text-center">
                <div class="inline-block w-10 h-10 border-2 border-[var(--brand-primary)] border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-xs font-black opacity-40">يتم الآن إجراء اتصال آمن بقاعدة بيانات حلويات بوسي...</p>
                <p id="diagnostic-msg" class="text-[9px] text-gray-400 mt-2 italic"></p>
            </div>
        </div>
    </main>

    <!-- 🛠️ شريط المعلومات -->
    <footer class="bg-white border-t border-gray-50 p-3.5 px-6 flex justify-between items-center shadow-inner">
        <div class="flex items-center gap-2">
            <div id="pulse-indicator" class="w-2 h-2 bg-gray-300 rounded-full"></div>
            <span id="footer-text" class="text-[10px] font-bold opacity-30 uppercase tracking-widest">انتظار البيانات</span>
        </div>
        <p class="text-[9px] font-bold opacity-20 uppercase">Sovereign Engine v2.8.5</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, onSnapshot, doc, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 🛡️ تهيئة الهوية الرقمية
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allLogs = [];
        let currentFilter = 'all';
        let user = null;

        // 🛡️ محرك الربط والتحكم (Rule 3)
        const initSystem = async () => {
            const diag = document.getElementById('diagnostic-msg');
            diag.innerText = "جاري التحقق من الهوية...";
            
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
                diag.innerText = "فشل في تسجيل الدخول. يرجى مراجعة الصلاحيات.";
                showErrorInUI("خطأ في المصادقة: " + error.code);
            }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            if (user) {
                document.getElementById('diagnostic-msg').innerText = "تمت المصادقة. جاري جلب السجلات...";
                startMonitoring();
                updateUIConnected();
            }
        });

        // 🛡️ بدء عملية الرصد اللحظي
        function startMonitoring() {
            if (!user) return;

            // مسار سيادي موحد (Rule 1)
            const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'system_logs');
            const q = query(logsRef, orderBy('timestamp', 'desc'), limit(50));

            const unsubscribe = onSnapshot(q, (snapshot) => {
                allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('loading-state').style.display = 'none';
                renderLogs();
            }, (error) => {
                console.error("Firestore Error:", error);
                showErrorInUI("عطل في الاتصال بقاعدة البيانات: " + error.code);
            });

            // مراقب السكون (إذا لم تأتِ بيانات)
            setTimeout(() => {
                if (allLogs.length === 0 && document.getElementById('loading-state').style.display !== 'none') {
                    document.getElementById('diagnostic-msg').innerText = "المنظومة متصلة ولكن السجل فارغ حالياً.";
                }
            }, 8000);
        }

        window.renderLogs = () => {
            const container = document.getElementById('logs-container');
            const searchVal = document.getElementById('log-search').value.toLowerCase();
            
            let filtered = allLogs;

            // 1. الفلترة النوعية
            if (currentFilter === 'error') filtered = allLogs.filter(l => l.type === 'error' || l.severity === 'critical');
            if (currentFilter === 'sync') filtered = allLogs.filter(l => (l.functionName && l.functionName.toLowerCase().includes('sync')) || l.source === 'sw.js');

            // 2. محرك البحث
            if (searchVal) {
                filtered = filtered.filter(l => 
                    (l.errorMessage && l.errorMessage.toLowerCase().includes(searchVal)) ||
                    (l.fileName && l.fileName.toLowerCase().includes(searchVal)) ||
                    (l.functionName && l.functionName.toLowerCase().includes(searchVal))
                );
            }

            if (filtered.length === 0 && allLogs.length > 0) {
                container.innerHTML = `<div class="py-32 text-center opacity-30 text-xs font-black italic">لا يوجد نتائج تطابق المعايير الحالية.</div>`;
                return;
            } else if (allLogs.length === 0) {
                container.innerHTML = `<div class="py-32 text-center opacity-30 text-xs font-black italic">السجل نظيف تماماً، لا توجد أحداث مسجلة.</div>`;
            } else {
                container.innerHTML = filtered.map((log, index) => {
                    const isError = log.type === 'error' || log.severity === 'critical';
                    const time = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}) : '--:--';
                    const date = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleDateString('ar-EG') : '';

                    return `
                        <div class="log-card animate-card bg-white p-5 rounded-2xl border border-gray-50 flex flex-col md:flex-row md:items-center gap-5 shadow-sm" style="animation-delay: ${index * 0.03}s">
                            <div class="flex items-center gap-4 flex-1">
                                <div class="w-10 h-10 shrink-0 rounded-xl flex items-center justify-center ${isError ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'}">
                                    <i data-lucide="${isError ? 'shield-alert' : 'activity'}" class="w-5 h-5"></i>
                                </div>
                                <div class="min-w-0">
                                    <h4 class="text-[13px] font-black text-gray-800 leading-snug truncate" title="${log.errorMessage || ''}">${log.errorMessage || 'نشاط اعتيادي للنظام'}</h4>
                                    <div class="flex flex-wrap gap-2 mt-2">
                                        <span class="text-[8px] font-black px-2 py-0.5 rounded bg-gray-100 text-gray-400 uppercase">موقع: ${log.fileName || 'Root'}</span>
                                        <span class="text-[8px] font-black px-2 py-0.5 rounded bg-gray-100 text-gray-400 uppercase">إجراء: ${log.functionName || 'Global'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex md:flex-col items-center md:items-end justify-between md:border-r border-gray-100 md:pr-5 shrink-0">
                                <div class="text-right">
                                    <span class="block text-[10px] font-black text-gray-300">${date}</span>
                                    <span class="block text-xs font-black text-gray-500">${time}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            document.getElementById('stat-total').innerText = allLogs.length;
            document.getElementById('stat-errors').innerText = allLogs.filter(l => l.type === 'error').length;
            lucide.createIcons();
        };

        window.setFilter = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            renderLogs();
        };

        function updateUIConnected() {
            document.getElementById('connection-status').innerText = "متصل بالرصد اللحظي";
            document.getElementById('connection-status').classList.add('text-green-500');
            document.getElementById('status-icon').className = "w-8 h-8 rounded-lg bg-green-50 text-green-500 flex items-center justify-center";
            document.getElementById('pulse-indicator').className = "w-2 h-2 bg-green-500 rounded-full animate-pulse";
            document.getElementById('footer-text').innerText = "البث السيادي مفعل";
            lucide.createIcons();
        }

        function showErrorInUI(msg) {
            document.getElementById('logs-container').innerHTML = `
                <div class="bg-red-50 p-8 rounded-3xl text-center border border-red-100">
                    <i data-lucide="wifi-off" class="w-12 h-12 text-red-300 mx-auto mb-4"></i>
                    <h3 class="text-red-500 font-black text-sm">انقطاع في الرصد الرقمي</h3>
                    <p class="text-[10px] font-bold text-red-400 mt-2">${msg}</p>
                    <button onclick="location.reload()" class="mt-6 text-[10px] font-black bg-red-500 text-white px-6 py-2 rounded-lg">إعادة المحاولة</button>
                </div>
            `;
            lucide.createIcons();
        }

        window.clearSystemLogs = async () => {
            if (!confirm("هل حضرتك متأكدة من تطهير كافة السجلات؟ هذا الإجراء نهائي ولا يمكن التراجع عنه.")) return;
            try {
                const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'system_logs');
                const snapshot = await getDocs(logsRef);
                const batch = writeBatch(db);
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("تم تطهير السجل الرقمي بنجاح ✅");
            } catch (e) {
                alert("حدث خطأ أثناء التطهير، قد يكون بسبب الصلاحيات.");
            }
        };

        initSystem();
    </script>
</body>
</html>
