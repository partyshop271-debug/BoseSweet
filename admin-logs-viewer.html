<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مركز القيادة الرقمي | حلويات بوسي</title>
    <!-- استدعاء الخط الرسمي المريح للعين -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-primary: #ff91a4;
            --brand-soft: #fff5f6;
            --brand-dark: #1a1a1a;
            --error-red: #ff4d4d;
            --success-green: #2ecc71;
            --bg-master: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-master);
            color: var(--brand-dark);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* منع التكدس البصري عبر الحاويات المريحة */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 145, 164, 0.1);
        }

        .scroll-area {
            scrollbar-width: thin;
            scrollbar-color: var(--brand-primary) transparent;
            overflow-y: auto;
            flex: 1;
            padding-bottom: 100px;
        }

        /* تحسينات لراحة العين - كروت متباعدة */
        .log-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 5px solid transparent;
        }
        .log-card:hover {
            transform: translateX(-5px);
            background-color: var(--brand-soft);
            border-right-color: var(--brand-primary);
        }

        .status-pill {
            font-size: 10px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 999px;
        }

        /* نظام التبويبات السيادي */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
            opacity: 0.5;
        }
        .tab-btn.active {
            opacity: 1;
            color: var(--brand-primary);
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--brand-primary);
            border-radius: 2px;
        }

        /* أنيميشن الظهور المتتابع */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-entry { animation: slideIn 0.4s ease forwards; }
    </style>
</head>
<body class="antialiased">

    <!-- 👑 الهيدر السيادي (Control Header) -->
    <header class="p-6 md:p-8 flex justify-between items-center border-b border-gray-50 bg-white z-50">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-[var(--brand-primary)] rounded-2xl flex items-center justify-center shadow-lg shadow-[var(--brand-primary)]/20">
                <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-tight">مركز القيادة <span class="text-[var(--brand-primary)]">الرقمي</span></h1>
                <p class="text-[10px] md:text-xs font-bold opacity-40">منظومة حلويات بوسي | الرصد السيادي الشامل</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="clearSystemLogs()" class="p-3 rounded-xl bg-gray-50 text-gray-400 hover:text-red-500 transition-colors" title="تطهير السجل">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>
            <button onclick="location.reload()" class="bg-[var(--brand-primary)] text-white px-6 py-2.5 rounded-xl font-black text-sm flex items-center gap-2 hover:shadow-lg transition-all">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> تحديث
            </button>
        </div>
    </header>

    <!-- 📊 شريط الإحصائيات التحليلي (Analytics Bar) -->
    <div class="px-6 md:px-8 py-4 bg-gray-50/50 flex gap-4 overflow-x-auto hide-scrollbar border-b border-gray-50">
        <div class="min-w-[150px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i data-lucide="activity" class="w-4 h-4"></i></div>
            <div>
                <span class="block text-[10px] font-bold opacity-40">إجمالي الأحداث</span>
                <span id="stat-total" class="text-lg font-black">0</span>
            </div>
        </div>
        <div class="min-w-[150px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center"><i data-lucide="alert-circle" class="w-4 h-4"></i></div>
            <div>
                <span class="block text-[10px] font-bold opacity-40">أعطال حرجة</span>
                <span id="stat-errors" class="text-lg font-black text-red-500">0</span>
            </div>
        </div>
        <div class="min-w-[150px] bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-4">
            <div class="w-8 h-8 rounded-full bg-green-50 text-green-500 flex items-center justify-center"><i data-lucide="wifi" class="w-4 h-4"></i></div>
            <div>
                <span class="block text-[10px] font-bold opacity-40">حالة الربط</span>
                <span class="text-sm font-black text-green-500">مؤمنة ✅</span>
            </div>
        </div>
    </div>

    <!-- 🔍 أدوات الفلترة والبحث (Search & Filter) -->
    <div class="p-6 md:px-8 bg-white flex flex-col md:flex-row gap-4 items-center">
        <div class="relative w-full md:w-1/3">
            <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-300 w-4 h-4"></i>
            <input type="text" id="log-search" oninput="filterLogs()" placeholder="بحث في السجلات أو الملفات..." class="w-full bg-gray-50 border-2 border-transparent focus:border-[var(--brand-primary)] rounded-xl py-3 pr-10 pl-4 text-xs font-bold outline-none transition-all">
        </div>
        <nav class="flex gap-6 border-gray-100 w-full md:w-auto">
            <button onclick="setFilter('all')" id="filter-all" class="tab-btn active text-xs font-black px-2">كل النشاط</button>
            <button onclick="setFilter('error')" id="filter-error" class="tab-btn text-xs font-black px-2">الأعطال</button>
            <button onclick="setFilter('sync')" id="filter-sync" class="tab-btn text-xs font-black px-2">المزامنة</button>
        </nav>
    </div>

    <!-- 📜 منطقة العرض الرئيسية (Main Feed) -->
    <main class="scroll-area px-6 md:px-8">
        <div id="logs-container" class="space-y-4 max-w-5xl mx-auto">
            <div class="py-32 text-center">
                <div class="inline-block w-8 h-8 border-4 border-[var(--brand-primary)] border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-bold opacity-40">جاري استدعاء السجلات من السحابة السيادية...</p>
            </div>
        </div>
    </main>

    <!-- 🛠️ شريط الحالة السفلي -->
    <footer class="bg-white border-t border-gray-50 p-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span class="text-[10px] font-black opacity-30">البث اللحظي يعمل</span>
        </div>
        <p class="text-[9px] font-bold opacity-30 uppercase tracking-widest">BoseMonitor Engine V2.5 Sovereign</p>
    </footer>

    <!-- Firebase Core Compatibility -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

    <script type="module">
        // 🛡️ استحضار الهوية التقنية للمشروع
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allLogs = [];
        let currentFilter = 'all';

        async function startSovereignMonitor() {
            try {
                // 🛡️ تأمين الجلسة الإدارية
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }

                // 🛡️ استهداف المسار الموحد للمستشعرات
                const logsPath = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('system_logs');
                
                logsPath.orderBy('timestamp', 'desc').limit(100).onSnapshot(snapshot => {
                    allLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    renderLogs();
                }, error => {
                    console.error("عطل في الرصد السحابي:", error);
                    document.getElementById('logs-container').innerHTML = `
                        <div class="bg-red-50 p-8 rounded-[2rem] text-center border-2 border-red-100">
                            <i data-lucide="shield-alert" class="w-12 h-12 text-red-400 mx-auto mb-4"></i>
                            <h3 class="text-red-500 font-black">فشل الاتصال بمركز البيانات</h3>
                            <p class="text-xs font-bold text-red-400 mt-2">يرجى التأكد من صلاحيات Firebase أو حالة الإنترنت.</p>
                        </div>
                    `;
                    lucide.createIcons();
                });

            } catch (err) {
                console.error("Master Hub Error:", err);
            }
        }

        window.renderLogs = () => {
            const container = document.getElementById('logs-container');
            const searchVal = document.getElementById('log-search').value.toLowerCase();
            
            let filtered = allLogs;
            
            // 1. تطبيق الفلتر النوعي
            if (currentFilter === 'error') filtered = allLogs.filter(l => l.type === 'error' || l.severity === 'critical');
            if (currentFilter === 'sync') filtered = allLogs.filter(l => (l.functionName && l.functionName.toLowerCase().includes('sync')) || l.source === 'sw.js');

            // 2. تطبيق فلتر البحث
            if (searchVal) {
                filtered = filtered.filter(l => 
                    (l.errorMessage && l.errorMessage.toLowerCase().includes(searchVal)) ||
                    (l.fileName && l.fileName.toLowerCase().includes(searchVal)) ||
                    (l.functionName && l.functionName.toLowerCase().includes(searchVal))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-40 text-center opacity-20 font-black text-sm italic">لا توجد بلاغات تطابق معايير البحث حالياً.</div>`;
                return;
            }

            container.innerHTML = filtered.map((log, index) => {
                const isError = log.type === 'error' || log.severity === 'critical';
                const time = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit', second:'2-digit'}) : 'توقيت مجهول';
                const date = log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleDateString('ar-EG') : '';

                return `
                    <div class="log-card bg-white p-6 rounded-[2rem] border border-gray-50 flex flex-col md:flex-row md:items-center gap-6 animate-entry" style="animation-delay: ${index * 0.05}s">
                        <div class="flex items-center gap-4 flex-1">
                            <div class="w-12 h-12 shrink-0 rounded-2xl flex items-center justify-center ${isError ? 'bg-red-50 text-red-500' : 'bg-pink-50 text-[var(--brand-primary)]'}">
                                <i data-lucide="${isError ? 'zap-off' : 'check-circle'}" class="w-6 h-6"></i>
                            </div>
                            <div class="min-w-0">
                                <h4 class="text-sm font-black text-gray-800 truncate" title="${log.errorMessage || ''}">${log.errorMessage || 'تنبيه نظام سيادي صامت'}</h4>
                                <div class="flex flex-wrap gap-2 mt-2">
                                    <span class="text-[9px] font-black text-[var(--brand-primary)] bg-[var(--brand-soft)] px-3 py-1 rounded-lg border border-[var(--brand-primary)]/10">الملف: ${log.fileName || 'نظامي'}</span>
                                    <span class="text-[9px] font-black text-gray-400 bg-gray-50 px-3 py-1 rounded-lg">الدالة: ${log.functionName || 'Global'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex md:flex-col items-center md:items-end justify-between border-t md:border-t-0 md:border-r border-gray-50 pt-4 md:pt-0 md:pr-6 shrink-0 gap-2">
                            <div class="text-right">
                                <span class="block text-[10px] font-black text-gray-300 uppercase">${date}</span>
                                <span class="block text-xs font-black text-gray-500">${time}</span>
                            </div>
                            <span class="status-pill ${isError ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-500'}">
                                ${isError ? 'عطل حرج' : 'مستقر'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            // تحديث الأرقام
            document.getElementById('stat-total').innerText = allLogs.length;
            document.getElementById('stat-errors').innerText = allLogs.filter(l => l.type === 'error').length;
            
            lucide.createIcons();
        };

        window.setFilter = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            renderLogs();
        };

        window.filterLogs = () => renderLogs();

        // دالة تطهير السجل (للإدارة فقط)
        window.clearSystemLogs = async () => {
            if (!confirm("هل حضرتك متأكدة من تطهير كافة السجلات؟ هذا القرار سيحذف التاريخ التشخيصي بالكامل.")) return;
            try {
                const logsCollection = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('system_logs');
                const snapshot = await logsCollection.get();
                const batch = db.batch();
                snapshot.docs.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert("تم تطهير السجل بنجاح ✅");
            } catch (e) {
                alert("نأسف، حدث خطأ أثناء عملية التطهير.");
            }
        };

        startSovereignMonitor();
    </script>
</body>
</html>
