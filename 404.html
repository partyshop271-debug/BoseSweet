    <link rel="stylesheet" href="css/global.css?v=2026_production_v43.1">
    <link rel="stylesheet" href="css/main.css?v=2026_production_v39.0">

         بدل الاعتماد على أي CDN خارجي (cdnjs/jsdelivr/unpkg) - مفيش نقطة فشل خارجية تانية خالص. -->

    <style>
        .not-found-wrapper {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 80px 20px 100px 20px;
            box-sizing: border-box;
            text-align: center;
            direction: rtl;
        }
        .not-found-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: rgba(255, 145, 164, 0.08);
            border: 2px solid var(--bose-pink, #FF91A4);
            color: var(--bose-pink, #FF91A4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            margin: 0 auto 24px auto;
        }
        .not-found-code {
            font-size: 4rem;
            font-weight: 700;
            color: var(--bose-pink, #FF91A4);
            margin: 0 0 8px 0;
            line-height: 1;
        }
        .not-found-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--bose-black, #111111);
            margin: 0 0 12px 0;
        }
        .not-found-text {
            font-size: 0.95rem;
            color: var(--bose-black, #111111);
            opacity: 0.8;
            line-height: 1.8;
            margin: 0 0 32px 0;
        }
        .not-found-actions {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }
        @media (min-width: 480px) {
            .not-found-actions { flex-direction: row; }
        }
        .btn-not-found-home, .btn-not-found-menu {
            flex: 1;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s ease;
        }
        .btn-not-found-home {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(255, 145, 164, 0.2);
        }
        .btn-not-found-home:hover {
            background-color: var(--bose-black, #111111);
        }
        .btn-not-found-menu {
            background-color: #FFFFFF;
            color: var(--bose-black, #111111);
            border: 1px solid rgba(255, 145, 164, 0.4);
        }
        .btn-not-found-menu:hover {
            border-color: var(--bose-pink, #FF91A4);
        }
    </style>
</head>
<body class="bose-hardware-accelerated">

    <div id="bose-header-injector"></div>

    <main class="not-found-wrapper">
        <div class="not-found-icon"><i class="fa-solid fa-cake-candles"></i></div>
        <p class="not-found-code">404</p>
        <h1 class="not-found-title">الصفحة اللي بتدور عليها مش موجودة</h1>
        <p class="not-found-text">🌸 يمكن الرابط اتغيّر أو اتكتب غلط. متقلقش، تقدر ترجع للرئيسية أو تتصفح المنيو الشامل وتلاقي كل تشكيلة حلويات بوسي.</p>

        <div class="not-found-actions">
            <a href="/index.html" class="btn-not-found-home">
                <i class="fas fa-home"></i> الرئيسية
            </a>
            <a href="/menu.html" class="btn-not-found-menu">
                <i class="fas fa-utensils"></i> المنيو الشامل
            </a>
        </div>
    </main>

    <div id="bose-footer-injector"></div>
</body>
</html>
