<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta property="og:title" content="سياسة الشحن والتوصيل الفاخر - حلويات بوسي">
    <meta property="og:description" content="نحن نهتم بكل تفصيلة لتصلك حلويات بوسي طازجة وبأعلى جودة. تعرف على خيارات التوصيل المتاحة لدينا.">
    <meta property="og:type" content="website">
    
    <!-- الستايلات القياسية الموحدة والمستندات الحاكمة للهوية البصرية -->
    <link rel="canonical" href="https://bose-sweet.vercel.app/policies/shipping-policy.html">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">
    <link rel="stylesheet" href="../vendor/fonts/cairo/cairo.css?v=2026_local_v1.0">
    <link rel="stylesheet" href="../css/global.css?v=2026_production_v44.0">
    <link rel="stylesheet" href="../css/main.css?v=2026_production_v38.0">
    
    <!-- المحرك المركزي العالمي وحارس البيانات المالي لحقن الخطوط والألوان الفاخرة -->
    <!-- ⚡🛡️🆕 [إصلاح جذري - الهيدر/الفوتر والمحتوى بيختفوا بالكامل]: السكريبتات
         دي كانت بتتحمّل من غير "defer"، يعني بتتنفذ فورًا أثناء تحليل <head>
         *قبل* ما <body> يتعمل أصلاً. core-engine.js فيه كود بيشتغل فور تحميله
         بينادي document.body مباشرة - وهو وقتها null لسه، فبيرمي خطأ JavaScript
         فعلي يوقف باقي السكريبت كله ويظهر رسالة "خطأ غير متوقع" بدل الصفحة
         الحقيقية. الحل: "defer" بيخلي السكريبت ينتظر لحد ما HTML كله يتحلل
         الأول - نفس الطريقة المستخدمة في كل صفحات الموقع التانية. -->
    <script src="../js/supabase-client.js?v=2027_production_v43.0" defer></script>
    <script src="../js/push-notifications.js?v=1.0" defer></script>
    <script src="../js/core-engine.js?v=2028_production_v60.0" defer></script>

    <style>
        /* ستايل هندسي مخصص لضمان التنفس البصري ومنع التكدس نهائياً لراحة العميل النفسية */
        .policy-page-hero {
            padding: 60px 20px;
            text-align: center;
            background-color: var(--bose-white);
            border-bottom: var(--bose-border-pink);
        }
        
        .policy-page-hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--bose-black);
            font-weight: 700;
        }
        
        .policy-page-hero p {
            font-size: 16px;
            color: var(--bose-black);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .policy-content-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: var(--bose-white);
        }

        .policy-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--bose-shadow-glow);
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .policy-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bose-hover-shadow, var(--bose-shadow-hover));
            border-color: var(--bose-pink);
        }

        .policy-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--bose-black);
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-card h2 i {
            color: var(--bose-pink);
            font-size: 20px;
        }

        .policy-card p {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin: 0 0 15px 0;
        }

        .policy-card ul {
            margin: 0;
            padding-right: 20px;
        }

        .policy-card ul li {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .policy-card ul li strong {
            color: var(--bose-black);
        }

        /* شريط عناصر الثقة الموزع بدقة هندسية */
        .trust-badge-mini {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 145, 164, 0.05);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255, 145, 164, 0.2);
            font-size: 13px;
            color: var(--bose-black);
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .policy-page-hero {
                padding: 40px 15px;
            }
            .policy-page-hero h1 {
                font-size: 26px;
            }
            .policy-card {
                padding: 20px;
                border-radius: 16px;
            }
            .policy-card h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- وسم النائب المقدس لحقن الهيدر ديناميكياً عبر المحرك المركزي الموحد -->
    <div id="bose-header-injector"></div>

    <main>
        <!-- قسم العنوان الفريد لتأكيد الالتزام والوضوح البصري لعميلنا -->
        <section class="policy-page-hero">
            <span class="trust-badge-mini"><i class="fa-solid fa-truck-ramp-box"></i> توصيل آمن ونضارة مضمونة</span>
            <h1>سياسة الشحن والتوصيل</h1>
            <p>وصول طلبك بالشكل اللي بتحلمي بيه هي مسؤوليتنا الأولى. إحنا ملتزمين بأعلى معايير الحفظ والأمان عشان تستمتعي بمنتجاتنا طازة وحلوة زي ما خرجت بالظبط من مطبخنا.</p>
        </section>

        <!-- حاوية محتوى سياسة التوصيل المنظم -->
        <section class="policy-content-wrapper" id="policy-dynamic-content">
            <template id="policy-static-fallback">
            <!-- كارت 1: نطاق التوصيل الجغرافي وبؤرة الاهتمام -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-map-location-dot"></i> مناطق التغطية والخدمة</h2>
                <p>حلويات بوسي براند مصري بيخدم أهالينا الكرام في نطاق مركز الكفاح بالفرافرة، محافظة الوادي الجديد.</p>
                <p>حددنا النطاق ده بعناية عشان نضمن إننا نقدر نوصل الحلويات الطازجة والورد بسرعة، والمنتج يفضل شكله ولمعته زي ما هو.</p>
            </div>

            <!-- كارت 2: زمن التحضير ووقت التوصيل المحدث -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> مدة التوصيل وتجهيز الطلب</h2>
                <p>الجودة بالنسبة لنا مالهاش حلول وسط، وكل قطعة بنصنعها محتاجة تحضير يدوي وتفاصيل دقيقة:</p>
                <ul>
                    <li><strong>وقت التحضير المسبق:</strong> بننصحك تطلبي المنتجات المخصصة أو الكبيرة (زي تورت المناسبات والبوكيهات المصممة وتنسيقات الهدايا الكبيرة) <strong>قبل المناسبة بأسبوع كامل على الأقل</strong> عشان نضمنلك أعلى جودة ممكنة.</li>
                    <li><strong>ميعاد التوصيل:</strong> تقدري وانتِ بتأكدي طلبك من السلة تحددي اليوم والساعة اللي يناسبوك، وفريق التوصيل هيلتزم يوصلك بالظبط في الميعاد ده.</li>
                </ul>
            </div>

            <!-- كارت 3: معايير السلامة والنقل الفاخر لمنتجاتك -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-temperature-arrow-down"></i> كيف نحمي منتجاتك أثناء الرحلة؟</h2>
                <p>عملية النقل بالنسبة لنا مش مجرد توصيل، دي امتداد لجودة المطبخ والفرع قدامك:</p>
                <ul>
                    <li>بننقل التورت والحلويات في صناديق مبردة مخصصة بتمنع تأثر الكريمة أو الشوكولاتة بحرارة الجو وبتحافظ على تماسكها.</li>
                    <li>بنثبّت بوكيهات الورد والهدايا اللي جواها بعناية عشان توصلك ناضرة من غير أي عيوب أو خدوش.</li>
                    <li>مندوبين التوصيل عندنا متدربين كويس على التعامل مع المنتجات الحساسة عشان توصلك سليمة من أول لحظة.</li>
                </ul>
            </div>

            <!-- كارت 4: رسوم التوصيل والشفافية التامة -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-coins"></i> رسوم التوصيل الواضحة</h2>
                <p>بنوضحلك السعر بالكامل قبل ما تخلصي الشراء، ومفيش عندنا أي تكاليف مخفية أو مفاجآت:</p>
                <ul>
                    <li>سعر التوصيل بيظهرلك بالظبط في صفحة السلة والدفع حسب منطقتك جوه مركز الكفاح وضواحي الفرافرة.</li>
                    <li>الرسوم دي بتغطي بس تكلفة نقل طلبك مبرداً وبأمان كامل.</li>
                </ul>
            </div>

            </template>
        </section>
    </main>

    <!-- وسم النائب المقدس لحقن الفوتر ديناميكياً عبر المحرك المركزي الموحد -->
    <div id="bose-footer-injector"></div>

    <!-- استدعاء محرك السلة لضمان استقرار العمليات عبر الصفحات -->
    <!-- 🛡️ [إصلاح - وزن زيادة بلا فايدة]: نفس الإصلاح اللي في policies/refund-policy.html -
         الملف ده معندهوش أي استخدام فعلي في الصفحة دي، فتم شيله. -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("🌸 صفحة سياسة الشحن متوافقة ومستقرة تماماً مع نظام حلويات بوسي الإنتاجي.");
        });
    </script>

    <!-- 🆕 [5.2 - محتوى ديناميكي من لوحة التحكم]: لو الأدمن كتب محتوى فعلي
         لصفحة السياسة دي، بيظهر هنا بدل الكروت الثابتة. لو لسه فاضي، بيفضل
         النص الحالي زي ما هو بالظبط. -->
    <script>
        (function () {
            async function loadDynamicPolicyContent() {
                const container = document.getElementById("policy-dynamic-content");
                const fallback = document.getElementById("policy-static-fallback");
                if (!container || !fallback) return;
                if (!window.BoseSupabase || typeof window.BoseSupabase.getBoseContentPage !== "function") {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const page = await window.BoseSupabase.getBoseContentPage("order-policy");
                const dbContent = (page && page.content || "").trim();
                if (!dbContent) {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const escape = window.escapeBoseHTML || ((s) => String(s));
                const paragraphs = dbContent.split(/\n{2,}/).map((p) => `<p>${escape(p).replace(/\n/g, "<br>")}</p>`).join("");
                container.innerHTML = `<div class="policy-card">${paragraphs}</div>`;
            }
            loadDynamicPolicyContent();
        })();
    </script>
</body>
</html>
