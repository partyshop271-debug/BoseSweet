<head>

    <!-- الستايلات القياسية الموحدة والمستندات الحاكمة للهوية البصرية -->

    <link rel="stylesheet" href="../css/global.css?v=2026_production_v42.0">
    <link rel="stylesheet" href="../css/main.css?v=2026_production_v38.0">
    
    <!-- المحرك المركزي العالمي وحارس البيانات المالي لحقن الخطوط والألوان الفاخرة -->
    <script src="../js/supabase-client.js?v=2026_production_v39.0"></script>
    <script src="../js/core-engine.js?v=2026_production_v38.0"></script>

    <style>
        /* ستايل هندسي مخصص لضمان التنفس البصري ومنع التكدس نهائياً لراحة العميل النفسية */
        .policy-page-hero {
            padding: 60px 20px;
            text-align: center;
            background-color: var(--bose-white);
            border-bottom: var(--bose-border-pink);
        }
        
        .policy-page-hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--bose-black);
            font-weight: 700;
        }
        
        .policy-page-hero p {
            font-size: 16px;
            color: var(--bose-black);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .policy-content-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: var(--bose-white);
        }

        .policy-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--bose-shadow-glow);
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .policy-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bose-hover-shadow, var(--bose-shadow-hover));
            border-color: var(--bose-pink);
        }

        .policy-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--bose-black);
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-card h2 i {
            color: var(--bose-pink);
            font-size: 20px;
        }

        .policy-card p {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin: 0 0 15px 0;
        }

        .policy-card ul {
            margin: 0;
            padding-right: 20px;
        }

        .policy-card ul li {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .policy-card ul li strong {
            color: var(--bose-black);
        }

        /* شريط عناصر الثقة الموزع بدقة هندسية */
        .trust-badge-mini {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 145, 164, 0.05);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255, 145, 164, 0.2);
            font-size: 13px;
            color: var(--bose-black);
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .policy-page-hero {
                padding: 40px 15px;
            }
            .policy-page-hero h1 {
                font-size: 26px;
            }
            .policy-card {
                padding: 20px;
                border-radius: 16px;
            }
            .policy-card h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- وسم النائب المقدس لحقن الهيدر ديناميكياً عبر المحرك المركزي الموحد -->
    <div id="bose-header-injector"></div>

    <main>
        <!-- قسم العنوان الفريد لتأكيد الالتزام والوضوح البصري لعميلنا -->
        <section class="policy-page-hero">
            <span class="trust-badge-mini"><i class="fa-solid fa-truck-ramp-box"></i> توصيل آمن ونضارة مضمونة</span>
            <h1>سياسة الشحن والتوصيل</h1>
            <p>وصول طلبك بالشكل الذي تتمناه هو مسؤوليتنا الأولى. نحن نلتزم بأعلى معايير الحفظ والسلامة لتستمتع بمنتجاتنا طازجة وجميلة تماماً كما تم تحضيرها في مطبخنا الخاص.</p>
        </section>

        <!-- حاوية محتوى سياسة التوصيل المنظم -->
        <section class="policy-content-wrapper" id="policy-dynamic-content">
            <template id="policy-static-fallback">
            <!-- كارت 1: نطاق التوصيل الجغرافي وبؤرة الاهتمام -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-map-location-dot"></i> مناطق التغطية والخدمة</h2>
                <p>حلويات بوسي براند مصري فخور يخدم أهالينا الكرام في نطاق مركز الكفاح بالفرافرة في محافظة الوادي الجديد.</p>
                <p>تم تحديد هذا النطاق بعناية بالغة لضمان قدرتنا على نقل وتوصيل الحلويات الطازجة والورد في زمن قياسي يضمن بقاء المنتجات في حالتها المثالية واللمعة الطبيعية التي تفتح الشهية.</p>
            </div>

            <!-- كارت 2: زمن التحضير ووقت التوصيل المحدث -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> مدة التوصيل وتجهيز الطلب</h2>
                <p>لأن الجودة بالنسبة لنا لا تقبل الحلول الوسط، ولأن كل قطعة نصنعها تتطلب تحضيراً يدوياً وتفاصيل دقيقة غاية في الدقة والفخامة:</p>
                <ul>
                    <li><strong>وقت التحضير المسبق:</strong> نوصي وننصح بطلب المنتجات المخصصة أو الكبيرة (مثل تورت المناسبات، البوكيهات المصممة، وتنسيقات الهدايا الكبرى) <strong>قبل المناسبة بأسبوع كامل على الأقل</strong> لكي نضمن لك أعلى جودة ممكنة، وتناسق بصري ساحر يشرفك أمام ضيوفك.</li>
                    <li><strong>جدولة مواعيد التوصيل:</strong> يمكنك أثناء تأكيد الطلب من السلة تحديد اليوم والساعة المناسبة لك لاستلام طلبك، وسيلتزم فريق التوصيل بالوصول إليك بدقة متناهية وفي الوقت المحدد تماماً.</li>
                </ul>
            </div>

            <!-- كارت 3: معايير السلامة والنقل الفاخر لمنتجاتك -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-temperature-arrow-down"></i> كيف نحمي منتجاتك أثناء الرحلة؟</h2>
                <p>عملية النقل بالنسبة لنا ليست مجرد توصيل، بل هي امتداد لجودة المطبخ والفرع وصورتنا أمامك:</p>
                <ul>
                    <li>يتم نقل التورت والحلويات في صناديق مبردة ومخصصة تمنع تماماً تأثر الكريمة أو الشوكولاتة بحرارة الطقس وتحافظ على تماسكها.</li>
                    <li>يتم حماية وتثبيت بوكيهات الورد والهدايا المدمجة بعناية تامة لكي تصلك نضرة وخالية من أي عيوب أو خدوش بصرية.</li>
                    <li>مندوبو التوصيل لدينا مدربون بشكل احترافي على كيفية التعامل مع المنتجات الحساسة لضمان وصولها سليمة تماماً ومبهرة من اللحظة الأولى.</li>
                </ul>
            </div>

            <!-- كارت 4: رسوم التوصيل والشفافية التامة -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-coins"></i> رسوم التوصيل الواضحة</h2>
                <p>نحن نعرض لك القيمة والوضوح الكامل قبل إتمام الشراء، ولا توجد لدينا أي تكاليف خفية أو مفاجئة:</p>
                <ul>
                    <li>تظهر لك تكلفة التوصيل بشكل دقيق في صفحة السلة والدفع بناءً على موقع التوصيل المحدد داخل مركز الكفاح وضواحي الفرافرة.</li>
                    <li>يتم حساب الرسوم بشفافية تامة لتغطي فقط التكلفة اللوجستية لنقل طلبك مبرداً وبأمان كامل.</li>
                </ul>
            </div>

            </template>
        </section>
    </main>

    <!-- وسم النائب المقدس لحقن الفوتر ديناميكياً عبر المحرك المركزي الموحد -->
    <div id="bose-footer-injector"></div>

    <!-- استدعاء محرك السلة لضمان استقرار العمليات عبر الصفحات -->
    <!-- 🛡️ [إصلاح - وزن زيادة بلا فايدة]: نفس الإصلاح اللي في policies/refund-policy.html -
         الملف ده معندهوش أي استخدام فعلي في الصفحة دي، فتم شيله. -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            console.log("🌸 صفحة سياسة الشحن متوافقة ومستقرة تماماً مع نظام حلويات بوسي الإنتاجي.");
        });
    </script>

    <!-- 🆕 [5.2 - محتوى ديناميكي من لوحة التحكم]: لو الأدمن كتب محتوى فعلي
         لصفحة السياسة دي، بيظهر هنا بدل الكروت الثابتة. لو لسه فاضي، بيفضل
         النص الحالي زي ما هو بالظبط. -->
    <script>
        (function () {
            async function loadDynamicPolicyContent() {
                const container = document.getElementById("policy-dynamic-content");
                const fallback = document.getElementById("policy-static-fallback");
                if (!container || !fallback) return;
                if (!window.BoseSupabase || typeof window.BoseSupabase.getBoseContentPage !== "function") {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const page = await window.BoseSupabase.getBoseContentPage("order-policy");
                const dbContent = (page && page.content || "").trim();
                if (!dbContent) {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const escape = window.escapeBoseHTML || ((s) => String(s));
                const paragraphs = dbContent.split(/\n{2,}/).map((p) => `<p>${escape(p).replace(/\n/g, "<br>")}</p>`).join("");
                container.innerHTML = `<div class="policy-card">${paragraphs}</div>`;
            }
            loadDynamicPolicyContent();
        })();
    </script>
</body>
</html>
