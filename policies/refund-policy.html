<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FF91A4">
    <title>سياسة الاستبدال والاسترجاع - حلويات بوسي</title>
    
    <!-- تهيئة محركات البحث والأرشفة العالمية (SEO) -->
    <meta name="description" content="سياسة الاستبدال والاسترجاع الرسمية لمتجر حلويات بوسي. نحن نضمن لك أعلى جودة ونوضح شروط التعامل بكل شفافية واحترام متبادل.">
    <meta property="og:title" content="سياسة الاستبدال والاسترجاع - حلويات بوسي">
    <meta property="og:description" content="نحن نعرف قيمة ما نقدمه ونلتزم بوضوح وصداقة كاملة معكم. تعرف على تفاصيل سياسة الاسترجاع الفاخرة.">
    <meta property="og:type" content="website">
    
    <!-- الستايلات والمستندات القياسية الحاكمة للهوية البصرية -->
    <link rel="canonical" href="https://bose-sweet.vercel.app/policies/refund-policy.html">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" fetchpriority="high">
    <link rel="stylesheet" href="../css/global.css?v=2026_production_v42.0">
    <link rel="stylesheet" href="../css/main.css?v=2026_production_v38.0">
    
    <!-- المحرك المركزي العالمي وحارس البيانات المالي (يُستدعى مبكراً في الرأس لحقن الخطوط والألوان الحاكمة) -->
    <script src="../js/supabase-client.js?v=2026_production_v39.0"></script>
    <script src="../js/core-engine.js?v=2027_production_v46.0"></script>

    <style>
        /* ستايل إضافي مخصص لصفحة السياسات يدعم التنفس البصري ويمنع التكدس */
        .policy-page-hero {
            padding: 60px 20px;
            text-align: center;
            background-color: var(--bose-white);
            border-bottom: var(--bose-border-pink);
        }
        
        .policy-page-hero h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: var(--bose-black);
        }
        
        .policy-page-hero p {
            font-size: 16px;
            color: var(--bose-black);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .policy-content-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: var(--bose-white);
        }

        .policy-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 30px;
            box-shadow: var(--bose-shadow-glow);
            margin-bottom: 30px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .policy-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--bose-hover-shadow, var(--bose-shadow-hover));
            border-color: var(--bose-pink);
        }

        .policy-card h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--bose-black);
            margin-top: 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .policy-card h2 i {
            color: var(--bose-pink);
            font-size: 20px;
        }

        .policy-card p {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin: 0 0 15px 0;
        }

        .policy-card ul {
            margin: 0;
            padding-right: 20px;
        }

        .policy-card ul li {
            font-size: 15px;
            color: var(--bose-black);
            line-height: 1.8;
            margin-bottom: 10px;
        }
        
        .policy-card ul li strong {
            color: var(--bose-black);
        }

        /* شريط عناصر الثقة الموزع بدقة هندسية */
        .trust-badge-mini {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 145, 164, 0.05);
            padding: 6px 12px;
            border-radius: 50px;
            border: 1px solid rgba(255, 145, 164, 0.2);
            font-size: 13px;
            color: var(--bose-black);
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .policy-page-hero {
                padding: 40px 15px;
            }
            .policy-page-hero h1 {
                font-size: 26px;
            }
            .policy-card {
                padding: 20px;
                border-radius: 16px;
            }
            .policy-card h2 {
                font-size: 19px;
            }
        }
    </style>
</head>
<body>

    <!-- وسم النائب المقدس لحقن الهيدر ديناميكياً عبر المحرك المركزي الموحد V3 -->
    <div id="bose-header-injector"></div>

    <main>
        <!-- قسم العنوان الفريد والوصف المهدئ لراحة العميل النفسية -->
        <section class="policy-page-hero">
            <span class="trust-badge-mini"><i class="fa-solid fa-shield-heart"></i> ضمان الجودة والالتزام</span>
            <h1>سياسة الاستبدال والاسترجاع</h1>
            <p>نحن في حلويات بوسي نعمل بشغف وخبرة طويلة لنقدم لك منتجات طازجة ومصنوعة يدوياً بحب. نوضح هنا شروط الاسترجاع بكل وضوح وشفافية انطلاقاً من قيم الاحترام المتبادل والمصداقية مع عملائنا المحترمين.</p>
        </section>

        <!-- حاوية محتوى السياسة الهندسي المنظم -->
        <section class="policy-content-wrapper" id="policy-dynamic-content">
            <template id="policy-static-fallback">
            <!-- كارت 1: طبيعة المنتجات الطازجة -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-cake-candles"></i> طبيعة منتجاتنا الفاخرة</h2>
                <p>جميع منتجاتنا من التورت، والحلويات، وبوكيهات الورد المخصصة يتم تحضيرها وتنسيقها طازجة ومصممة خصيصاً بناءً على طلبك الفردي. وبسبب طبيعة المنتجات الغذائية والاستهلاكية الطازجة، فإنها تندرج تحت سياسات دقيقة لضمان أعلى معايير السلامة والجودة والتميز البصري.</p>
            </div>

            <!-- كارت 2: شروط الاستبدال أو الإلغاء -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-rotate-left"></i> شروط تعديل أو إلغاء الطلب</h2>
                <p>لأننا نحتاج إلى وقت كافٍ لتجهيز طلبك بأفضل جودة ممكنة (شرط الـ 24 ساعة تحضير المعتمد)، يمكنك تعديل أو إلغاء طلبك وفق الضوابط التالية:</p>
                <ul>
                    <li><strong>المنتجات القياسية:</strong> يمكن طلب إلغاء أو تعديل الطلب قبل موعد الاستلام المحدد بـ 12 ساعة على الأقل.</li>
                    <li><strong>المنتجات والمحاكيات المخصصة:</strong> بالنسبة للتورت المصممة بحب أو بوكيهات الورد وتنسيقات الكاش المدمجة عبر المحاكيات، لا يمكن إلغاء الطلب أو تعديله بعد بدء العمل الفعلي عليه في الفرع، نظراً لشراء المكونات والملحقات وتخصيصها لقصتك الفريدة بالملي.</li>
                </ul>
            </div>

            <!-- كارت 3: معالجة المشكلات اللوجستية والحالات الاستثنائية -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-circle-check"></i> ضمان استلام المنتج المثالي</h2>
                <p>نحن نضمن أن يصلك طلبك بكامل نضارته ولمعته الطبيعية وشكله الاحترافي الذي يشرفك أمام أحبابك. في حال وجود أي ملاحظة لحظة الاستلام:</p>
                <ul>
                    <li>يرجى فحص ومراجعة الطلب مباشرة مع مندوب التوصيل الفاخر أو أثناء التواجد في الفرع بالكفاح.</li>
                    <li>في حال تبين وجود أي خطأ صريح في المكونات المتفق عليها أو النكهة المحددة، أو تلف واضح في التغليف يعيب المنتج، يتم استبدال المنتج فوراً دون أي تكلفة إضافية، أو إعادة القيمة الصافية كاملة إليك بحسب رغبتك.</li>
                    <li>يتم مراجعة كافة الطلبات المالية والكسور بدقة، وتطبيق التقريب المالي النهائي مرة واحدة على الفاتورة الكبرى لضمان أن يتطابق حسابك بالمليم مع الفاتورة الصادرة.</li>
                </ul>
            </div>

            <!-- كارت 4: آلية الدعم والتواصل الصادق -->
            <div class="policy-card">
                <h2><i class="fa-solid fa-comments"></i> تواصل مباشر مع الدعم</h2>
                <p>هدفنا الأسمى هو راحتك النفسية ورضاك التام. إذا كان لديك أي استفسار أو واجهت أي مشكلة أثناء رحلة الشراء، نحن هنا لنسمعك ونتعامل معك بكل ود واحترام متبادل كعميل محترم للعلامة التجارية.</p>
                <p>يمكنك دائماً الضغط على زر الواتساب المتواجد في الموقع للتحدث مباشرة مع فريق الإدارة والفرع لتسوية أي ملاحظات وتأكيد حقوقك بسرعة متناهية السلاسة.</p>
            </div>
            </template>
        </section>
    </main>

    <!-- وسم النائب المقدس لحقن الفوتر ديناميكياً عبر المحرك المركزي الموحد V3 -->
    <div id="bose-footer-injector"></div>

    <!-- استدعاء محرك السلة والعمليات اللوجستية لضمان تكامل العداد وتوافق الصفحات -->
    <!-- 🛡️ [إصلاح - وزن زيادة بلا فايدة]: الملف ده كان بيتحمّل هنا من غير أي داعي -
         كل دواله (renderBoseCartPage, renderBoseCheckoutPage...) مصممة لعناصر
         موجودة بس في صفحات السلة/الدفع/نجاح الطلب، ومفيش أي كود في الصفحة دي
         بينادي عليها أصلاً. عداد السلة في الهيدر شغال أساسًا من core-engine.js
         المحمّل بالفعل في كل صفحة - فالملف ده كان تحميل وتفسير كامل من غير أي
         استخدام فعلي، وده كان بيبطّئ الصفحة شوية من غير أي فايدة حقيقية. -->
    <script>
        // دالة تمهيدية للتأكد من ربط وتوافق الملف مع بقية ملفات ومحرك الموقع دون أي مشاكل
        document.addEventListener("DOMContentLoaded", () => {
            console.log("🌸 صفحة سياسة الاسترجاع متوافقة ومستقرة كلياً مع نظام حلويات بوسي الإنتاجي V3.");
        });
    </script>

    <!-- 🆕 [5.2 - محتوى ديناميكي من لوحة التحكم]: لو الأدمن كتب محتوى فعلي
         لصفحة السياسة دي، بيظهر هنا بدل الكروت الثابتة. لو لسه فاضي، بيفضل
         النص الحالي زي ما هو بالظبط. -->
    <script>
        (function () {
            async function loadDynamicPolicyContent() {
                const container = document.getElementById("policy-dynamic-content");
                const fallback = document.getElementById("policy-static-fallback");
                if (!container || !fallback) return;
                if (!window.BoseSupabase || typeof window.BoseSupabase.getBoseContentPage !== "function") {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const page = await window.BoseSupabase.getBoseContentPage("return-policy");
                const dbContent = (page && page.content || "").trim();
                if (!dbContent) {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const escape = window.escapeBoseHTML || ((s) => String(s));
                const paragraphs = dbContent.split(/\n{2,}/).map((p) => `<p>${escape(p).replace(/\n/g, "<br>")}</p>`).join("");
                container.innerHTML = `<div class="policy-card">${paragraphs}</div>`;
            }
            loadDynamicPolicyContent();
        })();
    </script>
</body>
</html>
