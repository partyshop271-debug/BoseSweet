    <style>
        /* نظام الألوان الحاكمة والمقدسة لعلامة حلويات بوسي الفاخرة */
        :root {
            --bose-pink: #FF91A4;
            --bose-white: #FFFFFF;
            --bose-black: #111111;
            --bose-gold: #FF91A4;
            
            --bose-shadow-glow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --bose-shadow-hover: 0 16px 40px rgba(255, 145, 164, 0.22);
            --bose-border-pink: 1px solid rgba(255, 145, 164, 0.3);
            --bose-border-thick: 2px solid #FF91A4;
        }

        /* إعادة تهيئة شاملة لضمان التوافق المطلق ومنع الـ Overflow */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif !important;
            background-color: var(--bose-white) !important;
            color: var(--bose-black) !important;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* حاوية المحتوى العام وتأمين التنفس البصري الكامل لراحة العين */
        .bose-policy-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            .bose-policy-wrapper {
                padding: 20px 15px;
            }
        }

        /* لافتة عنوان الصفحة الفاخر */
        .policy-header-block {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 15px;
            background-color: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            box-shadow: var(--bose-shadow-glow);
        }

        .policy-header-block h1 {
            font-size: 28px;
            font-weight: 700 !important;
            margin: 0 0 15px 0;
            color: var(--bose-black) !important;
        }

        .policy-header-block p {
            font-size: 16px;
            color: var(--bose-black);
            margin: 0;
            opacity: 0.85;
        }

        /* كتل بنود الوثيقة الهندسية الصارمة */
        .policy-content-grid {
            display: block;
        }

        .policy-section-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--bose-shadow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .policy-section-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--bose-shadow-hover);
            border-color: var(--bose-pink);
        }

        .policy-section-card h2 {
            font-size: 20px;
            font-weight: 700 !important;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--bose-black) !important;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid rgba(255, 145, 164, 0.15);
            padding-bottom: 12px;
        }

        .policy-section-card h2 i {
            color: var(--bose-pink);
            font-size: 18px;
        }

        .policy-section-card p {
            font-size: 15px;
            margin: 0 0 15px 0;
            text-align: justify;
            color: var(--bose-black);
        }

        .policy-section-card p:last-child {
            margin-bottom: 0;
        }

        /* تنسيق القوائم الداخلية الفخمة */
        .policy-list {
            margin: 15px 0 0 0;
            padding-right: 20px;
            list-style-type: none;
        }

        .policy-list li {
            position: relative;
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--bose-black);
            padding-right: 15px;
        }

        .policy-list li::before {
            content: "✦";
            position: absolute;
            right: 0;
            color: var(--bose-gold);
            font-size: 12px;
        }

        /* جدول الأسعار أو التوضيحات المدمج داخل الوثيقة إذا لزم الأمر */
        .policy-badge {
            display: inline-block;
            background-color: var(--bose-white);
            border: 1px solid var(--bose-pink);
            color: var(--bose-black);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;
        }

        /* شريط عناصر الثقة المشترك الفاخر لراحة العميل */
        .bose-trust-bar-shared {
            display: table;
            width: 100%;
            margin: 50px 0 20px 0;
            border-collapse: separate;
            border-spacing: 15px;
        }

        .trust-item-cell {
            display: table-cell;
            background: var(--bose-white);
            border: var(--bose-border-pink);
            padding: 20px;
            text-align: center;
            border-radius: 20px;
            box-shadow: var(--bose-shadow-glow);
            vertical-align: top;
            width: 25%;
        }

        .trust-item-cell i {
            color: var(--bose-pink);
            font-size: 24px;
            margin-bottom: 12px;
        }

        .trust-item-cell h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 600 !important;
            color: var(--bose-black) !important;
        }

        .trust-item-cell p {
            margin: 0;
            font-size: 12px;
            color: var(--bose-black);
            opacity: 0.8;
            line-height: 1.5;
        }

        @media (max-width: 991px) {
            .bose-trust-bar-shared {
                display: block;
            }
            .trust-item-cell {
                display: block;
                width: 100%;
                margin-bottom: 15px;
            }

<body>

    <!-- وسم حاقن الهيدر المقدس الموحد لجميع صفحات حلويات بوسي لتجنب كركبة الـ Root -->
    <div id="bose-header-injector"></div>

    <main class="bose-policy-wrapper">
        
        <!-- لافتة الترحيب والعنوان الرئيسي للوثيقة القانونية -->
        <div class="policy-header-block">
            <h1>شروط الاستخدام والخدمة</h1>
            <p>نوضح لكم القواعد المتبادلة التي تضمن أرقى تجربة تسوق آمنة وفخمة تليق بتقديركم وثقتكم في علامتنا التجارية.</p>
        </div>

        <div class="policy-content-grid" id="policy-dynamic-content">
            <template id="policy-static-fallback">
            <!-- البند الأول: تمهيد وهوية الخدمة -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-cookie-bite"></i> 1. الهوية الرسمية وقبول الشروط</h2>
                <p>مرحباً بكم في منصة حلويات بوسي، العلامة التجارية المصرية المتخصصة في تقديم الفخامة والجودة الفائقة بمقرنا الرئيسي في الكفاح - مركز الفرافرة - محافظة الوادي الجديد. يُعد تصفحكم للموقع أو إتمام أي طلبات شراء من خلاله بمثابة موافقة كاملة على الالتزام بالقواعد اللوجستية والتنظيمية الموضحة في هذه الوثيقة، والتي تهدف أولاً وأخيراً إلى حفظ حقوقكم وضمان تقديم تجربة تذوق استثنائية.</p>
                <p>نلتزم في منصتنا بعرض القيمة الحقيقية والمكونات الطازجة لمنتجاتنا بكل وضوح وصدق، دون مبالغات أو وعود غير واقعية، لنمنحكم دائماً الصورة الحقيقية التي تطابق توقعاتكم الراقية تماماً.</p>
            </section>

            <!-- البند الثاني: وضوح الأسعار والمعاملات -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-calculator"></i> 2. الشفافية ودقة المعاملات المالية</h2>
                <p>نحرص على أن تكون رحلة تسوقكم واضحة وموثوقة بالكامل، لذلك تخضع المعاملات المالية للقواعد الصارمة التالية:</p>
                <ul class="policy-list">
                    <li><strong>تأكيد الأسعار التفاعلية:</strong> يلتزم الموقع بحفظ السعر الأساسي للمنتج وتفاصيل خيارات التخصيص المختارة بدقة تامة لحظة الإضافة إلى سلة التسوق، مع حساب القيمة الإجمالية النهائية بوضوح كامل قبل تأكيد الطلب.</li>
                    <li><strong>التسعير العادل والمباشر:</strong> تُعرض قيم جميع المنتجات والملحقات الفاخرة بشكل مباشر وثابت داخل شاشات العرض والمحاكيات التفاعلية لضمان الشفافية الكاملة.</li>
                    <li><strong>الالتزام بقيمة الفاتورة الصافية:</strong> لا توجد أي رسوم معالجة خفية أو زيادات إضافية على الطلبات النقدية (الكاش) أو ميزانيات الهدايا المنسقة؛ يتم احتساب المبالغ المطلوبة كقيمة صافية تماماً ومطابقة لفاتورتكم.</li>
                </ul>
            </section>

            <!-- البند الثالث: سياسة عمل وشروط محاكي التورت المطور -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-cake-candles"></i> 3. شروط التخصيص عبر محاكي التورت التفاعلي</h2>
                <p>يمثل محاكي التورت التفاعلي ميزة خاصة تتيح لكم تصميم تورتتكم الفريدة بأنفسكم وتحديد تفاصيلها الفنية بما يناسب مناسباتكم السعيدة، وتخضع لضوابط الجودة الفنية التالية:</p>
                <ul class="policy-list">
                    <li><strong>تحديد الأحجام وسعة الأفراد:</strong> يتيح لكم المحاكي اختيار حجم التورتة بدقة تامة لعدد الأفراد المطلوب، ويتم تحديث واحتساب التكلفة الإجمالية بشكل فوري وتفاعلي أثناء التصميم بناءً على خياراتكم المحددة.</li>
                    <li><strong>التماسك الفني والهندسي:</strong> يمكنكم اختيار الشكل المفضل والنكهات المفضلة، مع ملاحظة أن بعض الأشكال والتصاميم الهندسية المعقدة تشترط حداً أدنى لعدد الأفراد لضمان التماسك الفني الفاخر للتورتة أثناء الخبز والتزيين.</li>
                    <li><strong>السلامة الغذائية وملاحظات الحساسية:</strong> نهتم بسلامتكم الطبية كأولوية قصوى، لذلك نرجو تدوين أي ملاحظات خاصة بالحساسية الغذائية (مثل موانع المكسرات أو الألبان) بدقة داخل الحقل النصي المخصص لتؤخذ في الحسبان أثناء التحضير.</li>
                </ul>
            </section>

            <!-- البند الرابع: سياسة عمل وشروط محاكي الورد المطور -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-browning-triangle"></i> 4. شروط تنسيق الورد والبوكيهات المخصصة</h2>
                <p>نوفر لكم من خلال محاكي الورد رحلة تفاعلية ذكية لتنسيق بوكيهاتكم الفاخرة، وتخضع عملية التصميم للشروط التنظيمية التالية:</p>
                <ul class="policy-list">
                    <li><strong>خيارات التنسيق ونوع الورد:</strong> يشمل السعر الأساسي الظاهر في المحاكي التنسيق الفاخر ونوع الورد المختار (سواء كان ورداً طبيعياً نضراً، صناعياً فاخراً، أو ورد ستان مصنوعاً يدوياً بحب) مع عدد الوردات الأساسي، وتُضاف قيمة أي وردة إضافية يتم طلبها تلقائياً للسعر الإجمالي.</li>
                    <li><strong>التنفيذ الفني المخصص:</strong> تتيح لكم المنصة رفع صورة لتصميم بوكيه خارجي نال إعجابكم، وسيقوم فريق الخبراء لدينا بتنفيذه ومحاكاته بأعلى درجات الاحترافية مع الحفاظ الكامل على النضارة والجودة.</li>
                    <li><strong>مرفقات التنسيق النقدية:</strong> في حال رغبتكم في دمج مبالغ نقدية أو شوكولاتة فاخرة داخل بوكيه الورد، يتم اختيار وتحديد الفئات والميزانية المطلوبة من خلال الحقول المخصصة، وتضاف كاملة كقيمة صافية وبدون أي رسوم إضافية لضمان سلامة وأمان التنسيق.</li>
                </ul>
            </section>

            <!-- البند الخامس: حارس الوقت الصارم وجدولة الشحن واللوجستيات -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-clock"></i> 5. جدولة التحضير الفاخر وسياسة الشحن اللوجستي</h2>
                <p>لأننا نعرف قيمة ما نقدمه ونعتمد كلياً على خبز وإعداد منتجات طازجة يومياً بمكونات طبيعية 100%، فإننا نلتزم بمواقيت تحضير صارمة تضمن خروج منتجاتنا بأعلى معايير الاتقان الفاخر:</p>
                <ul class="policy-list">
                    <li><strong>الطلبات الخاصة والمخصصة:</strong> نظراً لأن المناسبات الكبرى والطلبات الخاصة تحتاج إلى تحضير فني وتزيين معقد، يجب أن يتم الحجز والتأكيد قبل موعد المناسبة بـ 7 أيام كاملة (أسبوع) لمنح فريق المحترفين الوقت الكافي للتنفيذ المثالي.</li>
                    <li><strong>المنتجات والحلويات العادية:</strong> لضمان الخبز الطازج يومياً، يتم قبول وطلب الحلويات العادية المتاحة في المنيو قبل موعد الاستلام بـ 24 ساعة على الأقل.</li>
                    <li><strong>خيارات الاستلام واللوجستيات:</strong> نوفر لكم حرية الاختيار بين "الاستلام من الفرع" (بدون رسوم) مع توفير خريطة تفاعلية لعنواننا بالكفاح بجوار صيدلية د. أحمد مجدي، أو اختيار "التوصيل للمنزل" حيث تُحتسب كلفة الشحن لوجستياً بناءً على المنطقة السكنية المحددة بدقة لضمان وصول المنتج متماسكاً وطازجاً.</li>
                </ul>
            </section>

            <!-- البند السادس: حماية النزاهة وحظر الاستخدام غير المشروع -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-shield-halved"></i> 6. سلامة المعاملات، الضمان، وسياسة الاسترجاع</h2>
                <p>تلتزم علامة حلويات بوسي بتقديم أعلى معايير الجودة، وتتوقع من عملائها الالتزام بصحة البيانات المدخلة ومراعاة القواعد المتبادلة التالية لسلامة الخدمة:</p>
                <ul class="policy-list">
                    <li><strong>ضمان الجودة وسياسة الاسترجاع الصارمة:</strong> لأننا نقدم منتجات غذائية وحلويات طازجة وحساسة جداً للظروف الجوية، نرجو مراجعة الطلب فور استلامه. يتم قبول شكاوى الاسترجاع أو الإبلاغ عن أي ملاحظات في الجودة خلال ساعتين كحد أقصى من وقت الاستلام لضمان التحقق الفوري واتخاذ الإجراء المناسب لحفظ حقكم.</li>
                    <li><strong>سلامة الرسائل المطبوعة:</strong> نحرص على تقديم أسلوب هادئ ومحترم يليق بالجميع، ولذلك يُرجى الالتزام بكتابة رسائل إهداء مخصصة على التورت أو شرائط الستان تتوافق مع الذوق العام والسياق الراقي المعتمد للعلامة التجارية.</li>
                    <li><strong>مراجعة وتدقيق الفواتير:</strong> نحرص على دقة البيانات وتكاملها، وتحتفظ الإدارة بالحق في مراجعة الفواتير الموجهة للواتساب وتصحيح أي خطأ تقني أو نسبي غير مقصود في الأسعار مع التواصل المباشر مع العميل لتوضيح الأمر بكل وضوح وصداقة.</li>
                </ul>
            </section>
        </div>

        <!-- شريط عناصر الثقة والضمان الأربعة الفاخرة لتعزيز الطمأنينة -->
        <div class="bose-trust-bar-shared">
            <div class="trust-item-cell">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h4>مكونات طبيعية 100%</h4>
                <p>منتجات طازجة يومياً تُحضر بحب وشغف لضمان النكهة الفاخرة.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-truck-ramp-box"></i>
                <h4>توصيل سريع وآمن</h4>
                <p>شحن لوجستي دقيق يحافظ على نضارة الورد وتماسك التورتة.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-comments"></i>
                <h4>تقدير واحترام متبادل</h4>
                <p>دعم خبير يراعي متطلباتكم ويجيب عن الأسئلة بكل وضوح وصداقة.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-share-nodes"></i>
                <h4>تأكيد فوري بالواتساب</h4>
                <p>ربط فوري يضمن صياغة الفاتورة وإرسال تفاصيلها ومراجعتها بالملي.</p>
            </div>
            </template>
        </div>

    <!-- وسم حاقن الفوتر المقدس الموحد لجميع صفحات حلويات بوسي لخلق تنفس بصري مريح -->
    <div id="bose-footer-injector"></div>

    <!-- 🆕 [5.2 - محتوى ديناميكي من لوحة التحكم]: لو الأدمن كتب محتوى فعلي
         لصفحة السياسة دي، بيظهر هنا بدل الكروت الثابتة. لو لسه فاضي، بيفضل
         النص القانوني الحالي زي ما هو بالظبط. -->
    <script>
        (function () {
            async function loadDynamicPolicyContent() {
                const container = document.getElementById("policy-dynamic-content");
                const fallback = document.getElementById("policy-static-fallback");
                if (!container || !fallback) return;
                if (!window.BoseSupabase || typeof window.BoseSupabase.getBoseContentPage !== "function") {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const page = await window.BoseSupabase.getBoseContentPage("terms-conditions");
                const dbContent = (page && page.content || "").trim();
                if (!dbContent) {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const escape = window.escapeBoseHTML || ((s) => String(s));
                const paragraphs = dbContent.split(/\n{2,}/).map((p) => `<p>${escape(p).replace(/\n/g, "<br>")}</p>`).join("");
                container.innerHTML = `<section class="policy-section-card">${paragraphs}</section>`;
            }
            loadDynamicPolicyContent();
        })();
    </script>
</body>
</html>
