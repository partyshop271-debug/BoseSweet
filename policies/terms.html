    <style>
        /* نظام الألوان الحاكمة والمقدسة لعلامة حلويات بوسي الفاخرة */
        :root {
            --bose-pink: #FF91A4;
            --bose-white: #FFFFFF;
            --bose-black: #111111;
            --bose-gold: #FF91A4;
            
            --bose-shadow-glow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --bose-shadow-hover: 0 16px 40px rgba(255, 145, 164, 0.22);
            --bose-border-pink: 1px solid rgba(255, 145, 164, 0.3);
            --bose-border-thick: 2px solid #FF91A4;
        }

        /* إعادة تهيئة شاملة لضمان التوافق المطلق ومنع الـ Overflow */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif !important;
            background-color: var(--bose-white) !important;
            color: var(--bose-black) !important;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* حاوية المحتوى العام وتأمين التنفس البصري الكامل لراحة العين */
        .bose-policy-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            .bose-policy-wrapper {
                padding: 20px 15px;
            }
        }

        /* لافتة عنوان الصفحة الفاخر */
        .policy-header-block {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 15px;
            background-color: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            box-shadow: var(--bose-shadow-glow);
        }

        .policy-header-block h1 {
            font-size: 28px;
            font-weight: 700 !important;
            margin: 0 0 15px 0;
            color: var(--bose-black) !important;
        }

        .policy-header-block p {
            font-size: 16px;
            color: var(--bose-black);
            margin: 0;
            opacity: 0.85;
        }

        /* كتل بنود الوثيقة الهندسية الصارمة */
        .policy-content-grid {
            display: block;
        }

        .policy-section-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--bose-shadow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .policy-section-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--bose-shadow-hover);
            border-color: var(--bose-pink);
        }

        .policy-section-card h2 {
            font-size: 20px;
            font-weight: 700 !important;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--bose-black) !important;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid rgba(255, 145, 164, 0.15);
            padding-bottom: 12px;
        }

        .policy-section-card h2 i {
            color: var(--bose-pink);
            font-size: 18px;
        }

        .policy-section-card p {
            font-size: 15px;
            margin: 0 0 15px 0;
            text-align: justify;
            color: var(--bose-black);
        }

        .policy-section-card p:last-child {
            margin-bottom: 0;
        }

        /* تنسيق القوائم الداخلية الفخمة */
        .policy-list {
            margin: 15px 0 0 0;
            padding-right: 20px;
            list-style-type: none;
        }

        .policy-list li {
            position: relative;
            font-size: 15px;
            margin-bottom: 12px;
            color: var(--bose-black);
            padding-right: 15px;
        }

        .policy-list li::before {
            content: "✦";
            position: absolute;
            right: 0;
            color: var(--bose-gold);
            font-size: 12px;
        }

        /* جدول الأسعار أو التوضيحات المدمج داخل الوثيقة إذا لزم الأمر */
        .policy-badge {
            display: inline-block;
            background-color: var(--bose-white);
            border: 1px solid var(--bose-pink);
            color: var(--bose-black);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;

        /* شريط عناصر الثقة المشترك الفاخر لراحة العميل */
        .bose-trust-bar-shared {
            display: table;
            width: 100%;
            margin: 50px 0 20px 0;
            border-collapse: separate;
            border-spacing: 15px;
        }

        .trust-item-cell {

            background: var(--bose-white);

            padding: 20px;
            text-align: center;

            font-size: 24px;
            margin-bottom: 12px;

        .trust-item-cell h4 {

            color: var(--bose-black);
            opacity: 0.8;

            .bose-trust-bar-shared {
                display: block;

            .trust-item-cell {
                display: block;
                width: 100%;

<body>

    <!-- وسم حاقن الهيدر المقدس الموحد لجميع صفحات حلويات بوسي لتجنب كركبة الـ Root -->
    <div id="bose-header-injector"></div>

    <main class="bose-policy-wrapper">
        
        <!-- لافتة الترحيب والعنوان الرئيسي للوثيقة القانونية -->
        <div class="policy-header-block">
            <h1>شروط الاستخدام والخدمة</h1>
            <p>بنوضحلك هنا القواعد اللي بتضمن تجربة تسوق آمنة ومريحة تليق بيكِ وبثقتك فينا.</p>
        </div>

        <div class="policy-content-grid" id="policy-dynamic-content">
            <template id="policy-static-fallback">
            <!-- البند الأول: تمهيد وهوية الخدمة -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-cookie-bite"></i> 1. الهوية الرسمية وقبول الشروط</h2>
                <p>أهلاً بيكِ في حلويات بوسي، العلامة المصرية المتخصصة في الحلويات والورد الفاخر، ومقرنا في الكفاح - مركز الفرافرة - محافظة الوادي الجديد. لما بتتصفحي موقعنا أو بتكملي أي طلب، ده معناه إنك موافقة على الشروط المكتوبة في الصفحة دي، وهي في الأول والآخر عشان نحافظ على حقك ونضمنلك تجربة حلوة فعلاً.</p>
                <p>إحنا بنعرض المكونات والأسعار الحقيقية لمنتجاتنا بكل صدق ووضوح، من غير مبالغة أو وعود مش حقيقية، عشان اللي تشوفيه يكون هو اللي هيوصلك بالظبط.</p>
            </section>

            <!-- البند الثاني: وضوح الأسعار والمعاملات -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-calculator"></i> 2. الشفافية ودقة المعاملات المالية</h2>
                <p>إحنا حريصين إن رحلة تسوقك تكون واضحة وموثوقة 100%، وده بيتحقق من خلال القواعد دي:</p>
                <ul class="policy-list">
                    <li><strong>ثبات السعر وقت الإضافة للسلة:</strong> الموقع بيحفظ سعر المنتج وكل تفاصيل التخصيص اللي اخترتيها بالظبط لحظة ما تضيفيه للسلة، والإجمالي النهائي بيبقى واضح قدامك قبل ما تأكدي الطلب.</li>
                    <li><strong>أسعار واضحة وثابتة:</strong> كل أسعار المنتجات والإضافات مكتوبة واضحة قدامك في صفحات العرض والمحاكيات، من غير أي لبس.</li>
                    <li><strong>مفيش رسوم مخفية:</strong> الفاتورة اللي بتوصلك هي المبلغ الصافي بالظبط، من غير أي رسوم إضافية على مبالغ الكاش أو ميزانيات الهدايا اللي بتحدديها.</li>
                </ul>
            </section>

            <!-- البند الثالث: سياسة عمل وشروط محاكي التورت المطور -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-cake-candles"></i> 3. شروط التخصيص عبر محاكي التورت التفاعلي</h2>
                <p>محاكي التورت بيدّيكِ فرصة تصممي تورتتك بنفسك وتحددي كل تفاصيلها بما يناسب مناسبتك، وده بيتم حسب القواعد دي:</p>
                <ul class="policy-list">
                    <li><strong>الحجم على عدد الأفراد:</strong> تقدري تختاري حجم التورتة بالظبط على عدد ضيوفك، والسعر بيتحدث قدامك أول بأول وانتِ بتصممي.</li>
                    <li><strong>الشكل والنكهة:</strong> تقدري تختاري الشكل والنكهة اللي عايزاها، بس بعض الأشكال المعقدة محتاجة حد أدنى من عدد الأفراد عشان التورتة تظبط وتتماسك وهي بتتزين.</li>
                    <li><strong>الحساسية الغذائية:</strong> صحتك أهم حاجة عندنا، فياريت تكتبي أي حساسية عندك (زي المكسرات أو الألبان) في الخانة المخصصة عشان ناخدها في الاعتبار وإحنا بنحضّر.</li>
                </ul>
            </section>

            <!-- البند الرابع: سياسة عمل وشروط محاكي الورد المطور -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-browning-triangle"></i> 4. شروط تنسيق الورد والبوكيهات المخصصة</h2>
                <p>محاكي الورد بيدّيكِ فرصة تنسّقي بوكيهك بنفسك خطوة بخطوة، وده بيتم حسب القواعد دي:</p>
                <ul class="policy-list">
                    <li><strong>نوع الورد والسعر:</strong> السعر الأساسي اللي شايفاه في المحاكي بيشمل التنسيق ونوع الورد اللي اخترتيه (طبيعي، صناعي فاخر، أو ستان مصنوع بحب) مع عدد ورد معين، وأي وردة زيادة بتتضاف تلقائي للسعر.</li>
                    <li><strong>تنفيذ صورة معينة:</strong> تقدري ترفعي صورة لبوكيه عجباكِ في أي مكان، وفريقنا هيحاول يقرّب التصميم منها قد الإمكان بأعلى جودة.</li>
                    <li><strong>إضافة فلوس أو شوكولاتة:</strong> لو حابة تضيفي مبلغ فلوس أو شوكولاتة جوه البوكيه، تقدري تحددي المبلغ والفئة من الخانات المخصصة، وده بيتضاف كامل من غير أي رسوم زيادة.</li>
                </ul>
            </section>

            <!-- البند الخامس: حارس الوقت الصارم وجدولة الشحن واللوجستيات -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-clock"></i> 5. جدولة التحضير ومواعيد الشحن</h2>
                <p>علشان كل منتجاتنا بتتحضر وتتخبز طازة يوميًا بمكونات طبيعية 100%، إحنا بنلتزم بمواعيد تحضير محددة عشان نضمن جودة الشغل:</p>
                <ul class="policy-list">
                    <li><strong>الطلبات المخصصة (تورت وورد من المحاكي):</strong> لازم تحجزي قبل المناسبة بـ 7 أيام كاملة (أسبوع) على الأقل، عشان فريقنا ياخد وقته الكافي في التحضير والتزيين صح.</li>
                    <li><strong>المنتجات والحلويات العادية (من المنيو):</strong> لازم تحجزي قبل موعد الاستلام بـ 48 ساعة (يومين كاملين) على الأقل، عشان نضمن إنها طازة ومحضّرة صح.</li>
                    <li><strong>طريقة الاستلام:</strong> تقدري تختاري "استلام من الفرع" (من غير أي رسوم) وعندنا خريطة على الموقع لعنواننا بالكفاح بجوار صيدلية د. أحمد مجدي، أو "توصيل للمنزل" وسعر التوصيل بيتحدد حسب منطقتك عشان الطلب يوصلك طازة ومظبوط.</li>
                </ul>
            </section>

            <!-- البند السادس: حماية النزاهة وحظر الاستخدام غير المشروع -->
            <section class="policy-section-card">
                <h2><i class="fa-solid fa-shield-halved"></i> 6. سلامة المعاملات، الضمان، وسياسة الاسترجاع</h2>
                <p>إحنا في حلويات بوسي ملتزمين بأعلى معايير الجودة، وبنطلب من عملائنا كمان الالتزام بصحة البيانات ومراعاة القواعد دي عشان الخدمة تمشي صح:</p>
                <ul class="policy-list">
                    <li><strong>ضمان الجودة والاسترجاع:</strong> منتجاتنا طازة وحساسة للجو، فياريت تراجعي طلبك فور استلامه. أي شكوى أو ملاحظة على الجودة لازم توصلنا خلال ساعتين بحد أقصى من وقت الاستلام عشان نقدر نتصرف بسرعة ونحفظ حقك.</li>
                    <li><strong>الرسائل المطبوعة:</strong> إحنا حريصين على أسلوب راقي ومحترم يليق بالجميع، فياريت أي رسالة إهداء بتكتبيها على التورت أو شريط الستان تكون مناسبة للذوق العام.</li>
                    <li><strong>مراجعة الفواتير:</strong> بنحرص على دقة كل البيانات، والإدارة ليها الحق تراجع فاتورة الواتساب وتصحح أي خطأ تقني غير مقصود في الأسعار، وهنكلمك على طول لو حصل أي حاجة زي كده.</li>
                </ul>
            </section>
        </div>

        <!-- شريط عناصر الثقة والضمان الأربعة الفاخرة لتعزيز الطمأنينة -->
        <div class="bose-trust-bar-shared">
            <div class="trust-item-cell">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <h4>مكونات طبيعية 100%</h4>
                <p>بنحضّر منتجاتنا طازة كل يوم بحب عشان يوصلك أحلى طعم.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-truck-ramp-box"></i>
                <h4>توصيل سريع وآمن</h4>
                <p>بنوصلك بسرعة وأمان، ومنتجك بيوصلك طازة ومتماسك.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-comments"></i>
                <h4>تقدير واحترام متبادل</h4>
                <p>فريق دعم بيسمعك ويجاوب على أسئلتك بكل وضوح وود.</p>
            </div>
            <div class="trust-item-cell">
                <i class="fa-solid fa-share-nodes"></i>
                <h4>تأكيد فوري بالواتساب</h4>
                <p>بنجهزلك فاتورتك ونبعتهالك على الواتساب عشان تراجعيها بنفسك بكل التفاصيل.</p>
            </div>

    <!-- وسم حاقن الفوتر المقدس الموحد لجميع صفحات حلويات بوسي لخلق تنفس بصري مريح -->
    <div id="bose-footer-injector"></div>

    <!-- 🆕 [5.2 - محتوى ديناميكي من لوحة التحكم]: لو الأدمن كتب محتوى فعلي
         لصفحة السياسة دي، بيظهر هنا بدل الكروت الثابتة. لو لسه فاضي، بيفضل
         النص القانوني الحالي زي ما هو بالظبط. -->
    <script>
        (function () {
            async function loadDynamicPolicyContent() {
                const container = document.getElementById("policy-dynamic-content");
                const fallback = document.getElementById("policy-static-fallback");
                if (!container || !fallback) return;
                if (!window.BoseSupabase || typeof window.BoseSupabase.getBoseContentPage !== "function") {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const page = await window.BoseSupabase.getBoseContentPage("terms-conditions");
                const dbContent = (page && page.content || "").trim();
                if (!dbContent) {
                    container.appendChild(fallback.content.cloneNode(true));
                    return;
                }
                const escape = window.escapeBoseHTML || ((s) => String(s));
                const paragraphs = dbContent.split(/\n{2,}/).map((p) => `<p>${escape(p).replace(/\n/g, "<br>")}</p>`).join("");
                container.innerHTML = `<section class="policy-section-card">${paragraphs}</section>`;
            }
            loadDynamicPolicyContent();
        })();
    </script>
