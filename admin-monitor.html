<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة المراقبة التشخيصية | BoseMonitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-2xl font-bold text-brand-pink mb-6">سجل التشخيصات والأداء</h1>
        <div id="logs-container" class="space-y-4">
            </div>
    </div>

    <script type="module">
        import { getFirestore, collection, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        // ملاحظة: تأكدي من إعدادات الـ firebaseConfig في ملف core-engine
        
        const db = window.db; // المحرك الأساسي
        const logsRef = collection(db, 'system_logs');
        const q = query(logsRef, orderBy('timestamp', 'desc'), limit(50));

        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('logs-container');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const log = doc.data();
                container.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-lg border-r-4 border-brand-pink">
                        <div class="flex justify-between text-xs text-gray-400">
                            <span>${log.source}</span>
                            <span>${new Date(log.timestamp).toLocaleString('ar-EG')}</span>
                        </div>
                        <p class="mt-2 text-sm">${log.message}</p>
                        <span class="inline-block mt-2 px-2 py-1 bg-brand-pink/20 text-brand-pink text-[10px] rounded">${log.type}</span>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
