<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الإدارة المركزية | حلويات بوسي</title>
    
    <!-- تضمين خط Cairo الاحترافي المعتمد -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* هندسة النصوص والألوان الحاكمة (The Strict Palette) */
        :root {
            --primary-pink: #FF91A4; /* نبض الحياة والتفاعلات */
            --pure-white: #FFFFFF;  /* المسيطر تماماً للخلفيات والتنفس البصري */
            --deep-black: #111111;  /* للنصوص والعناوين لضمان وضوح كامل للعين */
            --luxury-gold: #D4AF37; /* وجود رمزي ناعم للفخامة */
            --error-red: #D32F2F;
            --font-max-weight: 700; /* قفل وزن الخط كحد أقصى لأضخم العناوين */
        }

        /* تصاميم الهيكل الأساسي ومنع التكديس البصري */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--pure-white);
            color: var(--deep-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            line-height: 1.25;
        }

        /* حاوية بوابة الأمان الاحترافية */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--pure-white);
            border: 2px solid var(--primary-pink);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(255, 145, 164, 0.15);
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-symbol {
            color: var(--luxury-gold);
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: inline-block;
        }

        .brand-name {
            font-size: 1.6rem;
            font-weight: var(--font-max-weight);
            color: var(--deep-black);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .portal-title {
            font-size: 0.95rem;
            color: var(--deep-black);
            opacity: 0.7;
            font-weight: 600;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--deep-black);
            margin-bottom: 8px;
            text-align: right;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1.5px solid rgba(17, 17, 17, 0.15);
            border-radius: 8px;
            background-color: var(--pure-white);
            color: var(--deep-black);
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
            text-align: right;
            -webkit-appearance: none;
        }

        .form-input:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--deep-black);
            color: var(--pure-white);
            border: 2px solid var(--deep-black);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: var(--font-max-weight);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        .submit-btn:hover, .submit-btn:focus {
            background-color: var(--pure-white);
            color: var(--primary-pink);
            border-color: var(--primary-pink);
            box-shadow: 0 5px 15px rgba(255, 145, 164, 0.3);
        }

        .error-message {
            background-color: rgba(211, 47, 47, 0.06);
            border-right: 4px solid var(--error-red);
            color: var(--error-red);
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
            text-align: right;
            animation: fadeIn 0.3s ease;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid var(--pure-white);
            border-top-color: transparent;
            border-radius: 50%;
            display: none;
            animation: spin 0.8s linear infinite;
        }

        .submit-btn:hover .loading-spinner {
            border-color: var(--primary-pink);
            border-top-color: transparent;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                border-width: 1.5px;
            }
            .brand-name { font-size: 1.4rem; }
            .form-input { padding: 12px 14px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <div class="brand-logo-symbol">✦</div>
            <h1 class="brand-name">حلويات بوسي</h1>
            <div class="portal-title">نظام الإدارة والتحكم المركزي</div>
        </div>

        <div class="error-message" id="errorNotification"></div>

        <form id="adminLoginForm" onsubmit="handleAdminAuth(event)">
            <div class="form-group">
                <label class="form-label" for="adminUser">اسم المستخدم</label>
                <input class="form-input" type="text" id="adminUser" required autocomplete="username" placeholder="أدخل اسم المستخدم الإداري" spellcheck="false">
            </div>

            <div class="form-group">
                <label class="form-label" for="adminPass">كلمة المرور الآمنة</label>
                <input class="form-input" type="password" id="adminPass" required autocomplete="current-password" placeholder="••••••••">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="loading-spinner" id="btnSpinner"></span>
                <span id="btnText">دخول لوحة التحكم</span>
            </button>
        </form>
    </div>

    <script>
        function handleAdminAuth(event) {
            event.preventDefault();

            const userInput = document.getElementById('adminUser');
            const passInput = document.getElementById('adminPass');
            const errorBox = document.getElementById('errorNotification');
            const submitBtn = document.getElementById('submitBtn');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            // بيانات الاعتماد الصحيحة والآمنة الخاصة بك
            const SECURE_UID = "Aadmin";
            const SECURE_PWD = "Aaboohamdy";

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            btnSpinner.style.display = 'block';
            btnText.textContent = 'جاري التحقق من الهوية...';

            setTimeout(() => {
                const enteredUser = userInput.value.trim();
                const enteredPass = passInput.value;

                if (enteredUser === SECURE_UID && enteredPass === SECURE_PWD) {
                    const adminToken = {
                        auth: true,
                        timestamp: new Date().getTime(),
                        role: "SuperAdmin"
                    };
                    // تخزين التوكن في مسار موحد لمنع التضارب اللوجستي
                    localStorage.setItem('bossy_admin_session', JSON.stringify(adminToken));
                    
                    btnText.textContent = 'تم التأكيد.. جاري الانتقال';
                    
                    // توجيه آمن ومباشر نسبي للمجلد المعزول الحالي
                    window.location.replace('dashboard.html');
                } else {
                    btnSpinner.style.display = 'none';
                    submitBtn.disabled = false;
                    btnText.textContent = 'دخول لوحة التحكم';
                    
                    errorBox.textContent = 'بيانات الاعتماد غير صحيحة. يرجى المراجعة والمحاولة مرة أخرى.';
                    errorBox.style.display = 'block';
                    
                    passInput.value = '';
                    userInput.focus();
                }
            }, 400);
        }

        // فحص الجلسة الاستباقي الذكي والمحمي تماماً من التوجيه اللانهائي
        window.addEventListener('DOMContentLoaded', () => {
            const activeSession = localStorage.getItem('bossy_admin_session');
            if (activeSession) {
                try {
                    const sessionData = JSON.parse(activeSession);
                    // التوجيه فقط في حال كانت الجلسة صالحة ومفتوحة في صفحة مختلفة
                    if (sessionData && sessionData.auth && !window.location.pathname.includes('dashboard.html')) {
                        window.location.replace('dashboard.html');
                    }
                } catch(e) {
                    localStorage.removeItem('bossy_admin_session');
                }
            }
        });
    </script>
</body>
</html>
