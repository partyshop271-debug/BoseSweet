<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة الآمنة | حلويات بوسي</title>
    <!-- استدعاء خط Cairo الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* إعدادات الهوية البصرية الحاكمة لحلويات بوسي */
        :root {
            --primary-pink: #Ff91a4;
            --pure-white: #FFFFFF;
            --dark-black: #111111;
            --luxury-gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--pure-white);
            color: var(--dark-black);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* حاوية كارت تسجيل الدخول الفاخر */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--pure-white);
            border: 2px solid var(--primary-pink);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(255, 145, 164, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: 0 15px 35px rgba(255, 145, 164, 0.25);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark-black);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
            font-weight: 400;
        }

        /* هندسة حقول الإدخال */
        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark-black);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            border: 1.5px solid #E0E0E0;
            border-radius: 8px;
            outline: none;
            background-color: var(--pure-white);
            color: var(--dark-black);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.2);
        }

        /* زرار الدخول التفاعلي الراقي */
        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: var(--dark-black);
            color: var(--pure-white);
            transition: background-color 0.3s ease, transform 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: #222222;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* رسائل النظام التفاعلية القصيرة والمباشرة */
        .system-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .system-message.error {
            display: block;
            background-color: rgba(255, 145, 164, 0.1);
            color: #D32F2F;
            border: 1px solid var(--primary-pink);
        }

        .system-message.success {
            display: block;
            background-color: rgba(212, 175, 55, 0.1);
            color: #856404;
            border: 1px solid var(--luxury-gold);
        }

        /* أنيميشن الظهور النظيف */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تحسينات الشاشات الصغيرة للموبايل */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                border-radius: 12px;
            }
            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>لوحة تحكم الإدارة</h1>
            <p>حلويات بوسي - النظام الأمني الموحد</p>
        </div>

        <form id="adminLoginForm" onsubmit="return false;">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم المعين" autocomplete="off" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">الرمز السري الخاص</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور السرية" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>تسجيل الدخول الآمن</span>
            </button>
            
            <div id="msgBox" class="system-message"></div>
        </form>
    </div>

    <!-- استدعاء المحرك البرمجي المؤمن للوحة التحكم -->
    <script src="admin.js"></script>
</body>
</html>
