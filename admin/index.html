<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة تسجيل الدخول الآمنة | لوحة تحكم حلويات بوسي</title>
    
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bose-pink: #FF91A4;
            --bose-white: #FFFFFF;
            --bose-black: #111111;
            --bose-gold: #D4AF37;
            --bose-shadow-glow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --bose-shadow-hover: 0 16px 40px rgba(255, 145, 164, 0.22);
            --bose-border-pink: 1px solid rgba(255, 145, 164, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bose-white);
            color: var(--bose-black);
            min-height: 100vh;
            display: flex;
            align-content: center;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--bose-shadow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-container:hover {
            box-shadow: var(--bose-shadow-hover);
            transform: translateY(-4px);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--bose-black);
            margin-bottom: 8px;
        }

        .portal-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--bose-pink);
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--bose-black);
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--bose-black);
            opacity: 0.6;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 45px 14px 15px;
            border: 1px solid rgba(17, 17, 17, 0.15);
            border-radius: 12px;
            font-size: 15px;
            color: var(--bose-black);
            background-color: var(--bose-white);
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--bose-pink);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.15);
        }

        .toggle-password {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--bose-black);
            opacity: 0.6;
            padding: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--bose-pink);
            border: none;
            border-radius: 12px;
            color: var(--bose-white);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: #ff788f;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .notification {
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .notification.error {
            background-color: #fff0f2;
            border: 1px solid rgba(255, 145, 164, 0.4);
            color: #d63031;
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: var(--bose-black);
            opacity: 0.5;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="brand-header">
            <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="حلويات بوسي" class="brand-logo" id="bose-admin-logo">
            <h1 class="brand-name">حلويات بوسي</h1>
            <div class="portal-title"><i class="fa-solid fa-shield-halved"></i> بوابة الإدارة الآمنة</div>
        </div>

        <div id="auth-notification" class="notification"></div>

        <form id="admin-login-form" onsubmit="handleAdminAuth(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-tie"></i>
                    <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="password">الرقم السري</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="أدخل الرقم السري" required>
                    <i class="fa-solid fa-eye toggle-password" id="toggle-pwd-icon" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">
                <span>تسجيل الدخول الآمن</span>
                <i class="fa-solid fa-arrow-left-to-bracket"></i>
            </button>
        </form>

        <p class="footer-text">حقوق الطبع محفوظة © 2026 | حلويات بوسي</p>
    </div>

    <script>
        const AUTH_KEYS = {
            u: "Aadmin",
            p: "Aaboohamdy"
        };

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const icon = document.getElementById('toggle-pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleAdminAuth(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const notification = document.getElementById('auth-notification');
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";
            notification.className = "notification";
            notification.style.display = "none";

            setTimeout(() => {
                if (usernameInput === AUTH_KEYS.u && passwordInput === AUTH_KEYS.p) {
                    const sessionToken = btoa(JSON.stringify({
                        auth: true,
                        user: usernameInput,
                        timestamp: Date.now()
                    }));
                    sessionStorage.setItem('bose_admin_session', sessionToken);
                    localStorage.setItem('bose_admin_session', sessionToken);
                    
                    window.location.href = 'dashboard.html';
                } else {
                    notification.className = "notification error";
                    notification.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>بيانات الاعتماد غير صحيحة، يرجى التحقق وإعادة المحاولة.</span>`;
                    
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                }
            }, 600);
        }
    </script>
</body>
</html>
