<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الإدارة الآمنة | حلويات بوسي</title>
    
    <!-- خط Cairo العربي الاحترافي المعتمد -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- أيقونات Font Awesome الفاخرة المنسقة -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bose-pink: #FF91A4;
            --bose-white: #FFFFFF;
            --bose-black: #111111;
            --bose-gold: #D4AF37;
            --bose-shadow-glow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --bose-shadow-hover: 0 16px 40px rgba(255, 145, 164, 0.22);
            --bose-border-pink: 1px solid rgba(255, 145, 164, 0.3);
            --bose-border-thick: 2px solid #FF91A4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bose-white) !important;
            color: var(--bose-black) !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .login-card-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--bose-white);
            border: var(--bose-border-pink);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--bose-shadow-glow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card-container:hover {
            transform: translateY(-4px);
            box-shadow: var(--bose-shadow-hover);
        }

        .brand-header-block {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo-mock {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: var(--bose-border-thick);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            background-color: var(--bose-white);
        }

        .brand-logo-mock i {
            color: var(--bose-pink);
            font-size: 36px;
        }

        .brand-title-display {
            font-size: 26px;
            font-weight: 700 !important;
            color: var(--bose-black) !important;
            margin-bottom: 8px;
        }

        .brand-subtitle-display {
            font-size: 14px;
            font-weight: 400;
            color: var(--bose-black);
            opacity: 0.7;
        }

        .form-group-wrapper {
            margin-bottom: 22px;
            position: relative;
        }

        .form-label-text {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--bose-black);
            margin-bottom: 8px;
            padding-right: 4px;
        }

        .input-field-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-container i {
            position: absolute;
            right: 16px;
            color: var(--bose-pink);
            font-size: 18px;
        }

        .bose-input-style {
            width: 100%;
            padding: 14px 48px 14px 16px;
            border: var(--bose-border-pink);
            border-radius: 14px;
            background-color: var(--bose-white);
            color: var(--bose-black);
            font-size: 15px;
            font-weight: 400;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .bose-input-style:focus {
            border-color: var(--bose-pink);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.15);
        }

        .password-toggle-btn {
            position: absolute;
            left: 16px;
            background: none;
            border: none;
            color: var(--bose-black);
            opacity: 0.5;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: opacity 0.3s ease;
        }

        .password-toggle-btn:hover {
            opacity: 0.9;
        }

        .error-message-banner {
            background-color: rgba(255, 145, 164, 0.1);
            border: 1px solid var(--bose-pink);
            color: var(--bose-black);
            font-size: 13px;
            font-weight: 600;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease forwards;
        }

        .btn-submit-login {
            width: 100%;
            padding: 15px;
            background-color: var(--bose-pink);
            border: none;
            border-radius: 14px;
            color: var(--bose-white);
            font-size: 16px;
            font-weight: 700 !important;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .btn-submit-login:hover {
            background-color: #ff7d93;
            box-shadow: 0 6px 16px rgba(255, 145, 164, 0.35);
        }

        .btn-submit-login:active {
            transform: scale(0.98);
        }

        .bose-admin-footer-copyright {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--bose-black);
            opacity: 0.6;
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .login-card-container {
                padding: 30px 20px;
                border-radius: 20px;
            }
        }
    </style>
</head>
<body>

    <main class="login-card-container">
        <!-- الهيدر البصري للعلامة التجارية -->
        <header class="brand-header-block">
            <div class="brand-logo-mock">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h1 class="brand-title-display">حلويات بوسي</h1>
            <p class="brand-subtitle-display">بوابة الدخول الآمنة المخصصة للإدارة فقط</p>
        </header>

        <!-- لوحة عرض الأخطاء اللحظية الآمنة -->
        <div id="error-banner" class="error-message-banner">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="error-text">عفواً، خطأ في بيانات الدخول!</span>
        </div>

        <!-- استمارة تسجيل الدخول -->
        <form id="bose-admin-login-form" onsubmit="handleAdminAuth(event)" autocomplete="off">
            <!-- حقل اسم المستخدم -->
            <div class="form-group-wrapper">
                <label for="admin-user-input" class="form-label-text">اسم مستخدم الإدارة</label>
                <div class="input-field-container">
                    <i class="fa-solid fa-user-shield"></i>
                    <input 
                        type="text" 
                        id="admin-user-input" 
                        class="bose-input-style" 
                        placeholder="ادخل اسم المستخدم" 
                        required 
                        autofocus
                        maxlength="30"
                    >
                </div>
            </div>

            <!-- حقل الرقم السري -->
            <div class="form-group-wrapper">
                <label for="admin-pass-input" class="form-label-text">الرقم السري</label>
                <div class="input-field-container">
                    <i class="fa-solid fa-key"></i>
                    <input 
                        type="password" 
                        id="admin-pass-input" 
                        class="bose-input-style" 
                        placeholder="ادخل الرقم السري" 
                        required
                        maxlength="40"
                    >
                    <button 
                        type="button" 
                        id="toggle-password-visibility" 
                        class="password-toggle-btn"
                        onclick="togglePasswordVisibility()"
                        aria-label="عرض الرقم السري"
                    >
                        <i class="fa-solid fa-eye" id="toggle-icon"></i>
                    </button>
                </div>
            </div>

            <!-- زر الدخول الحاسم -->
            <button type="submit" class="btn-submit-login">
                <span>تأكيد الدخول والعبور</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>

        <!-- كتلة حقوق النشر والتأريخ التلقائي 2026 -->
        <footer class="bose-admin-footer-copyright">
            <p>جميع الحقوق محفوظة لعلامة حلويات بوسي © 2026</p>
        </footer>
    </main>

    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('admin-pass-input');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        function handleAdminAuth(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('admin-user-input').value.trim();
            const passwordInput = document.getElementById('admin-pass-input').value.trim();
            const errorBanner = document.getElementById('error-banner');
            const errorText = document.getElementById('error-text');

            const cleanUsername = usernameInput.replace(/[<>'"&]/g, "");
            const cleanPassword = passwordInput.replace(/[<>'"&]/g, "");

            const SECURE_USER = "Aadmin";
            const SECURE_PASS = "Aaboohamdy";

            if (cleanUsername === SECURE_USER && cleanPassword === SECURE_PASS) {
                errorBanner.style.display = 'none';
                sessionStorage.setItem('bose_admin_session', 'authenticated_secure_token_' + Date.now());

                // تحسين ذكي: التوجيه النسبي المباشر لضمان التوافق مع الاستضافة المجانية و Vercel
                window.location.href = './dashboard.html';
            } else {
                errorText.textContent = "بيانات الاعتماد غير صحيحة. يرجى المراجعة والمحاولة مرة أخرى بحرص.";
                errorBanner.style.display = 'flex';
                
                document.getElementById('admin-pass-input').value = "";
                document.getElementById('admin-pass-input').focus();
            }
        }
    </script>
</body>
</html>
