<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/admin-theme.css?v=2026_admin_v1.0">
    <link rel="stylesheet" href="css/admin-layout.css?v=2026_admin_v1.0">
</head>
<body data-page="reports">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-card">
                    <div class="adm-card-header">
                        <div>
                            <h2><i class="fa-solid fa-chart-line"></i> اتجاه المبيعات</h2>
                            <p>عدد الطلبات والإيراد يوم بيوم (الطلبات الملغية مستبعدة)</p>
                        </div>
                        <div class="adm-gap-8">
                            <select class="adm-select" id="reports-range-select" style="width:auto;">
                                <option value="7">آخر 7 أيام</option>
                                <option value="30" selected>آخر 30 يوم</option>
                                <option value="90">آخر 90 يوم</option>
                            </select>
                        </div>
                    </div>
                    <div id="reports-summary-row" class="adm-stats-grid" style="margin-bottom: 18px;"></div>
                    <div id="reports-chart-wrap">
                        <div class="adm-loading-spinner"></div>
                    </div>
                </div>

                <div class="adm-card adm-mt-16">
                    <div class="adm-card-header">
                        <div>
                            <h2><i class="fa-solid fa-crown"></i> أكتر المنتجات مبيعاً</h2>
                            <p>حسب الكمية المباعة خلال نفس المدة المختارة فوق</p>
                        </div>
                    </div>
                    <div class="adm-table-wrapper">
                        <table class="adm-table">
                            <thead>
                                <tr>
                                    <th>المنتج</th>
                                    <th>الكمية المباعة</th>
                                    <th>الإيراد</th>
                                </tr>
                            </thead>
                            <tbody id="reports-top-products-tbody">
                                <tr><td colspan="3"><div class="adm-loading-spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin-data.js?v=2026_admin_v1.0"></script>
    <script src="js/admin-auth-guard.js?v=2026_admin_v1.0"></script>
    <script src="js/admin-ui-utils.js?v=2026_admin_v1.0"></script>
    <script src="js/admin-shell.js?v=2026_admin_v1.0"></script>
    <script src="js/pages/reports-page.js?v=2026_admin_v1.0"></script>
</body>
</html>
