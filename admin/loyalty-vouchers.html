<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القسائم الصادرة | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">

    <style>
        .lv-filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .lv-filters input { min-width: 220px; direction: ltr; text-align: right; }
        .lv-code { direction: ltr; text-align: right; font-weight: 800; }
    </style>
</head>
<body data-page="loyalty-vouchers">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-stats-grid" id="lv-stats-grid"></div>

                <div class="adm-card adm-mt-16">
                    <div class="adm-card-header">
                        <div>
                            <h2>كل القسائم الصادرة</h2>
                            <p>كل قسايم الهدية اللي اتكسبت عبر دورة الولاء - مين استخدمها، قد إيه فلوس اتصرفت من خلالها، والمنتهية صلاحيتها</p>
                        </div>
                        <button class="adm-btn adm-btn-primary" id="lv-issue-btn">
                            <i class="fa-solid fa-plus"></i> إصدار قسيمة يدوي
                        </button>
                        <div class="lv-filters">
                            <input type="text" class="adm-input" id="lv-search-input" placeholder="بحث بالكود / رقم التليفون...">
                            <select class="adm-select" id="lv-status-filter">
                                <option value="">كل الحالات</option>
                                <option value="active">نشطة</option>
                                <option value="used">اتصرفت بالكامل</option>
                                <option value="expired">منتهية الصلاحية</option>
                            </select>
                        </div>
                    </div>
                    <div class="adm-table-wrapper">
                        <table class="adm-table" id="lv-table">
                            <thead>
                                <tr>
                                    <th>الكود</th>
                                    <th>رقم التليفون</th>
                                    <th>القيمة الأصلية</th>
                                    <th>المتبقي</th>
                                    <th>اتكسبت في طلب</th>
                                    <th>آخر استخدام</th>
                                    <th>تاريخ الصدور</th>
                                    <th>تنتهي في</th>
                                    <th>الحالة</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="lv-tbody">
                                <tr><td colspan="10"><div class="adm-loading-spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth-guard.js"></script>
    <script src="js/admin-ui-utils.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/pages/loyalty-vouchers-page.js"></script>
</body>
</html>
