<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم - إدارة الطلبات والفواتير | حلويات بوسي</title>
    <!-- استدعاء الهندسة الرقمية للنصوص والخط المعتمد Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bose-pink: #FF91A4;
            --bose-white: #FFFFFF;
            --bose-black: #111111;
            --bose-gold: #D4AF37;
            --bose-shadow-glow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --bose-shadow-hover: 0 16px 40px rgba(255, 145, 164, 0.22);
            --bose-border-pink: 1px solid rgba(255, 145, 164, 0.3);
            --bose-border-thick: 2px solid #FF91A4;
        }

        body {
            font-family: 'Cairo', sans-serif !important;
            background-color: var(--bose-white) !important;
            color: var(--bose-black) !important;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* حاوية بوابة تسجيل الدخول الآمنة */
        .login-gate-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--bose-white);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bose-white);
            border: var(--bose-border-pink);
            box-shadow: var(--bose-shadow-glow);
            border-radius: 20px;
            padding: 32px;
            box-sizing: border-box;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: var(--bose-shadow-hover);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700 !important;
            margin: 0;
            color: var(--bose-black);
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--bose-black);
            opacity: 0.7;
            margin: 4px 0 0 0;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--bose-black);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            border: var(--bose-border-pink);
            border-radius: 12px;
            box-sizing: border-box;
            background-color: var(--bose-white);
            color: var(--bose-black);
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--bose-pink);
            box-shadow: 0 0 0 3px rgba(255, 145, 164, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: var(--bose-white);
            background-color: var(--bose-pink);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:opacity {
            opacity: 0.9;
        }

        .error-message {
            color: #d93025;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        /* حاوية لوحة التحكم المركزية بالطلبات */
        .dashboard-container {
            display: none;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--bose-border-pink);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .dashboard-title {
            font-size: 24px;
            font-weight: 700 !important;
            margin: 0;
        }

        .btn-logout {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Cairo', sans-serif;
            color: var(--bose-black);
            background-color: transparent;
            border: var(--bose-border-pink);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-logout:hover {
            background-color: rgba(255, 145, 164, 0.1);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .order-card {
            background: var(--bose-white);
            border: var(--bose-border-pink);
            box-shadow: var(--bose-shadow-glow);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed rgba(255, 145, 164, 0.2);
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-id {
            font-weight: 700;
            color: var(--bose-pink);
            font-size: 16px;
        }

        .order-date {
            font-size: 13px;
            opacity: 0.6;
        }

        .customer-info-block {
            margin-bottom: 16px;
        }

        .info-row {
            margin-bottom: 6px;
            font-size: 14px;
        }

        .info-label {
            font-weight: 600;
            opacity: 0.7;
        }

        .items-list {
            background: rgba(255, 145, 164, 0.03);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .custom-badge {
            font-size: 11px;
            background: var(--bose-gold);
            color: var(--bose-white);
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 600;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .total-price-display {
            font-size: 18px;
            font-weight: 700;
            color: var(--bose-black);
        }

        .total-price-display span {
            color: var(--bose-pink);
        }

        .no-orders {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
            font-size: 16px;
        }

        @media (min-width: 768px) {
            .orders-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .orders-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- بوابة تسجيل الدخول الآمنة المخصصة للإدارة فقط -->
    <div id="loginGate" class="login-gate-container">
        <div class="login-card">
            <div class="brand-header">
                <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="لوجو حلويات بوسي" class="brand-logo">
                <h1 class="brand-title">حلويات بوسي</h1>
                <p class="brand-subtitle">بوابة الإدارة الآمنة</p>
            </div>
            <form id="loginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label for="usernameField">اسم المستخدم</label>
                    <input type="text" id="usernameField" class="form-control" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="passwordField">الرقم السري</label>
                    <input type="password" id="passwordField" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-submit">تسجيل الدخول</button>
                <div id="loginError" class="error-message">بيانات الدخول غير صحيحة!</div>
            </form>
        </div>
    </div>

    <!-- لوحة عرض ومتابعة طلبات العملاء والفواتير -->
    <div id="dashboardSection" class="dashboard-container">
        <div class="dashboard-header">
            <h2 class="dashboard-title">متابعة طلبات عملاء حلويات بوسي</h2>
            <button class="btn-logout" onclick="handleAdminLogout()">تسجيل الخروج</button>
        </div>
        
        <div id="ordersWrapper" class="orders-grid">
            <!-- يتم حقن الطلبات ديناميكياً هنا -->
        </div>
    </div>

    <script>
        // بيانات الاعتماد الرسمية والمشفرة محلياً لمنع الوصول العشوائي
        const AUTH_CONFIG = {
            user: "Aadmin",
            pass: "Aaboohamdy"
        };

        // دالة الفحص الأمني التلقائي فور تحميل الصفحة لضمان استقرار الجلسة
        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("bose_admin_session") === "authenticated") {
                showDashboard();
            }
        });

        // دالة معالجة تسجيل الدخول والتحقق الآمن
        function handleAdminLogin(event) {
            event.preventDefault();
            const uField = document.getElementById("usernameField").value.trim();
            const pField = document.getElementById("passwordField").value.trim();
            const errorDiv = document.getElementById("loginError");

            if (uField === AUTH_CONFIG.user && pField === AUTH_CONFIG.pass) {
                errorDiv.style.display = "none";
                sessionStorage.setItem("bose_admin_session", "authenticated");
                showDashboard();
            } else {
                errorDiv.style.display = "block";
                document.getElementById("passwordField").value = "";
            }
        }

        // دالة تسجيل الخروج وتدمير الجلسة الآمنة
        function handleAdminLogout() {
            sessionStorage.removeItem("bose_admin_session");
            document.getElementById("usernameField").value = "";
            document.getElementById("passwordField").value = "";
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("loginGate").style.display = "flex";
        }

        // دالة تفعيل واجهة لوحة التحكم وجلب الفواتير
        function showDashboard() {
            document.getElementById("loginGate").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";
            renderAdminOrders();
        }

        // دالة تطهير النصوص لمنع ثغرات XSS
        function sanitizeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#x27;');
        }

        // دالة استدعاء وحقن طلبات العملاء ديناميكياً
        function renderAdminOrders() {
            const wrapper = document.getElementById("ordersWrapper");
            
            // جلب الفواتير المخزنة في الذاكرة المحلية
            const rawOrders = localStorage.getItem("bose_orders_log");
            const orders = rawOrders ? JSON.parse(rawOrders) : [];

            if (orders.length === 0) {
                wrapper.innerHTML = `<div class="no-orders">لا توجد طلبات أو فواتير مسجلة حالياً في النظام.</div>`;
                return;
            }

            // ترتيب الطلبات من الأحدث للأقدم
            orders.reverse();

            let htmlContent = "";
            orders.forEach(order => {
                const methodText = order.deliveryMethod === "pickup" ? "استلام من الفرع" : "توصيل للمنزل";
                
                let itemsHtml = "";
                if (Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        const isCustom = item.type === "custom-cake" || item.type === "custom-flower" ? `<span class="custom-badge">مخصص</span>` : "";
                        itemsHtml += `
                            <div class="item-row">
                                <div>${isCustom}<strong>${sanitizeHTML(item.title)}</strong> (${sanitizeHTML(item.flavorName)})</div>
                                <div>${parseInt(item.quantity) || 1} × ${parseFloat(item.finalPrice).toFixed(0)} ج.م</div>
                            </div>
                        `;
                    });
                }

                htmlContent += `
                    <div class="order-card">
                        <div class="order-card-header">
                            <span class="order-id">طلب رقم: ${sanitizeHTML(order.orderId)}</span>
                            <span class="order-date">${sanitizeHTML(order.timestamp || '')}</span>
                        </div>
                        <div class="customer-info-block">
                            <div class="info-row"><span class="info-label">العميل:</span> ${sanitizeHTML(order.customerName)}</div>
                            <div class="info-row"><span class="info-label">الهاتف:</span> ${sanitizeHTML(order.customerPhone)}</div>
                            ${order.customerPhone2 ? `<div class="info-row"><span class="info-label">الهاتف البديل:</span> ${sanitizeHTML(order.customerPhone2)}</div>` : ''}
                            <div class="info-row"><span class="info-label">طريقة الاستلام:</span> ${methodText}</div>
                            ${order.shippingZone ? `<div class="info-row"><span class="info-label">منطقة الشحن:</span> ${sanitizeHTML(order.shippingZone)}</div>` : ''}
                            ${order.addressDetails ? `<div class="info-row"><span class="info-label">العنوان بالتفصيل:</span> ${sanitizeHTML(order.addressDetails)}</div>` : ''}
                            <div class="info-row"><span class="info-label">موعد التجهيز:</span> ${sanitizeHTML(order.deliveryDate)} في ${sanitizeHTML(order.deliveryTime)}</div>
                            ${order.orderNotes ? `<div class="info-row"><span class="info-label">ملاحظات العميل:</span> ${sanitizeHTML(order.orderNotes)}</div>` : ''}
                        </div>
                        <div class="items-list">
                            ${itemsHtml}
                        </div>
                        <div class="order-footer">
                            <div class="total-price-display">إجمالي الفاتورة: <span>${Math.round(order.grandTotal || 0)} ج.م</span></div>
                        </div>
                    </div>
                `;
            });

            wrapper.innerHTML = htmlContent;
        }
    </script>
</body>
</html>
