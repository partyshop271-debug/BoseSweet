<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلبات | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../vendor/fonts/cairo/cairo.css?v=2026_local_v1.0">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">
</head>
<body data-page="orders">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-card">
                    <div class="adm-card-header">
                        <div>
                            <h2>كل الطلبات</h2>
                            <p>اضغط على أي طلب لعرض تفاصيله وتحديث حالته</p>
                        </div>
                        <div class="adm-orders-filters">
                            <input type="text" class="adm-input adm-orders-search" id="orders-search-input"
                                   placeholder="بحث برقم الطلب / الاسم / التليفون...">
                            <select class="adm-select adm-orders-status-filter" id="orders-status-filter">
                                <option value="">كل الحالات</option>
                            </select>
                            <button type="button" class="adm-btn adm-btn-danger" id="orders-delete-cancelled-btn">
                                <i class="fa-solid fa-broom"></i> حذف كل الملغي
                            </button>
                            <button type="button" class="adm-btn adm-btn-outline" id="orders-export-csv-btn">
                                <i class="fa-solid fa-file-csv"></i> تصدير Excel
                            </button>
                        </div>
                    </div>

                    <!-- 🆕 [تحسين إنتاجية - فلتر تاريخ سريع]: بدل ما تدوّري وسط كل
                         الطلبات المتراكمة، دوسي زرار واحد تشوفي بس طلبات اليوم/أمس/الأسبوع -->
                    <div class="adm-orders-date-filter" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
                        <button type="button" class="adm-chip active" data-range="all">كل الطلبات</button>
                        <button type="button" class="adm-chip" data-range="today">اليوم</button>
                        <button type="button" class="adm-chip" data-range="yesterday">أمس</button>
                        <button type="button" class="adm-chip" data-range="week">آخر 7 أيام</button>
                    </div>

                    <div class="adm-orders-bulk-bar" id="orders-bulk-bar" style="display:none;">
                        <span id="orders-bulk-count">0 طلب محدد</span>
                        <button type="button" class="adm-btn adm-btn-ghost" id="orders-bulk-clear-btn">إلغاء التحديد</button>
                        <!-- 🆕 [تحسين إنتاجية - تحديث حالة جماعي] -->
                        <select class="adm-select" id="orders-bulk-status-select" style="width:auto; min-width:160px; margin-inline-start:auto;"></select>
                        <button type="button" class="adm-btn adm-btn-primary" id="orders-bulk-status-btn">
                            <i class="fa-solid fa-check-double"></i> تحديث الحالة
                        </button>
                        <button type="button" class="adm-btn adm-btn-danger" id="orders-bulk-delete-btn">
                            <i class="fa-solid fa-trash"></i> حذف المحدد
                        </button>
                    </div>

                    <div class="adm-table-wrapper">
                        <table class="adm-table" id="orders-table">
                            <thead>
                                <tr>
                                    <th style="width:36px;"><input type="checkbox" id="orders-select-all"></th>
                                    <th>رقم الطلب</th>
                                    <th>العميل</th>
                                    <th>الهاتف</th>
                                    <th>الإجمالي</th>
                                    <th>الحالة</th>
                                    <th>التاريخ</th>
                                </tr>
                            </thead>
                            <tbody id="orders-tbody">
                                <tr><td colspan="7"><div class="adm-loading-spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../vendor/supabase-js/supabase.js"></script>
    <!-- 🧾 [أداة داخلية]: نفس ملف توليد صورة الفاتورة المستخدم في الموقع العام
         (js/invoice-image-generator.js في جذر المشروع) - بيتحمّل بمساره النسبي
         هنا بدل ما يتكرر كملف منفصل جوه admin/js/، عشان يفضل مصدر واحد للحقيقة
         ومنعاً لتكرار مشكلة تفرّع الملفات اللي حصلت قبل كده مع core-engine.js
         وcart-engine.js وsupabase-client.js. -->
    <script src="../js/invoice-image-generator.js"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth-guard.js"></script>
    <script src="js/admin-ui-utils.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/pages/orders-page.js"></script>
</body>
</html>
