<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - بوابة الطلبات الآمنة | حلويات بوسي</title>
    <!-- استدعاء المحرك المركزي الموحد لحلويات بوسي V3 في رأس الصفحة إجبارياً -->
    <script src="../js/core-engine.js"></script>
    
    <style>
        :root {
            --admin-pink: #FF91A4;
            --admin-white: #FFFFFF;
            --admin-black: #111111;
            --admin-gold: #D4AF37;
            --admin-shadow: 0 8px 32px rgba(255, 145, 164, 0.12);
            --admin-border: 1px solid rgba(255, 145, 164, 0.3);
        }

        body {
            font-family: 'Cairo', sans-serif !important;
            background-color: var(--admin-white) !important;
            color: var(--admin-black) !important;
            margin: 0;
            padding: 0;
            direction: rtl;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--admin-white);
            border: 2px solid var(--admin-pink);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: var(--admin-shadow);
        }

        .auth-card h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--admin-black);
        }

        .auth-card p {
            font-size: 14px;
            color: var(--admin-black);
            margin-bottom: 25px;
            font-weight: 400;
        }

        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: var(--admin-border);
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--admin-pink);
            box-shadow: 0 0 8px rgba(255, 145, 164, 0.2);
        }

        .btn-admin-submit {
            width: 100%;
            background-color: var(--admin-pink);
            color: var(--admin-white);
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--admin-shadow);
        }

        .btn-admin-submit:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .dashboard-wrapper {
            display: none;
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--admin-border);
            padding-bottom: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dashboard-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .btn-logout {
            background: transparent;
            border: var(--admin-border);
            color: var(--admin-black);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: rgba(255, 145, 164, 0.1);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .order-admin-card {
            background: var(--admin-white);
            border: var(--admin-border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--admin-shadow);
            position: relative;
            transition: transform 0.3s ease;
        }

        .order-admin-card:hover {
            transform: translateY(-3px);
        }

        .order-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px dashed rgba(255, 145, 164, 0.3);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .order-id-badge {
            font-weight: 700;
            color: var(--admin-black);
            font-size: 16px;
        }

        .order-status-select {
            padding: 6px 12px;
            border-radius: 8px;
            border: var(--admin-border);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
        }

        .customer-info-box {
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .customer-info-box strong {
            color: var(--admin-black);
        }

        .order-items-list {
            background: rgba(255, 145, 164, 0.04);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .order-item-detail {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(17, 17, 17, 0.05);
        }

        .order-item-detail:last-child {
            border-bottom: none;
        }

        .order-custom-specs {
            display: block;
            font-size: 12px;
            color: rgba(17, 17, 17, 0.7);
            margin-top: 4px;
            padding-right: 10px;
            border-right: 2px solid var(--admin-pink);
        }

        .order-financial-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 145, 164, 0.3);
        }

        .price-display-admin {
            color: var(--admin-pink);
        }

        .no-orders-message {
            text-align: center;
            padding: 40px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(17, 17, 17, 0.6);
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .btn-logout {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div id="admin-auth-block" class="auth-container">
        <div class="auth-card">
            <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1780054759/logo_igggsb.png" alt="Bose Sweets" style="max-width: 90px; margin-bottom: 15px;">
            <h1>مدير النظام</h1>
            <p>سجل دخولك لاستعراض ومتابعة طلبات عملاء حلويات بوسي</p>
            
            <form id="admin-login-form" onsubmit="event.preventDefault(); window.verifyAdminCredentials();">
                <div class="form-group">
                    <label for="admin-user">اسم المستخدم الفاخر</label>
                    <input type="text" id="admin-user" class="form-control" placeholder="ادخل اسم المستخدم" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="admin-pass">كلمة المرور المشفرة</label>
                    <input type="password" id="admin-pass" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-admin-submit">تفعيل الصلاحية الآمنة</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard-block" class="dashboard-wrapper">
        <div class="dashboard-header">
            <div>
                <h2>متابعة طلبات العملاء والفواتير</h2>
            </div>
            <button class="btn-logout" onclick="terminateAdminSession()">إنهاء الجلسة الآمنة</button>
        </div>

        <div id="admin-orders-grid" class="orders-grid"></div>
    </div>

    <script>
        const SECURE_TOKEN = "bose_admin_session";

        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem(SECURE_TOKEN) === "active_session") {
                showDashboardView();
            }
        });

        function showDashboardView() {
            document.getElementById("admin-auth-block").style.display = "none";
            document.getElementById("admin-dashboard-block").style.display = "block";
            renderAdminOrdersGrid();
        }

        function renderAdminOrdersGrid() {
            const gridContainer = document.getElementById("admin-orders-grid");
            const storedOrdersRaw = localStorage.getItem("bose_orders");
            const ordersList = storedOrdersRaw ? JSON.parse(storedOrdersRaw) : [];

            if (ordersList.length === 0) {
                gridContainer.innerHTML = `<div class="no-orders-message">لا توجد طلبات مسجلة في قاعدة البيانات المحلية حالياً.</div>`;
                return;
            }

            ordersList.sort((a, b) => b.timestamp - a.timestamp);
            let gridHTML = "";

            ordersList.forEach(order => {
                let itemsHTML = "";
                order.items.forEach(item => {
                    let customSpecsHTML = "";
                    if (item.customDetails) {
                        const d = item.customDetails;
                        let specsArray = [];
                        
                        if (item.type === "custom-flower" || item.type === "custom-cake") {
                            if (d.flowerType && d.flowerType !== "none") specsArray.push(`نوع الورد: ${d.flowerType}`);
                            if (d.flowerCount) specsArray.push(`عدد الورد: ${d.flowerCount}`);
                            if (d.cakeType) specsArray.push(`النكهة: ${d.cakeType}`);
                            if (d.shape) specsArray.push(`الشكل: ${d.shape}`);
                            if (d.persons) specsArray.push(`الأفراد: ${d.persons}`);
                            if (d.satinRibbonText) specsArray.push(`شريط ستان: ${d.satinRibbonText}`);
                            if (d.cashAmount) specsArray.push(`كاش مدمج: ${d.cashAmount} جنيه (فئة ${d.cashCategory})`);
                            if (d.chocolateBudget) specsArray.push(`شوكولاتة بميزانية: ${d.chocolateBudget} جنيه`);
                            if (d.giftCardText) specsArray.push(`كارت إهداء: ${d.giftCardText}`);
                        } else {
                            if (d.size) specsArray.push(`الحجم: ${d.size}`);
                            if (d.customMessage) specsArray.push(`الرسالة: ${d.customMessage}`);
                        }
                        if (d.allergyNote) specsArray.push(`⚠️ ملاحظة طبية: ${d.allergyNote}`);
                        if (specsArray.length > 0) {
                            customSpecsHTML = `<span class="order-custom-specs">${specsArray.join(' | ')}</span>`;
                        }
                    }

                    itemsHTML += `
                        <div class="order-item-detail">
                            <div>
                                <strong>${escapeSecureText(item.title)}</strong> × ${parseInt(item.quantity)}
                                ${customSpecsHTML}
                            </div>
                            <div>${parseFloat(item.finalPrice).toFixed(2)} جنيه</div>
                        </div>
                    `;
                });

                const currentStatus = order.status || "pending";

                gridHTML += `
                    <div class="order-admin-card" id="order-card-${order.orderId}">
                        <div class="order-meta-row">
                            <span class="order-id-badge">رقم الطلب: #${escapeSecureText(order.orderId)}</span>
                            <select class="order-status-select" onchange="updateOrderStatus('${order.orderId}', this.value)">
                                <option value="pending" ${currentStatus === 'pending' ? 'selected' : ''}>قيد الانتظار</option>
                                <option value="preparing" ${currentStatus === 'preparing' ? 'selected' : ''}>جاري التجهيز في الفرع</option>
                                <option value="shipping" ${currentStatus === 'shipping' ? 'selected' : ''}>مع المندوب للتوصيل</option>
                                <option value="completed" ${currentStatus === 'completed' ? 'selected' : ''}>تم التسليم بنجاح</option>
                                <option value="cancelled" ${currentStatus === 'cancelled' ? 'selected' : ''}>ملغي</option>
                            </select>
                        </div>
                        
                        <div class="customer-info-box">
                            <strong>العميل:</strong> ${escapeSecureText(order.customerName)}<br>
                            <strong>الهاتف الأساسي:</strong> <a href="tel:${escapeSecureText(order.customerPhone)}" style="color:var(--admin-black); text-decoration:none;">${escapeSecureText(order.customerPhone)}</a>
                            ${order.customerPhone2 ? `<br><strong>الهاتف البديل:</strong> ${escapeSecureText(order.customerPhone2)}` : ''}<br>
                            <strong>طريقة الاستلام:</strong> ${order.deliveryMethod === 'delivery' ? 'توصيل للمنزل' : 'استلام من الفرع'}<br>
                            ${order.deliveryMethod === 'delivery' ? `<strong>المنطقة والنشاط:</strong> ${escapeSecureText(order.shippingZone)} - ${escapeSecureText(order.addressDetails)}<br>` : ''}
                            <strong>موعد التجهيز المطلوب:</strong> التاريخ: ${escapeSecureText(order.deliveryDate)} | الساعة: ${escapeSecureText(order.deliveryTime)}
                            ${order.notes ? `<br><strong>ملاحظات حرة:</strong> ${escapeSecureText(order.notes)}` : ''}
                        </div>

                        <div class="order-items-list">
                            ${itemsHTML}
                        </div>

                        <div class="order-financial-summary">
                            <div>إجمالي الفاتورة:</div>
                            <div class="price-display-admin">${Math.round(order.grandTotal)} جنيه</div>
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = gridHTML;
        }

        function updateOrderStatus(orderId, newStatus) {
            const storedOrdersRaw = localStorage.getItem("bose_orders");
            if (!storedOrdersRaw) return;

            let ordersList = JSON.parse(storedOrdersRaw);
            const orderIndex = ordersList.findIndex(o => o.orderId === orderId);
            if (orderIndex !== -1) {
                ordersList[orderIndex].status = newStatus;
                localStorage.setItem("bose_orders", JSON.stringify(ordersList));
            }
        }

        function terminateAdminSession() {
            localStorage.removeItem(SECURE_TOKEN);
            window.location.reload();
        }

        function escapeSecureText(text) {
            if (!text) return "";
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
    <script src="admin.js"></script>
</body>
</html>
