<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مناطق التوصيل | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="../vendor/fonts/cairo/cairo.css?v=2026_local_v1.0">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">
</head>
<body data-page="shipping-zones">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-card">
                    <div class="adm-card-header">
                        <div>
                            <h2>مناطق التوصيل</h2>
                            <p>إدارة المناطق ورسوم الشحن الظاهرة للعميل وقت اختيار التوصيل</p>
                        </div>
                        <button class="adm-btn adm-btn-primary" id="add-zone-btn">
                            <i class="fa-solid fa-plus"></i> منطقة جديدة
                        </button>
                    </div>
                    <div class="adm-table-wrapper">
                        <table class="adm-table" id="zones-table">
                            <thead>
                                <tr>
                                    <th>المحافظة</th>
                                    <th>المدينة</th>
                                    <th>المنطقة</th>
                                    <th>سعر التوصيل</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="zones-tbody">
                                <tr><td colspan="5"><div class="adm-loading-spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../vendor/supabase-js/supabase.js"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth-guard.js"></script>
    <script src="js/admin-ui-utils.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/pages/shipping-page.js"></script>
</body>
</html>
