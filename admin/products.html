<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنتجات | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">
</head>
<body data-page="products">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-card">
                    <div class="adm-card-header">
                        <div>
                            <h2>كل المنتجات</h2>
                            <p>إضافة وتعديل وحذف منتجات المتجر</p>
                        </div>
                        <div class="adm-products-filters">
                            <input type="text" class="adm-input adm-products-search" id="products-search-input"
                                   placeholder="بحث بالاسم...">
                            <select class="adm-select adm-products-category-filter" id="products-category-filter">
                                <option value="">كل الفئات</option>
                            </select>
                            <label class="adm-checkbox-label" style="white-space:nowrap;">
                                <input type="checkbox" id="products-missing-photo-filter">
                                بدون صورة حقيقية بس
                            </label>
                            <button class="adm-btn adm-btn-primary" id="add-product-btn">
                                <i class="fa-solid fa-plus"></i> منتج جديد
                            </button>
                        </div>
                    </div>
                    <div class="adm-products-bulk-bar" id="products-bulk-bar" style="display:none;">
                        <span id="products-bulk-count">0 منتج محدد</span>
                        <button type="button" class="adm-btn adm-btn-ghost" id="products-bulk-clear-btn">إلغاء التحديد</button>
                        <button type="button" class="adm-btn adm-btn-primary" id="products-bulk-price-btn">
                            <i class="fa-solid fa-tags"></i> تعديل السعر جماعياً
                        </button>
                    </div>

                    <div class="adm-table-wrapper">
                        <table class="adm-table" id="products-table">
                            <thead>
                                <tr>
                                    <th style="width:36px;"><input type="checkbox" id="products-select-all"></th>
                                    <th></th>
                                    <th>الاسم</th>
                                    <th>الفئة</th>
                                    <th>السعر</th>
                                    <th>السعر القديم</th>
                                    <th>مميز</th>
                                    <th>الحالة</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="products-tbody">
                                <tr><td colspan="8"><div class="adm-loading-spinner"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth-guard.js"></script>
    <script src="js/admin-ui-utils.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/pages/products-page.js"></script>
</body>
</html>
