<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">
</head>
<body>

    <div class="adm-login-wrapper">
        <div class="adm-login-card">
            <div class="adm-login-brand">
                <div class="adm-login-brand-badge"><i class="fa-solid fa-cake-candles"></i></div>
                <h1>لوحة تحكم حلويات بوسي</h1>
                <p>سجّل دخولك للمتابعة إلى إدارة المتجر</p>
            </div>

            <div class="adm-login-error" id="login-error-box"></div>

            <form id="login-form">
                <div class="adm-field">
                    <label for="login-email">البريد الإلكتروني</label>
                    <input type="email" id="login-email" class="adm-input" placeholder="you@example.com" required autocomplete="username">
                </div>
                <div class="adm-field">
                    <label for="login-password">كلمة المرور</label>
                    <input type="password" id="login-password" class="adm-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="adm-btn adm-btn-primary adm-w-full" id="login-submit-btn" style="margin-top: 6px;">
                    <i class="fa-solid fa-right-to-bracket"></i> دخول
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/pages/login-page.js"></script>
</body>
</html>
