<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهدايا والزينة | لوحة تحكم حلويات بوسي</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="manifest" href="/admin/admin.webmanifest">
    <meta name="theme-color" content="#FF91A4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="../vendor/fonts/cairo/cairo.css?v=2026_local_v1.0">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=2026_local_v1.0" fetchpriority="high">

    <link rel="stylesheet" href="css/admin-theme.css">
    <link rel="stylesheet" href="css/admin-layout.css">
</head>
<body data-page="gifts">

    <!-- شاشة تحميل تظهر لحد ما يتأكد من الجلسة -->
    <div class="adm-auth-gate"><div class="adm-loading-spinner"></div></div>

    <div class="adm-shell">
        <div id="adm-shell-target"></div>

        <main class="adm-main">
            <div id="adm-topbar-target"></div>

            <div class="adm-content" id="adm-page-content">

                <div class="adm-card">
                    <div class="adm-card-header">
                        <div>
                            <h2>الهدايا والزينة</h2>
                            <p>أضيفي هدايا كاملة وزينة وورد، ورتبي الرفوف اللي بتظهر للعميل، من غير كود. كل هدية بتتباع زي أي منتج عادي في السلة.</p>
                        </div>
                        <button class="adm-btn adm-btn-primary" id="gf-add-btn" type="button"><i class="fa-solid fa-plus"></i> <span id="gf-add-label">إضافة هدية</span></button>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap; padding:0 20px 14px;" id="gf-tabs">
                        <button class="adm-chip active" data-tab="gifts" type="button">الهدايا</button>
                        <button class="adm-chip" data-tab="shelves" type="button">الرفوف</button>
                        <button class="adm-chip" data-tab="heroes" type="button">الواجهة الكبيرة</button>
                        <button class="adm-chip" data-tab="tags" type="button">المناسبات والعلامات</button>
                    </div>
                    <div class="adm-hint" style="padding:0 20px 14px;" id="gf-hint"></div>
                    <div class="adm-table-wrapper">
                        <table class="adm-table">
                            <thead><tr id="gf-thead"></tr></thead>
                            <tbody id="gf-tbody"><tr><td colspan="6"><div class="adm-loading-spinner"></div></td></tr></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../vendor/supabase-js/supabase.js"></script>
    <script src="../js/phone-utils.js"></script>
    <script src="js/admin-data.js"></script>
    <script src="js/admin-auth-guard.js"></script>
    <script src="js/admin-ui-utils.js"></script>
    <script src="js/admin-shell.js"></script>
    <script src="js/pages/gifts-page.js"></script>
</body>
</html>
