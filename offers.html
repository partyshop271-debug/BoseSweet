        var esc = function (v) { return (window.escapeBoseHTML ? window.escapeBoseHTML(String(v == null ? "" : v)) : String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; })); };

            if (!line) { for (i = 0; i < cart.length; i++) { if (cart[i] && cart[i].productSlug === slug) { line = cart[i]; break; } } }

            if (delta > 0) {

            var reached = [], next = null, total = 0, maxMin = 0;

        /* ---------- رسم الصفحة ---------- */

                groups[key].push(r);

            function settingsFor(key) {
                for (var i = 0; i < settingsList.length; i++) { if (String(settingsList[i].campaign || "").trim() === key) return settingsList[i]; }

            }
            order.sort(function (a, b) {
                var sa = settingsFor(a), sb = settingsFor(b);

                    if (p.isAvailable === false || (ppu && ppu > 1) || (p.customBuilderUrl && p.builderType && p.builderType !== "standard")) return false;
                    if (seen[p.slug]) return false;

                    if (inAny) seen[p.slug] = true;

                });
                var imgs = flavors.map(function (p) { return (p.images && p.images[0]) || ""; }).filter(Boolean);
                var starts = ps.map(function (r) { return r.starts_at ? new Date(r.starts_at).getTime() : 0; });
                var minStart = Math.min.apply(null, starts);
                var upcoming = minStart > now;
                var endsArr = ps.map(function (r) { return r.ends_at ? new Date(r.ends_at).getTime() : 0; }).filter(Boolean);
                var target = upcoming ? minStart : (endsArr.length ? Math.min.apply(null, endsArr) : 0);
                var maxEnd = endsArr.length ? Math.max.apply(null, endsArr) : 0;
                var oneDay = !!maxEnd && (maxEnd - (minStart || now) <= 26 * 3600 * 1000);

                var catIds = []; ps.forEach(function (r) { if (r.scope_type === "category" && Array.isArray(r.scope_ids)) r.scope_ids.forEach(function (id) { if (catIds.indexOf(id) === -1) catIds.push(id); }); });
                var catTitle = "";
                if (catIds.length === 1) { for (var ci = 0; ci < cats.length; ci++) { if (cats[ci] && cats[ci].id === catIds[0]) { catTitle = cats[ci].title || ""; break; } } }
                var headingHtml = s.hero_title ? esc(s.hero_title) : (catTitle ? ('خصم على <em>' + esc(catTitle) + '</em> بكل النكهات') : (key ? esc(key) : 'عروضنا <em>الحالية</em>'));
                var best = ps.slice().sort(function (a, b) { return minOf(b) - minOf(a); })[0];
                var tabSub = (ps.length > 1 && best.reward_type === "percent_off" ? "حتى " : "") + rewardShort(best);
                return {
                    i: i, key: key, promos: ps, flavors: flavors, imgs: imgs, target: target, upcoming: upcoming, oneDay: oneDay,
                    headingHtml: headingHtml,
                    chip: s.badge_text || (oneDay ? "عرض ليوم واحد فقط" : "عروض لفترة محدودة"),
                    sub: s.hero_sub || "اختاري العرض اللي يناسبك والنكهات اللي تحبيها، والخصم بيتحسب تلقائيًا في السلة.",
                    flavorsTitle: catTitle ? ("نكهات " + catTitle + " والأسعار") : "النكهات والأسعار",
                    tabTitle: s.tab_title || key || (catTitle ? ("عروض " + catTitle) : "العروض"),
                    tabSub: tabSub,
                    tabImg: s.image_url || imgs[0] || "",
                    showTimer: flag("show_timer"), showCounter: flag("show_counter"), showProgress: flag("show_progress"),
                    showFlavors: flag("show_flavors"), showImages: flag("show_images")
                };
            });
            state.camps = camps;
            if (state.active >= camps.length) state.active = 0;

            if (holder) holder.innerHTML = camps.map(function (c) { return buildCamp(c, data); }).join("");

            // شريط التبويبات (بيظهر بس لو أكتر من حملة)
            var tabsEl = $("op-tabs-inner");
            if (tabsEl) {
                tabsEl.innerHTML = camps.map(function (c) {
                    var pic = c.tabImg ? '<img src="' + esc(thumb(c.tabImg, 96)) + '" alt="" width="48" height="48" decoding="async">' : '<span class="op-tab-ph" aria-hidden="true"><i class="fa-solid fa-gift"></i></span>';
                    return '<button type="button" class="op-tab' + (c.i === state.active ? " is-active" : "") + '" data-tab="' + c.i + '" aria-controls="camp-' + c.i + '">' + pic +
                        '<span><strong>' + esc(c.tabTitle) + '</strong><small>' + esc(c.tabSub) + '</small></span></button>';
                }).join("");
            }
            show("op-tabs", camps.length > 1);

            // العدّادات التنازلية (كل حملة بوقتها) - أحمر في آخر ساعة
            var anyTarget = camps.some(function (c) { return !!c.target; });
            function update() {
                var expired = false;
                camps.forEach(function (c) {
                    if (!c.target) return;
                    var left = Math.max(0, c.target - Date.now());
                    var total = Math.floor(left / 1000);
                    var h = pad(Math.floor(total / 3600)), m = pad(Math.floor((total % 3600) / 60)), s2 = pad(total % 60);
                    var sec = $("camp-" + c.i);
                    var urgent = !c.upcoming && left > 0 && left <= 3600 * 1000;
                    if (sec) {
                        var eh = sec.querySelector(".t-h"), em = sec.querySelector(".t-m"), es = sec.querySelector(".t-s");
                        if (eh) eh.textContent = h; if (em) em.textContent = m; if (es) es.textContent = s2;
                        var wrap = sec.querySelector(".op-timer-wrap"); if (wrap) wrap.classList.toggle("urgent", urgent);
                    }
                    if (c.i === Math.min(state.active, camps.length - 1)) {
                        var bt = $("op-bar-timer"); if (bt) bt.textContent = h + ":" + m + ":" + s2;
                        var bar = $("op-bar"); if (bar) bar.classList.toggle("urgent", urgent);
                    }
                    if (left <= 0) expired = true;
                });
                if (expired) render(); // بدأ أو خلص: نعيد رسم الصفحة بالحالة الجديدة
            }
            if (anyTarget) { update(); tick = setInterval(update, 1000); }
            refresh();
        }

        /* ---------- أحداث (مرة واحدة) ---------- */
        document.addEventListener("click", function (e) {
            var t = e.target;
            if (!t || !t.closest) return;
            var b = t.closest("#op-campaigns [data-op]");
            if (b) {
                var tile = b.closest(".op-fl");
                if (tile) change(tile.getAttribute("data-slug"), b.getAttribute("data-op") === "dec" ? -1 : 1);
                return;
            }
            var go = t.closest("[data-op-go]");
            if (go) {
                var sec = $("camp-" + go.getAttribute("data-op-go") + "-fl");
                if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
                return;
            }
            var tab = t.closest(".op-tab");
            if (tab) {
                var idx = parseInt(tab.getAttribute("data-tab"), 10) || 0;
                var target = $("camp-" + idx);
                setActive(idx);
                if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
            }
        });
        window.addEventListener("scroll", onScroll, { passive: true });
        // لو السلة اتغيّرت من تبويب تاني أو بعد الرجوع بزرار "رجوع" في المتصفح
        window.addEventListener("storage", function (e) { if (e.key === CART_KEY) refresh(); });
        window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });

        document.addEventListener("BoseDatabaseLoaded", render);
        if (window.BoseStoreData) render();
    })();
    </script>
</body>
</html>
