<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ربط واتساب - حلويات بوسي</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#fdf6f2;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px}
  .card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:32px 24px;max-width:420px;width:100%;text-align:center}
  h1{font-size:20px;color:#333;margin-bottom:8px}
  p{color:#666;font-size:14px;line-height:1.7;margin-bottom:24px}
  button{background:#1877F2;color:#fff;border:none;border-radius:8px;padding:14px 24px;font-size:16px;font-weight:bold;cursor:pointer;width:100%}
  button:disabled{opacity:.6;cursor:not-allowed}
  #status{margin-top:20px;font-size:14px;padding:12px;border-radius:8px;display:none;line-height:1.6;word-break:break-all}
  .ok{background:#e6f7e9;color:#1a7a32;display:block!important}
  .err{background:#fdeaea;color:#a11;display:block!important}
</style>
</head>
<body>
<div class="card">
  <h1>ربط رقم واتساب بالنظام</h1>
  <p>اضغطي الزر تحت وسجّلي دخول بحساب فيسبوك بتاعك، وهيفتح خطوات ربط رقم واتساب بيزنس مع الحفاظ عليه شغال في موبايلك.</p>
  <button id="loginBtn">الاستمرار بحساب فيسبوك</button>
  <div id="status"></div>
</div>

<script src="/js/whatsapp-connect.js"></script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/ar_AR/sdk.js"></script>
</body>
</html>
