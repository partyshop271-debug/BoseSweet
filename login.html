<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حلويات بوسي | دخول الإدارة الآمن</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    
    <script src="firebase-config.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #ff91a4;
            --brand-bg: #ffffff;
            --brand-text: #1a1a1a;
            --brand-glow: rgba(255, 145, 164, 0.3);
        }
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--brand-bg); 
            color: var(--brand-text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes slideUp { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast-animate { animation: slideUp 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards; }
        
        .login-card {
            border: 2px solid var(--brand-primary);
            border-radius: 2.5rem;
            box-shadow: 0 20px 50px var(--brand-glow);
            background: #ffffff;
        }
        .admin-input {
            border: 2px solid #f1f5f9;
            border-radius: 1.25rem;
            transition: all 0.3s ease;
            font-size: 16px !important;
        }
        .admin-input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 4px var(--brand-glow);
            outline: none;
        }
        .btn-login {
            background-color: var(--brand-primary);
            border: 2px solid var(--brand-primary);
            border-radius: 1.25rem;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px var(--brand-glow);
        }
        .btn-login:hover {
            background-color: #ffffff;
            color: var(--brand-primary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-[420px] px-6">
        <div class="login-card p-8 md:p-10 animate-fade-in">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-[#ffffff] border-2 border-[#ff91a4] rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg overflow-hidden">
                    <img src="https://res.cloudinary.com/dyx4w0dr1/image/upload/v1712586716/logo_bose_gold.png" class="w-full h-full object-cover" alt="حلويات بوسي">
                </div>
                <h1 class="text-2xl font-black text-[#ff91a4] tracking-tight">مركز قيادة حلويات بوسي</h1>
                <p class="text-slate-500 font-bold text-sm mt-2">تسجيل دخول الإدارة المعتمد 🛡️</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-700 mr-2">بريد الإدارة الإلكتروني</label>
                    <div class="relative">
                        <i data-lucide="mail" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="email" id="admin-email" placeholder="admin@bosesweets.com" class="w-full admin-input py-4 pr-12 pl-4 font-bold text-[#1a1a1a]">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-black text-slate-700 mr-2">كلمة المرور المشفرة</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="admin-pwd" placeholder="••••••••" class="w-full admin-input py-4 pr-12 pl-4 font-bold text-[#1a1a1a]">
                    </div>
                </div>

                <button onclick="handleAdminLogin()" id="login-btn" class="w-full btn-login py-4 text-white font-black flex items-center justify-center gap-3 active:scale-95 mt-4">
                    <span>دخول النظام</span>
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="mt-8 text-center">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">جميع الحقوق محفوظة لـ حلويات بوسي © 2026</p>
            </div>
        </div>
    </div>

    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[1000] w-[90%] max-w-[350px]"></div>

    <script>
        lucide.createIcons();

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-500' : 'bg-red-500';
            
            toast.className = `${bgColor} text-white px-6 py-4 rounded-2xl shadow-2xl font-black text-sm text-center toast-animate mb-3 border-2 border-white/20`;
            toast.innerHTML = message;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        async function handleAdminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const pwd = document.getElementById('admin-pwd').value.trim();
            const btn = document.getElementById('login-btn');

            if (!email || !pwd) {
                showToast("يرجى إكمال بيانات الهوية الإدارية أولاً 🛡️", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>جاري التحقق...</span>`;
            lucide.createIcons();

            try {
                // استخدام نظام التوثيق السحابي لبراند حلويات بوسي
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, pwd);
                showToast("تم التحقق.. أهلاً بعودتك للإدارة 👑", "success");
                
                sessionStorage.setItem('bosy_admin_auth', 'true');
                setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
            } catch (error) {
                console.error("🔥 تقرير خطأ تسجيل الدخول:", error);
                
                if (error.code === 'auth/network-request-failed') {
                    showToast("شبكة الإنترنت ضعيفة جداً حالياً جربي تاني 📡", "error");
                } else if (error.code === 'auth/too-many-requests') {
                    showToast("محاولات كتير جداً استريحي دقيقة وجربي تاني ⏳", "error");
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                    showToast("الإيميل ده مش متسجل في إدارة بوسي راجعي الحروف 🛡️", "error");
                } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showToast("الباسورد غلط يا فندم تأكدي من الحروف 🛡️", "error");
                } else {
                    showToast(`عطل فني: ${error.message} 🛠️`, "error");
                }
                
                btn.innerHTML = `<span>دخول النظام</span><i data-lucide="log-in" class="w-5 h-5"></i>`; 
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        document.getElementById('admin-pwd').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleAdminLogin();
        });
    </script>
</body>
</html>
