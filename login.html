```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حلويات بوسي | بوابة الدخول السيادية</title>
    
    <!-- مكتبات الواجهة والأيقونات -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- محرك قواعد البيانات السيادية (Firebase) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    
    <!-- ملف الربط مع قواعد البيانات -->
    <script src="firebase-config.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #ff91a4;
            --brand-bg: #070b14;
            --brand-card: #101726;
            --brand-glow: rgba(255, 145, 164, 0.25);
            --input-bg: #1a2235;
        }
        
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--brand-bg);
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% -20%, rgba(255, 145, 164, 0.08), transparent 60%);
        }

        .login-card {
            background: var(--brand-card);
            border: 1px solid rgba(255, 145, 164, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px var(--brand-glow);
            border-radius: 2rem;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            background: var(--input-bg);
            border: 1px solid rgba(255, 145, 164, 0.1);
            color: #ffffff;
            border-radius: 1.25rem;
            padding: 1.25rem 1.5rem 1.25rem 3rem; /* مساحة للأيقونات */
            width: 100%;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            direction: ltr;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .input-field:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 15px var(--brand-glow);
            background: #1e293b;
        }

        .input-field::placeholder {
            color: #64748b;
            font-weight: 600;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s;
        }

        .input-icon:hover {
            color: var(--brand-primary);
        }

        .btn-primary {
            background-color: var(--brand-primary);
            color: #ffffff;
            border: none;
            border-radius: 1.25rem;
            padding: 1.25rem;
            width: 100%;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: 0 10px 25px var(--brand-glow);
        }

        .btn-primary:active { 
            transform: scale(0.96); 
            box-shadow: 0 5px 15px var(--brand-glow);
        }

        .btn-primary:disabled { 
            opacity: 0.6; 
            cursor: not-allowed; 
            transform: none;
        }

        @keyframes toastSlideDown {
            from { transform: translate(-50%, -100%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .toast-enter {
            animation: toastSlideDown 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
    </style>
</head>
<body>

    <!-- منظومة الإشعارات السيادية -->
    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 z-[1000] hidden">
        <div id="toast-body" class="bg-[#101726] border text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transition-colors duration-300 min-w-[300px] justify-center">
            <i id="toast-icon" data-lucide="info" class="w-5 h-5 shrink-0"></i>
            <span id="toast-msg" class="font-bold text-sm tracking-wide"></span>
        </div>
    </div>

    <div class="w-full px-6">
        <div class="login-card mx-auto">
            <div class="mb-8">
                <div class="w-24 h-24 bg-[#ff91a4]/10 rounded-3xl flex items-center justify-center mx-auto border border-[#ff91a4]/30 mb-5 shadow-[0_0_25px_rgba(255,145,164,0.15)] relative overflow-hidden group">
                    <div class="absolute inset-0 bg-gradient-to-tr from-[#ff91a4]/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <i data-lucide="shield-check" class="w-12 h-12 text-[#ff91a4] relative z-10"></i>
                </div>
                <h1 class="text-3xl font-black text-white tracking-wide mb-1">حلويات بوسي</h1>
                <p class="text-[#ff91a4] text-xs font-black tracking-widest uppercase bg-[#ff91a4]/10 inline-block px-3 py-1 rounded-lg border border-[#ff91a4]/20">مركز القيادة السيادي</p>
            </div>

            <div class="space-y-4">
                <div class="input-group">
                    <input type="email" id="admin-email" class="input-field pr-4" placeholder="البريد الإلكتروني للإدارة" autocomplete="email">
                    <i data-lucide="mail" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                </div>
                
                <div class="input-group">
                    <input type="password" id="admin-pwd" class="input-field pr-4" placeholder="الرمز السري المشفر" autocomplete="current-password">
                    <i data-lucide="lock" class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500"></i>
                    <!-- زر إظهار وإخفاء الباسورد -->
                    <div onclick="togglePasswordVisibility()" class="input-icon" title="عرض الرمز السري">
                        <i id="toggle-pwd-icon" data-lucide="eye" class="w-5 h-5"></i>
                    </div>
                </div>
                
                <button id="login-btn" onclick="executeAdminLogin()" class="btn-primary mt-6">
                    <span>اعتماد الدخول</span>
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="mt-8 pt-6 border-t border-slate-800/50">
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">جميع الحقوق محفوظة لـ حلويات بوسي ©</p>
            </div>
        </div>
    </div>

    <script>
        // تهيئة الأيقونات
        lucide.createIcons();
        
        let toastTimeout;

        // نظام الإشعارات المهني المطور
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast-container');
            const toastBody = document.getElementById('toast-body');
            const icon = document.getElementById('toast-icon');
            const msgEl = document.getElementById('toast-msg');
            
            msgEl.innerText = msg;
            
            // تطبيق الألوان السيادية حسب الحالة
            if(type === 'error') { 
                icon.setAttribute('data-lucide', 'alert-triangle'); 
                icon.className = "w-5 h-5 shrink-0 text-red-500"; 
                toastBody.className = "bg-[#101726] border border-red-500/30 text-white px-6 py-4 rounded-2xl shadow-[0_10px_30px_rgba(239,68,68,0.2)] flex items-center gap-3 min-w-[300px] justify-center";
            }
            else { 
                icon.setAttribute('data-lucide', 'check-circle'); 
                icon.className = "w-5 h-5 shrink-0 text-emerald-500"; 
                toastBody.className = "bg-[#101726] border border-emerald-500/30 text-white px-6 py-4 rounded-2xl shadow-[0_10px_30px_rgba(16,185,129,0.2)] flex items-center gap-3 min-w-[300px] justify-center";
            }
            
            lucide.createIcons();
            toast.classList.remove('hidden');
            toast.classList.add('toast-enter');
            
            if(toastTimeout) clearTimeout(toastTimeout);
            
            toastTimeout = setTimeout(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('hidden');
            }, 4500); // زيادة مدة العرض قليلاً لقراءة الرسائل المهنية
        }

        // كشف وتغطية الرمز السري
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('admin-pwd');
            const icon = document.getElementById('toggle-pwd-icon');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // دالة الدخول السيادية المُحكمة
        async function executeAdminLogin() {
            const email = document.getElementById('admin-email').value.trim();
            const pwd = document.getElementById('admin-pwd').value;
            const btn = document.getElementById('login-btn');

            if (!email || !pwd) { 
                showToast("يرجى من حضرتك إدخال بيانات الهوية الإدارية كاملة للاعتماد.", "error"); 
                return; 
            }
            
            if (!navigator.onLine) { 
                showToast("عذراً، لا يوجد اتصال ثابت بالشبكة لإتمام المصادقة السيادية.", "error"); 
                return; 
            }

            if (typeof firebase === 'undefined' || !firebase.auth) {
                showToast("عطل تقني: لم يتم تحميل محرك قواعد البيانات، يرجى تحديث الصفحة.", "error");
                return;
            }

            // تأمين الواجهة أثناء معالجة البيانات
            btn.innerHTML = `<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i><span>جاري مصادقة البيانات...</span>`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                // استخدام نظام التوثيق السحابي
                await firebase.auth().signInWithEmailAndPassword(email, pwd);
                sessionStorage.setItem('bosy_admin_auth', 'true');
                showToast("تمت المصادقة بنجاح.. جاري توجيه حضرتك لمركز القيادة 👑", "success");
                
                // الانتقال المأمون للوحة التحكم
                setTimeout(() => { window.location.replace('admin.html'); }, 1200);
                
            } catch (error) {
                console.error("🔥 تقرير الرفض الأمني:", error);
                
                // رسائل أخطاء مهنية تحترم لغة البراند
                if (error.code === 'auth/network-request-failed') {
                    showToast("يبدو أن هناك ضعف في الاتصال بالإنترنت، يرجى تحقق حضرتك من الشبكة.", "error");
                } else if (error.code === 'auth/too-many-requests') {
                    showToast("تم رصد محاولات دخول متعددة، يرجى من حضرتك الانتظار قليلاً قبل المحاولة القادمة ⏳.", "error");
                } else if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                    showToast("بيانات الهوية غير مسجلة في نظام حلويات بوسي، يرجى مراجعة البريد الإلكتروني 🛡️.", "error");
                } else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    showToast("الرمز السري غير صحيح، يرجى من حضرتك التأكد من حالة الأحرف وإعادة المحاولة 🛡️.", "error");
                } else {
                    showToast(`تم رفض الدخول لسبب تقني: ${error.message} 🛠️`, "error");
                }
                
                // إعادة الزر لحالته الأصلية
                btn.innerHTML = `<span>اعتماد الدخول</span><i data-lucide="log-in" class="w-5 h-5"></i>`; 
                btn.disabled = false;
                lucide.createIcons();
            }
        }

        // دعم ضغطة زر الإدخال (Enter)
        document.getElementById('admin-pwd').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeAdminLogin();
        });
        document.getElementById('admin-email').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('admin-pwd').focus();
        });
    </script>
</body>
</html>
