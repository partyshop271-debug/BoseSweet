<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
        http-equiv="X-UA-Compatible"
        content="IE=edge"
    />

    <meta
        name="robots"
        content="noindex,nofollow,noarchive,nosnippet"
    />

    <title>
        حلويات بوسي | بوابة الإدارة المؤمنة
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    />

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    />

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap"
        rel="stylesheet"
    />

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <script type="importmap">
    {
        "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
        }
    }
    </script>

    <script>

        tailwind.config = {

            theme: {

                extend: {

                    colors: {

                        brand: {

                            pink: '#ff91a4',

                            bg: '#050505',

                            surface: '#0e0e0e',

                            border: 'rgba(255,255,255,.08)',

                            text: '#ffffff',

                            muted: 'rgba(255,255,255,.65)'

                        }

                    },

                    fontFamily: {

                        cairo: ['Cairo', 'sans-serif']

                    }

                }

            }

        };

    </script>

    <style>

        :root {

            color-scheme: dark;

            --brand-pink: #ff91a4;

            --brand-bg: #050505;

            --brand-surface: #0e0e0e;

            --brand-border: rgba(255,255,255,.08);

        }

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

        }

        html {

            scroll-behavior: smooth;

        }

        body {

            margin: 0;

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(circle at top, rgba(255,145,164,.08), transparent 45%),
                #050505;

            color: white;

            font-family: Cairo, sans-serif;

        }

        input,
        button {

            font-family: inherit;

        }

        .glass {

            background: rgba(255,255,255,.03);

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255,255,255,.06);

        }

        .focus-ring:focus {

            border-color: var(--brand-pink);

            box-shadow:
                0 0 0 4px rgba(255,145,164,.12);

        }

        .shadow-pink {

            box-shadow:
                0 10px 40px rgba(255,145,164,.12);

        }

        .btn-hover {

            transition:
                transform .2s ease,
                opacity .2s ease,
                box-shadow .2s ease;

        }

        .btn-hover:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 30px rgba(255,145,164,.16);

        }

        .btn-hover:active {

            transform: scale(.99);

        }

        .fade-in {

            animation: fadeIn .35s ease;

        }

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform: translateY(8px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        /* حاجب الحماية لمنع وميض البيانات غير المصادق عليها */
        #loadingGuard {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #loadingGuard.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 145, 164, 0.1);
            border-radius: 50%;
            border-top-color: var(--brand-pink);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

    </style>

</head>

<body class="font-cairo">

    <div id="loadingGuard">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <p class="text-xs text-brand-muted tracking-widest">جاري تأمين الاتصال بالنواة...</p>
        </div>
    </div>

    <div
        class="absolute inset-0 pointer-events-none"
    >
        <div
            class="absolute inset-0 opacity-40"
            style="
                background-image:
                linear-gradient(
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.02) 1px,
                    transparent 1px
                );
                background-size: 32px 32px;
            "
        ></div>
    </div>

    <main
        class="
            relative
            z-10
            min-h-screen
            flex
            items-center
            justify-center
            p-5
        "
    >

        <section
            class="
                glass
                shadow-pink
                fade-in
                w-full
                max-w-[460px]
                rounded-[32px]
                p-8
                md:p-10
            "
        >

            <header
                class="
                    flex
                    flex-col
                    items-center
                    text-center
                    mb-8
                "
            >

                <div
                    class="
                        w-24
                        h-24
                        rounded-[28px]
                        flex
                        items-center
                        justify-center
                        bg-[#111]
                        border
                        border-white/10
                        mb-5
                    "
                >

                    <i
                        data-lucide="shield-check"
                        class="
                            w-11
                            h-11
                            text-brand-pink
                        "
                    ></i>

                </div>

                <h1
                    class="
                        text-3xl
                        font-black
                        tracking-wide
                    "
                >
                    حلويات بوسي
                </h1>

                <p
                    class="
                        text-brand-muted
                        mt-2
                        text-sm
                    "
                >
                    بوابة الإدارة المؤمنة
                </p>

            </header>

            <div
                id="authAlert"
                class="
                    hidden
                    mb-5
                    rounded-2xl
                    border
                    border-red-500/25
                    bg-red-500/10
                    p-4
                    text-sm
                    text-red-200
                "
            ></div>

            <form
                id="loginForm"
                class="space-y-5"
                autocomplete="off"
            >

                <div>

                    <label
                        class="
                            block
                            text-sm
                            mb-2
                            text-brand-muted
                        "
                    >
                        البريد الإلكتروني الإداري
                    </label>

                    <div class="relative">

                        <i
                            data-lucide="mail"
                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2
                                w-5
                                h-5
                                text-brand-muted
                            "
                        ></i>

                        <input
                            id="adminEmail"
                            type="email"
                            dir="ltr"
                            inputmode="email"
                            autocomplete="username"
                            spellcheck="false"
                            autocorrect="off"
                            autocapitalize="none"
                            required
                            class="
                                focus-ring
                                w-full
                                rounded-2xl
                                border
                                border-white/10
                                bg-black/40
                                py-4
                                pr-12
                                pl-4
                                outline-none
                                transition-all
                            "
                            placeholder="admin@bosesweets.com"
                        />

                    </div>

                </div>

                <div>

                    <label
                        class="
                            block
                            text-sm
                            mb-2
                            text-brand-muted
                        "
                    >
                        كلمة المرور
                    </label>

                    <div class="relative">

                        <i
                            data-lucide="lock"
                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2
                                w-5
                                h-5
                                text-brand-muted
                            "
                        ></i>

                        <input
                            id="adminPassword"
                            type="password"
                            dir="ltr"
                            autocomplete="current-password"
                            autocorrect="off"
                            autocapitalize="none"
                            required
                            class="
                                focus-ring
                                w-full
                                rounded-2xl
                                border
                                border-white/10
                                bg-black/40
                                py-4
                                pr-12
                                pl-14
                                outline-none
                                transition-all
                            "
                            placeholder="••••••••••••"
                        />

                        <button
                            id="togglePassword"
                            type="button"
                            class="
                                absolute
                                left-4
                                top-1/2
                                -translate-y-1/2
                                text-brand-muted
                            "
                        >

                            <i
                                id="passwordEye"
                                data-lucide="eye"
                                class="w-5 h-5"
                            ></i>

                        </button>

                    </div>

                </div>

                <button
                    id="submitButton"
                    type="submit"
                    class="
                        btn-hover
                        w-full
                        rounded-2xl
                        bg-brand-pink
                        py-4
                        text-black
                        font-black
                        flex
                        items-center
                        justify-center
                        gap-2
                    "
                >

                    <span id="submitText">
                        تأكيد الهوية
                    </span>

                    <i
                        data-lucide="arrow-left"
                        class="w-5 h-5"
                    ></i>

                </button>

            </form>

            <footer
                class="
                    mt-8
                    pt-6
                    border-t
                    border-white/5
                    text-center
                "
            >

                <p
                    class="
                        text-xs
                        text-brand-muted
                    "
                >
                    نظام مصادقة محمي ومراقب لحظياً
                </p>

            </footer>

        </section>

    </main>

    <script type="module">

        /**
         * =================================================
         * Infrastructure Imports
         * =================================================
         */

        import REGISTRY from './system-registry.js';
        import SYSTEM_CORE from './system-core.js';

        import {

            initializeApp,
            getApps

        } from 'firebase/app';

        import {

            getAuth,
            setPersistence,
            browserSessionPersistence,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut

        } from 'firebase/auth';

        import {
            getFirestore,
            collection,
            addDoc,
            serverTimestamp
        } from 'firebase/firestore';

        /**
         * =================================================
         * Unified Configuration - BoseSweets Verified Cloud
         * =================================================
         */

        const FIREBASE_CONFIG = {

            apiKey: "AIzaSyBLIrbV_mzttQYwFzs5OYfq7w7pc0UvvLc",

            authDomain: "bosy-sweets.firebaseapp.com",

            projectId: "bosy-sweets",

            storageBucket: "bosy-sweets.firebasestorage.app",

            messagingSenderId: "473615735083",

            appId: "1:473615735083:web:f09c6001c72640b2588d6e",

            measurementId: "G-46D1CS3WLB"

        };

        /**
         * =================================================
         * Runtime State
         * =================================================
         */

        const STATE = Object.seal({

            locked: false,

            loading: false,

            attempts: 0,

            lastAttempt: 0,

            authenticated: false,

            online: navigator.onLine,

            destroyed: false

        });

        /**
         * =================================================
         * Constants
         * =================================================
         */

        const MAX_ATTEMPTS = 5;

        const LOCK_DURATION = 1000 * 60 * 5;

        const ATTEMPT_WINDOW = 1000 * 4;

        const IDLE_TIMEOUT = 1000 * 60 * 30;

        /**
         * =================================================
         * Firebase Boot & Services
         * =================================================
         */

        const app = !getApps().length

            ? initializeApp(FIREBASE_CONFIG)

            : getApps()[0];

        const auth = getAuth(app);
        const db = getFirestore(app);

        /**
         * =================================================
         * Dom Contracts Alignment - Strictly via Registry
         * =================================================
         */

        let DOM = {};

        function initializeDOMContracts() {
            DOM = Object.freeze({

                form: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.LOGIN_FORM),

                email: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.ADMIN_EMAIL),

                password: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.ADMIN_PASSWORD),

                alert: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.AUTH_ALERT),

                submitButton: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.SUBMIT_BUTTON),

                submitText: SYSTEM_CORE.DOM.get(REGISTRY.DOM.AUTH.SUBMIT_TEXT),

                loadingGuard: document.getElementById('loadingGuard'),

                togglePassword: document.getElementById('togglePassword'),

                passwordEye: document.getElementById('passwordEye')

            });
        }

        /**
         * =================================================
         * Helpers
         * =================================================
         */

        function now() {

            return Date.now();

        }

        function showAlert(message) {

            if (!DOM.alert) return;
            DOM.alert.textContent = message;

            DOM.alert.classList.remove('hidden');

        }

        function hideAlert() {

            if (!DOM.alert) return;
            DOM.alert.classList.add('hidden');

        }

        function setLoading(status) {

            STATE.loading = status;

            if (!DOM.submitButton || !DOM.submitText) return;

            DOM.submitButton.disabled = status;

            DOM.submitButton.style.opacity = status

                ? '.7'

                : '1';

            DOM.submitText.textContent = status

                ? 'جاري التحقق...'

                : 'تأكيد الهوية';

        }

        function sanitizeInput(value) {

            return String(value || '')
                .trim()
                .replace(/[<>]/g, '');

        }

        function lockRuntime() {

            STATE.locked = true;

            localStorage.setItem(

                'bose_login_lock',

                String(now())

            );

        }

        function unlockRuntime() {

            STATE.locked = false;

            localStorage.removeItem(

                'bose_login_lock'

            );

        }

        function validateLock() {

            const lockTime = Number(

                localStorage.getItem(

                    'bose_login_lock'

                ) || 0

            );

            if (

                lockTime &&

                now() - lockTime < LOCK_DURATION

            ) {

                STATE.locked = true;

                return true;

            }

            unlockRuntime();

            return false;

        }

        function safeRedirect() {

            window.location.replace(

                REGISTRY.FILES.PAGES.ADMIN

            );

        }

        /**
         * =================================================
         * Cloud Logging System - السيادية الأمنية للمراقبة
         * =================================================
         */

        async function logSecurityEvent(type, payload) {
            try {
                const logPath = REGISTRY.FIREBASE.COLLECTIONS.SYSTEM_LOGS;
                // حل ثغرة التمرير المفرد للمصفوفات العميقة عبر دمج المسار بنمط نصي قياسي متوافق مع SDK
                const pathString = logPath.join('/');
                await addDoc(collection(db, pathString), {
                    event: type,
                    timestamp: serverTimestamp(),
                    environment: REGISTRY.META.ENVIRONMENT,
                    ...payload
                });
            } catch (err) {
                SYSTEM_CORE.Diagnostics.error('Security Logging System Failure', { error: err.message });
            }
        }

        /**
         * =================================================
         * Attempt Governance
         * =================================================
         */

        function validateAttempts() {

            if (STATE.locked) {

                throw new Error(

                    'تم قفل النظام مؤقتاً بسبب المحاولات المتكررة'

                );

            }

            const current = now();

            if (

                current - STATE.lastAttempt

                < ATTEMPT_WINDOW

            ) {

                throw new Error(

                    'يرجى الانتظار قليلاً قبل إعادة المحاولة'

                );

            }

            STATE.lastAttempt = current;

        }

        function registerFailure(email) {

            STATE.attempts++;

            if (

                STATE.attempts >= MAX_ATTEMPTS

            ) {

                lockRuntime();
                logSecurityEvent('BRUTE_FORCE_LOCKOUT', { email, attempts: STATE.attempts });

            }

        }

        function resetAttempts() {

            STATE.attempts = 0;

            unlockRuntime();

        }

        /**
         * =================================================
         * Password Toggle
         * =================================================
         */

        function setupPasswordToggle() {
            if (DOM.togglePassword) {
                DOM.togglePassword.addEventListener(

                    'click',

                    () => {

                        if (!DOM.password || !DOM.passwordEye) return;

                        const visible =

                            DOM.password.type === 'text';

                        DOM.password.type = visible

                            ? 'password'

                            : 'text';

                        DOM.passwordEye.setAttribute(

                            'data-lucide',

                            visible ? 'eye' : 'eye-off'

                        );

                        lucide.createIcons();

                    }

                );
            }
        }

        /**
         * =================================================
         * Login Runtime
         * =================================================
         */

        async function login(email, password) {

            validateAttempts();

            if (!navigator.onLine) {

                throw new Error(

                    'لا يوجد اتصال بالشبكة حالياً'

                );

            }

            await setPersistence(

                auth,

                browserSessionPersistence

            );

            return signInWithEmailAndPassword(

                auth,

                email,

                password

            );

        }

        /**
         * =================================================
         * Form Submit Implementation
         * =================================================
         */

        function setupFormSubmit() {
            if (DOM.form) {
                DOM.form.addEventListener(

                    'submit',

                    async (event) => {

                        event.preventDefault();

                        hideAlert();

                        if (STATE.loading) {

                            return;

                        }

                        let emailInput = '';

                        try {

                            if (validateLock()) {

                                throw new Error(

                                    'تم قفل تسجيل الدخول مؤقتاً'

                                );

                            }

                            setLoading(true);

                            if (!DOM.email || !DOM.password) return;

                            emailInput = sanitizeInput(

                                DOM.email.value

                            );

                            const password = sanitizeInput(

                                DOM.password.value

                            );

                            if (

                                !emailInput ||

                                !password

                            ) {

                                throw new Error(

                                    'يرجى إدخال البيانات كاملة'

                                );

                            }

                            await login(

                                emailInput,

                                password

                            );

                            resetAttempts();

                            STATE.authenticated = true;

                            SYSTEM_CORE.EVENTS.emit(REGISTRY.EVENTS.AUTH.LOGIN_SUCCESS, { email: emailInput });
                            await logSecurityEvent('ADMIN_LOGIN_SUCCESS', { email: emailInput });

                            safeRedirect();

                        } catch (error) {

                            registerFailure(emailInput);

                            let message =

                                'تعذر تسجيل الدخول';

                            switch (error.code) {

                                case 'auth/network-request-failed':

                                    message =
                                        'حدثت مشكلة في الاتصال';

                                    break;

                                case 'auth/invalid-credential':

                                case 'auth/wrong-password':

                                case 'auth/user-not-found':

                                    message =
                                        'بيانات الدخول غير صحيحة';

                                    break;

                                default:

                                    if (error.message) {

                                        message = error.message;

                                    }

                            }

                            showAlert(message);
                            SYSTEM_CORE.EVENTS.emit(REGISTRY.EVENTS.AUTH.LOGIN_FAILED, { error: error.message });
                            await logSecurityEvent('ADMIN_LOGIN_FAILED', { email: emailInput, error: error.message });

                        } finally {

                            setLoading(false);

                        }

                    }

                );
            }
        }

        /**
         * =================================================
         * Orchestration Core Initialization - تفعيل آمن ومنظم
         * =================================================
         */

        async function executeInitializationSequence() {
            // 1. تهيئة العقود البرمجية للـ DOM
            initializeDOMContracts();
            
            // 2. تفعيل المستمعات والأحداث الخاصة بالواجهة
            setupPasswordToggle();
            setupFormSubmit();
            lucide.createIcons();

            // 3. فحص حالة المصادقة بشكل مراقب وآمن
            onAuthStateChanged(auth, async (user) => {
                try {
                    if (user) {
                        STATE.authenticated = true;
                        safeRedirect();
                        return;
                    }
                    STATE.authenticated = false;
                } catch {
                    try {
                        await signOut(auth);
                    } catch {}
                } finally {
                    // إزالة شاشة الحماية والتحميل بأمان فوري بعد انتهاء الفحص
                    if (DOM.loadingGuard) {
                        DOM.loadingGuard.classList.add('hidden');
                    }
                }
            });
        }

        // حل ثغرة جمود دورة الحياة (Initialization Deadlock) لضمان العمل الفوري والمطابق
        const systemStatus = SYSTEM_CORE.HEALTH.status();
        if (systemStatus.runtime && systemStatus.runtime.initialized) {
            executeInitializationSequence();
        } else {
            SYSTEM_CORE.EVENTS.on(REGISTRY.EVENTS.SYSTEM.READY, async (payload) => {
                if (payload.runtime === 'SYSTEM_CORE' && payload.status === 'READY') {
                    executeInitializationSequence();
                }
            });
        }

        /**
         * =================================================
         * Idle Session Protection
         * =================================================
         */

        let idleTimer;

        function resetIdleTimer() {

            clearTimeout(idleTimer);

            idleTimer = setTimeout(

                async () => {

                    try {

                        await signOut(auth);

                        SYSTEM_CORE.EVENTS.emit(REGISTRY.EVENTS.AUTH.LOGOUT);

                    } catch {}

                },

                IDLE_TIMEOUT

            );

        }

        [

            'click',

            'mousemove',

            'keydown',

            'touchstart'

        ].forEach(eventName => {

            window.addEventListener(

                eventName,

                resetIdleTimer,

                {

                    passive: true

                }

            );

        });

        resetIdleTimer();

        /**
         * =================================================
         * Network Recovery
         * =================================================
         */

        window.addEventListener(

            'online',

            () => {

                STATE.online = true;

                hideAlert();

            }

        );

        window.addEventListener(

            'offline',

            () => {

                STATE.online = false;

                showAlert(

                    'تم فقد الاتصال بالشبكة'

                );

            }

        );

        /**
         * =================================================
         * Memory Cleanup
         * =================================================
         */

        window.addEventListener(

            'beforeunload',

            () => {

                STATE.destroyed = true;

            }

        );

    </script>

</body>

</html>
