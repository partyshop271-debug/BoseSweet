<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حلويات بوسي - انقطاع الاتصال</title>
    
    <!-- 👑 BoseSweets Deep Monitor (Offline Fallback Edition) -->
    <script>
        (function() {
            if (window.BoseMonitor) return;

            window.BoseMonitor = {
                diagnose: function(errorMsg) {
                    const msg = String(errorMsg).toLowerCase();
                    if (msg.includes('network') || msg.includes('offline')) return "انقطاع شبكي تام: العميل يتصفح صفحة الطوارئ.";
                    return "خلل في صفحة الطوارئ: يتطلب مراجعة توافقية المتصفح.";
                },
                report: async function(error, sourceFile = 'offline.html', lineNo = null, colNo = null, functionName = 'رصد تلقائي') {
                    try {
                        const errorMessage = error && error.message ? error.message : String(error);
                        
                        console.warn(`%c[رصد أمني - وضع الطوارئ]%c تم رصد خلل في: ${sourceFile} | دالة: ${functionName}`, "color: #ff91a4; font-weight: bold; background: #1a1a1a; padding: 2px 6px; border-radius: 4px;", "color: inherit;");

                        const reportData = {
                            fileName: sourceFile,
                            functionName: functionName,
                            errorMessage: errorMessage,
                            diagnosis: this.diagnose(errorMessage),
                            timestamp: Date.now(),
                            status: 'unresolved',
                            clientDevice: typeof navigator !== 'undefined' ? navigator.userAgent : 'غير معروف',
                            isOfflinePage: true
                        };

                        // الاعتماد الكلي على الذاكرة المحلية (Local Storage) لأن الإنترنت مقطوع
                        this.saveToLocalStorage(reportData);
                    } catch (e) {
                        console.error("فشل نظام الرصد العميق في وضع الطوارئ:", e);
                    }
                },
                saveToLocalStorage: function(reportData) {
                    try {
                        let localLogs = JSON.parse(localStorage.getItem('bose_blackbox_logs') || '[]');
                        if (localLogs.length > 50) localLogs.shift();
                        localLogs.push(reportData);
                        localStorage.setItem('bose_blackbox_logs', JSON.stringify(localLogs));
                    } catch(err) {
                        // صمت برمجي لعدم إزعاج العميل في وضع الطوارئ
                    }
                },
                initGlobalWatch: function() {
                    window.addEventListener('error', (event) => {
                        let fName = event.filename ? event.filename.split('/').pop() : 'offline.html';
                        this.report(event.error || event.message, fName, null, null, 'رصد تلقائي (Offline Global Error)');
                    });
                }
            };

            window.BoseMonitor.initGlobalWatch();
        })();
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: #1a1a1a;
            -webkit-tap-highlight-color: transparent;
        }
        .offline-container {
            padding: 40px 20px;
            max-width: 400px;
            border: 2px solid #ff91a4;
            border-radius: 2.5rem;
            box-shadow: 0 10px 30px rgba(255, 145, 164, 0.2);
        }
        .brand-name {
            color: #ff91a4;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #1a1a1a;
        }
        p {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #1a1a1a;
        }
        .retry-btn {
            background-color: #ff91a4;
            color: #ffffff;
            border: 2px solid #ff91a4;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 900;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 145, 164, 0.3);
        }
        .retry-btn:hover {
            background-color: #ffffff;
            color: #ff91a4;
            transform: translateY(-2px);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="offline-container">
        <div class="brand-name">حلويات بوسي</div>
        <h1>عذراً، انقطع الاتصال</h1>
        <p>لا يوجد اتصال بالإنترنت حالياً. يرجى التأكد من تشغيل الواي فاي أو بيانات الهاتف لمعاودة تصفح منيو حلويات بوسي.</p>
        <button class="retry-btn" onclick="retryConnection()">إعادة المحاولة</button>
    </div>

    <script>
        // 👑 تحصين زر إعادة المحاولة وربطه بالمستشعر
        function retryConnection() {
            try {
                // إبلاغ المستشعر بأن العميل يحاول الاتصال مجدداً
                if (navigator.onLine) {
                    window.location.reload();
                } else {
                    // تسجيل محاولة فاشلة في وضع الأوفلاين
                    if (window.BoseMonitor) {
                        window.BoseMonitor.report("محاولة إعادة اتصال فاشلة (الشبكة لا تزال غير متاحة)", "offline.html", null, null, "retryConnection");
                    }
                    // إعادة تحميل الصفحة لإجبار المتصفح على المحاولة
                    window.location.reload();
                }
            } catch (error) {
                if(window.BoseMonitor) window.BoseMonitor.report(error, 'offline.html', null, null, 'retryConnection');
            }
        }
    </script>
</body>
</html>
