<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتج - حلويات بوسي</title>
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <button id="sidebar-toggle">☰</button>
        <div id="brand">حلويات بوسي</div>
        <input id="header-search" type="text" placeholder="ابحث عن منتج">
        <a href="./cart.html" id="header-cart">
            🛒 <span id="header-cart-count">0</span>
        </a>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <button id="sidebar-close">×</button>
        <nav>
            <ul>
                <li><a href="./index.html">الرئيسية</a></li>
                <li><a href="./menu.html">المنيو</a></li>
                <li><a href="./cart.html">السلة</a></li>
            </ul>
        </nav>
    </aside>
    <div id="sidebar-overlay"></div>

    <!-- PRODUCT DETAIL -->
    <main>
        <section class="product-detail">
            <div class="product-image">
                <img id="product-image" src="assets/images/placeholder.jpg" alt="صورة المنتج">
            </div>
            <div class="product-info">
                <h1 id="product-title">اسم المنتج</h1>
                <p id="product-description">الوصف الاحترافي للمنتج يبرز الجودة والقيمة بدون أي مياعة أو رسميّة زايدة.</p>
                <div id="product-options"></div>
                <div class="quantity-container">
                    <button class="quantity-button" id="quantity-minus">-</button>
                    <span id="quantity-text">1</span>
                    <button class="quantity-button" id="quantity-plus">+</button>
                </div>
                <div class="product-price" id="product-price">0 ج.م</div>
                <button id="add-to-cart" class="add-to-cart">إضافة للسلة</button>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-links">
            <a href="#">من نحن</a>
            <a href="#">سياسة الخصوصية</a>
            <a href="#">سياسة الاسترجاع</a>
            <a href="#">تواصل معنا</a>
        </div>
        <div class="footer-social">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">TikTok</a>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script type="module" src="./contracts.js"></script>
    <script type="module" src="./data-service.js"></script>
    <script type="module" src="./cart-service.js"></script>
    <script type="module" src="./ui-engine.js"></script>
    <script type="module" src="./product-renderer.js"></script>
    <script type="module" src="./product-page.js"></script>

</body>

</html>
