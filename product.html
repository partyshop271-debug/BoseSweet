<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفاصيل المنتج الفاخر | حلويات بوسي</title>
    
    <!-- 🔍 إعدادات تحسين محركات البحث والأرشفة الفاخرة SEO الملتزمة بمواصفة البراند -->
    <meta name="description" content="استمتع بتذوق القيمة والجودة العالية لأصناف حلويات بوسي الفاخرة المجهزة يومياً بمكونات طبيعية 100% طازجة تليق بمناسباتكم السعيدة.">
    
    <!-- 🎨 ربط ملفات التصميم الموزعة هندسياً لمنع تضخم الأكواد وتأخر التحميل البصري -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    
    <!-- 👑 استدعاء المحرك المركزي العالمي في رأس الصفحة لتأمين الـ DOM ومنع وميض الألوان وتأمين الكاش -->
    <script src="js/core-engine.js"></script>

    <style>
        /* 🎨 الهندسة البصرية الخاصة بصفحة المنتج الفردي لمنع التكديس البصري */
        .product-internal-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 16px;
            direction: rtl;
            box-sizing: border-box;
            background-color: var(--bose-white, #FFFFFF);
        }

        .bose-breadcrumb-nav {
            font-size: 0.9rem;
            margin-bottom: 30px;
            color: var(--bose-black, #111111);
            font-weight: 600 !important;
        }

        .bose-breadcrumb-nav a {
            color: var(--bose-black, #111111);
            text-decoration: none;
            transition: var(--bose-transition-smooth, color 0.3s ease);
        }

        .bose-breadcrumb-nav a:hover {
            color: var(--bose-pink, #FF91A4);
        }

        .bose-breadcrumb-nav span {
            margin: 0 10px;
            opacity: 0.3;
        }

        .product-master-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            align-items: start;
            width: 100%;
            margin-bottom: 50px;
        }

        @media (min-width: 768px) {
            .product-master-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 48px;
            }
        }

        .product-visual-gallery {
            position: relative;
            background-color: var(--bose-white);
            border: var(--bose-border-pink, 1px solid rgba(255, 145, 164, 0.3));
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            box-shadow: var(--bose-shadow-glow);
            transition: var(--bose-transition-smooth, all 0.3s ease);
        }

        .product-visual-gallery:hover {
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: var(--bose-shadow-hover, 0 16px 40px rgba(255, 145, 164, 0.22));
        }

        .product-display-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-details-panel {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .product-headline {
            font-size: 2rem;
            font-weight: 700 !important;
            color: var(--bose-black, #111111) !important;
            margin: 0 0 4px 0;
            line-height: 1.4;
        }

        .product-flavor-badge {
            font-size: 1.15rem;
            font-weight: 700 !important;
            color: var(--bose-pink, #FF91A4);
            margin-bottom: 12px;
            display: block;
        }

        .product-stars-box {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }

        .stars-gold-track {
            color: var(--bose-gold, #D4AF37);
            font-size: 1.15rem;
            letter-spacing: 2px;
        }

        .reviews-count-lbl {
            font-size: 0.85rem;
            color: #555555;
            font-weight: 600 !important;
        }

        .product-price-display-node {
            font-size: 1.85rem;
            font-weight: 700 !important;
            color: var(--bose-pink, #FF91A4);
            margin-bottom: 20px;
            display: inline-block;
        }

        /* ستايل وصف النكهة الإعلاني الفريد */
        .product-flavor-exclusive-desc {
            font-size: 1.1rem;
            color: var(--bose-black, #111111);
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .product-specs-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 32px;
        }

        .product-specs-table td {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 145, 164, 0.1);
            font-size: 0.95rem;
            color: var(--bose-black, #111111);
            line-height: 1.6;
        }

        .product-specs-table td.spec-title-bold {
            font-weight: 700 !important;
            width: 35%;
            color: var(--bose-black, #111111);
        }

        .interactive-purchase-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            width: 100%;
        }

        .qty-stepper-container {
            display: flex;
            align-items: center;
            border: 2px solid var(--bose-pink, #FF91A4);
            border-radius: 50px;
            overflow: hidden;
            height: 50px;
            background: var(--bose-white, #FFFFFF);
            padding: 0 6px;
        }

        .qty-stepper-container button {
            background: none;
            border: none;
            width: 36px;
            height: 36px;
            font-size: 1.3rem;
            font-weight: 700 !important;
            cursor: pointer;
            color: var(--bose-black, #111111);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--bose-transition-smooth, background 0.2s);
            border-radius: 50%;
        }

        .qty-stepper-container button:hover {
            background-color: var(--bose-cream, #FFF5F6);
            color: var(--bose-pink, #FF91A4);
        }

        .qty-numeric-input {
            width: 45px;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700 !important;
            color: var(--bose-black, #111111);
            background: transparent;
        }

        .bose-add-to-cart-action {
            flex-grow: 1;
            height: 50px;
            background-color: var(--bose-pink, #FF91A4);
            color: var(--bose-white, #FFFFFF);
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 700 !important;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 145, 164, 0.2);
            transition: var(--bose-transition-smooth, all 0.3s ease);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .bose-add-to-cart-action:hover {
            background-color: var(--bose-black, #111111);
            box-shadow: 0 6px 20px rgba(17, 17, 17, 0.15);
        }

        .bose-reviews-section {
            border-top: 1px dashed rgba(255, 145, 164, 0.3);
            padding-top: 40px;
            margin-bottom: 50px;
            text-align: right;
        }

        .review-row-card {
            background: #FFF5F6;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 145, 164, 0.15);
        }

        .bose-review-toggle-btn {
            background: transparent;
            border: 1px solid var(--bose-pink, #FF91A4);
            color: var(--bose-black, #111111);
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .bose-review-toggle-btn:hover {
            background-color: var(--bose-pink, #FF91A4);
            color: #FFFFFF;
        }

        .bose-interactive-review-form {
            background: #FFFFFF;
            border: 1px solid rgba(255, 145, 164, 0.25);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: var(--bose-shadow-glow);
        }

        .bose-star-rating-interactive {
            display: flex;
            gap: 8px;
            flex-direction: row-reverse;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .bose-star-rating-interactive input { display: none; }
        .bose-star-rating-interactive label {
            font-size: 1.8rem;
            color: #DDD;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .bose-star-rating-interactive input:checked ~ label,
        .bose-star-rating-interactive label:hover,
        .bose-star-rating-interactive label:hover ~ label {
            color: var(--bose-gold, #D4AF37);
        }

        .review-image-preview-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .review-preview-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 145, 164, 0.3);
        }

        .bose-recommendations-section {
            border-top: 1px dashed rgba(255, 145, 164, 0.3);
            padding-top: 40px;
            margin-bottom: 20px;
        }

        .skeleton-block-loader {
            background: linear-gradient(90deg, #f7f7f7 25%, #eeeeee 50%, #f7f7f7 75%);
            background-size: 200% 100%;
            animation: boseSkeletonAnim 1.4s infinite linear;
            border-radius: 12px;
        }

        @keyframes boseSkeletonAnim {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .size-radio-node { display: none; }
        .size-label-node {
            border: 1px solid rgba(255, 145, 164, 0.3);
            border-radius: 10px;
            padding: 8px 14px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700 !important;
            color: var(--bose-black, #111111);
            transition: 0.2s ease;
            background: var(--bose-white, #FFFFFF);
        }
        .size-radio-node:checked + .size-label-node {
            background-color: var(--bose-pink, #FF91A4);
            color: var(--bose-white, #FFFFFF);
            border-color: var(--bose-pink, #FF91A4);
            box-shadow: 0 4px 10px rgba(255, 145, 164, 0.15);
        }
    </style>
</head>
<body class="bose-hardware-accelerated bose-arabic-text">

    <header class="bose-navbar"></header>

    <div class="drawer-overlay" id="drawer-shield"></div>
    <aside class="bose-drawer-menu" id="sidebar-drawer"></aside>

    <main id="bose-product-root-view" class="product-internal-wrapper">
        <div class="product-master-grid">
            <div class="product-visual-gallery skeleton-block-loader"></div>
            <div class="product-details-panel">
                <div class="skeleton-block-loader" style="height: 45px; width: 75%; margin-bottom: 16px;"></div>
                <div class="skeleton-block-loader" style="height: 25px; width: 40%; margin-bottom: 16px;"></div>
                <div class="skeleton-block-loader" style="height: 35px; width: 30%; margin-bottom: 24px;"></div>
                <div class="skeleton-block-loader" style="height: 120px; width: 100%; margin-bottom: 30px;"></div>
            </div>
        </div>
    </main>

    <footer class="bose-footer"></footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const productSlug = urlParams.get('slug') || urlParams.get('id'); 

            const viewContainer = document.getElementById('bose-product-root-view');

            if (!productSlug) {
                renderErrorPanel("لم نتمكن من تحديد الصنف المطلوب لتصفح تفاصيله الفاخرة.");
                return;
            }

            window.getBoseDatabase().then(siteData => {
                processProductExtraction(siteData);
            }).catch(() => {
                document.addEventListener("BoseDatabaseLoaded", function(e) {
                    processProductExtraction(e.detail);
                });
            });

            function processProductExtraction(siteData) {
                if (!siteData || !siteData.products) {
                    renderErrorPanel("عذراً، واجهنا صعوبة في جلب المنيو الفاخر حالياً.");
                    return;
                }

                const matchedProduct = siteData.products.find(p => String(p.slug) === String(productSlug) || String(p.id) === String(productSlug));

                if (matchedProduct) {
                    renderActiveProductDOM(matchedProduct, siteData);
                } else {
                    renderErrorPanel("عذراً، الصنف غير موجود ضمن تشكيلتنا الحالية الفاخرة.");
                }
            }

            function renderActiveProductDOM(product, siteData) {
                const currency = siteData.store.currency || "EGP";
                const rating = product.rating || 5;
                
                let stars = "";
                for (let i = 1; i <= 5; i++) {
                    stars += i <= Math.floor(rating) ? "★" : "☆";
                }

                let sizeSelectorHTML = "";
                const defaultSize = product.defaultSize || 'triangle';
                const initialPrice = (product.prices && product.prices[defaultSize]) ? product.prices[defaultSize] : product.price;
                const finalCalculatedPrice = window.calculateBosePrice ? window.calculateBosePrice(initialPrice, "menu-only") : initialPrice;

                if (product.prices) {
                    sizeSelectorHTML = `<div style="margin: 0 0 24px 0;"><span style="display:block; font-size:0.95rem; font-weight:700; margin-bottom:10px;">اختر الحجم / المقاس المفضل:</span><div style="display:flex; gap:10px; flex-wrap:wrap;">`;
                    
                    if (product.sizes) {
                        product.sizes.forEach(sz => {
                            const isChecked = sz.id === defaultSize;
                            sizeSelectorHTML += `
                                <label style="display:block; position:relative;">
                                    <input type="radio" name="product-size-option" class="size-radio-node" value="${sz.id}" data-price="${product.prices[sz.id]}" ${isChecked ? 'checked' : ''}>
                                    <div class="size-label-node">${sz.name}</div>
                                </label>
                            `;
                        });
                    } else {
                        sizeSelectorHTML += `
                            <label style="display:block; position:relative;">
                                <input type="radio" name="product-size-option" class="size-radio-node" value="triangle" data-price="${product.price}" checked>
                                <div class="size-label-node">حجم قياسي فاخر</div>
                            </label>
                        `;
                    }
                    sizeSelectorHTML += `</div></div>`;
                }

                let reviewsHTML = `
                    <div class="bose-reviews-section">
                        <h3 class="bose-section-title" style="font-size:1.3rem; font-weight:700; margin-bottom:12px; color:var(--bose-black);">🌟 مراجعات وتقييمات العملاء المحترمين</h3>
                        <p style="font-size:0.9rem; opacity:0.8; margin-bottom:20px;">رأيك وتجربتك هما سر نجاحنا وإتقاننا الطازج يومياً بالفرع 🌸</p>
                        
                        <button id="bose-toggle-review-form-btn" class="bose-review-toggle-btn">
                            <i class="fas fa-pen"></i> شاركنا تجربتك وتقييمك الفاخر
                        </button>

                        <div id="bose-review-form-wrapper" class="bose-interactive-review-form" style="display:none;">
                            <h4 style="font-size:1rem; font-weight:700; margin-bottom:16px;">✍️ أضف مراجعتك الشخصية:</h4>
                            
                            <div class="bose-star-rating-interactive">
                                <input type="radio" id="star5" name="interactive-rating" value="5" /><label for="star5" title="ممتاز">★</label>
                                <input type="radio" id="star4" name="interactive-rating" value="4" /><label for="star4" title="جيد جداً">★</label>
                                <input type="radio" id="star3" name="interactive-rating" value="3" /><label for="star3" title="متوسط">★</label>
                                <input type="radio" id="star2" name="interactive-rating" value="2" /><label for="star2" title="مقبول">★</label>
                                <input type="radio" id="star1" name="interactive-rating" value="1" /><label for="star1" title="ضعيف">★</label>
                            </div>

                            <div style="display:flex; gap:12px; margin-bottom:12px;">
                                <input type="text" id="bose-review-user-name" placeholder="اكتب اسمك الكريم هنا.." style="flex:1;" />
                            </div>

                            <textarea id="bose-review-comment" placeholder="احكيلنا عن رأيك في جودة الطعم والتغليف والتجربة مع حلويات بوسي الشغوفة.." rows="3" style="margin-bottom:12px; resize:none;"></textarea>
                            
                            <div style="margin-bottom:16px;">
                                <label for="bose-review-file-input" style="display:inline-flex; align-items:center; gap:8px; background:#FFF5F6; border:1px dashed var(--bose-pink); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:0.85rem; font-weight:700;">
                                    <i class="fas fa-camera" style="color:var(--bose-pink);"></i> أضف صور تجربتك الحقيقية (اختياري)
                                </label>
                                <input type="file" id="bose-review-file-input" accept="image/*" multiple style="display:none;" />
                                <div id="review-images-preview" class="review-image-preview-container"></div>
                            </div>

                            <button type="button" id="bose-submit-review-btn" style="background:var(--bose-pink); color:#FFF; font-weight:700; padding:10px 24px; border-radius:50px; cursor:pointer; width:100%; box-shadow:0 4px 12px rgba(255,145,164,0.25);">نشر المراجعة الآن</button>
                        </div>

                        <div id="bose-active-reviews-list-container">
                `;

                if (product.reviews && product.reviews.length > 0) {
                    product.reviews.forEach(rev => {
                        let rStars = "";
                        for (let i = 1; i <= 5; i++) rStars += i <= rev.rating ? "★" : "☆";
                        reviewsHTML += `
                            <div class="review-row-card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                    <strong style="font-size:14px; font-weight:700; color:var(--bose-black);">${window.escapeHTML ? window.escapeHTML(rev.user) : rev.user}</strong>
                                    <span style="color:var(--bose-gold); font-size: 1rem;">${rStars}</span>
                                </div>
                                <p style="margin:0; font-size:13.5px; opacity:0.9; color:var(--bose-black);">"${window.escapeHTML ? window.escapeHTML(rev.comment) : rev.comment}"</p>
                            </div>
                        `;
                    });
                } else {
                    reviewsHTML += `<p id="bose-no-reviews-fallback" style="font-size:14px; opacity:0.7; color:var(--bose-black);">طعم حلوياتنا الفاخرة يتحدث عن نفسه مباشرة في كل مناسبة سعيدة! شاركنا تقييمك لتكون أول من ينشر هنا 🌸</p>`;
                }
                reviewsHTML += `</div></div>`;

                let recommendationsHTML = `
                    <div class="bose-recommendations-section">
                        <h3 class="bose-section-title" style="font-size:1.3rem; font-weight:700; margin-bottom:24px; text-align:center; color:var(--bose-black);">🍰 قد يعجبك أيضاً تشكيلة متميزة</h3>
                        <div id="product-page-suggestions-grid" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; width:100%;"></div>
                    </div>
                `;

                // 👑 [التطبيق الهندسي لمنع التضارب]: حقن flavorDesc تحت السعر مباشرة، وحفظ الـ product.description لجدول البيانات
                viewContainer.innerHTML = `
                    <nav class="bose-breadcrumb-nav" aria-label="مسار التنقل">
                        <a href="index.html">الرئيسية</a>
                        <span>/</span>
                        <a href="menu.html">المنيو الشامل</a>
                        <span>/</span>
                        <span aria-current="page">${window.escapeHTML ? window.escapeHTML(product.title) : product.title}</span>
                    </nav>

                    <div class="product-master-grid">
                        <div class="product-visual-gallery">
                            <img src="${product.image || (product.images && product.images[0])}" alt="${window.escapeHTML ? window.escapeHTML(product.title) : product.title}" class="product-display-img" loading="eager" />
                        </div>

                        <div class="product-details-panel">
                            <h1 class="product-headline">${window.escapeHTML ? window.escapeHTML(product.title) : product.title}</h1>
                            <span class="product-flavor-badge">${window.escapeHTML ? window.escapeHTML(product.flavorName || "طعم أصلي فاخر") : (product.flavorName || "طعم أصلي فاخر")}</span>
                            
                            <div class="product-stars-box">
                                <div class="stars-gold-track" aria-label="تقييم ${rating} من 5">${stars}</div>
                                <span class="reviews-count-lbl">(${product.reviews ? product.reviews.length : 12} مراجعة موثقة)</span>
                            </div>

                            <div id="product-price-node" class="product-price-display-node" data-unit-base="${finalCalculatedPrice}">
                                ${finalCalculatedPrice} ${currency}
                            </div>

                            <!-- 👑 حقن حقل وصف النكهة الإعلاني المخصص الفاخر لمنع التكرار -->
                            <div class="product-flavor-exclusive-desc">
                                ${product.flavorDesc || "توليفة مميزة ومجهزة بعناية فائقة لتناسب ذوقكم الرفيع."}
                            </div>

                            ${sizeSelectorHTML}

                            <table class="product-specs-table">
                                <tbody>
                                    <tr><td class="spec-title-bold">المفهوم والأساس</td><td>${product.description}</td></tr>
                                    ${product.size ? `<tr><td class="spec-title-bold">الحجم القياسي</td><td>${product.size}</td></tr>` : ''}
                                    <tr><td class="spec-title-bold">حالة المكونات</td><td>طازجة وطبيعية 100% يومياً بالفرع بدون حافظة</td></tr>
                                    <tr><td class="spec-title-bold">شرط التحضير</td><td>يُخبز ويُحضر بكل حب خصيصاً لمناسبتكم السعيدة تماشياً مع معايير الإتقان</td></tr>
                                </tbody>
                            </table>

                            <div class="interactive-purchase-row">
                                <div class="qty-stepper-container">
                                    <button type="button" id="btn-decrement-bose" aria-label="تقليل الكمية">−</button>
                                    <input type="number" id="input-bose-qty-val" class="qty-numeric-input" value="1" min="1" max="99" readonly />
                                    <button type="button" id="btn-increment-bose" aria-label="زيادة الكمية">+</button>
                                </div>
                                <button type="button" id="btn-add-to-cart-trigger" class="bose-add-to-cart-action">
                                    <i class="fas fa-shopping-bag"></i> إضافة للسلة
                                </button>
                            </div>
                        </div>
                    </div>

                    ${reviewsHTML}
                    ${recommendationsHTML}
                `;

                const suggestionsGrid = document.getElementById('product-page-suggestions-grid');
                if (suggestionsGrid) {
                    // 👑 [إصلاح ذكي للبدائل]: ترشيح أصناف من نفس الفئة لعدم تشتيت العميل بالجاتوهات داخل القشطوطة
                    const recProducts = siteData.products.filter(p => p.category === product.category && p.slug !== product.slug).slice(0, 2);
                    // فولباك احتياطي في حال عدم وجود أصناف كافية في نفس الفئة
                    const finalRecs = recProducts.length >= 2 ? recProducts : siteData.products.filter(p => p.slug !== product.slug && p.slug !== "toort-custom-master" && p.slug !== "flowers-master").slice(0, 2);
                    
                    suggestionsGrid.innerHTML = finalRecs.map(p => window.generateStrictProductCardHTML(p, currency)).join('');
                    window.attachProductCardEvents(suggestionsGrid, siteData.products, currency);
                }

                setupStepperMechanics(currency);
                setupSizeTabsEvents(currency);
                setupCartIntegration();
                setupInteractiveReviewsEngine();
            }

            function setupStepperMechanics(currency) {
                const btnDec = document.getElementById('btn-decrement-bose');
                const btnInc = document.getElementById('btn-increment-bose');
                const qtyInput = document.getElementById('input-bose-qty-val');
                const priceNode = document.getElementById('product-price-node');

                if (!qtyInput || !btnDec || !btnInc || !priceNode) return;

                const refreshPriceLabel = () => {
                    const qty = parseInt(qtyInput.value, 10) || 1;
                    const base = parseFloat(priceNode.dataset.unitBase);
                    priceNode.textContent = `${base * qty} ${currency}`;
                };

                btnDec.addEventListener('click', function(e) { e.preventDefault(); let val = parseInt(qtyInput.value, 10) || 1; if (val > 1) { qtyInput.value = val - 1; refreshPriceLabel(); } });
                btnInc.addEventListener('click', function(e) { e.preventDefault(); let val = parseInt(qtyInput.value, 10) || 1; if (val < 99) { qtyInput.value = val + 1; refreshPriceLabel(); } });
            }

            function setupSizeTabsEvents(currency) {
                const priceNode = document.getElementById('product-price-node');
                const qtyInput = document.getElementById('input-bose-qty-val');
                const radios = document.querySelectorAll('.size-radio-node');

                radios.forEach(radio => {
                    radio.addEventListener('change', function() {
                        if (this.checked) {
                            const rawPrice = parseFloat(this.dataset.price);
                            const updatedUnitPrice = window.calculateBosePrice ? window.calculateBosePrice(rawPrice, "menu-only") : rawPrice;
                            
                            priceNode.dataset.unitBase = updatedUnitPrice;
                            const qty = parseInt(qtyInput.value, 10) || 1;
                            priceNode.textContent = `${updatedUnitPrice * qty} ${currency}`;
                        }
                    });
                });
            }

            function setupCartIntegration() {
                const triggerBtn = document.getElementById('btn-add-to-cart-trigger');
                if (!triggerBtn) return;

                triggerBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const qtyInput = document.getElementById('input-bose-qty-val');
                    const quantity = parseInt(qtyInput.value, 10) || 1;
                    const checkedRadio = document.querySelector('.size-radio-node:checked');
                    const activeSize = checkedRadio ? checkedRadio.value : 'triangle';

                    window.getBoseDatabase().then(siteData => {
                        const matchedProduct = siteData.products.find(p => String(p.slug) === String(productSlug) || String(p.id) === String(productSlug));
                        if (!matchedProduct) return;

                        const options = { size: activeSize };
                        if (matchedProduct.prices && matchedProduct.sizes) {
                            const matchedSize = matchedProduct.sizes.find(s => s.id === activeSize);
                            options.flavorName = `${matchedProduct.flavorName || "كلاسيك"} (${matchedSize ? matchedSize.name : ""})`;
                        } else {
                            options.flavorName = matchedProduct.flavorName || "كلاسيك";
                        }

                        const cartItem = window.createCartItem ? window.createCartItem(matchedProduct, options, quantity) : null;
                        if (cartItem && typeof window.addBoseCartItem === 'function') {
                            window.addBoseCartItem(cartItem);
                            qtyInput.value = 1;
                            const currentBase = parseFloat(document.getElementById('product-price-node').dataset.unitBase);
                            const currency = siteData.store.currency || "EGP";
                            document.getElementById('product-price-node').textContent = `${currentBase} ${currency}`;
                        }
                    });
                });
            }

            function setupInteractiveReviewsEngine() {
                const toggleFormBtn = document.getElementById('bose-toggle-review-form-btn');
                const formWrapper = document.getElementById('bose-review-form-wrapper');
                const submitReviewBtn = document.getElementById('bose-submit-review-btn');
                const fileInput = document.getElementById('bose-review-file-input');
                const previewContainer = document.getElementById('review-images-preview');
                const reviewsList = document.getElementById('bose-active-reviews-list-container');
                const fallbackMsg = document.getElementById('bose-no-reviews-fallback');

                let uploadedImagesBase64 = [];

                if (!toggleFormBtn || !formWrapper || !submitReviewBtn) return;

                toggleFormBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (formWrapper.style.display === 'none') {
                        formWrapper.style.display = 'block';
                        this.innerHTML = `<i class="fas fa-times"></i> تراجع عن كتابة المراجعة`;
                    } else {
                        formWrapper.style.display = 'none';
                        this.innerHTML = `<i class="fas fa-pen"></i> شاركنا تجربتك وتقييمك الفاخر`;
                    }
                });

                if (fileInput && previewContainer) {
                    fileInput.addEventListener('change', function() {
                        previewContainer.innerHTML = "";
                        uploadedImagesBase64 = [];
                        
                        const files = Array.from(this.files);
                        files.forEach(file => {
                            const reader = new FileReader();
                            reader.onload = function(e) {
                                uploadedImagesBase64.push(e.target.result);
                                const img = document.createElement('img');
                                img.src = e.target.result;
                                img.className = 'review-preview-thumb';
                                previewContainer.appendChild(img);
                            };
                            reader.readAsDataURL(file);
                        });
                    });
                }

                submitReviewBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const name = document.getElementById('bose-review-user-name').value.trim();
                    const comment = document.getElementById('bose-review-comment').value.trim();
                    const checkedRadio = document.querySelector('input[name="interactive-rating"]:checked');
                    const ratingValue = checkedRadio ? parseInt(checkedRadio.value, 10) : 5;

                    if (!name) {
                        if (typeof window.showBoseToast === 'function') window.showBoseToast("ياريت تكتب اسمك الكريم أولاً علشان ننشر مراجعتك الفاخرة 🌸");
                        return;
                    }
                    if (!comment) {
                        if (typeof window.showBoseToast === 'function') window.showBoseToast("من فضلك اكتب رأيك أو تجربتك الصادقة داخل خانة التعليق ✨");
                        return;
                    }

                    if (fallbackMsg) fallbackMsg.style.display = 'none';

                    let rStars = "";
                    for (let i = 1; i <= 5; i++) rStars += i <= ratingValue ? "★" : "☆";

                    let attachedImagesHTML = "";
                    if (uploadedImagesBase64.length > 0) {
                        attachedImagesHTML = `<div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">`;
                        uploadedImagesBase64.forEach(base64 => {
                            attachedImagesHTML += `<img src="${base64}" style="width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid rgba(255,145,164,0.2);" />`;
                        });
                        attachedImagesHTML += `</div>`;
                    }

                    const newReviewCard = document.createElement('div');
                    newReviewCard.className = 'review-row-card';
                    newReviewCard.style.animation = 'fadeIn 0.4s ease forwards';
                    newReviewCard.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <strong style="font-size:14px; font-weight:700; color:var(--bose-black);">${window.escapeHTML ? window.escapeHTML(name) : name} <span style="font-size:11px; font-weight:400; opacity:0.6; margin-right:6px;">(مراجعة مؤكدة لحظياً)</span></strong>
                            <span style="color:var(--bose-gold); font-size: 1rem;">${rStars}</span>
                        </div>
                        <p style="margin:0; font-size:13.5px; opacity:0.9; color:var(--bose-black);">"${window.escapeHTML ? window.escapeHTML(comment) : comment}"</p>
                        ${attachedImagesHTML}
                    `;

                    reviewsList.insertBefore(newReviewCard, reviewsList.firstChild);

                    document.getElementById('bose-review-user-name').value = "";
                    document.getElementById('bose-review-comment').value = "";
                    if (checkedRadio) checkedRadio.checked = false;
                    if (previewContainer) previewContainer.innerHTML = "";
                    uploadedImagesBase64 = [];
                    
                    formWrapper.style.display = 'none';
                    toggleFormBtn.innerHTML = `<i class="fas fa-pen"></i> شاركنا تجربتك وتقييمك الفاخر`;

                    if (typeof window.showBoseToast === 'function') window.showBoseToast("تم نشر مراجعتك الفاخرة بنجاح، شكراً لمشاركتنا تجربتك السعيدة! 🌸");
                });
            }

            function renderErrorPanel(message) {
                viewContainer.innerHTML = `
                    <div class="error-state-box" style="text-align: center; padding: 60px 20px; color: var(--bose-black);">
                        <h2 style="font-size:1.4rem; font-weight:700; margin-bottom:14px; font-family:'Cairo', sans-serif;">${message}</h2>
                        <a href="menu.html" style="display: inline-block; margin-top: 20px; color: var(--bose-pink); text-decoration: none; font-weight: 700; font-family:'Cairo', sans-serif;">العودة لتصفح المنيو الشامل بالكامل</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
