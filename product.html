<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | حلويات بوسي</title>
    <!-- استدعاء خط Cairo الاحترافي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- الملفات الأسلوبية الموحدة -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        /* تصميم مخصص لصفحة المنتج الفردية متوافق مع الألوان الحاكمة للموقع */
        .product-details-wrapper {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #FFFFFF;
        }

        .breadcrumb {
            font-size: 0.95rem;
            margin-bottom: 25px;
            color: #111111;
        }

        .breadcrumb a {
            color: #111111;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .breadcrumb a:hover {
            color: #Ff91a4;
        }

        .breadcrumb span {
            margin: 0 8px;
            color: #ccc;
        }

        .product-grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .product-grid-container {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            .product-details-wrapper {
                margin: 20px auto;
            }
        }

        .product-gallery {
            position: relative;
            background-color: #FFFFFF;
            border: 1px solid transparent;
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .product-gallery:hover {
            border-color: #Ff91a4;
            box-shadow: 0 8px 24px rgba(255, 145, 164, 0.15);
        }

        .product-main-img {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            display: block;
        }

        .product-info-panel {
            display: flex;
            flex-direction: column;
        }

        .product-title-text {
            font-family: 'Cairo', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #111111;
            margin: 0 0 15px 0;
            line-height: 1.4;
        }

        .product-rating-box {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .stars-container {
            color: #D4AF37;
            font-size: 1.2rem;
        }

        .rating-count-text {
            font-size: 0.9rem;
            color: #555555;
        }

        .product-price-tag {
            font-size: 1.75rem;
            font-weight: 700;
            color: #Ff91a4;
            margin-bottom: 25px;
            display: inline-block;
        }

        .product-description-content {
            font-size: 1.1rem;
            color: #111111;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .product-specifications-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 35px;
        }

        .product-specifications-table td {
            padding: 12px 0;
            border-bottom: 1px solid #eeeeee;
            font-size: 1rem;
            color: #111111;
        }

        .product-specifications-table td.spec-label {
            font-weight: 600;
            width: 30%;
        }

        .purchase-controls-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .quantity-stepper {
            display: flex;
            align-items: center;
            border: 1px solid #111111;
            border-radius: 6px;
            overflow: hidden;
            height: 48px;
        }

        .quantity-stepper button {
            background: none;
            border: none;
            width: 40px;
            height: 100%;
            font-size: 1.2rem;
            cursor: pointer;
            color: #111111;
            transition: background-color 0.2s;
        }

        .quantity-stepper button:hover {
            background-color: #f5f5f5;
        }

        .quantity-display-input {
            width: 50px;
            height: 100%;
            border: none;
            border-left: 1px solid #111111;
            border-right: 1px solid #111111;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #111111;
            background: transparent;
            -moz-appearance: textfield;
        }

        .quantity-display-input::-webkit-outer-spin-button,
        .quantity-display-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .add-to-cart-action-btn {
            flex-grow: 1;
            height: 48px;
            background-color: #111111;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .add-to-cart-action-btn:hover {
            background-color: #Ff91a4;
        }

        .add-to-cart-action-btn:active {
            transform: scale(0.98);
        }

        /* رسالة التنبيه المنبثقة الراقية والسريعة */
        .toast-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #111111;
            color: #FFFFFF;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
        }

        .toast-notification.is-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* هيكل التحميل الهيكلي الـ Skeleton الفائق لخلق تجربة أداء فورية */
        .skeleton-block {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .error-state-box {
            text-align: center;
            padding: 60px 20px;
            color: #111111;
        }

        .error-return-link {
            display: inline-block;
            margin-top: 20px;
            color: #Ff91a4;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- الهيدر الموحد للموقع -->
    <header class="site-header">
        <div class="header-container">
            <a href="index.html" class="logo-link">حلويات بوسي</a>
            <nav class="main-navigation">
                <a href="index.html">الرئيسية</a>
                <a href="menu.html">تصفح المنيو</a>
                <a href="cake-builder.html">صمم تورتتك</a>
                <a href="flower-builder.html">تنسيق الورد</a>
            </nav>
            <div class="header-actions">
                <a href="cart.html" class="cart-anchor" aria-label="سلة المشتريات">
                    <span class="cart-icon-visual">🛒</span>
                    <span id="cart-count-badge" class="cart-counter-indicator">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- منطقة تفاصيل المنتج الديناميكية -->
    <main id="product-page-main" class="product-details-wrapper">
        <!-- يتم بناء الهيكل المؤقت Skeleton تلقائياً عبر المحرك البرمجي ريثما تُقرأ البيانات -->
        <div class="product-grid-container">
            <div class="product-gallery skeleton-block" style="aspect-ratio: 1/1;"></div>
            <div class="product-info-panel">
                <div class="skeleton-block" style="height: 40px; width: 70%; margin-bottom: 20px;"></div>
                <div class="skeleton-block" style="height: 20px; width: 40%; margin-bottom: 20px;"></div>
                <div class="skeleton-block" style="height: 35px; width: 30%; margin-bottom: 30px;"></div>
                <div class="skeleton-block" style="height: 100px; width: 100%; margin-bottom: 30px;"></div>
            </div>
        </div>
    </main>

    <!-- الفوتر الموحد للموقع -->
    <footer class="site-footer">
        <div class="footer-container">
            <p class="copyright-text">© 2026 حلويات بوسي. كل الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- عنصر التنبيه الموحد السريع لعمليات إضافة المنتجات -->
    <div id="toast-alert" class="toast-notification" role="alert" aria-live="assertive">تمت إضافة المنتج إلى السلة.</div>

    <!-- استدعاء المحرك العام الوحيد لضمان المزامنة والقراءة الموحدة للـ JSON وسلة المشتريات -->
    <script src="js/core-engine.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // استخراج معرف المنتج (ID) من الرابط URL بكل دقة وعزل تام للاحتمالات الخاطئة
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            const mainContainer = document.getElementById('product-page-main');

            if (!productId) {
                renderErrorState("لم نتمكن من العثور على هذا المنتج.");
                return;
            }

            // التحقق من جهوزية قاعدة البيانات المشتركة عبر المحرك العام
            if (window.BoseSweetsData) {
                initProductLoading(window.BoseSweetsData);
            } else {
                // في حال تأخر تحميل الملف الأصلي لسبب شبكي، يتم الإنصات لحدث اكتماله الصادر من المحرك
                document.addEventListener("BoseDataReady", function(e) {
                    initProductLoading(e.detail);
                });
            }

            function initProductLoading(siteData) {
                let foundProduct = null;
                let foundCategoryName = "المنيو";

                // بحث شامل وتفصيلي متوافق مع الفئات الـ 12 المعتمدة في المنيو وقاعدة البيانات
                if (siteData && siteData.categories) {
                    for (const catKey in siteData.categories) {
                        const category = siteData.categories[catKey];
                        if (category.products && Array.isArray(category.products)) {
                            const match = category.products.find(p => String(p.id) === String(productId));
                            if (match) {
                                foundProduct = match;
                                foundCategoryName = category.name || foundCategoryName;
                                break;
                            }
                        }
                    }
                }

                if (foundProduct) {
                    renderProductData(foundProduct, foundCategoryName);
                } else {
                    renderErrorState("عذراً، المنتج غير موجود ضمن تشكيلتنا الحالية.");
                }
            }

            function renderProductData(product, categoryName) {
                // معالجة وحساب التقييمات والنجوم الرمزية الفاخرة بناءً على البيانات الواقعية المتاحة
                const ratingValue = product.rating || 5;
                let starsHtml = "";
                for (let i = 1; i <= 5; i++) {
                    starsHtml += i <= Math.floor(ratingValue) ? "★" : "☆";
                }

                // صياغة وعرض محتوى الصفحة الفعلي بشكل Scannable ومنظم لراحة العميل البصرية
                mainContainer.innerHTML = `
                    <nav class="breadcrumb" aria-label="مسار التنقل">
                        <a href="index.html">الرئيسية</a>
                        <span>/</span>
                        <a href="menu.html">${categoryName}</a>
                        <span>/</span>
                        <span aria-current="page">${product.name}</span>
                    </nav>

                    <div class="product-grid-container">
                        <div class="product-gallery">
                            <img src="${product.image}" alt="${product.name}" class="product-main-img" loading="eager" />
                        </div>

                        <div class="product-info-panel">
                            <h1 class="product-title-text">${product.name}</h1>
                            
                            <div class="product-rating-box">
                                <div class="stars-container" aria-label="تقييم ${ratingValue} من 5">${starsHtml}</div>
                                <span class="rating-count-text">(${product.reviews_count || 12} تقييم)</span>
                            </div>

                            <div class="product-price-tag">${product.price} جنيه</div>

                            <p class="product-description-content">${product.description}</p>

                            <table class="product-specifications-table">
                                <tbody>
                                    ${product.size ? `<tr><td class="spec-label">الحجم</td><td>${product.size}</td></tr>` : ''}
                                    ${product.ingredients ? `<tr><td class="spec-label">المكونات أساسية</td><td>${product.ingredients}</td></tr>` : ''}
                                    <tr><td class="spec-label">التوفر</td><td>طازج وجاهز للاستلام أو التوصيل السريع</td></tr>
                                </tbody>
                            </table>

                            <div class="purchase-controls-row">
                                <div class="quantity-stepper">
                                    <button type="button" id="btn-decrease-qty" aria-label="تقليل الكمية">−</button>
                                    <input type="number" id="input-product-qty" class="quantity-display-input" value="1" min="1" max="99" readonly />
                                    <button type="button" id="btn-increase-qty" aria-label="زيادة الكمية">+</button>
                                </div>
                                <button type="button" id="btn-add-to-cart-trigger" class="add-to-cart-action-btn">إضافة للسلة</button>
                            </div>
                        </div>
                    </div>
                `;

                // تفعيل عداد التحكم في الكمية
                setupQuantityControls();
                
                // ربط زر الإضافة للسلة بالمحرك لضمان التحديث اللحظي لعداد الهيدر والـ LocalStorage
                setupAddToCartAction(product);
            }

            function setupQuantityControls() {
                const btnDecrease = document.getElementById('btn-decrease-qty');
                const btnIncrease = document.getElementById('btn-increase-qty');
                const qtyInput = document.getElementById('input-product-qty');

                if (!qtyInput || !btnDecrease || !btnIncrease) return;

                btnDecrease.addEventListener('click', function() {
                    let currentVal = parseInt(qtyInput.value, 10) || 1;
                    if (currentVal > 1) {
                        qtyInput.value = currentVal - 1;
                    }
                });

                btnIncrease.addEventListener('click', function() {
                    let currentVal = parseInt(qtyInput.value, 10) || 1;
                    if (currentVal < 99) {
                        qtyInput.value = currentVal + 1;
                    }
                });
            }

            function setupAddToCartAction(product) {
                const addToCartBtn = document.getElementById('btn-add-to-cart-trigger');
                if (!addToCartBtn) return;

                addToCartBtn.addEventListener('click', function() {
                    const qtyInput = document.getElementById('input-product-qty');
                    const quantity = parseInt(qtyInput.value, 10) || 1;

                    // استدعاء دالة الإضافة المشتركة المتواجدة بالمحرك العام core-engine.js لتوحيد منطق السلة منعاً لأي تعارض
                    if (window.BoseCart && typeof window.BoseCart.addItem === 'function') {
                        window.BoseCart.addItem({
                            id: product.id,
                            name: product.name,
                            price: parseFloat(product.price),
                            image: product.image,
                            quantity: quantity
                        });
                        
                        // إظهار التنبيه المنبثق الراقي والقصير المتفق عليه
                        showToastNotification();
                    } else {
                        // حل بديل احترافي وتلقائي في حال لم تكن الدالة محملة بعد لمنع توقف تجربة المستخدم
                        let localCart = JSON.parse(localStorage.getItem('bose_cart_items')) || [];
                        const existingItem = localCart.find(item => String(item.id) === String(product.id));
                        
                        if (existingItem) {
                            existingItem.quantity += quantity;
                        } else {
                            localCart.push({
                                id: product.id,
                                name: product.name,
                                price: parseFloat(product.price),
                                image: product.image,
                                quantity: quantity
                            });
                        }
                        localStorage.setItem('bose_cart_items', JSON.stringify(localCart));
                        
                        // إرسال حدث لتحديث العداد في الهيدر فورياً
                        document.dispatchEvent(new CustomEvent('CartUpdated'));
                        showToastNotification();
                    }
                });
            }

            function showToastNotification() {
                const toast = document.getElementById('toast-alert');
                if (!toast) return;
                
                toast.classList.add('is-visible');
                setTimeout(() => {
                    toast.classList.remove('is-visible');
                }, 3000);
            }

            function renderErrorState(message) {
                mainContainer.innerHTML = `
                    <div class="error-state-box">
                        <h2>${message}</h2>
                        <a href="menu.html" class="error-return-link">العودة لتصفح المنيو الشامل</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
