<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>جاري تحويلك... | حلويات بوسي</title>

    <!--
        🆕👑 [دمج صفحة المنتج جوه صفحة الفئة - إصدار جديد]:
        بناءً على قرار صاحبة المتجر، اتشالت صفحة تفاصيل المنتج المستقلة دي
        بالكامل والصفحة الحقيقية بقت جوه category.html (نافذة تفاصيل مدمجة،
        من غير أي تنقل صفحات - راجع window.openBoseProductDetailModal هناك).

        الملف ده اتسيب هنا عمداً كـ "مُحوِّل" بس (مش صفحة حقيقية) عشان أي رابط
        قديم كان بيشاور على product.html؟slug=X - محفوظ في جوجل، مبعوت في
        فاتورة واتساب قديمة، متبعت في محادثة قديمة، أو مضاف كمفضلة في متصفح حد -
        يفضل شغال ويوديه للمكان الصحيح بدل ما يوصله لصفحة فاضية أو خطأ 404.

        ⚠️ [ملاحظة لأي حد يشتغل على الكود بعد كده]: لسه فيه أماكن تانية في
        الموقع بتشاور مباشرة على product.html وبتحتاج تحديث في مرحلة تانية
        (لسه ماتمتش لغاية دلوقتي): ملف الأرشفة الآلي (api/sitemap.js)، فيد
        جوجل شوبينج (api/product-feed.js)، قسم التقييمات (js/reviews-widget.js)،
        والجولة التفاعلية (js/guided-tour.js + admin/js/pages/tour-page.js).
        دول محتاجين مراجعة/تحديث مستقلة عشان يتوافقوا مع الرابط الجديد،
        ومش لازم يوقفوا شغل التحويل البسيط هنا لحد ما يتحدثوا.
    -->

    <script src="js/supabase-client.js?v=2027_production_v43.0" defer></script>
    <script>
        function boseRedirectOldProductLink(siteData) {
            var params = new URLSearchParams(window.location.search);
            var slug = params.get('slug');
            var size = params.get('size');
            var qty = params.get('qty');

            var product = (slug && siteData && siteData.products)
                ? siteData.products.find(function(p) { return p.slug === slug || p.id === slug; })
                : null;

            var target;
            if (product) {
                var newParams = new URLSearchParams();
                if (product.category) newParams.set('category', product.category);
                newParams.set('product', product.slug);
                if (size) newParams.set('size', size);
                if (qty) newParams.set('qty', qty);
                target = '/category.html?' + newParams.toString();
            } else {
                // المنتج مش موجود (اتشال، أو الرابط غلط) - نوديها لمنيو المتجر
                // الرئيسي بدل ما نسيبها في صفحة فاضية.
                target = '/menu.html';
            }
            window.location.replace(target);
        }

        if (window.BoseStoreData) {
            boseRedirectOldProductLink(window.BoseStoreData);
        } else {
            document.addEventListener("BoseDatabaseLoaded", function(e) {
                boseRedirectOldProductLink(e.detail);
            });
            // 🛡️ شبكة أمان: لو تحميل بيانات المتجر اتأخر لأي سبب (اتصال بطيء، مشكلة
            // مؤقتة)، منسيبش الزائر واقف على صفحة فاضية أكتر من 4 ثواني - نوديه
            // لمنيو المتجر بدل ما يحس إن اللينك باظ.
            setTimeout(function() {
                if (!window.BoseStoreData) window.location.replace('/menu.html');
            }, 4000);
        }
    </script>
</head>
<body>
</body>
</html>
