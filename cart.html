<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        السلة - حلويات بوسي
    </title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

</head>

<body>

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header>

        <button id="sidebar-toggle">
            ☰
        </button>

        <div id="brand">
            حلويات بوسي
        </div>

        <input
            id="header-search"
            type="text"
            placeholder="ابحث عن منتج"
        >

        <a
            href="./cart.html"
            id="header-cart"
        >

            🛒

            <span id="header-cart-count">
                0
            </span>

        </a>

    </header>

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <aside id="sidebar">

        <button id="sidebar-close">
            ×
        </button>

        <nav>

            <ul>

                <li>
                    <a href="./index.html">
                        الرئيسية
                    </a>
                </li>

                <li>
                    <a href="./menu.html">
                        المنيو
                    </a>
                </li>

                <li>
                    <a href="./checkout.html">
                        اتمام الطلب
                    </a>
                </li>

            </ul>

        </nav>

    </aside>

    <div id="sidebar-overlay"></div>

    <!-- ================================================= -->
    <!-- PAGE HERO -->
    <!-- ================================================= -->

    <section class="page-hero">

        <h1>
            سلة المشتريات
        </h1>

        <p>
            راجعي المنتجات والتفاصيل قبل اتمام الطلب.
        </p>

    </section>

    <!-- ================================================= -->
    <!-- CART -->
    <!-- ================================================= -->

    <main>

        <section class="cart-section">

            <div
                id="cart-items"
                class="cart-items"
            ></div>

            <div class="cart-summary">

                <div class="summary-row">

                    <span>
                        إجمالي المنتجات
                    </span>

                    <span id="cart-subtotal">
                        0 ج.م
                    </span>

                </div>

                <div class="summary-row total">

                    <span>
                        الإجمالي النهائي
                    </span>

                    <span id="cart-total">
                        0 ج.م
                    </span>

                </div>

                <a
                    href="./checkout.html"
                    class="checkout-button"
                >
                    اتمام الطلب
                </a>

            </div>

        </section>

    </main>

    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <footer>

        <div class="footer-links">

            <a href="#">
                من نحن
            </a>

            <a href="#">
                سياسة الخصوصية
            </a>

            <a href="#">
                سياسة الاسترجاع
            </a>

            <a href="#">
                تواصل معنا
            </a>

        </div>

        <div class="footer-social">

            <a href="#">
                Facebook
            </a>

            <a href="#">
                Instagram
            </a>

            <a href="#">
                TikTok
            </a>

        </div>

    </footer>

    <!-- ================================================= -->
    <!-- SCRIPTS -->
    <!-- ================================================= -->

    <script
        type="module"
        src="./contracts.js"
    ></script>

    <script
        type="module"
        src="./data-service.js"
    ></script>

    <script
        type="module"
        src="./cart-service.js"
    ></script>

    <script
        type="module"
        src="./ui-engine.js"
    ></script>

    <script
        type="module"
        src="./cart-page.js"
    ></script>

</body>

</html>
