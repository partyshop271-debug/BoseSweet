<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حقيبة المشتريات | حلويات بوسي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* الهوية البصرية الصارمة لعلامة حلويات بوسي */
        :root {
            --primary-pink: #ff91a4;
            --primary-dark: #222222;
            --surface-light: #ffffff;
            --bg-soft: #fffafb;
            --text-main: #222222;
            --text-muted: #666666;
            --border-radius-card: 16px;
            --shadow-soft: 0 4px 15px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 8px 25px rgba(255, 145, 164, 0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            margin: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* الهيدر السيادي */
        .main-header {
            background: var(--surface-light);
            box-shadow: var(--shadow-soft);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            margin: 0;
            color: var(--primary-pink);
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: -0.5px;
        }

        /* تصميم صفحة السلة */
        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            margin-top: 40px;
        }
        
        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
                gap: 25px;
            }
        }

        .page-title-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            border-bottom: 2px solid rgba(255, 145, 164, 0.1);
            padding-bottom: 20px;
        }

        .page-title {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
        }

        .text-pink { color: var(--primary-pink); }

        /* كارت المنتج في السلة */
        .cart-item {
            display: flex;
            gap: 20px;
            background: var(--surface-light);
            border-radius: var(--border-radius-card);
            border: 1px solid rgba(255, 145, 164, 0.1);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
            position: relative;
        }

        .cart-item:hover {
            border-color: var(--primary-pink);
            box-shadow: var(--shadow-hover);
        }

        .cart-item-img {
            width: 120px;
            height: 120px;
            border-radius: 12px;
            object-fit: cover;
            background: #f9f9f9;
        }

        .cart-item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .cart-item-name {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0 0 5px 0;
        }

        .cart-item-price {
            color: var(--primary-pink);
            font-weight: 900;
            font-size: 1.1rem;
        }

        /* التحكم في الكمية */
        .qty-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f8f8f8;
            padding: 8px 12px;
            border-radius: 10px;
        }

        .qty-btn {
            background: none;
            border: 1px solid rgba(255,145,164,0.3);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--primary-pink);
            font-weight: 900;
            transition: var(--transition-smooth);
        }

        .qty-btn:hover {
            background: var(--primary-pink);
            color: white;
        }

        /* ملخص الطلب */
        .summary-card {
            background: var(--surface-light);
            border-radius: var(--border-radius-card);
            border: 2px solid var(--primary-pink);
            padding: 25px;
            position: sticky;
            top: 100px;
            box-shadow: var(--shadow-soft);
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 20px;
            border-right: 4px solid var(--primary-pink);
            padding-right: 12px;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .total-line {
            border-top: 2px dashed rgba(255, 145, 164, 0.2);
            margin-top: 20px;
            padding-top: 15px;
            font-size: 1.4rem;
            color: var(--primary-pink);
        }

        .btn-checkout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary-pink);
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-smooth);
            margin-top: 25px;
        }

        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 145, 164, 0.3);
        }

        /* الاقتراحات */
        .suggestions-section {
            margin-top: 80px;
            padding-bottom: 60px;
        }

        .suggestions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        @media (max-width: 600px) {
            .suggestions-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        .suggestion-card {
            background: white;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255,145,164,0.1);
            text-align: center;
            transition: var(--transition-smooth);
        }

        .suggestion-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-pink);
        }

        .suggestion-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(-360deg); } }

        .footer {
            background: #fffafb;
            padding: 50px 0;
            text-align: center;
            border-top: 1px solid rgba(255,145,164,0.1);
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container header-content">
            <button onclick="window.history.back()" style="background:none; border:none; cursor:pointer;"><i data-lucide="arrow-right"></i></button>
            <h1 class="brand-title" onclick="window.location.href='index.html'">حلويات بوسي</h1>
            <button onclick="window.location.href='menu.html'" style="background:none; border:none; cursor:pointer;"><i data-lucide="layout-grid"></i></button>
        </div>
    </header>

    <main class="container">
        <div class="page-title-section">
            <i data-lucide="shopping-basket" class="text-pink" style="width: 35px; height: 35px;"></i>
            <h2 class="page-title">حقيبة <span class="text-pink">المشتريات</span></h2>
        </div>

        <div class="cart-layout">
            <!-- قائمة المنتجات -->
            <div id="cart-items-list">
                <div style="text-align: center; padding: 60px 0;">
                    <i data-lucide="loader-2" class="spin text-pink" style="width: 40px; height: 40px; margin-bottom: 15px;"></i>
                    <p style="font-weight: 700; color: var(--text-muted);">تأمين بيانات السلة السيادية...</p>
                </div>
            </div>

            <!-- ملخص الحساب -->
            <aside>
                <div class="summary-card" id="cart-summary-box" style="display: none;">
                    <h3 class="summary-title">ملخص الطلب</h3>
                    
                    <div class="summary-line">
                        <span>إجمالي الوحدات</span>
                        <span id="summary-subtotal">0 ج.م</span>
                    </div>
                    
                    <div class="summary-line" style="color: var(--text-muted); font-size: 0.9rem;">
                        <span>رسوم التوصيل</span>
                        <span>تُحدد لاحقاً</span>
                    </div>

                    <div class="summary-line total-line">
                        <span>الإجمالي</span>
                        <span id="summary-total">0 ج.م</span>
                    </div>

                    <a href="checkout.html" class="btn-checkout">
                        متابعة الطلب <i data-lucide="chevron-left"></i>
                    </a>
                </div>
            </aside>
        </div>

        <!-- اقتراحات ذكية -->
        <section class="suggestions-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h3 style="margin:0; font-weight: 900;">إضافات <span class="text-pink">مميزة</span></h3>
                <a href="menu.html" style="color: var(--primary-pink); text-decoration: none; font-weight: 700;">عرض المنيو</a>
            </div>
            <div class="suggestions-grid" id="cart-suggestions-container"></div>
        </section>
    </main>

    <footer class="footer">
        <h3 class="text-pink" style="font-weight: 900; margin-bottom: 15px;">حلويات بوسي</h3>
        <p style="font-weight: 700;">مركز الفرافرة - الكفاح - الوادي الجديد</p>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 20px;">&copy; 2026 جميع الحقوق محفوظة لعلامة حلويات بوسي.</p>
    </footer>

    <!-- المحرك السيادي المدمج -->
    <script type="module">
        /**
         * 👑 BoseSweets Unified Cart Engine (V30.1)
         * المحرك الموحد المدمج لإدارة السلة والعمليات الحسابية السيادية.
         */
        
        // محاكاة الحالة في حال عدم وجود core-engine
        const BoseState = window.BoseState || {
            cart: JSON.parse(localStorage.getItem('BoseSweets_Cart')) || [],
            catalog: [],
            shippingZones: []
        };

        const cartSystem = {
            getAdjustedPrice: (p) => Math.round(parseFloat(p)),

            getCart: () => {
                const local = localStorage.getItem('BoseSweets_Cart') || localStorage.getItem('bose_cart_items');
                if (local) {
                    const parsed = JSON.parse(local);
                    BoseState.cart = parsed;
                    return parsed;
                }
                return BoseState.cart || [];
            },

            save: () => {
                localStorage.setItem('BoseSweets_Cart', JSON.stringify(BoseState.cart));
                cartSystem.updateGlobalUI();
            },

            calculate: () => {
                let subtotal = 0;
                BoseState.cart.forEach(item => {
                    let base = cartSystem.getAdjustedPrice(item.price);
                    if (item.isCustomCake) {
                        if (item.printing?.includes('أكل')) base += 60;
                        else if (item.printing?.includes('غير')) base += 20;
                    }
                    subtotal += (base * item.quantity);
                });
                return { subtotal, total: subtotal };
            },

            syncUI: () => {
                const list = document.getElementById('cart-items-list');
                const summaryBox = document.getElementById('cart-summary-box');
                const subEl = document.getElementById('summary-subtotal');
                const totEl = document.getElementById('summary-total');

                if (!list) return;

                const items = cartSystem.getCart();

                if (items.length === 0) {
                    list.innerHTML = `
                        <div style="text-align:center; padding: 50px 20px;">
                            <i data-lucide="shopping-bag" style="width: 60px; height: 60px; opacity:0.1; margin-bottom: 15px;"></i>
                            <p style="font-weight: 700; color: #999;">السلة فارغة حالياً</p>
                            <a href="menu.html" class="btn-checkout" style="max-width: 200px; margin: 20px auto; font-size: 0.9rem; padding: 12px;">تصفح المنيو</a>
                        </div>`;
                    if (summaryBox) summaryBox.style.display = 'none';
                    if (window.lucide) lucide.createIcons();
                    return;
                }

                if (summaryBox) summaryBox.style.display = 'block';

                let html = '';
                items.forEach((item, idx) => {
                    let img = item.image || 'https://res.cloudinary.com/dm965v1z0/image/upload/v1712586716/logo_bose_gold.jpg';
                    if (img && !img.startsWith('http')) img = `https://res.cloudinary.com/dm965v1z0/image/upload/f_auto,q_auto/v1/${img}`;

                    html += `
                        <div class="cart-item">
                            <img src="${img}" class="cart-item-img" alt="${item.name}">
                            <div class="cart-item-info">
                                <h4 class="cart-item-name">${item.name}</h4>
                                <div class="cart-item-price">${item.price} ج.م</div>
                                ${item.isCustomCake ? `<small style="font-weight:700; opacity:0.6;">نكهة: ${item.flavor}</small>` : ''}
                            </div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="window.cartSystem.mod(${idx}, -1)">-</button>
                                <span style="font-weight:900; min-width: 20px; text-align:center;">${item.quantity}</span>
                                <button class="qty-btn" onclick="window.cartSystem.mod(${idx}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });

                list.innerHTML = html;
                const vals = cartSystem.calculate();
                if (subEl) subEl.innerText = `${vals.subtotal} ج.م`;
                if (totEl) totEl.innerText = `${vals.total} ج.م`;
                if (window.lucide) lucide.createIcons();
            },

            mod: (idx, delta) => {
                if (BoseState.cart[idx]) {
                    BoseState.cart[idx].quantity += delta;
                    if (BoseState.cart[idx].quantity <= 0) BoseState.cart.splice(idx, 1);
                    cartSystem.save();
                    cartSystem.syncUI();
                }
            },

            updateGlobalUI: () => {
                // تحديث العدادات إذا وجدت في الهيدر
                const badge = document.getElementById('cart-count-badge');
                if (badge) {
                    const total = BoseState.cart.reduce((s, i) => s + i.quantity, 0);
                    badge.innerText = total;
                    badge.style.display = total > 0 ? 'flex' : 'none';
                }
            }
        };

        // الربط العالمي
        window.cartSystem = cartSystem;

        // تهيئة الصفحة
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            cartSystem.syncUI();
            renderSuggestions();
        });

        // محرك الاقتراحات
        function renderSuggestions() {
            const container = document.getElementById('cart-suggestions-container');
            if (!container || !window.catalog) return;
            
            const currentIds = BoseState.cart.map(i => String(i.id));
            const pool = window.catalog.filter(p => !currentIds.includes(String(p.id)));
            const picked = pool.sort(() => 0.5 - Math.random()).slice(0, 4);

            if (picked.length === 0) return;

            container.innerHTML = picked.map(p => `
                <div class="suggestion-card">
                    <img src="${p.image}" class="suggestion-img" alt="${p.name}">
                    <h4 style="font-size: 0.9rem; font-weight:700; margin: 10px 0;">${p.name}</h4>
                    <div style="color:var(--primary-pink); font-weight:900; margin-bottom: 12px;">${p.price} ج.م</div>
                    <button onclick="window.location.href='product.html?id=${p.id}'" class="btn-checkout" style="padding: 8px; font-size: 0.8rem; margin:0;">التفاصيل</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
