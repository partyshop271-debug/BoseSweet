<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حقيبة المشتريات | حلويات بوسي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            align-items: start;
        }
        
        @media (max-width: 992px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
        }

        /* كارت المنتج داخل السلة (تصميم أفقي مريح) */
        .cart-item {
            display: flex;
            gap: 20px;
            background: var(--surface-light);
            border-radius: var(--border-radius-card);
            border: 1px solid rgba(255, 145, 164, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition-smooth);
        }

        .cart-item:hover {
            box-shadow: var(--shadow-hover);
        }

        .cart-item-img {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .cart-item-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .cart-item-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .cart-item-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* زر الحذف بدون تكدس */
        .remove-btn {
            background: rgba(255, 0, 0, 0.05);
            color: #d32f2f;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .remove-btn:hover {
            background: #d32f2f;
            color: white;
        }

        .cart-item-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        /* ملخص الطلب */
        .order-summary {
            background: var(--surface-light);
            border-radius: var(--border-radius-card);
            border: 2px solid var(--primary-pink);
            padding: 30px;
            position: sticky;
            top: 100px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 145, 164, 0.2);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-pink);
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-icon" onclick="window.history.back()"><i data-lucide="arrow-right"></i></button>
            <div style="cursor: pointer;" onclick="window.location.href='index.html'">
                <h2 style="margin: 0; color: var(--primary-pink); font-size: 1.6rem;">حلويات بوسي</h2>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-icon" onclick="window.location.href='menu.html'"><i data-lucide="layout-grid"></i></button>
            </div>
        </div>
    </header>

    <main class="container mt-section mb-section">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 40px; border-bottom: 2px solid rgba(255,145,164,0.2); padding-bottom: 20px;">
            <i data-lucide="shopping-basket" style="width: 32px; height: 32px; color: var(--primary-pink);"></i>
            <h1 style="margin: 0; text-align: right;">حقيبة <span class="text-pink">المشتريات</span></h1>
        </div>

        <div class="cart-container">
            
            <div id="cart-items-list">
                <div style="text-align: center; padding: 40px 10px;">
                    <i data-lucide="loader" class="spin-animation" style="color: var(--primary-pink); margin-bottom: 15px;"></i>
                    <p style="font-weight: 700; opacity: 0.6;">جاري مزامنة بيانات الحقيبة وتأمين الأسعار...</p>
                </div>
            </div>

            <div>
                <div class="order-summary" id="cart-summary-box" style="display: none;">
                    <h3 style="text-align: right; margin-bottom: 25px; color: var(--text-main);">ملخص الطلب</h3>
                    
                    <div class="summary-row">
                        <span>المجموع الفرعي</span>
                        <span id="summary-subtotal" style="font-weight: 700;">0 ج.م</span>
                    </div>
                    <div class="summary-row" style="color: var(--text-muted); font-size: 0.9rem;">
                        <span>رسوم التوصيل</span>
                        <span id="summary-shipping">تُحدد في الخطوة القادمة</span>
                    </div>
                    
                    <div class="summary-total">
                        <span>الإجمالي المتوقع</span>
                        <span id="summary-total">0 ج.م</span>
                    </div>

                    <a href="checkout.html" class="btn-primary" style="width: 100%; margin-top: 30px; display: flex; justify-content: center; align-items: center; gap: 10px; padding: 18px;">
                        متابعة لإتمام الطلب <i data-lucide="arrow-left"></i>
                    </a>
                    
                    <p style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 15px;">
                        <i data-lucide="shield-check" style="width: 14px; display: inline-block; vertical-align: middle;"></i> المعاملة آمنة وتخضع لسياساتنا المركزية.
                    </p>
                </div>
            </div>
        </div>

        <section style="margin-top: 80px; border-top: 2px solid rgba(255,145,164,0.2); padding-top: 40px;">
            <h2 style="text-align: right; margin-bottom: 30px;">منتجات <span class="text-pink">قد تناسبك</span></h2>
            <div class="horizontal-scroll" id="cart-suggestions-container" style="display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scrollbar-width: none;">
                </div>
        </section>

    </main>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="core-engine.js"></script>
    <script type="module" src="data-bridge.js"></script>
    <script type="module" src="cart-system.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') lucide.createIcons();

            // الاستماع للنواة المركزية للتأكد من توفر الكتالوج المحدث لحماية الأسعار
            window.addEventListener('catalogDataReady', () => {
                console.log('🛡️ مستشعر المشتريات: الكتالوج جاهز، بدء مزامنة الأسعار الحية للمنتجات.');
                renderCartUI();
                renderCartSuggestions();
            });

            // معالجة حالة إذا كانت البيانات جاهزة بالفعل عند فتح الصفحة
            if (window.catalog && window.catalog.length > 0) {
                renderCartUI();
                renderCartSuggestions();
            }
        });

        // الهندسة الوظيفية لبناء الواجهة وحساب الإجمالي من الكتالوج المركزي (منع اختراق الأسعار)
        window.renderCartUI = function() {
            const cartList = document.getElementById('cart-items-list');
            const summaryBox = document.getElementById('cart-summary-box');
            
            // جلب بيانات السلة المبدئية
            let rawCart = [];
            if (window.cartSystem && typeof window.cartSystem.getCart === 'function') {
                rawCart = window.cartSystem.getCart();
            } else {
                rawCart = JSON.parse(localStorage.getItem('bose_cart_items')) || [];
            }

            if (!rawCart || rawCart.length === 0) {
                cartList.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: var(--surface-light); border-radius: var(--border-radius-card); border: 1px dashed rgba(255,145,164,0.5);">
                        <i data-lucide="shopping-cart" style="width: 64px; height: 64px; color: var(--text-muted); margin-bottom: 20px; opacity: 0.5;"></i>
                        <h3 style="color: var(--text-main); margin-bottom: 10px;">حقيبة المشتريات فارغة</h3>
                        <p style="color: var(--text-muted); margin-bottom: 25px;">لم تقم بإضافة أي من إبداعاتنا حتى الآن.</p>
                        <a href="menu.html" class="btn-primary" style="padding: 12px 30px; display: inline-block;">تصفح المنيو</a>
                    </div>
                `;
                summaryBox.style.display = 'none';
                if (typeof lucide !== 'undefined') lucide.createIcons();
                return;
            }

            let htmlContent = '';
            let subtotal = 0;

            rawCart.forEach(item => {
                // المطابقة الحتمية مع الكتالوج لضمان السعر والتفاصيل
                const originalProduct = window.catalog.find(p => String(p.id) === String(item.id));
                if (originalProduct) {
                    const securePrice = parseFloat(originalProduct.price) || 0;
                    const itemQuantity = parseInt(item.quantity) || 1;
                    const itemTotal = securePrice * itemQuantity;
                    subtotal += itemTotal;

                    htmlContent += `
                        <div class="cart-item">
                            <img src="${originalProduct.image || 'assets/default-product.jpg'}" alt="${originalProduct.name}" class="cart-item-img">
                            <div class="cart-item-details">
                                <div class="cart-item-header">
                                    <div>
                                        <h3 class="cart-item-title">${originalProduct.name}</h3>
                                        <span class="cart-item-meta">${securePrice} ج.م / للقطعة</span>
                                    </div>
                                    <button class="remove-btn" onclick="handleRemoveFromCart('${originalProduct.id}')" title="حذف من الحقيبة">
                                        <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                                    </button>
                                </div>
                                <div class="cart-item-actions">
                                    <div class="quantity-controls" style="display: flex; align-items: center; gap: 15px; background: var(--bg-white); border-radius: 50px; padding: 5px 15px; border: 1px solid rgba(0,0,0,0.05);">
                                        <button onclick="handleUpdateQuantity('${originalProduct.id}', 1)" style="border:none; background:none; cursor:pointer; color:var(--primary-pink); font-size: 1.2rem; font-weight: 700;">+</button>
                                        <span style="font-weight: 700; width: 20px; text-align: center; color: var(--text-main);">${itemQuantity}</span>
                                        <button onclick="handleUpdateQuantity('${originalProduct.id}', -1)" style="border:none; background:none; cursor:pointer; color:var(--text-main); font-size: 1.5rem; line-height: 1;">-</button>
                                    </div>
                                    <div style="font-weight: 700; color: var(--primary-pink); font-size: 1.1rem;">
                                        ${itemTotal} ج.م
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            cartList.innerHTML = htmlContent;
            
            // تحديث نافذة الدفع
            document.getElementById('summary-subtotal').textContent = subtotal + ' ج.م';
            document.getElementById('summary-total').textContent = subtotal + ' ج.م';
            summaryBox.style.display = 'block';

            if (typeof lucide !== 'undefined') lucide.createIcons();
        };

        // وظائف التحديث اللحظي للكميات
        window.handleUpdateQuantity = function(id, change) {
            if (window.cartSystem && typeof window.cartSystem.updateQuantity === 'function') {
                window.cartSystem.updateQuantity(id, change);
            } else {
                let cart = JSON.parse(localStorage.getItem('bose_cart_items')) || [];
                let item = cart.find(i => String(i.id) === String(id));
                if (item) {
                    item.quantity += change;
                    if (item.quantity <= 0) {
                        cart = cart.filter(i => String(i.id) !== String(id));
                    }
                    localStorage.setItem('bose_cart_items', JSON.stringify(cart));
                    window.dispatchEvent(new Event('cartUpdated'));
                }
            }
            renderCartUI();
        };

        // وظيفة الإزالة المباشرة
        window.handleRemoveFromCart = function(id) {
            if (window.cartSystem && typeof window.cartSystem.removeItem === 'function') {
                window.cartSystem.removeItem(id);
            } else {
                let cart = JSON.parse(localStorage.getItem('bose_cart_items')) || [];
                cart = cart.filter(i => String(i.id) !== String(id));
                localStorage.setItem('bose_cart_items', JSON.stringify(cart));
                window.dispatchEvent(new Event('cartUpdated'));
            }
            renderCartUI();
        };

        // نظام الاقتراحات الذكية للبيع المتقاطع (Cross-Selling)
        window.renderCartSuggestions = function() {
            const suggestionsContainer = document.getElementById('cart-suggestions-container');
            if (!window.catalog || window.catalog.length === 0) return;

            let rawCart = JSON.parse(localStorage.getItem('bose_cart_items')) || [];
            const cartIds = rawCart.map(item => String(item.id));

            // استبعاد المنتجات الموجودة بالفعل في السلة
            let availableSuggestions = window.catalog.filter(p => !cartIds.includes(String(p.id)));
            
            // انتقاء عشوائي لأربع منتجات
            availableSuggestions = availableSuggestions.sort(() => 0.5 - Math.random()).slice(0, 4);

            if (availableSuggestions.length === 0) {
                suggestionsContainer.innerHTML = '<p style="text-align:center; color:var(--text-muted); width: 100%;">لقد أضفت معظم منتجاتنا المميزة لسلتك!</p>';
                return;
            }

            let suggestionsHtml = '';
            availableSuggestions.forEach(product => {
                suggestionsHtml += `
                    <div style="min-width: 220px; background: var(--bg-white); border: 1px solid rgba(0,0,0,0.05); border-radius: 16px; padding: 15px; text-align: center; box-shadow: var(--shadow-soft);">
                        <img src="${product.image || 'assets/default-product.jpg'}" alt="${product.name}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 12px; margin-bottom: 12px;">
                        <h4 style="margin: 0 0 8px; font-size: 1.05rem; color: var(--text-main); font-weight: 700;">${product.name}</h4>
                        <p style="margin: 0 0 15px; color: var(--primary-pink); font-weight: 700; font-size: 1.1rem;">${product.price} ج.م</p>
                        <button onclick="window.location.href='product.html?id=${product.id}'" class="btn-primary" style="padding: 10px 15px; width: 100%; font-size: 0.95rem; border-radius: 8px;">التفاصيل</button>
                    </div>
                `;
            });
            
            suggestionsContainer.innerHTML = suggestionsHtml;
        };
    </script>
</body>
</html>
