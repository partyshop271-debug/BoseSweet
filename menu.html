<!DOCTYPE html>
<html lang="ar">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        المنيو - حلويات بوسي
    </title>

    <link
        rel="stylesheet"
        href="./styles.css"
    >

</head>

<body>

    <!-- ================================================= -->
    <!-- HEADER -->
    <!-- ================================================= -->

    <header>

        <button id="sidebar-toggle">
            ☰
        </button>

        <div id="brand">
            حلويات بوسي
        </div>

        <input
            id="header-search"
            type="text"
            placeholder="ابحث عن منتج"
        >

        <a
            href="./cart.html"
            id="header-cart"
        >

            🛒

            <span id="header-cart-count">
                0
            </span>

        </a>

    </header>

    <!-- ================================================= -->
    <!-- SIDEBAR -->
    <!-- ================================================= -->

    <aside id="sidebar">

        <button id="sidebar-close">
            ×
        </button>

        <nav>

            <ul>

                <li>
                    <a href="./index.html">
                        الرئيسية
                    </a>
                </li>

                <li>
                    <a href="./menu.html">
                        المنيو
                    </a>
                </li>

                <li>
                    <a href="./cart.html">
                        السلة
                    </a>
                </li>

                <li>
                    <a href="./checkout.html">
                        اتمام الطلب
                    </a>
                </li>

            </ul>

        </nav>

    </aside>

    <div id="sidebar-overlay"></div>

    <!-- ================================================= -->
    <!-- PAGE HERO -->
    <!-- ================================================= -->

    <section class="page-hero">

        <h1>
            منيو حلويات بوسي
        </h1>

        <p>
            منتجات معمولة بخامات مختارة بعناية
            علشان توصلك بنفس الجودة والطعم
            اللي بنقدمه كل يوم داخل مطبخنا.
        </p>

    </section>

    <!-- ================================================= -->
    <!-- CATEGORY NAVIGATION -->
    <!-- ================================================= -->

    <section class="categories-navigation">

        <button
            class="category-button"
            data-category="all"
        >
            كل المنتجات
        </button>

        <button
            class="category-button"
            data-category="desserts"
        >
            الحلويات
        </button>

        <button
            class="category-button"
            data-category="boxes"
        >
            البوكسات
        </button>

    </section>

    <!-- ================================================= -->
    <!-- PRODUCTS -->
    <!-- ================================================= -->

    <main>

        <section class="products-section">

            <div class="products-grid"></div>

        </section>

    </main>

    <!-- ================================================= -->
    <!-- FOOTER -->
    <!-- ================================================= -->

    <footer>

        <div class="footer-links">

            <a href="#">
                من نحن
            </a>

            <a href="#">
                سياسة الخصوصية
            </a>

            <a href="#">
                سياسة الاسترجاع
            </a>

            <a href="#">
                تواصل معنا
            </a>

        </div>

        <div class="footer-social">

            <a href="#">
                Facebook
            </a>

            <a href="#">
                Instagram
            </a>

            <a href="#">
                TikTok
            </a>

        </div>

    </footer>

    <!-- ================================================= -->
    <!-- SCRIPTS -->
    <!-- ================================================= -->

    <script
        type="module"
        src="./contracts.js"
    ></script>

    <script
        type="module"
        src="./data-service.js"
    ></script>

    <script
        type="module"
        src="./cart-service.js"
    ></script>

    <script
        type="module"
        src="./ui-engine.js"
    ></script>

    <script
        type="module"
        src="./product-renderer.js"
    ></script>

</body>

</html>
