<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو حلويات بوسي | BoseSweets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* تنسيقات خاصة بصفحة المنيو لضمان الراحة والتنقل السلس */
        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 20px 0;
            margin-bottom: 40px;
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255, 145, 164, 0.1);
            position: sticky;
            top: 75px; /* يلتصق أسفل الهيدر الزجاجي */
            background: var(--bg-white);
            z-index: 900;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        
        .category-item {
            padding: 10px 25px;
            border-radius: 50px;
            background: var(--surface-light);
            color: var(--text-main);
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }
        
        .category-item.active {
            background: var(--primary-pink);
            color: var(--bg-white);
        }

        /* شبكة المنيو: كارتين جنب بعض في الموبايل */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 25px;
            }
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-icon" id="openSidebar" onclick="window.history.back()"><i data-lucide="arrow-right"></i></button>
            <div style="cursor: pointer;" onclick="window.location.href='index.html'">
                <h2 style="margin: 0; color: var(--primary-pink); font-size: 1.6rem;">حلويات بوسي</h2>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn-icon" onclick="window.location.href='cart.html'" style="position: relative;">
                    <i data-lucide="shopping-basket"></i>
                    <span id="cart-badge" style="position: absolute; top:-5px; right:-5px; background:var(--primary-pink); color:white; font-size:10px; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; display:none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container mt-section mb-section">
        <h1 style="margin-bottom: 10px;">قائمة <span class="text-pink">المنتجات</span></h1>
        <p class="text-center" style="max-width: 600px; margin: 0 auto 30px; color: var(--text-muted);">
            تصفح إبداعاتنا المختارة بعناية لتناسب ذوقكم الرفيع، من التورت الملكية إلى المخبوزات الطازجة يومياً.
        </p>

        <nav class="category-nav" id="categoryNav">
            <div class="category-item active" data-category="all">الكل</div>
            <div class="category-item" data-category="تورت">التورت</div>
            <div class="category-item" data-category="ديسباسيتو">الديسباسيتو</div>
            <div class="category-item" data-category="سينابون">السينابون</div>
            <div class="category-item" data-category="دوناتس">الدوناتس</div>
            <div class="category-item" data-category="قشطوطة">القشطوطة</div>
            <div class="category-item" data-category="ورد">ركن الورد</div>
        </nav>

        <div class="menu-grid" id="menuGrid">
            </div>
    </main>

    <footer class="main-footer">
        <div class="container" style="text-align: center; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 30px;">
            <p style="font-size: 0.85rem; color: #888;">جميع الحقوق محفوظة ومسجلة لعلامة حلويات بوسي © 2026</p>
        </div>
    </footer>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="core-engine.js"></script>
    <script type="module" src="data-bridge.js"></script>
    <script type="module" src="cart-system.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // تفعيل نظام الأيقونات
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            const menuGrid = document.getElementById('menuGrid');
            const categoryItems = document.querySelectorAll('.category-item');
            
            // مستشعر تحميل البيانات من السحابة لضمان التزامن ومنع ظهور الشاشة الفارغة
            window.addEventListener('catalogDataReady', () => {
                const activeItem = document.querySelector('.category-item.active');
                const activeCategory = activeItem ? activeItem.dataset.category : 'all';
                renderCategory(activeCategory);
            });

            // تفعيل الفلترة الديناميكية المباشرة
            categoryItems.forEach(item => {
                item.addEventListener('click', () => {
                    categoryItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    const activeCategory = item.dataset.category;
                    console.log(`تم تنفيذ قرار العرض: قسم ${activeCategory}`);
                    
                    renderCategory(activeCategory);
                });
            });

            // دالة المعالجة المستقلة للتأكد من استقرار الأداء
            function renderCategory(category) {
                if (window.catalog && typeof window.renderProductCards === 'function') {
                    let filteredProducts = window.catalog;
                    if (category && category !== 'all') {
                        filteredProducts = window.catalog.filter(p => p.category === category);
                    }
                    
                    // تحديث الشبكة بالبيانات المفلترة
                    menuGrid.innerHTML = '';
                    window.renderProductCards(filteredProducts, 'menuGrid');
                    
                    // إعادة تشغيل الأيقونات للعناصر الجديدة المضافة
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                } else {
                    console.warn('جاري تهيئة البيانات والمزامنة مع محرك حلويات بوسي...');
                }
            }
        });
    </script>
</body>
</html>
