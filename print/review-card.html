<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Cairo';
    src: local('DejaVu Sans');
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    width: 700px;
    height: 1000px;
    font-family: 'Noto Sans Arabic', 'DejaVu Sans', sans-serif;
    background: #FFFFFF;
    border: 12px solid #FF91A4;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .header {
    width: 100%;
    background: #FF91A4;
    padding: 34px 10px 26px 10px;
  }
  .brand-en {
    color: #fff;
    font-size: 46px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .brand-ar {
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    margin-top: 6px;
  }
  .stars {
    color: #D4AF37;
    font-size: 40px;
    margin: 26px 0 8px 0;
    letter-spacing: 6px;
  }
  .cta {
    font-size: 34px;
    font-weight: 800;
    color: #111;
    margin-top: 6px;
  }
  .sub {
    font-size: 20px;
    color: #666;
    margin-top: 10px;
  }
  .qr-wrap {
    margin-top: 28px;
    border: 4px solid #FF91A4;
    border-radius: 14px;
    padding: 14px;
  }
  .qr-wrap img {
    width: 340px;
    height: 340px;
    display: block;
  }
  .thanks {
    color: #FF91A4;
    font-size: 24px;
    font-weight: 800;
    margin-top: 26px;
  }
  .contact {
    color: #888;
    font-size: 16px;
    margin-top: 10px;
    direction: ltr;
  }
  .footer {
    margin-top: auto;
    width: 100%;
    background: #111;
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    padding: 18px 0;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="brand-en">BoseSweets</div>
    <div class="brand-ar">حلويات بوسي</div>
  </div>

  <div class="stars">★ ★ ★ ★ ★</div>
  <div class="cta">قيّمونا على جوجل</div>
  <div class="sub">امسحوا الكود أو قرّبوا موبايلكوا من الكارت</div>

  <div class="qr-wrap">
    <img src="qr_review.png" alt="كود QR لتقييم منتجات حلويات بوسي - امسحيه بكاميرا موبايلك عشان تكتبي تقييمك">
  </div>

  <div class="thanks">رأيكوا بيفرق معانا 💕</div>
  <div class="contact">wa.me/201097238441 &nbsp;|&nbsp; bose-sweet.vercel.app</div>

  <div class="footer">صنعناها بحب لتهديها لمن تحب</div>
</body>
</html>
